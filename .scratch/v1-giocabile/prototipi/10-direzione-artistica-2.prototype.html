<!--
  PROTOTIPO USA E GETTA — ticket «Direzione artistica» (10), mappa v1-giocabile, secondo giro.
  Domanda: la direzione B · Dossier con rete è stata scelta, ma il primo prototipo è «troppo serio:
  rimane comunque un gioco» (docs/ricerca/sintesi/decisioni.md:126-131). Quale stile giocoso regge
  sulle schermate vere del gioco, restando semplice e comprensibile?
  Quattro varianti via ?variant=S|F|P|M, ognuna con tre schermate (?vista=esito|cruscotto|schema):
    S  Il Settimanale      — docs/ricerca/estetica/tono-giocoso-su-temi-seri.md:79
    F  Album di figurine   — docs/ricerca/estetica/succo-per-interfacce-di-carte-e-numeri.md:173
    P  Plancia a tracciati — docs/ricerca/estetica/tabellone-e-carta-ritagliata.md:119
    M  Macchina inutile    — docs/ricerca/estetica/grafica-italiana-giocosa.md:195
  Testi condivisi in due registri, ordinario e grave (docs/ricerca/estetica/tono-giocoso-su-temi-seri.md:47).
  Token di movimento da docs/ricerca/estetica/succo-per-interfacce-di-carte-e-numeri.md:116-125.
  Altri parametri: ?frame=fit|deck|hd ?vel=1|2|0 ?mov=on|off ?reg=ord|grave.
  Dati inventati, partiti e ministri fittizi. Geometria regioni: openpolis/geojson-italy (ISTAT), semplificata, dal primo prototipo.
  Non è codice di produzione: niente test, niente motore. Buttare dopo il verdetto.
-->

<style>
/* ---------- token di movimento (succo-per-interfacce-di-carte-e-numeri.md:116-125) ---------- */
:root{
  --t-press:80ms; --t-hover:150ms; --t-enter:240ms; --t-big:400ms;
  --e-work:cubic-bezier(0.2,0,0.38,0.9); --e-rare:cubic-bezier(0.4,0.14,0.3,1); --e-in:cubic-bezier(0,0,0.3,1);
  --e-pop:cubic-bezier(0.34,1.56,0.64,1); --e-hit:cubic-bezier(0.55,0,1,0.45); --e-count:cubic-bezier(0.22,1,0.36,1);
  --k:1; --passo:300ms;
}
html[data-vel="2"]{--k:.5}
html[data-reg="grave"]{--e-pop:var(--e-work)}            /* registro grave: nessun rimbalzo */
html[data-vel="0"] #screen *, html[data-mov="off"] #screen *, #screen.salta *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
#stage{position:absolute;inset:0 0 50px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{width:1280px;height:800px;position:relative;overflow:hidden;flex:none;transform-origin:center center;font-variant-numeric:tabular-nums}
#screen>div{width:100%;height:100%;position:relative}
#screen>div>*,#screen>div>*>*{min-width:0}   /* un figlio troppo largo non allarga la griglia: resta lui, e il controllo dei tagli lo vede */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.num{font-variant-numeric:tabular-nums lining-nums}
.entra{animation:var(--anim,entra) calc(var(--t-enter)*var(--k)) var(--e-in) both;animation-delay:calc((var(--i,0)*var(--passo) + 150ms)*var(--k))}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.press{transition:transform var(--t-press) var(--e-work)}
.press:active{transform:scale(.97)}               /* feedback alla pressione, non al rilascio */
.bollo{display:none}
[data-stato="ferma"] .bollo,[data-stato="dirotta"] .bollo{display:block}
[data-stato="ferma"] .bollo::after{content:"Fermato"}
[data-stato="dirotta"] .bollo::after{content:"Dirottato"}
[data-stato="ferma"] .atto-t{text-decoration:line-through}
.timbro{display:none;pointer-events:none}
.timbro.scatto{display:flex}
html[data-reg="grave"] .solo-ord{display:none!important}
html[data-reg="grave"] svg.testa{filter:grayscale(1)}
.reg{cursor:default}
.reg:hover{stroke-width:2.5}

/* ======================= S · Il Settimanale ======================= */
.vS{--carta:#F4ECD8;--ink:#1F1A17;--rosso:#B3122B;--biro:#1D4E89;--grigio:#5E5750;--verde:#2E6B45;--giallo:#FFD23F;
  --tit:'Fraunces',Georgia,'Times New Roman',serif;--txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--carta);color:var(--ink);font-family:var(--txt);--anim:entraS}
html[data-reg="grave"] .vS{--rosso:var(--ink);--biro:var(--ink);--verde:var(--ink);--giallo:transparent}
@keyframes entraS{from{opacity:0;transform:translateY(-6px)}}
.vS .tit{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1}
.vS .btn{border:2px solid var(--ink);padding:5px 12px;font-size:14px;font-weight:700;background:var(--carta)}
.vS .btn.pieno{background:var(--ink);color:var(--carta)}
.vS .btn:hover{background:var(--ink);color:var(--carta)}
.vS .bene{color:var(--verde)} .vS .male{color:var(--rosso)}
/* esito */
.vS .pagina{height:100%;padding:16px 28px 12px;display:grid;grid-template-rows:auto auto auto 1fr auto;animation:rotativa calc(var(--t-big)*var(--k)) var(--e-rare) both}
@keyframes rotativa{0%{transform:translateY(-40px);opacity:0}75%{transform:translateY(3px);opacity:1}100%{transform:none}}
html[data-reg="grave"] .vS .pagina{animation-name:entra}
.vS .testata{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding-bottom:4px}
.vS .testata .nome{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:800;font-size:76px;line-height:1.1;letter-spacing:-.01em;color:var(--rosso);text-align:center}
.vS .orecchio{font-size:13px;line-height:1.35;color:var(--grigio)}
.vS .orecchio b{color:var(--ink)}
.vS .orecchio.dx{text-align:right}
.vS .sotto{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);padding:4px 0;color:var(--grigio)}
.vS .apertura{display:grid;grid-template-columns:1fr 340px;gap:26px;padding:14px 0 12px;border-bottom:1px solid var(--ink)}
html[data-reg="grave"] .vS .apertura{grid-template-columns:1fr}
.vS .occh{font-size:15px;font-weight:700;line-height:1.3;color:var(--ink)}
.vS .occh.crit{color:var(--rosso)}
.vS .esito h2{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:700;line-height:1.06;margin:4px 0 6px}
.vS .lead h2{font-size:50px}
.vS .lead .occh{font-size:17px}
.vS .lead p{font-size:17px}
.vS .esito p{font-size:14px;line-height:1.38;color:var(--grigio)}
.vS .vignetta{border:2px solid var(--ink);padding:8px;background:var(--carta);--anim:inchiostra;animation-delay:calc(450ms*var(--k))}
@keyframes inchiostra{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.vS .vignetta figcaption{font-style:italic;font-size:15px;margin-top:6px;text-align:center}
.vS .colonne{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;padding-top:10px}
.vS .colonne article{padding:4px 16px 12px;border-right:1px solid var(--grigio)}
.vS .colonne article:nth-child(3n+1){padding-left:0}
.vS .colonne article:nth-child(3n){border-right:0;padding-right:0}
.vS .colonne h2{font-size:29px}
.vS .colonne p{font-size:15px}
.vS .colonne .occh{font-size:16px}
.vS .piede{display:flex;justify-content:space-between;align-items:center;border-top:3px double var(--ink);padding-top:8px;font-size:14px}
.vS .piede span{text-decoration:underline;color:var(--grigio)}
/* cruscotto */
.vS.crusc{padding:12px 24px;display:grid;grid-template-rows:auto auto 1fr;gap:8px}
.vS .gerenza{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;border-bottom:3px double var(--ink);padding-bottom:8px}
.vS .g-sx{display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.3;color:var(--grigio)}
.vS .nomino{font-size:30px;font-weight:800;color:var(--rosso);line-height:1}
.vS .borsa{display:flex;justify-content:center}
.vS .tab{padding:2px 18px;border-left:1px solid var(--grigio);display:flex;flex-direction:column}
.vS .tab:last-child{border-right:1px solid var(--grigio)}
.vS .tab .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grigio)}
.vS .tab .v{font-size:26px;font-weight:700;line-height:1.1;background:linear-gradient(var(--giallo),var(--giallo)) no-repeat 0 88%/100% 38%;animation:evidenzia calc(200ms*var(--k)) var(--e-work) both;animation-delay:calc(500ms*var(--k))}
@keyframes evidenzia{from{background-size:0 38%}}
.vS .tab .d{font-size:13px;font-weight:700}
.vS .g-dx{display:flex;gap:8px}
.vS .corsivo{font-size:15px;font-style:italic;display:flex;gap:10px;align-items:baseline}
.vS .corsivo b{font-style:normal;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rosso)}
.vS .corsivo .link{margin-left:auto;font-style:normal;font-size:14px;text-decoration:underline}
.vS .corpo{display:grid;grid-template-columns:712px 1fr;gap:24px;min-height:0}
.vS h3.tit{font-size:24px;font-weight:700;line-height:1.1;margin-bottom:4px}
.vS .riga{display:grid;grid-template-columns:44px 148px 206px 62px 1fr 72px;align-items:center;gap:0 8px;height:61px;border-top:1px solid var(--grigio);position:relative}
.vS .riga:last-child{border-bottom:1px solid var(--grigio)}
.vS .chi b{font-size:14px;display:block;line-height:1.2}

.vS .atto{font-size:13px;line-height:1.25}
.vS .atto .costo{color:var(--grigio)}
.vS .atto .nota{display:block;font-size:12px;color:var(--rosso);font-weight:700}
.vS .punti{font-size:20px;font-weight:700;white-space:nowrap}

.vS .motto{font-size:13px;font-style:italic;line-height:1.25;color:var(--biro)}
.vS .az{display:flex;flex-direction:column;gap:3px}
.vS .az .btn{padding:1px 6px;font-size:12px;border-width:1.5px}
.vS .bollo{position:absolute;left:206px;top:10px;border:3px double var(--rosso);color:var(--rosso);font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;padding:2px 10px;transform:rotate(-6deg);background:rgb(244 236 216 / .85)}
.vS [data-stato="dirotta"] .bollo{border-color:var(--biro);color:var(--biro)}
.vS .scatto .bollo,.vS .timbro.scatto{animation:timbra calc(260ms*var(--k)) both}
@keyframes timbra{0%{transform:rotate(-6deg) scale(1.35);opacity:0;animation-timing-function:var(--e-hit)}46%{transform:rotate(-6deg) scale(1);opacity:1;animation-timing-function:var(--e-pop)}60%{transform:rotate(-6deg) scale(1.04,.96)}100%{transform:rotate(-6deg) scale(1)}}
.vS .lato{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}
.vS .misura{border:2px solid var(--ink);padding:10px 14px}
.vS .forma{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rosso);font-weight:700}
.vS .misura h3{font-size:23px;margin:2px 0}
.vS .meta{font-size:13px;color:var(--grigio);line-height:1.35}
.vS .meta i{color:var(--biro)}
.vS .azioni{display:flex;gap:6px;margin-top:8px}
.vS .carta-it{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.vS .carta-it h4{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;font-size:20px;font-weight:700}
.vS .leg{display:grid;grid-template-columns:22px auto;gap:3px 8px;font-size:13px;margin-top:6px;align-items:center}
.vS .leg i{display:block;width:22px;height:13px;border:1px solid var(--ink)}
.vS .cartiglio{margin-top:10px;font-style:italic;color:var(--biro);font-size:14px;border-top:1px solid var(--grigio);padding-top:6px}
.vS .timbro{position:absolute;inset:0;align-items:center;justify-content:center}
.vS .timbro span{font-family:var(--tit);font-weight:800;font-size:80px;color:var(--rosso);border:8px double var(--rosso);padding:4px 30px;transform:rotate(-6deg);background:rgb(244 236 216 / .9);letter-spacing:.04em;text-transform:uppercase}

.vS .timbro.scatto span{animation:timbra calc(260ms*var(--k)) both}
/* schema */
.vS.schemaV{padding:14px 24px;display:grid;grid-template-rows:auto 1fr;gap:8px}
.vS .s-testa{display:flex;justify-content:space-between;align-items:end;border-bottom:3px double var(--ink);padding-bottom:6px}
.vS .s-testa .tavola{font-size:30px;font-weight:700;display:block;line-height:1.1}
.vS .s-testa .sub{font-size:14px;color:var(--grigio)}
.vS .s-corpo{display:grid;grid-template-columns:1000px 1fr;gap:16px}
.vS aside{font-size:13px;line-height:1.35}
.vS aside h4{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;font-size:20px;margin-bottom:4px}
.vS aside ol{padding-left:18px;margin-top:6px}
.vS aside li{margin-bottom:5px}
.vS [data-nodo]{cursor:pointer}

/* ======================= F · Album di figurine ======================= */
.vF{--carta:#FFF8EC;--ink:#1B1F3B;--sec:#5A5F7A;--rosso:#C8102E;--giallo:#FFC145;--acqua:#7FD1B9;--blu:#2E5EAA;
  --tit:'Bricolage Grotesque','Arial Rounded MT Bold',system-ui,-apple-system,sans-serif;--txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Atkinson Hyperlegible Mono',ui-monospace,Menlo,monospace;
  --ombra:2px 3px 0 rgba(27,31,59,.2);
  background:var(--carta);color:var(--ink);font-family:var(--txt)}
html[data-reg="grave"] .vF{--rosso:var(--ink);--giallo:#E6E2DA;--acqua:#E6E2DA;--blu:var(--ink)}
.vF .tit{font-family:var(--tit);font-weight:800;letter-spacing:-.01em}
.vF .btn{background:var(--blu);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;box-shadow:var(--ombra)}
.vF .btn.chiaro{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.vF .btn.rosso{background:var(--rosso)}
.vF .bene{color:#1d6b55} .vF .male{color:var(--rosso)}
/* esito */
.vF.esito{padding:16px 40px}
.vF .f-testa{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:12px}
.vF .f-testa h1{font-size:40px;line-height:1}
.vF .f-testa p{font-size:14px;color:var(--sec);margin-top:4px}
.vF .f-testa .btn{justify-self:end}
.vF .bustina{--anim:apri}
@keyframes apri{0%{opacity:0;transform:scale(.8)}60%{opacity:1;transform:scale(1.06)}100%{transform:none}}
.vF .album{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 20px}
.vF .posto{width:280px;height:318px;border:2px dashed var(--sec);border-radius:8px;position:relative}
.vF .posto .np{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:40px;color:var(--sec);opacity:.5}
.vF .fig{position:absolute;inset:-2px;background:#fff;border-radius:6px;border:4px solid #fff;box-shadow:var(--ombra),0 0 0 1px rgba(27,31,59,.15);overflow:hidden;display:flex;flex-direction:column;transform:rotate(var(--rot));
  --anim:esce;animation-timing-function:var(--e-pop)}
@keyframes esce{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(0deg)}to{opacity:1;transform:rotate(var(--rot))}}
html[data-reg="grave"] .vF .fig{--rot:0deg;--anim:entra;animation-timing-function:var(--e-work)}
.vF .banda{background:var(--blu);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.vF .fig.crit .banda{background:var(--rosso)}
.vF .fig.grave .banda{background:var(--ink)}
.vF .bol{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--giallo);color:var(--ink);font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:0}
.vF .fig .corpo{padding:8px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.vF .fig .r1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.vF .fig .illu{flex:none}
.vF .fig .fatto{font-size:15px;font-weight:700;line-height:1.3}
.vF .fig .battuta{font-size:23px;line-height:1.08;color:var(--blu)}
.vF .fig.crit .battuta{color:var(--rosso)}
.vF .fig .causa{font-size:13px;line-height:1.35;color:var(--sec);margin-top:auto}
/* cruscotto */
.vF.crusc{padding:14px 20px;display:grid;grid-template-rows:auto 1fr;gap:10px}
.vF .f-bar{display:grid;grid-template-columns:250px 1fr auto;align-items:center;gap:12px}
.vF .link{text-decoration:underline;font-size:13px;color:var(--blu)}
.vF .f-bar h1{font-size:24px;line-height:1.1}
.vF .f-bar p{font-size:13px;color:var(--sec);margin-top:4px}
.vF .bollini{display:flex;gap:14px;justify-content:center;white-space:nowrap}
.vF .bg{display:flex;align-items:center;gap:10px}

.vF .bg .tondo.acqua{background:var(--acqua);font-size:17px}
.vF .bg .tondo.rosso{background:var(--rosso);color:#fff}
@keyframes pulsa{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.vF .bg .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
.vF .bg .d{font-size:14px;font-weight:700}
.vF .f-az{display:flex;gap:8px;white-space:nowrap}
.vF .f-corpo{display:grid;grid-template-columns:760px 1fr;gap:20px;min-height:0}
.vF h2.tit{font-size:20px;margin-bottom:6px}
.vF .mazzo{display:grid;grid-template-columns:repeat(5,144px);gap:12px 10px}
.vF .mz{display:flex;flex-direction:column;gap:5px}
.vF .mfig{height:192px;background:#fff;border-radius:6px;border:4px solid #fff;box-shadow:var(--ombra),0 0 0 1px rgba(27,31,59,.15);position:relative;transition:transform var(--t-hover) var(--e-pop),box-shadow var(--t-hover) var(--e-work)}

.vF .mfig.gira{animation:gira calc(240ms*var(--k)) var(--e-work)}

function reteMisura(o){

  let s=`<svg class="rete" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${o.font}">`;
  s += o.nodo ? o.nodo(x0,my) : `<rect x="${x0}" y="${my-24}" width="84" height="48" fill="${o.ink}" rx="${o.r||0}"/><text x="${x0+42}" y="${my-4}" text-anchor="middle" font-size="13" fill="${o.fondo}" font-weight="700">Decreto</text><text x="${x0+42}" y="${my+13}" text-anchor="middle" font-size="12" fill="${o.fondo}">1,4 mld</text>`;
  E.forEach((e,i)=>{ const col=e.bene?o.bene:o.male;
    s+=`<path d="${cv(x0+86,my,x1-8,ye[i])}" fill="none" stroke="${col}" stroke-width="${e.f*1.4}" ${e.rit?'stroke-dasharray="6 4"':''}/>`;

  });

  G.forEach((g,i)=>{ const col=g.bene?o.bene:o.male; s+=`<circle cx="${x2}" cy="${yg[i]-4}" r="4.5" fill="${col}"/><text x="${x2+10}" y="${yg[i]}" font-size="13" fill="${col}">${g.bene?'+':'−'} ${g.t}</text>`; });

function schema(o){

  ARCHI.forEach(e=>s+=o.arco(e,N[e[0]],N[e[1]]));

  return s+'</svg>';
}
const mezzo = (A,B,t=.5)=>[A.x+(B.x-A.x)*t, A.y+(B.y-A.y)*t];
function etichetta(e,A,B,L){
  const righe=[etichettaArco(e)].concat(L.battute&&!grave()&&e[6]?['«'+e[6]+'»']:[]);
  const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy); let nx=-dy/len, ny=dx/len;
  if(ny>0) { nx=-nx; ny=-ny; }                       // dalla parte di sopra
  if(Math.abs(ny)<.45 && nx<0) { nx=-nx; ny=-ny; }   // linee quasi verticali: a destra
  const [mx,my]=mezzo(A,B), d=e[2]?24:12, w=Math.max(...righe.map(r=>largh(r,13)));
  let x=mx+nx*d, y=my+ny*d, anc='middle';
  if(Math.abs(ny)<.45){ anc='start'; if(x+w>994){ anc='end'; x=mx-nx*d; } }
  else x=Math.min(Math.max(x,w/2+4),996-w/2);
  const y0 = anc==='middle' ? y-(righe.length-1)*16 : y+4;
  return righe.map((r,i)=>`<text x="${x}" y="${y0+i*16}" text-anchor="${anc}" font-size="13" ${L.italic?'font-style="italic"':''} font-weight="${L.peso||400}" fill="${i?L.col2||L.col(e):L.col(e)}" paint-order="stroke" stroke="${L.halo}" stroke-width="4" stroke-linejoin="round">${esc(r)}</text>`).join('');
}

const P_RAMP = rampa('#EFE6D2','#1F2A44'), P_RAMPG = rampa('#EFE6D2','#3a3a3a');
function traccia(o){
  const w=o.w||26;
  let s=`<div class="trk" style="width:${o.n*w}px">`;
  (o.zone||[]).forEach(z=>s+=`<div class="zona ${z[2]}" style="left:${z[0]*w}px;width:${(z[1]-z[0])*w}px"><span>${z[3]}</span></div>`);
  for(let i=0;i<o.n;i++) s+=`<i class="cas" style="left:${i*w}px;width:${w}px"></i>`;
  (o.tick||[]).forEach(t=>s+=`<span class="tick" style="left:${t[0]*w}px">${t[1]}</span>`);
  if(o.soglia!=null) s+=`<b class="soglia" style="left:${o.soglia*w}px"></b>`;
  (o.blocchi||[]).forEach((b,j)=>{ const da=b.da??b.a; s+=`<span class="blk ${b.c||''}" title="${b.t||''}" style="--a:${b.a};--da:${da};--n:${Math.max(1,Math.abs(b.a-da))};--w:${w}px;--j:${j}">${b.l||''}</span>`; });
  return s+'</div>';
}

const K = Object.keys(V);
const qs = new URLSearchParams(location.search);
if(qs.has('nofont')) document.querySelectorAll('link[rel=stylesheet]').forEach(l=>l.disabled=true); // prova «Google Fonts non caricati»: restano i font di ripiego
const RIDOTTO = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = (k,ok,def)=>ok.includes(qs.get(k))?qs.get(k):def;
const st = {variant:pick('variant',K,K[0]), frame:pick('frame',['fit','deck','hd'],'deck'), vel:pick('vel',['1','2','0'],'1'),

const screen = document.getElementById('screen'), stage = document.getElementById('stage');

let scala=1, gen=0, timers=[];
const dopo=(ms,f)=>timers.push(setTimeout(f,ms));

function cornice(){
  const t = st.frame==='deck'?1 : st.frame==='hd'?1.35 : 99; // hd: la stessa interfaccia a 1080 righe, cioè ×1,35
  scala = Math.min(t, stage.clientWidth/1280, stage.clientHeight/800);

}
const haTesto = el=>[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());
function misura(){
  let min=1e9, chi=null; const cut=[];
  const sr = screen.getBoundingClientRect();
  if(screen.scrollWidth>1281||screen.scrollHeight>801) cut.push(screen);
  screen.querySelectorAll('*').forEach(el=>{
    if(el.closest('title')||!el.getClientRects().length) return;
    if(el instanceof SVGElement){
      if(el.tagName!=='text') return;
      const svg=el.ownerSVGElement; let f=1;
      for(let s=svg; s; s=s.ownerSVGElement){ const vb=s.viewBox.baseVal; if(vb&&vb.width) f*=Math.min(s.width.baseVal.value/vb.width, s.height.baseVal.value/vb.height); }
      const px = parseFloat(getComputedStyle(el).fontSize) * f;
      if(px<min){min=px;chi=el;}
      const b=el.getBBox(), v2=svg.viewBox.baseVal;
      if(!el.closest('[transform]') && (b.x<v2.x-1||b.y<v2.y-1||b.x+b.width>v2.x+v2.width+1||b.y+b.height>v2.y+v2.height+1)) cut.push(el);
      return;
    }
    const cs=getComputedStyle(el);
    // anche senza overflow:hidden: un contenuto più largo o più alto del suo riquadro esce dal disegno
    // tolleranza verticale: le maiuscole grandi sporgono dalla riga senza essere tagliate; .posto e .trk sporgono apposta
    if(!el.closest('.trk,.reg-w,.album') && el.clientWidth && (el.scrollWidth>el.clientWidth+3||el.scrollHeight>el.clientHeight+Math.max(3,parseFloat(cs.fontSize)*.3)) && cs.display!=='inline') cut.push(el);
    if(!haTesto(el)) return;
    const px=parseFloat(cs.fontSize);
    if(px<min){min=px;chi=el;}
    const r=el.getBoundingClientRect();
    if(r.right>sr.right+1||r.bottom>sr.bottom+1||r.left<sr.left-1||r.top<sr.top-1) cut.push(el);
  });

  b.textContent = `testo min ${fmtN(min,1)} px${Math.abs(scala-1)>.005?` (reali ${fmtN(reali,1)}, scala ${fmtN(scala,2)})`:''} ${reali>=9?'✓':'✗ < 9'} · tagli ${cut.length}`;
  b.className = 'min'+(reali<9||cut.length?' ko':'');
  b.onclick = ()=>{ document.querySelectorAll('.offender').forEach(e=>e.classList.remove('offender')); [chi,...cut].forEach(e=>e&&e.classList.add('offender')); console.log('[proto] più piccolo:', chi&&chi.textContent.trim().slice(0,50), '| tagli:', cut.map(e=>e.tagName+'.'+(e.getAttribute('class')||'')+' «'+(e.textContent||'').trim().slice(0,40)+'»').join(' || ')); };
  console.log(`[proto] ${st.variant}/${st.vista}/${st.reg} min=${fmtN(min,1)}px reali=${fmtN(reali,1)} scala=${fmtN(scala,2)} tagli=${cut.length}${cut.length?' → '+cut.map(e=>(e.textContent||e.tagName).trim().slice(0,30)).join(' | '):''}`);
}
function contatori(){
  const kk=kf(), my=gen;
  screen.querySelectorAll('[data-conta]').forEach(el=>{
    const to=+el.dataset.conta, dec=+(el.dataset.dec||0), da=el.dataset.da!=null?+el.dataset.da:to;
    el.textContent=fmtN(kk?da:to,dec);
    if(!kk) return;
    const dur=(+el.dataset.dur||450)*kk;
    dopo((+el.dataset.dopo||300)*kk, ()=>{ const t0=performance.now();
      const passo=t=>{ if(gen!==my) return; const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,5); el.textContent=fmtN(da+(to-da)*e,dec); if(p<1) requestAnimationFrame(passo); };
      requestAnimationFrame(passo); });
  });
}

function oscilla(){ const m=screen.querySelector('.mobile'); if(m&&kf()) riavvia(m,'osc'); }
function chiudi(){
  const t=screen.querySelector('.timbro'), kk=kf();
  timers.forEach(clearTimeout); timers=[];
  if(!kk||!t){ st.vista='esito'; render(); return; }
  riavvia(t,'scatto');
  dopo(900*kk, ()=>{ st.vista='esito'; render(); });
}
let pronto=0;   // dopo un cambio di schermata ignora i clic per 350 ms: un doppio clic non preme il pulsante che compare sotto
screen.addEventListener('click',e=>{
  if(performance.now()<pronto) return;
  const b=e.target.closest('[data-go],[data-az],[data-chiudi],[data-misura],[data-nodo]');
  if(!b){ if(st.vista==='esito'){ screen.classList.add('salta'); finali(); } return; } // un clic sul vuoto salta la rivelazione
  if(b.dataset.go){ st.vista=b.dataset.go; render(); return; }
  if(b.dataset.az){ cambia(+b.dataset.i,b.dataset.az); return; }
  if('chiudi' in b.dataset){ chiudi(); return; }
  if('misura' in b.dataset){ const s=b.closest('.misura'); if(s&&kf()) riavvia(s,'scatto'); oscilla(); return; }
  if(b.dataset.nodo && st.variant==='M' && kf()){ const id=b.dataset.nodo, vicini=new Set([id]); ARCHI.forEach(a=>{ if(a[0]===id) vicini.add(a[1]); if(a[1]===id) vicini.add(a[0]); });
    screen.querySelectorAll('.pend').forEach(g=>{ if(vicini.has(g.dataset.nodo)){ g.style.setProperty('--j',0); riavvia(g,'pend'); } }); }
});
function render(){
  gen++; timers.forEach(clearTimeout); timers=[]; pronto=performance.now()+350;
  const h=document.documentElement; h.dataset.vel=st.vel; h.dataset.mov=st.mov; h.dataset.reg=st.reg;
  screen.classList.remove('salta');
  screen.innerHTML = V[st.variant][st.vista]();
  screen.querySelectorAll('[data-riga]').forEach(el=>applicaStato(el,+el.dataset.riga));
  document.getElementById('lab').textContent = `${st.variant} · ${V[st.variant].nome}`;
  document.querySelectorAll('#proto .seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',st[s.dataset.k]===b.dataset.v)));
  const q=new URLSearchParams(); ['variant','vista','frame','vel','mov','reg'].forEach(k=>q.set(k,st[k])); history.replaceState(null,'','?'+q);
  cornice(); contatori();
  requestAnimationFrame(misura);
  dopo(3000*kf()+60, misura);   // di nuovo a rivelazione finita, per contare i tagli sullo stato fermo
}
const go=d=>{ st.variant=K[(K.indexOf(st.variant)+d+K.length)%K.length]; render(); };
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.querySelectorAll('#proto .seg').forEach(s=>s.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; st[s.dataset.k]=b.dataset.v; render(); }));
addEventListener('keydown',e=>{ if(e.target.closest('input,textarea,[contenteditable]')) return; if(e.key==='ArrowLeft') go(-1); if(e.key==='ArrowRight') go(1); });
addEventListener('resize',()=>{ cornice(); misura(); });
document.fonts && document.fonts.ready.then(misura);
render();
</script>
</body>
</html>
