<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Direzione artistica» (10), mappa v1-giocabile.
  Domanda: la direzione B+D (carta stampata + diagramma di sistema,
  docs/ricerca/sintesi/direzioni-artistiche-candidate.md:71) regge su una schermata vera?
  Tre varianti dello stesso cruscotto d'apertura del turno, via ?variant=A|B|C:
    A  Prima pagina      — solo B
    B  Dossier con rete  — B + D (la raccomandazione)
    C  Schema su carta   — D dominante, disegnato con l'inchiostro di B
  Dati inventati, partiti e ministri fittizi. Geometria regioni: openpolis/geojson-italy (ISTAT), semplificata.
  Non è codice di produzione: niente test, niente motore. Buttare dopo il verdetto.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo direzione artistica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --carta:#f2ece0; --carta2:#e9e1d0; --carta3:#ddd3be;
  --ink:#1c1a17; --ink2:#4b463e; --ink3:#7a7264; --filo:#b8ad97;
  --rosso:#b3301d; --blu:#1f4a73;
  --serif:'IBM Plex Serif',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#8f877a;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
#stage{position:absolute;inset:0 0 52px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{background:var(--carta);position:relative;overflow:hidden;transform-origin:center center;flex:none}
#screen.fit{width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg text{font-family:var(--sans)}
.num{font-variant-numeric:tabular-nums lining-nums}
.crit{color:var(--rosso)}
.voce{opacity:0;animation:rivela .4s ease-out forwards;animation-delay:calc(var(--i) * 380ms + 150ms)}
@keyframes rivela{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.voce{animation:none;opacity:1}}
.reg{stroke:var(--carta);stroke-width:.8;vector-effect:non-scaling-stroke}
.reg:hover{stroke:var(--ink);stroke-width:1.6}
.btn{border:1px solid var(--ink);padding:3px 9px;font-size:12px;font-weight:500;background:var(--carta)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.rosso{border-color:var(--rosso);color:var(--rosso)}
.btn:hover{background:var(--ink);color:var(--carta)}

/* ---------- A · Prima pagina ---------- */
.vA{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding:14px 22px 12px}
.vA .testata{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;border-bottom:3px double var(--ink);padding-bottom:6px}
.vA .testata h1{font-family:var(--serif);font-weight:700;font-size:46px;letter-spacing:.02em;line-height:1;text-align:center}
.vA .orecchio{font-size:11px;color:var(--ink2);line-height:1.35}
.vA .orecchio.dx{text-align:right}
.vA .riga-data{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding:4px 0;color:var(--ink2)}
.vA .listino{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ink)}
.vA .listino>div{padding:5px 12px;border-right:1px solid var(--filo);display:flex;align-items:baseline;gap:10px}
.vA .listino>div:last-child{border-right:0}
.vA .listino .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.vA .listino .v{font-family:var(--serif);font-size:26px;font-weight:600}
.vA .listino .d{font-size:12px}
.vA .listino .n{font-size:11px;color:var(--ink3)}
.vA .corpo{display:grid;grid-template-columns:1.45fr .95fr 1.25fr .9fr;gap:0;min-height:0;padding-top:10px}
.vA .col{padding:0 14px;border-right:1px solid var(--filo);min-height:0;overflow:hidden}
.vA .col:first-child{padding-left:0}.vA .col:last-child{border-right:0;padding-right:0}
.vA .occhiello{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--rosso);font-weight:600}
.vA h2{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.04;margin:4px 0 6px}
.vA h3{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.12;margin:3px 0 4px}
.vA h4{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.15;margin-bottom:2px}
.vA p{font-family:var(--serif);font-size:13px;line-height:1.42;color:var(--ink2);hyphens:auto}
.vA .sommario{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.3;color:var(--ink);margin-bottom:6px}
.vA .art{padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--filo)}
.vA .art:last-child{border-bottom:0}
.vA .tabellino{display:flex;gap:14px;font-size:12px;margin:5px 0;font-family:var(--sans)}
.vA .tabellino b{font-family:var(--serif);font-size:20px}
.vA .carta-tit{font-family:var(--serif);font-weight:600;font-size:14px}
.vA .carta-sub{font-size:11px;color:var(--ink3);margin-bottom:2px}
.vA .breve{padding:6px 0;border-bottom:1px solid var(--filo)}
.vA .breve p{font-size:12px;line-height:1.35}
.vA .tavolo{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;border-top:3px double var(--ink);padding-top:8px;margin-top:6px}
.vA .tavolo h5{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:3px}
.vA table{width:100%;border-collapse:collapse;font-size:11.5px}
.vA td{padding:2px 6px 2px 0;border-bottom:1px dotted var(--filo);white-space:nowrap}
.vA td.atto{white-space:normal;font-family:var(--serif)}
.vA tr.ev td{font-weight:600}
.vA tr.ev td:first-child{box-shadow:inset 3px 0 0 var(--rosso);padding-left:6px}
.vA .velina{font-family:var(--mono);font-size:11.5px;line-height:1.45;background:var(--carta2);padding:7px 10px;border-left:3px solid var(--ink)}
.vA .velina .t{font-weight:500}
.vA .azioni{display:flex;gap:6px;margin-top:6px;align-items:center}
.vA .chiudi{margin-left:auto}

/* ---------- B · Dossier con rete ---------- */
.vB{height:100%;display:grid;grid-template-rows:56px 1fr;grid-template-columns:290px 1fr 440px}
.vB .barra{grid-column:1/-1;display:grid;grid-template-columns:290px 1fr 440px;align-items:center;border-bottom:2px solid var(--ink);background:var(--carta)}
.vB .quando{padding:0 18px;font-size:12px;line-height:1.3;color:var(--ink2)}
.vB .quando b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink)}
.vB .ind{display:flex;justify-content:center;gap:0;height:100%}
.vB .ind>div{padding:6px 18px;border-left:1px solid var(--filo);display:flex;flex-direction:column;justify-content:center}
.vB .ind>div:last-child{border-right:1px solid var(--filo)}
.vB .ind .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.vB .ind .v{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
.vB .ind .v small{font-family:var(--sans);font-size:12px;font-weight:400;margin-left:5px}
.vB .barra .dx{display:flex;justify-content:flex-end;padding-right:16px;gap:8px}
.vB .esito{border-right:1px solid var(--ink);padding:12px 14px;overflow:hidden;background:var(--carta2)}
.vB .esito h5,.vB .tavolo h5,.vB .mappa h5{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--ink2);margin-bottom:8px}
.vB .ritaglio{background:var(--carta);padding:7px 10px 8px;margin-bottom:7px;box-shadow:0 1px 0 var(--filo),0 0 0 1px var(--carta3)}
.vB .ritaglio.c{box-shadow:inset 3px 0 0 var(--rosso),0 0 0 1px var(--carta3)}
.vB .ritaglio h4{font-family:var(--serif);font-size:14px;line-height:1.15;font-weight:600}
.vB .ritaglio p{font-size:11.5px;line-height:1.35;color:var(--ink2);margin-top:2px}
.vB .registro{font-size:12px;color:var(--ink2);text-decoration:underline}
.vB .mappa{position:relative;padding:12px 16px;display:flex;flex-direction:column;min-height:0}
.vB .mappa .tabs{display:flex;gap:14px;font-size:12px;margin-bottom:4px}
.vB .mappa .tabs button{padding-bottom:2px;color:var(--ink3)}
.vB .mappa .tabs button.on{color:var(--ink);border-bottom:2px solid var(--ink);font-weight:600}
.vB .mappa svg{flex:1;min-height:0;width:100%}
.vB .legenda{display:flex;gap:2px;align-items:center;font-size:11px;color:var(--ink2)}
.vB .legenda i{display:inline-block;width:26px;height:9px}
.vB .tavolo{border-left:1px solid var(--ink);padding:12px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.vB .misura{border:1px solid var(--ink);background:var(--carta);padding:9px 11px}
.vB .misura .forma{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--rosso);font-weight:600}
.vB .misura h3{font-family:var(--serif);font-size:17px;line-height:1.15;margin:2px 0 3px}
.vB .misura .meta{font-size:11.5px;color:var(--ink2)}
.vB .misura svg{width:100%;display:block;margin:4px 0}
.vB .misura .azioni{display:flex;gap:6px;flex-wrap:wrap}
.vB table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
.vB td{padding:4px 4px 4px 0;border-bottom:1px solid var(--carta3);vertical-align:top}
.vB td .perche{display:block;color:var(--rosso);font-size:11px}
.vB td.dic{font-weight:600;white-space:nowrap}
.vB .altri{font-size:11.5px;color:var(--ink3);padding:5px 0}

/* ---------- C · Schema su carta ---------- */
.vC{height:100%;display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto 1fr}
.vC .testa{grid-column:1/-1;display:flex;align-items:baseline;gap:18px;padding:10px 18px 6px;border-bottom:1px solid var(--ink)}
.vC .testa h1{font-family:var(--serif);font-size:20px;font-weight:600}
.vC .testa span{font-size:12px;color:var(--ink2)}
.vC .testa .dx{margin-left:auto}
.vC .schema{min-height:0;position:relative}
.vC .schema svg{width:100%;height:100%;display:block}
.vC .lato{border-left:1px solid var(--ink);padding:10px 14px;overflow:hidden;background:var(--carta2);display:flex;flex-direction:column;gap:6px}
.vC .lato h5{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--ink2)}
.vC .lv{display:grid;grid-template-columns:20px 1fr;gap:6px;font-size:11.5px;line-height:1.3}
.vC .lv b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--carta);font-size:11px}
.vC .lv.c b{background:var(--rosso)}
.vC .lv strong{font-family:var(--serif);font-weight:600;font-size:13px}
.vC .scelta{border:1px solid var(--rosso);padding:8px;background:var(--carta);font-size:11.5px;margin-top:auto}
.vC .scelta h4{font-family:var(--serif);font-size:14px;margin-bottom:3px}
.vC .scelta .azioni{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}

/* ---------- barra prototipo (non fa parte del design) ---------- */
#proto{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#111;color:#f5f5f5;font:13px/1 system-ui,sans-serif;padding:7px 10px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35);z-index:99;white-space:nowrap}
#proto button{color:#f5f5f5;padding:4px 8px;border-radius:999px}
#proto button:hover{background:#333}
#proto .lab{min-width:220px;text-align:center;font-weight:600}
#proto .seg button.on{background:#f5f5f5;color:#111}
#proto .min{font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:999px;background:#333;cursor:pointer}
#proto .min.ko{background:#b3301d}
.offender{outline:2px solid #e0f !important}
</style>
</head>

// ---------- mappa ----------
function mappa({modo='tinta', layer='disoc', etichette=true, segni=true, scala=1}){
  const L = LAYERS[layer], pal = L.tipo==='seq'?SEQ:DIV;
  let defs = '';
  if(modo==='retino'){ // retino: punti di inchiostro su carta, raggio per classe
    defs = '<defs>'+[0.45,0.8,1.15,1.5,1.85].map((r,i)=>`<pattern id="ret${i}" width="4.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.2" height="4.2" fill="#f2ece0"/><circle cx="2.1" cy="2.1" r="${r}" fill="#1c1a17"/></pattern>`).join('')+'</defs>';
  }
  let g = '', lab = '';
  for(const [nome,{d,c}] of Object.entries(GEO.regioni)){
    const v = L.dati[nome], k = cls(v,L.soglie);
    const fill = modo==='retino'?`url(#ret${k})`:pal[k];
    g += `<path class="reg" d="${d}" fill="${fill}"><title>${esc(nome)}: ${String(v).replace('.',',')}${L.u}</title></path>`;
    if(etichette && c){
      const n = BREVE[nome]||nome, big = ['Sicilia','Sardegna','Lombardia','Piemonte','Toscana','Puglia','Lazio','Campania','Calabria','Veneto','Emilia-Romagna'].includes(nome);
      if(big||scala>=1) lab += `<text x="${c[0]}" y="${c[1]}" text-anchor="middle" font-size="${(big?11:9.5)/scala}" fill="${k>=3&&modo!=='retino'?'#f2ece0':'#1c1a17'}" paint-order="stroke" stroke="${modo==='retino'?'#f2ece0':'none'}" stroke-width="${3/scala}" font-weight="500">${esc(n)}</text>`;
    }
  }
  let s = '';
  if(segni){ // evento e grande opera
    const er = GEO.regioni['Emilia-Romagna'].c, cal = GEO.regioni['Calabria'].c;
    s += `<g><circle cx="${er[0]+8}" cy="${er[1]+12}" r="${7/scala}" fill="none" stroke="#b3301d" stroke-width="${2/scala}"/><text x="${er[0]+18/scala+8}" y="${er[1]+16}" font-size="${10/scala}" fill="#b3301d" font-weight="600">alluvione</text></g>`;
    s += `<g><path d="M${cal[0]+4},${cal[1]-30} L${cal[0]+20},${cal[1]+8}" stroke="#1c1a17" stroke-width="${2.2/scala}" stroke-dasharray="${5/scala} ${2.5/scala}"/><text x="${cal[0]+26}" y="${cal[1]+18}" font-size="${9.5/scala}" fill="#1c1a17">AV lotto 2</text></g>`;
  }
  return `<svg viewBox="-10 -6 ${GEO.w+40} ${GEO.h+12}" preserveAspectRatio="xMidYMid meet">${defs}<g>${g}</g>${lab}${s}</svg>`;
}
function legenda(layer, modo){
  const L = LAYERS[layer], pal = L.tipo==='seq'?SEQ:DIV;
  if(modo==='retino') return `<svg viewBox="0 0 250 24" width="100%" style="max-width:250px"><defs>${[0.45,0.8,1.15,1.5,1.85].map((r,i)=>`<pattern id="lr${i}" width="4.2" height="4.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.2" height="4.2" fill="#f2ece0"/><circle cx="2.1" cy="2.1" r="${r}" fill="#1c1a17"/></pattern>`).join('')}</defs>${L.etichette.map((e,i)=>`<rect x="${i*50}" y="0" width="48" height="10" fill="url(#lr${i})"/><text x="${i*50}" y="22" font-size="10.5" fill="#4b463e">${e}</text>`).join('')}</svg>`;
  return `<div class="legenda">${L.etichette.map((e,i)=>`<span><i style="background:${pal[i]}"></i><br>${e}</span>`).join('')}<span style="margin-left:6px">${L.u}</span></div>`;

let layerB = 'disoc';
function rete(){ // misura → grandezze → gruppi, disegnata a inchiostro (D dentro B)
  const W=408, H=196, x0=8, x1=150, x2=290;
  const ye = MISURA.effetti.map((_,i)=>22+i*44), yg = MISURA.gruppi.map((_,i)=>22+i*44);
  const curva=(xa,ya,xb,yb)=>`M${xa},${ya} C${(xa+xb)/2},${ya} ${(xa+xb)/2},${yb} ${xb},${yb}`;
  let o = `<svg viewBox="0 0 ${W} ${H}">`;
  // nodo misura
  o += `<rect x="${x0}" y="${H/2-22}" width="76" height="44" fill="#1c1a17"/><text x="${x0+38}" y="${H/2-4}" text-anchor="middle" font-size="11" fill="#f2ece0" font-weight="600">Decreto</text><text x="${x0+38}" y="${H/2+11}" text-anchor="middle" font-size="10.5" fill="#f2ece0">1,4 mld</text>`;
  MISURA.effetti.forEach((e,i)=>{
    const neg = e[1]==='−', col = neg?'#b3301d':'#1c1a17';
    o += `<path d="${curva(x0+76,H/2,x1-6,ye[i])}" fill="none" stroke="${col}" stroke-width="${e[2]*1.3}" ${e[3]!=='subito'?'stroke-dasharray="5 3"':''}/>`;
    o += `<text x="${x1}" y="${ye[i]-3}" font-size="11.5" font-weight="600" fill="${col}">${neg?'▼':'▲'} ${e[0]}</text><text x="${x1}" y="${ye[i]+10}" font-size="10" fill="#7a7264">${e[3]}</text>`;
  });
  // grandezze → gruppi: le due grandezze positive vanno ai gruppi E-R, debito/spread al reddito alto
  const legami = [[0,0],[1,0],[1,1],[0,2],[3,3],[2,3]];
  legami.forEach(([a,b])=>{
    const neg = MISURA.gruppi[b][1]==='−';
    o += `<path d="${curva(x1+100,ye[a],x2-6,yg[b])}" fill="none" stroke="${neg?'#b3301d':'#4b463e'}" stroke-width="1" opacity=".75"/>`;
  });
  MISURA.gruppi.forEach((g,i)=>{
    const neg=g[1]==='−';
    o += `<circle cx="${x2}" cy="${yg[i]-4}" r="3.5" fill="${neg?'#b3301d':'#1c1a17'}"/><text x="${x2+8}" y="${yg[i]}" font-size="11" fill="${neg?'#b3301d':'#1c1a17'}">${g[0]}</text>`;
  });
  return o+`</svg>`;
}

// ---------- C · Schema su carta ----------
function VariantC(){
  const W=1000, H=640, P=[470,300], R=170;
  const DIC = ['Economia','Sviluppo','Lavoro','Sanità','Istruzione','Infrastrutture','Ambiente','Interno','Giustizia','Esteri e Difesa'];
  const SODD = [61,48,66,34,70,72,58,63,55,60];
  const ang = i=>-Math.PI/2+i*2*Math.PI/10;
  const pos = DIC.map((_,i)=>[Math.round(P[0]+R*Math.cos(ang(i))),Math.round(P[1]+R*Math.sin(ang(i)))]);
  const IND = {Spread:[880,125], Maggioranza:[880,300], Consenso:[880,480]}; // ordine scelto per non incrociare le linee
  const CAM=[120,130], SEN=[120,250], UR=[720,300];
  const ins = {x:18,y:362,s:0.5};
  const inMap = n=>{const c=GEO.regioni[n].c;return [Math.round(ins.x+c[0]*ins.s), Math.round(ins.y+c[1]*ins.s)];};
  const er = inMap('Emilia-Romagna'), cal = inMap('Calabria');
  // ponytail: tracciati a mano con punti espliciti; un motore di routing serve solo se lo schema diventa vero
  const L = (pts,{col='#1c1a17',w=4,dash=''}={})=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
  const num=(p,n,c)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="10" fill="${c?'#b3301d':'#1c1a17'}" stroke="#f2ece0" stroke-width="2"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" fill="#f2ece0" font-weight="600">${n}</text></g>`;
  const nota=(p,t,c,anc='start')=>`<text x="${p[0]}" y="${p[1]}" text-anchor="${anc}" font-size="10.5" fill="${c?'#b3301d':'#4b463e'}" paint-order="stroke" stroke="#f2ece0" stroke-width="3">${t}</text>`;
  const ER1=[er[0]+(er[1]-395),395], CAL1=[cal[0]+(cal[1]-470),470];
  const S=pos[3], SAN1=[IND.Consenso[0]-20-(IND.Consenso[1]-S[1]),S[1]];
  let o = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  o += `<circle cx="${P[0]}" cy="${P[1]}" r="${R}" fill="none" stroke="#ddd3be" stroke-width="10"/>`;
  // linee del turno, una per voce dell'esito
  o += L([pos[0],[IND.Spread[0]-20,pos[0][1]]],{w:5});                                         // 6 conti
  o += L([S,SAN1,[IND.Consenso[0]-20,IND.Consenso[1]]],{col:'#b3301d',w:3,dash:'7 5'});        // 2 sanità → consenso, in ritardo
  o += L([[CAM[0]+46,CAM[1]],[220,CAM[1]],[220,250],[250,280],[250,300]],{w:3}) + L([[SEN[0]+46,SEN[1]],[200,SEN[1]],[250,300],[P[0]-34,300]],{w:3}); // 4 aula
  o += L([pos[5],CAL1,cal],{w:4});                                                             // 5 atti eseguiti
  o += L([P,[UR[0]-52,UR[1]]],{w:6}) + L([[UR[0]+52,UR[1]],[IND.Maggioranza[0]-20,UR[1]]],{col:'#b3301d',w:6,dash:'10 6'}); // 1 alleato
  o += L([[P[0]-24,P[1]+24],[375,395],ER1,er],{col:'#b3301d',w:3,dash:'2 5'});                // 3 decreto sul tavolo
  o += L([[650,575],[785,575],[IND.Consenso[0]-20,IND.Consenso[1]+10]],{w:2});                 // 7 sondaggio
  // mappa nel riquadro
  o += `<g transform="translate(${ins.x},${ins.y}) scale(${ins.s})">${Object.entries(GEO.regioni).map(([n,{d}])=>`<path class="reg" d="${d}" fill="${SEQ[cls(DISOC[n],LAYERS.disoc.soglie)]}"><title>${esc(n)}: ${String(DISOC[n]).replace('.',',')}%</title></path>`).join('')}</g>`;
  o += nota([ins.x,ins.y-8],'Disoccupazione per regione');
  o += `<circle cx="${er[0]}" cy="${er[1]}" r="6" fill="none" stroke="#b3301d" stroke-width="2.5"/>`;
  // stazioni
  DIC.forEach((d,i)=>{const [x,y]=pos[i], low=SODD[i]<40, a=ang(i), lx=x+Math.cos(a)*22, ly=y+Math.sin(a)*22+4, anc=Math.cos(a)>0.3?'start':Math.cos(a)<-0.3?'end':'middle';
    o += `<circle cx="${x}" cy="${y}" r="11" fill="#f2ece0" stroke="${low?'#b3301d':'#1c1a17'}" stroke-width="3.5"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${low?'#b3301d':'#1c1a17'}">${SODD[i]}</text><text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="12" font-weight="500" fill="#1c1a17" paint-order="stroke" stroke="#f2ece0" stroke-width="3">${d}</text>`;});
  o += `<circle cx="${P[0]}" cy="${P[1]}" r="34" fill="#1c1a17"/><text x="${P[0]}" y="${P[1]-2}" text-anchor="middle" font-size="11" fill="#f2ece0" font-weight="600">Presidente</text><text x="${P[0]}" y="${P[1]+12}" text-anchor="middle" font-size="11" fill="#f2ece0">del Consiglio</text>`;
  o += `<rect x="${UR[0]-52}" y="${UR[1]-16}" width="104" height="32" rx="16" fill="#f2ece0" stroke="#b3301d" stroke-width="3"/><text x="${UR[0]}" y="${UR[1]-1}" text-anchor="middle" font-size="11" font-weight="600" fill="#b3301d">Unione Riformista</text><text x="${UR[0]}" y="${UR[1]+11}" text-anchor="middle" font-size="10" fill="#b3301d">intesa 38</text>`;
  for(const [k,[x,y]] of Object.entries(IND)){
    const val = k==='Consenso'?T.cons.v:k==='Spread'?T.spread.v:`${T.magg.camera} / ${T.magg.senato}`;
    const d = k==='Consenso'?T.cons.d:k==='Spread'?T.spread.d+' pb':'senza UR '+T.magg.senzaUR;
    o += `<rect x="${x-20}" y="${y-30}" width="120" height="60" fill="#f2ece0" stroke="#1c1a17" stroke-width="2.5"/><text x="${x-10}" y="${y-12}" font-size="10.5" fill="#4b463e" letter-spacing="1">${k.toUpperCase()}</text><text x="${x-10}" y="${y+10}" font-family="IBM Plex Serif" font-size="21" font-weight="600" fill="#1c1a17">${val}</text><text x="${x-10}" y="${y+24}" font-size="10.5" fill="#b3301d">${d}</text>`;
  }
  for(const [n,[x,y]] of [['Camera',CAM],['Senato',SEN]]) o += `<rect x="${x-46}" y="${y-14}" width="92" height="28" fill="#1c1a17"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="#f2ece0" font-weight="600">${n}</text>`;
  // numeri dell'esito sulle linee, con una nota breve
  o += num([800,300],1,1) + nota([800,284],'ultimatum',1,'middle');
  o += num(SAN1,2,1) + nota([SAN1[0]+14,SAN1[1]+4],'soddisfazione 34',1);
  o += num([250,395],3,1) + nota([250,415],'decreto sul tavolo',1,'middle');
  o += num([250,300],4,0) + nota([258,322],'104–91 · 6 f.t.');
  o += num([300,470],5,0) + nota([300,490],'AV lotto 2',0,'middle');
  o += num([700,pos[0][1]],6,0) + nota([700,pos[0][1]-14],'+14 pb',0,'middle');
  o += num([700,575],7,0) + nota([650,595],'sondaggio del trimestre');
  return o+'</svg>';
}

// ---------- switcher ----------
const VARIANTI = {A:['Prima pagina (solo B)',VariantA], B:['Dossier con rete (B+D)',VariantB], C:['Schema su carta (D)',VariantCwrap]};
const K = Object.keys(VARIANTI);
const qs = new URLSearchParams(location.search);
let cur = K.includes(qs.get('variant'))?qs.get('variant'):'B';
let modo = ['fit','deck','hd'].includes(qs.get('frame'))?qs.get('frame'):'fit';
const screen = document.getElementById('screen'), stage = document.getElementById('stage');
let scala = 1;
function cornice(){
  screen.className = modo==='fit'?'fit':'';
  if(modo==='fit'){screen.style.cssText='';scala=1;return;}
  const [w,h] = modo==='deck'?[1280,800]:[1920,1080];
  scala = Math.min(1, stage.clientWidth/w, stage.clientHeight/h);
  screen.style.cssText = `width:${w}px;height:${h}px;transform:scale(${scala})`;
}
function misuraTesto(){ // corpo minimo in px reali
  let min=1e9, chi=null;
  screen.querySelectorAll('*').forEach(el=>{
    const hasText = [...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());
    if(!hasText) return;
    let px;
    if(el.tagName==='title') return; // non disegnato
    if(el instanceof SVGElement){ const m=el.getScreenCTM&&el.getScreenCTM(); if(!m) return; px=parseFloat(getComputedStyle(el).fontSize)*Math.hypot(m.a,m.b); }
    else px=parseFloat(getComputedStyle(el).fontSize)*scala;
    if(px<min){min=px;chi=el;}
  });
  const b=document.getElementById('min');
  b.textContent=`testo min ${min.toFixed(1).replace('.',',')} px ${min>=9?'✓':'✗ < 9'}`;
  b.className='min'+(min<9?' ko':'');
  b.dataset.chi=chi?chi.textContent.trim().slice(0,40):''; b.title='più piccolo: «'+b.dataset.chi+'» — clic per evidenziarlo';
  b.onclick=()=>{document.querySelectorAll('.offender').forEach(e=>e.classList.remove('offender'));chi&&chi.classList.add('offender');};
}
function render(){
  screen.innerHTML = VARIANTI[cur][1]();
  document.getElementById('lab').textContent = `${cur} · ${VARIANTI[cur][0]}`;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===modo));
  screen.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{layerB=b.dataset.layer;render();});
  const q=new URLSearchParams(location.search); q.set('variant',cur); q.set('frame',modo); history.replaceState(null,'','?'+q);
  cornice(); requestAnimationFrame(misuraTesto);
}
const go=d=>{cur=K[(K.indexOf(cur)+d+K.length)%K.length];render();};
