<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo fondazione · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec)}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.testa{display:flex;align-items:end;gap:16px;padding:12px var(--marg) 8px;border-bottom:var(--doppio)}
.testa .nomino{font-size:30px}
.testa .dove{font-family:var(--tit);font-size:var(--c-sez);font-weight:600}
.testa .fuori{margin-left:auto;padding-bottom:3px;font-size:var(--c-sec);color:var(--grigio)}
.testa .fuori b{color:var(--ink)}
.corpo{padding:14px var(--marg) 16px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:12px var(--canale);align-content:start}
.corpo>*{min-width:0}
.titsez{display:flex;align-items:baseline;gap:12px;border-bottom:var(--forte);padding-bottom:4px;margin-bottom:6px}
.titsez .tit{font-size:var(--c-riq)}
.titsez .dx{margin-left:auto}
.nota-proto{font-size:var(--c-min);color:var(--grigio);font-style:italic}

/* nome */
.nome{display:flex;gap:10px;align-items:baseline}
.nome input{font:inherit;border:0;border-bottom:var(--forte);background:transparent;padding:2px 2px;min-width:0;flex:1;color:var(--ink)}
.nome input::placeholder{color:var(--grigio);opacity:.7}
.nome .cnt{font-size:var(--c-min);color:var(--grigio);white-space:nowrap}
.nome.grande input{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;font-size:var(--c-apre);line-height:1.05}
.nome.medio input{font-family:var(--tit);font-weight:700;font-size:var(--c-sez)}

/* asse con istogramma */
.asse{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;border-bottom:var(--forte)}
.asse .bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;padding:0 18%}
.asse .bar i{display:block;width:100%;background:var(--grigio);opacity:.55}
.asse .bar.vic i{background:var(--ink);opacity:1}
.asse .bar .q{font-size:var(--c-min);color:var(--grigio);margin-bottom:2px}
.asse .bar.vic .q{color:var(--ink);font-weight:700}
.asse .slot{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--grigio)}
.asse .slot.qui{border-left:2.5px solid var(--rosso)}
.asse .slot button{position:absolute;top:0;transform:translateX(-50%);border:1.5px solid var(--ink);background:var(--carta);padding:2px 7px;font-size:var(--c-sec);font-weight:700;white-space:nowrap;line-height:1.15;text-align:center}
.asse .slot button small{display:block;font-weight:400;font-size:var(--c-min);color:var(--grigio)}
.asse .slot button:hover{background:var(--velo)}
.asse .slot.qui button{background:var(--rosso);border-color:var(--rosso);color:var(--carta)}
.asse .slot.qui button small{color:var(--carta)}
.sotto{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:var(--c-min);padding-top:3px}
.sotto b{display:block;font-size:var(--c-sec)}
.sotto .vic b{color:var(--ink)} .sotto span{color:var(--grigio)}
.estremi{display:flex;justify-content:space-between;font-size:var(--c-min);color:var(--grigio);margin-top:2px}

/* elenco degli alleati */
.alleati{display:grid;gap:0}
.al{display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 6px;padding:3px 0;border-bottom:var(--filo);font-size:var(--c-sec);align-items:baseline}
.al .seg{font-weight:700}
.al.si .seg{color:var(--verde)} .al.no{color:var(--grigio)} .al.no .seg{color:var(--grigio)}
.al .ca{grid-column:2;font-size:var(--c-min);color:var(--grigio)}
.al.si .nm{font-weight:700}

/* tabellina dei posti (A) */
.posti{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.posti th{font-size:var(--c-min);letter-spacing:.06em;text-transform:uppercase;color:var(--grigio);font-weight:700;text-align:left;padding:2px 6px;border-bottom:var(--filo)}
.posti td{padding:4px 6px;border-bottom:var(--filo);vertical-align:baseline}
.posti tr{cursor:pointer}
.posti tr:hover td{background:var(--velo)}
.posti tr.qui td{background:var(--ink);color:var(--carta)}
.posti tr.qui .muto{color:var(--carta);opacity:.8}
.posti .n{text-align:right;white-space:nowrap;font-weight:700}
.qb{display:inline-block;height:8px;background:var(--rosso);vertical-align:middle;margin-right:5px}
tr.qui .qb{background:var(--giallo)}

/* dettaglio a lato (A) */
.corpo.A{grid-template-columns:minmax(0,1fr) var(--lato);overflow:hidden}
.sx{display:grid;gap:18px;align-content:start;min-width:0;overflow:hidden auto;padding-right:6px}
.lato{border-left:var(--bordo);padding-left:var(--canale);display:grid;gap:12px;align-content:start;overflow:hidden auto;min-width:0}
.grandenum{font-family:var(--tit);font-weight:800;font-size:var(--c-test);line-height:.95;color:var(--rosso)}
.vuoto{border:1.5px dashed var(--grigio);color:var(--grigio);padding:14px;font-size:var(--c-sec)}
.fonda{border-top:var(--doppio);padding-top:10px;display:grid;gap:6px}
.fonda .chi{font-family:var(--tit);font-weight:700;font-size:var(--c-riq)}
.manca{font-size:var(--c-min);color:var(--rosso);font-weight:700}

/* B */
.corpo.B{grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;gap:10px}
.B .carte{display:grid;grid-template-columns:.5fr repeat(6,minmax(0,1fr)) .5fr;gap:0 8px}
.B .carta{grid-row:1;border:1.5px solid var(--ink);padding:6px 8px 8px;display:grid;gap:4px;align-content:start;text-align:left;background:var(--carta)}
.B .carta:hover{background:var(--velo)}
.B .carta.qui{background:var(--ink);color:var(--carta)}
.B .carta .pp{font-size:var(--c-min);color:var(--grigio);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.B .carta.qui .pp{color:var(--giallo)}
.B .carta .qq{font-family:var(--tit);font-weight:800;font-size:var(--c-pag);line-height:1}
.B .carta .ch{display:flex;flex-wrap:wrap;gap:3px}
.B .carta .ch span{font-size:var(--c-min);border:1px solid currentColor;padding:0 4px;font-weight:700}
.B .carta .ch .nessuno{border:0;padding:0;font-weight:400;color:var(--grigio)}
.B .carta.qui .ch .nessuno{color:var(--carta);opacity:.75}
.B .piede{border-top:var(--doppio);padding-top:8px;display:flex;gap:14px;align-items:center}
.B .piede .frase{font-size:var(--c-lead);flex:1}
.B .asse .slot button{display:none}
.B .asse .slot{border-left-style:dotted}
.B .asse .slot.qui{border-left-style:solid}

/* C */
.corpo.C{align-content:start}
.mat td{padding-top:9px!important;padding-bottom:9px!important}
.mat{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.mat th{font-size:var(--c-min);color:var(--grigio);font-weight:700;padding:3px 6px;border-bottom:var(--forte);text-align:center;vertical-align:bottom;line-height:1.1}
.mat th.sx2{text-align:left}
.mat td{padding:5px 6px;border-bottom:var(--filo);text-align:center;vertical-align:middle}
.mat td.sx2{text-align:left}
.mat tr.riga{cursor:pointer}
.mat tr.riga:hover td{background:var(--velo)}
.mat tr.riga.qui td{background:rgb(255 210 63 / .35)}
.mat tr.riga.qui td:first-child{box-shadow:inset 4px 0 0 var(--rosso)}
.mat .rd{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block;vertical-align:middle}
.mat tr.qui .rd{background:radial-gradient(var(--rosso) 0 3.5px,transparent 4px)}
.mat .pt{font-family:var(--tit);font-weight:700;font-size:var(--c-riq)}
.mat .qn{font-family:var(--tit);font-weight:800;font-size:var(--c-riq);white-space:nowrap}
.mat .qn .qb{height:9px}
.pall{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle}
.pall.si{background:var(--verde)}
.pall.no{border:1.5px solid var(--grigio);opacity:.6}
.mini{display:inline-grid;grid-template-columns:repeat(7,7px);gap:1px;align-items:end;height:30px;position:relative;vertical-align:middle}
.mini i{display:block;background:var(--grigio);opacity:.55}
.mini i.vic{background:var(--ink);opacity:1}
.mini b{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px solid var(--rosso)}
.C .sotto-mat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--canale);align-items:end;border-top:var(--doppio);padding-top:8px;margin-top:6px}
.C .cause{columns:2;column-gap:var(--canale);font-size:var(--c-min);color:var(--grigio)}
.C .cause div{break-inside:avoid;padding:1px 0}
.C .cause b{color:var(--ink)}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}

#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px}
#proto .lab{min-width:120px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
</style>
</head>

const DEF = {v:'A', son:'oggi4', fin:'1280', scala:'1'};
const st = {...DEF, nome:'', posto:null, msg:''};
try{ new URLSearchParams(location.search).forEach((v,k)=>{ if(k in DEF) st[k]=v; }); }catch(e){}
const FORME = {A:'A · Banco', B:'B · Manifesto', C:'C · Tabella'};
const SON = {oggi4:'oggi, seme 4', oggi1:'oggi, seme 1', oggi9:'oggi, seme 9', destra4:'elettorato a destra, seme 4'};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (x,d=1) => x.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
const pct = q => num(q*100)+'%';
const NOMI = Object.fromEntries(D.partiti.map(p=>[p.id,p.nome]));
const PART = [...D.partiti].sort((a,b)=>a.posizione-b.posizione);
const an = () => D.anteprime[SON[st.son]];
const voce = () => an().posizioni.find(p=>p.posizione===st.posto);
const vicini = x => [Math.floor(x), Math.ceil(x)];          // i due punti interi accanto al mezzo punto
const fra = x => { const [a,b]=vicini(x); return `fra ${PART[a-1].nome} e ${PART[b-1].nome}`; };
const sinistraDestra = x => x<3?'a sinistra':x>5?'a destra':x<4?'al centrosinistra':'al centrodestra';
const disponibili = v => v.disponibilita.filter(d=>d.disponibile);
const maxQ = () => Math.max(...an().posizioni.map(p=>p.quota_attesa));
const nomeP = () => st.nome.trim() || 'Il vostro partito';

// ===== pezzi =====
function testa(){
  return `<div class="testa"><button class="link" data-indietro>‹ Scenario</button><span class="nomino">Il Pungolo</span>
    <span class="dove">Nuova partita · il partito</span>
    <span class="fuori">Scenario: <b>${st.son==='destra4'?'Elettorato a destra':'Italia di oggi'}</b></span></div>`;
}
function campoNome(cl){
  return `<label class="nome ${cl}"><input data-nome maxlength="40" value="${esc(st.nome)}" placeholder="Come si chiama il vostro partito?" aria-label="Nome del partito">
    <span class="cnt">${st.nome.trim().length}/40</span></label>`;
}
function asse(h, conBottoni=true){
  const a=an(), mx=Math.max(...a.istogramma), vic=st.posto?vicini(st.posto):[];
  const bars=a.istogramma.map((q,i)=>`<div class="bar ${vic.includes(i+1)?'vic':''}"><span class="q">${pct(q)}</span><i style="height:${(q/mx*(h-50)).toFixed(0)}px"></i></div>`).join('');
  const slots=a.posizioni.map(p=>`<div class="slot ${p.posizione===st.posto?'qui':''}" style="left:${((p.posizione-.5)/7*100).toFixed(3)}%">${conBottoni?`<button role="radio" aria-checked="${p.posizione===st.posto}" data-posto="${p.posizione}">${pct(p.quota_attesa)}<small>${num(p.posizione)}</small></button>`:''}</div>`).join('');
  const sotto=PART.map((p,i)=>`<div class="${vic.includes(i+1)?'vic':''}"><b>${esc(p.nome)}</b><span>${num(p.posizione,0)}</span></div>`).join('');
  return `<div class="asse" role="radiogroup" aria-label="Posto sull'asse" style="height:${h}px">${bars}${slots}</div><div class="sotto">${sotto}</div>
    <div class="estremi"><span>1 · estrema sinistra</span><span>elettori che si collocano su ogni punto, dalle regioni del sondaggio</span><span>estrema destra · 7</span></div>`;
}
function elencoAlleati(v){
  const o=[...v.disponibilita].sort((a,b)=>(b.disponibile-a.disponibile)||(PART.findIndex(p=>p.id===a.partito)-PART.findIndex(p=>p.id===b.partito)));
  return `<div class="alleati">${o.map(d=>`<div class="al ${d.disponibile?'si':'no'}"><span class="seg">${d.disponibile?'✓':'✕'}</span><span class="nm">${esc(NOMI[d.partito])}</span><span class="ca">${esc(d.causa)}</span></div>`).join('')}</div>`;
}
function fonda(){
  const manca=[!st.nome.trim()&&'manca il nome', !st.posto&&'manca il posto'].filter(Boolean);
  return `<div class="fonda"><div class="chi">${esc(nomeP())}${st.posto?` · a ${num(st.posto)}`:''}</div>
    ${manca.length?`<div class="manca">${manca.join(', ')}</div>`:`<div class="min muto">Si vota alla chiusura del turno zero: il primo turno è la campagna.</div>`}
    <div><button class="btn pieno" data-fonda ${manca.length?'disabled':''}>Fonda il partito ›</button></div></div>`;
}

// ===== A · Banco =====
function vistaA(){
  const a=an(), mx=maxQ(), v=st.posto&&voce();
  const righe=a.posizioni.map(p=>{ const d=disponibili(p);
    return `<tr class="${p.posizione===st.posto?'qui':''}" data-posto="${p.posizione}"><td><b>${num(p.posizione)}</b> <span class="muto">${fra(p.posizione)}</span></td>
      <td class="n"><span class="qb" style="width:${(p.quota_attesa/mx*70).toFixed(0)}px"></span>${pct(p.quota_attesa)}</td>
      <td>${d.length?d.map(x=>esc(NOMI[x.partito])).join(', '):'<span class="muto">nessuno</span>'}</td></tr>`; }).join('');
  const lato = v ? `<div><div class="occ">Il posto ${num(v.posizione)} · ${sinistraDestra(v.posizione)}</div>
      <h3 class="tit" style="font-size:var(--c-sez)">${fra(v.posizione)}</h3></div>
    <div><div class="grandenum">${pct(v.quota_attesa)}</div><div class="sec muto">dei votanti, atteso al turno zero: media degli istituti del sondaggio</div><div class="min muto" style="margin-top:2px">È un sondaggio: il voto può dire altro.</div></div>
    <div class="sec">Accanto a voi si collocano il <b>${pct(a.istogramma[vicini(v.posizione)[0]-1])}</b> e il <b>${pct(a.istogramma[vicini(v.posizione)[1]-1])}</b> degli elettori.</div>
    <div><div class="titsez"><h4 class="tit">Con chi correre</h4><span class="dx min muto">${disponibili(v).length} disponibili</span></div>${elencoAlleati(v)}</div>`
    : `<div class="vuoto">Scegliete un posto sull'asse o nella tabella: qui il risultato atteso e con chi potreste correre.</div>`;
  return `${testa()}<div class="corpo A"><div class="sx">
      <div><div class="titsez"><h3 class="tit">Il nome</h3></div>${campoNome('medio')}</div>
      <div><div class="titsez"><h3 class="tit">Il posto sull'asse</h3><span class="dx min muto">uno dei sei mezzi punti fra due partiti</span></div>${asse(230)}</div>
      <table class="posti"><thead><tr><th>Posto</th><th style="text-align:right">Atteso</th><th>Alleati disponibili</th></tr></thead><tbody>${righe}</tbody></table>
    </div><div class="lato">${lato}${fonda()}</div></div>`;
}

// ===== B · Manifesto =====
function vistaB(){
  const a=an(), v=st.posto&&voce();
  const carte=a.posizioni.map((p,i)=>{ const d=disponibili(p);
    return `<button class="carta ${p.posizione===st.posto?'qui':''}" style="grid-column:${i+2}" data-posto="${p.posizione}" role="radio" aria-checked="${p.posizione===st.posto}">
      <span class="pp">a ${num(p.posizione)}</span><span class="qq">${pct(p.quota_attesa)}</span>
      <span class="ch">${d.length?d.map(x=>`<span title="${esc(x.causa)}">${esc(NOMI[x.partito])}</span>`).join(''):'<span class="nessuno">da soli</span>'}</span></button>`; }).join('');
  const frase = v ? `<b>${esc(nomeP())}</b> nasce ${fra(v.posizione)}: <b>${pct(v.quota_attesa)}</b> atteso dei votanti; ${disponibili(v).length?'potrebbe correre con '+disponibili(v).map(x=>esc(NOMI[x.partito])).join(' e '):'correrebbe da solo'}.`
    : '<span class="muto">Scegliete una delle sei colonne.</span>';
  const manca=[!st.nome.trim()&&'manca il nome', !st.posto&&'manca il posto'].filter(Boolean);
  return `${testa()}<div class="corpo B"><div>${campoNome('grande')}</div>
    <div style="display:grid;align-content:start;min-height:0;gap:6px"><div class="carte">${carte}</div>${asse(Math.max(160, (st.fin==='1440'?900:800)/(+st.scala)-405),false)}</div>
    <div class="piede"><span class="frase">${frase}</span>${manca.length?`<span class="manca">${manca.join(', ')}</span>`:''}<button class="btn pieno" data-fonda ${manca.length?'disabled':''}>Fonda il partito ›</button></div></div>`;
}

// ===== C · Tabella =====
function vistaC(){
  const a=an(), mx=maxQ(), mi=Math.max(...a.istogramma), v=st.posto&&voce();
  const testaP=PART.map(p=>`<th>${esc(p.nome).replace(' ','<br>')}</th>`).join('');
  const righe=a.posizioni.map(p=>{ const vic=vicini(p.posizione), by=Object.fromEntries(p.disponibilita.map(d=>[d.partito,d]));
    const mini=`<span class="mini">${a.istogramma.map((q,i)=>`<i class="${vic.includes(i+1)?'vic':''}" style="height:${(q/mi*28).toFixed(0)}px"></i>`).join('')}<b style="left:${(vic[0]*8-.5)}px"></b></span>`;
    return `<tr class="riga ${p.posizione===st.posto?'qui':''}" data-posto="${p.posizione}"><td><span class="rd"></span></td><td class="sx2"><span class="pt">${num(p.posizione)}</span> <span class="min muto">${fra(p.posizione)}</span></td>
      <td>${mini}</td><td class="sx2 qn"><span class="qb" style="width:${(p.quota_attesa/mx*80).toFixed(0)}px"></span>${pct(p.quota_attesa)}</td>
      ${PART.map(x=>{const d=by[x.id]; return `<td title="${esc(x.nome)}: ${esc(d.causa)}"><span class="pall ${d.disponibile?'si':'no'}"></span></td>`;}).join('')}</tr>`; }).join('');
  const cause = v ? `<div class="cause">${[...v.disponibilita].sort((a,b)=>b.disponibile-a.disponibile).map(d=>`<div><b class="${d.disponibile?'bene':''}">${esc(NOMI[d.partito])}</b>: ${esc(d.causa)}</div>`).join('')}</div>`
    : `<div class="sec muto">Scegliete una riga: qui sotto le cause, partito per partito.</div>`;
  return `${testa()}<div class="corpo C"><div>${campoNome('medio')}</div>
    <table class="mat" role="radiogroup" aria-label="Posto sull'asse"><thead><tr><th></th><th class="sx2">Posto</th><th>Elettori</th><th class="sx2">Atteso</th>${testaP}</tr></thead><tbody>${righe}</tbody></table>
    <div class="sotto-mat">${cause}<div>${fonda()}</div></div></div>`;
}

// ===== montaggio =====
const scr=document.getElementById('screen'); let limite='';
function render(){
  const W=+st.fin, H=W===1440?900:800, chiesta=+st.scala, z=Math.min(chiesta,W/1024), lw=W/z, lh=H/z;
  limite = z<chiesta ? `scala fermata a ${num(z,2)}×` : '';
  const foc=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.nome!==undefined;
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML=`<div class="vS" style="zoom:${z};width:${lw}px;height:${lh}px">${({A:vistaA,B:vistaB,C:vistaC})[st.v]()}</div>`;
  if(foc){ const el=scr.querySelector('[data-nome]'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
  document.getElementById('lab').textContent=FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',st[seg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  document.getElementById('avv').textContent=[limite,'anteprima vera (genera/): '+SON[st.son],st.msg].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else st[b.parentElement.dataset.k]=b.dataset.v;
  st.msg=''; render();
});
scr.addEventListener('input',e=>{ if(e.target.dataset.nome!==undefined){ st.nome=e.target.value; render(); } });
scr.addEventListener('click',e=>{
  const q=s=>e.target.closest(s); let x; st.msg='';
  if(x=q('[data-posto]')) st.posto=+x.dataset.posto;
  else if(q('[data-fonda]')) st.msg=`(fonda «${st.nome.trim()}» a ${num(st.posto)} sullo stesso seme dell'anteprima e apre il turno zero)`;
  else if(q('[data-indietro]')) st.msg='(torna all’editor dello scenario)';
  else return;
  render();
});
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
