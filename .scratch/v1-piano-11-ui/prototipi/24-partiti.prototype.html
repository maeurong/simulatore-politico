<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Partiti» (24), mappa v1-piano-11-ui.
  Domanda: com'è fatta la sezione Partiti? L'asse coi partiti IA e il tuo, posizione dichiarata e percepita (storia 117),
  leader con nome e caricatura (103), vocazione e regola di movimento in una riga (100), minaccia di scissione (108),
  nascite e scioglimenti (108-109); gli alleati con intesa, cause, ultimatum e soglie (83); il parlamento in carica;
  le casse dei partiti (122, 129). All'opposizione gli alleati sono quelli del governo avversario, in fasce.
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Schieramento — l'asse a tutta pagina coi partiti sopra, dichiarata e percepita; sotto, una scheda per partito
    B  Schedario    — tabella densa, una riga per partito nell'ordine dell'asse; sotto, le due Camere a barre
    C  Campi        — tre colonne per rapporto con te (maggioranza, opposizione, fuori dalle Camere), l'intesa in grande
  In tutte la scheda del partito sta nel dettaglio a lato; senza scelta il lato mostra le Camere in carica e quelle che
  uscirebbero votando oggi.
  Stati, ?stato=: governo (Vista 03) · ultimatum (seme 1, turno 13: Sinistra in ultimatum, minaccia di scissione, Lista
    dei Territori nata) · dieci (seme 14, turno 37: dieci partiti, il tetto, e due leader nuovi) · opposizione (06) ·
    opp_fine (seme 1, turno 19) · sciolto (seme 43, turno 21: Estrema sinistra sciolta; a partita finita, qui solo per
    vedere la riga) · grave (08) · zero (01, turno zero)
  Altri parametri: ?fin=1280|1440 ?scala=1|1.25
  Dati: le Viste campione, nessuna aggiunta a genera/ (dati incollati da uno script che legge viste/). Ricavati qui:
  la minaccia (distanza ≥ 0,5: `VocePartito.minaccia` è nella spec del core, le soglie in `VistaCampagna`), le elezioni
  senza seggi di fila (da `Vista.elezioni`), il leader nuovo (confronto col turno zero: in partita lo dice il registro,
  voce `cambio_di_leader`), l'origine del partito nato (la dice il registro, voci `partito_di_protesta` e `scissione`;
  qui scritta a mano dove la nota del 26 la sa). Rifatte dai dati del core, e quindi un rimando: le soglie dell'intesa,
  40 per l'ultimatum e 25 per l'uscita (manopole.toml, soglia_ultimatum e soglia_uscita), che la Vista non porta.
  Colori dei partiti: gli otto del ticket 23; i partiti nati in partita a retino grigio. Facce: variante 5 del 32,
  copiata dal 18. Stile: 08-fondamenta (forma A), cornice del 17/18. Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 12/11/2026), nel ticket 24: A · Schieramento; carisma del leader come numero con segno; partiti nati
  a retino grigio; senza scelta il lato mostra le Camere. Il file si apre su questa forma. Scartate: B e C dalla barra.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo Partiti · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.dl.crit{background:var(--rosso);color:var(--carta);padding:0 5px}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.fascia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fascia .cas{--cw:12px;--ch:8px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-top:var(--filo);font-size:var(--c-sec)}
.voce:first-child{border-top:0}
.voce small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.voce small::before{content:"perché: ";font-style:italic}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:center}
.dati dt{color:var(--grigio)}

/* cornice A · Gerenza */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez);margin-bottom:4px}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:2px}
.capo h3{margin:0}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:170px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}

.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start}
.lato h4{font-size:var(--c-sez)}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.rosso{border-color:var(--rosso);color:var(--rosso)}
.chip.pieno{background:var(--ink);color:var(--carta)}
.chip.ok{border-color:var(--verde);color:var(--verde)}
.chip.tr{border-style:dashed;border-color:var(--grigio);color:var(--grigio)}
.sez-l{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);border-bottom:1.5px solid var(--ink);padding-bottom:2px;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.sez-l span{letter-spacing:0;text-transform:none;font-weight:400}

/* ===== Partiti (ticket 24) ===== */
.par{grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.par>.lato{overflow:hidden auto;min-height:0;padding-bottom:8px}
.par>.pag{min-height:0;overflow:hidden auto;display:grid;gap:10px;align-content:start}
.sw{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);vertical-align:-1px;margin-right:5px;flex:none}
.sw.nato{background:var(--retino)!important}
.g .sw{background:var(--carta)!important}
.tu-box{display:inline-grid;place-items:center;border:2px solid var(--biro);color:var(--biro);font-weight:800;font-family:var(--tit);flex:none}
.g .tu-box{border-color:var(--ink);color:var(--ink)}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.sciolto{color:var(--grigio)}
.sciolto .nmP{text-decoration:line-through}
.nmP{font-weight:700}
.ld{font-size:var(--c-min);color:var(--grigio)}
.ld b{color:var(--ink);font-weight:400}
.ind1{font-size:var(--c-min);color:var(--grigio);line-height:1.25}
.num{font-weight:700;white-space:nowrap}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none;position:relative}
.cas i.on{background:var(--ink)}
.cas i.rs{border-color:var(--rosso)}
.cas i.rs.on{background:var(--rosso)}
.cas i.sg::after{content:"";position:absolute;right:-3.5px;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.g .cas i.sg::after{background:var(--ink)}
.intesa{display:grid;gap:2px}
.intesa .cas{--cw:12px;--ch:10px}
.ints{font-size:var(--c-min);color:var(--grigio);display:flex;justify-content:space-between;gap:6px}
.barraI{position:relative;height:12px;border:1px solid var(--grigio);background:var(--velo)}
.barraI i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barraI i.ult{background:var(--rosso)}
.barraI b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.barraI em{position:absolute;top:13px;font-size:10px;font-style:normal;color:var(--rosso);transform:translateX(-50%);white-space:nowrap}
.cause{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;font-size:var(--c-min)}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:baseline}
.dati dt{color:var(--grigio)}
.dati dd b{font-weight:700}
.mossa{font-size:var(--c-min);border-left:2px solid var(--biro);padding-left:6px;color:var(--ink);line-height:1.3}
.g .mossa{border-color:var(--ink)}
.prom{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:var(--c-min);gap:1px 8px}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.testa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.testa h4{font-size:var(--c-sez)}
.ax text{font:400 11px var(--txt);fill:var(--grigio)}
.ax .nmA{font-weight:700;fill:var(--ink);font-size:12px}
.ax .nmA.sc{text-decoration:line-through;fill:var(--grigio)}
.sel-ring{outline:2px solid var(--ink);outline-offset:1px}
[data-sel]{cursor:pointer}

/* A · Schieramento */
.schier{display:grid;grid-template-columns:repeat(var(--nc),minmax(0,1fr));gap:6px}
.sch .cas{--cw:10px;--ch:9px}
.sch .cas i.sg::after{right:-2.5px}
.sch .ind1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch{border:var(--bordo);padding:6px 8px 7px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;align-content:start;border-top-width:5px;min-width:0}
.sch>:not(.fz){grid-column:2}
.sch .fz{grid-row:1/span 3;grid-column:1;align-self:start}
.sch .largo{grid-column:1/-1}
.sch:hover{background:var(--velo)}
.sch.sel{box-shadow:inset 0 0 0 2px var(--ink)}

.sch .nmP{font-size:var(--c-sec);line-height:1.15}
.sch.sciolto{border-style:dashed;border-color:var(--grigio)}
.sch .rr{display:flex;justify-content:space-between;gap:4px;font-size:var(--c-min);min-width:0}
.sch .rr>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asseG{border-bottom:var(--doppio);padding-bottom:4px}

/* B · Schedario */
.lst{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.lst th{font-size:var(--c-min);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio);text-align:left;font-weight:700;border-bottom:1.5px solid var(--ink);padding:2px 5px;white-space:nowrap}
.lst th.n,.lst td.n{text-align:right}
.lst td{border-bottom:var(--filo);padding:3px 5px;vertical-align:middle}
.lst tr.riga:hover td{background:var(--velo)}
.lst tr.sel td{background:var(--velo)}
.lst tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.lst tr.mi td:first-child{box-shadow:inset 3px 0 0 var(--rosso)}
.lst td.f{width:40px;padding:2px 4px}
.lst td.nm{white-space:nowrap}
.lst td.ind{font-size:var(--c-min);color:var(--grigio);max-width:0;width:22%}
.lst td.ind>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst td.n{white-space:nowrap}
.camere{display:grid;gap:4px}
.cam{display:grid;grid-template-columns:62px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:var(--c-min)}
.stk{display:flex;height:14px;border:1px solid var(--ink);position:relative}
.stk i{height:100%;border-right:1px solid var(--carta)}
.stk b{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.g .stk b{background:var(--ink)}

/* C · Campi */
.campi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.campi>section{padding:0 14px;border-left:var(--filo);display:grid;gap:6px;align-content:start;min-width:0}
.campi>section:first-child{padding-left:0;border-left:0}
.campi>section:last-child{padding-right:0}
.campi .capo h3{font-size:var(--c-riq)}
.fas{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:center;border:var(--filo);border-left:5px solid var(--ink);padding:5px 7px}
.fas:hover{background:var(--velo)}
.fas.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.fas.sciolto{border-style:dashed}
.fas .t{min-width:0;line-height:1.2}
.fas .s{grid-column:1/-1;font-size:var(--c-min);color:var(--grigio);line-height:1.25}
.fas .intesa{grid-column:1/-1}
</style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>
<div id="proto">

// con la direzione come in un tratto a pennino; si assottiglia ai due capi. Ogni passo è un quadrilatero, tutti con lo
// stesso verso, in un solo path: la regola nonzero ne fa l'unione senza giunte.
const PENNI = new Map();
let PEN;
function pennello(d,L,a,passo=.7,coda=.16){
  const chiave=`${d}|${L}|${a}`; if(PENNI.has(chiave)) return PENNI.get(chiave);
  if(!PEN){ const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('style','position:absolute;width:0;height:0;visibility:hidden'); PEN=document.createElementNS(s.namespaceURI,'path'); s.appendChild(PEN); document.body.appendChild(s); }
  PEN.setAttribute('d',d);
  const tot=PEN.getTotalLength(), n=Math.max(8,Math.ceil(tot/passo)), nx=Math.cos(a*Math.PI/180)*L/2, ny=-Math.sin(a*Math.PI/180)*L/2;
  const pt = Array.from({length:n+1},(_,i)=>{ const t=i/n, q=PEN.getPointAtLength(t*tot), s=Math.max(.25,Math.min(1,t/coda,(1-t)/coda)); return [q.x,q.y,nx*s,ny*s]; });
  const f = v=>+v.toFixed(1);
  let out='';
  for(let i=0;i<n;i++){
    const [x0,y0,a0,b0]=pt[i], [x1,y1,a1,b1]=pt[i+1];
    let q=[[x0-a0,y0-b0],[x0+a0,y0+b0],[x1+a1,y1+b1],[x1-a1,y1-b1]];
    if(q.reduce((s,[x,y],j)=>{ const [X,Y]=q[(j+1)%4]; return s+x*Y-X*y; },0)<0) q.reverse();

}

  if(r.k==='uscente') c.push(`<span class="chip">governo uscente</span>`);
  if(r.k==='alleato' && r.a.ultimatum) c.push(`<span class="chip rosso">ultimatum</span>`);
  if(r.k==='fascia' && r.f.fascia==='ultimatum') c.push(`<span class="chip rosso">ultimatum al governo</span>`);
  if(minaccia(p)) c.push(`<span class="chip rosso">minaccia di scissione</span>`);
  if(nato(p) && !corto) c.push(`<span class="chip">nato in partita</span>`);
  if(leaderNuovo(p) && !corto) c.push(`<span class="chip">leader nuovo</span>`);
  const z=senzaSeggi(p); if(!p.sciolto && p.id!=='giocatore' && z===1 && !corto) c.push(`<span class="chip tr">senza seggi all’ultimo voto</span>`);
  return c.join(' ');
}
// l'intesa in dieci caselle: le soglie di 40 e 25 come fili rossi dopo la quarta e la terza (si legge «sotto il filo»)
function intesa(a, larga){
  const n=Math.round(a.intesa/10), rossa = a.intesa<SOGLIA.ultimatum;
  const cas = `<span class="cas">${Array.from({length:10},(_,i)=>`<i class="${[i<n?'on':'', rossa?'rs':'', i===2||i===3?'':'' ].join(' ')}${i===3?' sg':''}"></i>`).join('')}</span>`;
  if(!larga) return `<span class="intesa">${cas}<span class="ints"><b class="${rossa?'male':''}">intesa ${num(a.intesa,0)}</b><span>${a.ultimatum?'ultimatum':a.intesa<SOGLIA.ultimatum+10?'vicina al filo':''}</span></span></span>`;
  const w=x=>`${x}%`;
  return `<div class="barraI"><i class="${rossa?'ult':''}" style="width:${w(a.intesa)}"></i><b style="left:${w(SOGLIA.ultimatum)}"></b><b style="left:${w(SOGLIA.uscita)}"></b>
    <em style="left:${w(SOGLIA.ultimatum)}">40 ultimatum</em><em style="left:${w(SOGLIA.uscita)}">25 esce</em></div><div style="height:12px"></div>`;
}
function fascia3(f){
  const n={solida:3,incrinata:2,ultimatum:1}[f.fascia];
  return `<span class="intesa"><span class="cas" style="--cw:18px;--ch:10px">${[0,1,2].map(i=>`<i class="${i<n?'on':''} ${f.fascia==='ultimatum'?'rs':''}"></i>`).join('')}</span><span class="ints"><b class="${f.fascia==='ultimatum'?'male':''}">col governo: ${FASCIA[f.fascia]}</b></span></span>`;
}
function rapBreve(p){
  const r=rapporto(p);
  if(r.k==='alleato') return intesa(r.a);
  if(r.k==='fascia') return fascia3(r.f);
  return '';
}

// ======================= l'asse =======================
// x da 1 a 7; dichiarata = punto pieno, percepita = anello, la freccia fra le due; i fili di minaccia e scissione
// solo dal lato dove scivola la percepita
function asse(ps, W, H, opz={}){
  if(opz.etichette){ // file dei nomi prima, per sapere quanto è alto
    const L0=18, R0=W-18, X0=x=>L0+(x-1)/6*(R0-L0), lv=[];
    for(const p of ps){ const x=X0(p.posizione_dichiarata), w=nomeA(p).length*6.6+12; let k=0; while((lv[k]??-1e9) > x - w/2) k++; lv[k]=x+w/2; }
    H = 52 + lv.length*16; }
  const L=18, R=W-18, X=x=>L+(x-1)/6*(R-L), y0=H-22;
  let s=`<line x1="${L}" y1="${y0}" x2="${R}" y2="${y0}" stroke="#1F1A17" stroke-width="1.5"/>`;
  for(let i=1;i<=7;i++) s+=`<line x1="${X(i)}" y1="${y0}" x2="${X(i)}" y2="${y0+5}" stroke="#1F1A17"/><text x="${X(i)}" y="${y0+16}" text-anchor="middle">${i}</text>`;
  s+=`<text x="${L}" y="${y0+16}" text-anchor="start" dx="-14">◂</text><text x="${R}" y="${y0+16}" text-anchor="end" dx="14">▸</text>`;
  // file per non sovrapporre i nomi: avido, da sinistra
  const livelli=[]; const pos={};
  for(const p of ps){ const x=X(p.posizione_dichiarata), w=(opz.etichette? (nomeA(p).length*6.6+12):18); let k=0; while((livelli[k]??-1e9) > x - w/2) k++; livelli[k]=x+w/2; pos[p.id]=k; }
  const passo = 16;
  for(const p of ps){
    const xd=X(p.posizione_dichiarata), xp=X(p.posizione_percepita), y=y0-6, c=col(p), sel=st.sel===p.id;
    const verso=Math.sign(p.posizione_percepita-p.posizione_dichiarata)||1;
    if(opz.fili && minaccia(p)) for(const [d,lab] of [[SCISS.minaccia,'½'],[SCISS.scissione,'1']]) { const xx=X(p.posizione_dichiarata+verso*d); s+=`<line x1="${xx}" y1="${y-9}" x2="${xx}" y2="${y+3}" stroke="#B3122B" stroke-width="${d===1?2:1}" ${d===1?'':'stroke-dasharray="2 2"'}/>`; }
    if(Math.abs(xp-xd)>2) s+=`<line x1="${xd}" y1="${y}" x2="${xp-Math.sign(xp-xd)*4}" y2="${y}" stroke="${minaccia(p)&&!grave()?'#B3122B':'#5E5750'}" stroke-width="1.5" marker-end="url(#pt)"/>`;
    s+=`<circle cx="${xp}" cy="${y}" r="4.5" fill="#F4ECD8" stroke="${c}" stroke-width="2"/>`;
    if(opz.etichette){ const yl=y-14-pos[p.id]*passo; s+=`<line x1="${xd}" y1="${y-5}" x2="${xd}" y2="${yl+3}" stroke="${c}" stroke-width="${sel?2.5:1}"/>`;
      const anc = xd-L < nomeA(p).length*3.4 ? 'start' : R-xd < nomeA(p).length*3.4 ? 'end' : 'middle', dx = anc==='start'?-6:anc==='end'?6:0;
      s+=`<text class="nmA ${p.sciolto?'sc':''}" x="${xd+dx}" y="${yl}" text-anchor="${anc}" data-sel="${p.id}" style="${sel?'text-decoration:underline':''}">${esc(nomeA(p))}</text>`; }
    s+=`<rect x="${xd-5}" y="${y-5}" width="10" height="10" fill="${c}" stroke="#1F1A17" stroke-width="1" ${p.sciolto?'opacity=".35"':''} data-sel="${p.id}" style="cursor:pointer"/>`;
  }
  if(opz.tu){ const t=mio(), xt=X(t.posizione_dichiarata); s+=`<path d="M${xt-5} ${y0-19}L${xt+5} ${y0-19}L${xt} ${y0-11}Z" fill="${grave()?'#1F1A17':'#1D4E89'}"/><text x="${xt}" y="${y0-22}" text-anchor="middle" style="fill:${grave()?'#1F1A17':'#1D4E89'}">tu</text>`; }
  return `<svg class="ax" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" viewBox="0 0 ${W} ${H}" role="img" aria-label="Asse destra-sinistra: dichiarata (quadrato) e percepita (anello)"><defs><marker id="pt" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#5E5750"/></marker></defs>${s}</svg>`;
}

// ======================= le Camere =======================
function camere(fonte, piccole){
  const ps=tutti().filter(p=>!p.sciolto);
  const riga = (k,i,tot,lab)=>{ const xs=ps.map(p=>[p,(fonte==='ora'?seggi(p):proi(p))[i]]).filter(x=>x[1]>0);
    return `<div class="cam"><span>${lab}</span><div class="stk">${xs.map(([p,n])=>`<i title="${esc(p.nome)}: ${n}" style="width:${n/tot*100}%;background:${col(p)}" class="${nato(p)?'':''}"></i>`).join('')}<b></b></div><span class="muto">${tot} seggi</span></div>`; };
  return `<div class="camere">${riga('c',0,400,'Camera')}${riga('s',1,200,'Senato')}</div>`;
}

  const rap = r.k==='alleato' ? `<div class="sez-l">intesa con te<span>${num(r.a.intesa,1)} su 100</span></div>${intesa(r.a,true)}
      ${r.a.ultimatum?`<p class="sec"><b class="male">Ultimatum</b> per ${esc(causa(r.a.causa_ultimatum))}. Sotto 25 a fine turno esce dal governo e i suoi dicasteri vanno in interim. <button class="link">Rispondi nel Cruscotto ›</button></p>`:r.a.intesa<SOGLIA.ultimatum+10?`<p class="sec">A ${num(r.a.intesa-SOGLIA.ultimatum,0)} punti dall’ultimatum.</p>`:''}
      ${r.a.causa_principale?`<p class="min muto">Pesa di più: ${esc(causa(r.a.causa_principale))}.</p>`:''}
      ${r.a.variazioni.length?`<div class="cause">${r.a.variazioni.map(x=>`<span>${esc(causa(x.causa))} <span class="muto">· turno ${x.turno}</span></span><b class="${x.delta<0?'male':'bene'}">${x.delta>0?'+':'−'}${num(Math.abs(x.delta))}</b>`).join('')}</div>`:''}`
    : r.k==='fascia' ? `<div class="sez-l">intesa col governo<span>all’opposizione la vedi in fasce</span></div>${fascia3(r.f)}${r.f.causa_ultimatum?`<p class="sec">Ultimatum per ${esc(causa(r.f.causa_ultimatum))}.</p>`:''}<p class="min muto">Un alleato incrinato vota meno compatto: la sfiducia ha più margine.</p>`
    : r.k==='pdc' ? `<div class="sez-l">governo</div><p class="sec">${esc(p.leader)} è Presidente del Consiglio.</p>` : '';
  const mosse = v.mosse.filter(m=>m.partito===p.id);

  return `<aside class="lato">

      ${tu?`<div class="ld">Sei tu il leader, e lo resti.</div>`:`<div class="ld">leader <b>${esc(p.leader)}</b>${leaderNuovo(p)?` · al posto di ${esc(v.leader_zero[p.id])}, dopo la sconfitta`:''}</div>`}

function formaC(){

  const tuPrima = xs => [...xs.filter(p=>p.id==='giocatore'), ...xs.filter(p=>p.id!=='giocatore')];

}

// ======================= cornice (da 08, forma A, come nel 18) =======================
function caselle(pos,soglia=3,n=10){
  if(pos==null) return `<span class="cas vuoto">${'<i></i>'.repeat(n)}</span>`;
  const inp=pos<=soglia;
  return `<span class="cas ${inp?'inp':''}">${Array.from({length:n},(_,i)=>`<i class="${[i<soglia?'per':'', i===soglia-1?'sog':'', i<pos?'on':''].join(' ')}"></i>`).join('')}</span>`;
}
function tracciati(){
  const v=V(), m=v.margine, stretto=m?Math.min(...m):null;
  const cons = v.governa ? ['Consenso', v.consenso] : ['Il tuo consenso', sond(mio())*100];
  const t=[[cons[0], num(cons[1])+'%', clamp(Math.round((cons[1]-25)/5),0,10)],
    [v.governa?'Maggioranza C / S':'Governo C / S', m? m.map(sgn).join(' / ') : 'Camere sciolte', m? clamp(Math.round((stretto+9)/3),0,10) : null],
    ['Conti · spread', num(v.spread,0), clamp(Math.round((500-v.spread)/50),0,10)]];
  return `<div class="trks">${t.map(([k,val,pos])=>`<div class="trk"><span class="k">${k}</span>${caselle(pos)}<span class="v">${val}</span></div>`).join('')}</div>`;
}
const SEZ = [['prima','Prima pagina'],['cruscotto','Cruscotto'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function cornice(){
  const v=V(), b={};
  if(!v.governa) b.governo = v.fase==='sciolta' ? 'Camere sciolte: nessun governo da guidare' : 'Non governi: sei all’opposizione';
  if(!(v.governa && v.data.trimestre===4)) b.bilancio = v.governa ? 'La legge di bilancio si presenta in ottobre-dicembre' : 'Il bilancio lo presenta chi governa';
  if(v.turni_al_voto>1) b.campagna='Si fa campagna solo nel turno prima del voto';
  if(v.fase==='sciolta'){ b.aula='Camere sciolte'; }
  const stato = v.finita ? 'Partita finita' : v.fase==='sciolta' ? 'Camere sciolte' : v.crisi ? 'Crisi di governo' : v.governa ? 'Al governo' : 'All’opposizione';
  const chi=`<span class="chi"><b>${stato}</b><br>${per(v.data)} · turno ${v.turno}<br><b>${v.turni_al_voto?v.turni_al_voto+' turni al voto':'si vota a fine turno'}</b></span>`;
  const somm=`<nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}">${t}</button>` : `<button class="${k==='partiti'?'qui':''}" ${k==='partiti'?'aria-current="page"':''}>${t}</button>`).join('')}
    <span class="fuori"><button>Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav>`;
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino solo-ord">Il Pungolo</span>${chi}</div>${tracciati()}
    <div class="c-dx"><div class="pila"><button class="btn pieno">Chiudi il turno ›</button></div><span class="def tutte">nessuna scelta al default</span></div></div>${somm}</header>`;
}

// ======================= render =======================
const scr = document.getElementById('screen');
let limite='';
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const v=V();
  if(st.sel && !Pid(st.sel)) st.sel=null;
  const banda = v.crisi ? `<div class="banda">Crisi di governo: solo ordinaria amministrazione. Allarga la maggioranza o dimettiti.</div>` : '';
  const corpo = st.v==='B' ? formaB() : st.v==='C' ? formaC() : formaA();
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${banda?'auto ':''}minmax(0,1fr)">${cornice()}${banda}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')||el.closest('.cas')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.pag'), scorre = c && c.scrollHeight>c.clientHeight+1;
  const l=r.querySelector('.lato'), scorreL = l && l.scrollHeight>l.clientHeight+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'la pagina scorre':'', scorreL?'il lato scorre':''].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else { st[b.parentElement.dataset.k]=b.dataset.v; if(b.parentElement.dataset.k==='stato') st.sel=null; }
  render();
});
scr.addEventListener('click',e=>{
  const x=e.target.closest('[data-sel]'); if(!x) return;
  const id=x.dataset.sel; st.sel = !id || st.sel===id ? null : id; render();
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
</html>
