<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Ossatura e navigazione» (07), mappa v1-piano-11-ui.
  Domanda: com'è fatta l'ossatura dell'app? Tre varianti strutturali via ?v=A|B|C:
    A  Sommario di sezioni — cornice fissa + sezioni a pagina intera + dettaglio a lato
    B  Cruscotto snodo     — come il prototipo vincolante: si entra e si esce dal cruscotto
    C  Cruscotto unico     — una pagina sola, pannelli che si aprono al posto
  Altri parametri: ?scr=esito|cruscotto|aula|conti|paese|partiti|registro|schema|edicola
    ?stato=governo|opposizione|trattativa|crisi|zero|fine   (cosa cambia nell'ossatura)
    ?pp=striscia|testata|dentro   (la cornice sulla prima pagina)
    ?reg=ord|grave  ?est=turno|evento|cornice   (fin dove arriva il tono grave)
  Stile S «Il Settimanale» da .scratch/v1-giocabile/prototipi/10-direzione-artistica-2.prototype.html.
  Dati inventati. I riquadri tratteggiati sono segnaposto: dicono cosa va lì, non com'è fatto.
  Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 10-11/11/2026), nel ticket 07: A sommario di sezioni; striscia in prima pagina; grave a tutto
  il turno; edicola all'avvio; otto sezioni con «Governo» e cruscotto corto, poi Bilancio e Campagna come sezioni
  loro (dieci in tutto); sezioni vuote barrate col motivo; evento sul cruscotto; acquisti dove si leggono;
  Governo barrata quando non governi; la casa cambia nome con lo stato. Il file si apre su questa forma.
  Alternative scartate: ?v=B|C ?pp=testata|dentro ?est=evento|cornice ?somm=sette|sei ?spente=tolte
    ?evpos=prima ?acq=unico ?govopp=carica ?camp=partiti ?bil=conti
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo ossatura · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{width:1280px;height:800px;flex:none;position:relative;overflow:hidden;transform-origin:center;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

.vS{--carta:#F4ECD8;--ink:#1F1A17;--rosso:#B3122B;--biro:#1D4E89;--grigio:#5E5750;--verde:#2E6B45;--giallo:#FFD23F;
  --tit:'Fraunces',Georgia,serif;--txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  width:100%;height:100%;background:var(--carta);color:var(--ink);font-family:var(--txt);font-size:14px;line-height:1.35;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);min-height:0}
.g{--rosso:var(--ink);--biro:var(--ink);--verde:var(--ink);--giallo:transparent}
.g .solo-ord{display:none!important}
.g .faccia{filter:grayscale(1)}
.tit{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1}
.btn{border:2px solid var(--ink);padding:4px 11px;font-size:14px;font-weight:700;background:var(--carta);white-space:nowrap}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn.p{padding:1px 7px;font-size:12px;border-width:1.5px}
.btn.scelto{background:var(--giallo)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.link{text-decoration:underline;font-size:13px}
.bene{color:var(--verde)} .male{color:var(--rosso)} .muto{color:var(--grigio)}
h3.tit{font-size:23px;font-weight:700;line-height:1.1;margin-bottom:4px}
h4.tit{font-size:18px;font-weight:700;line-height:1.15}
.occ{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rosso);font-weight:700}

/* ---------- cornice ---------- */
.cornice{padding:8px 24px 0;border-bottom:3px double var(--ink)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c-sx{display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.3;color:var(--grigio);white-space:nowrap}
.c-sx b{color:var(--ink)}
.nomino{white-space:nowrap;font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;font-size:27px;font-weight:800;color:var(--rosso);line-height:1}
.trks{display:flex;justify-content:center}
.trk{padding:0 11px;border-left:1px solid var(--grigio);display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center}
.trk:last-child{border-right:1px solid var(--grigio)}
.trk .k{grid-column:1/3;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grigio)}
.cas{display:flex;gap:2px}
.cas i{width:8px;height:14px;border:1.5px solid var(--ink)}
.cas i.on{background:var(--ink)}
.cas i.ult{background:var(--rosso);border-color:var(--rosso)}
.trk .v{font-size:19px;font-weight:700;line-height:1.1;white-space:nowrap}
.trk .d{grid-column:1/3;font-size:12px;font-weight:700}
.c-dx{display:flex;gap:8px;align-items:center}
.c-dx .pila{display:flex;flex-direction:column;gap:3px}
.c-dx .pila .btn{font-size:13px;padding:2px 10px}
.def{font-size:12px;color:var(--grigio);text-align:right;line-height:1.2;text-decoration:underline;cursor:pointer}
.somm{display:flex;gap:2px;align-items:end;margin-top:2px}
.somm button{padding:4px 13px 5px;font-size:14px;font-weight:700;border:1.5px solid transparent;border-bottom:0;color:var(--grigio)}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink);border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm button.chiusa{text-decoration:line-through;cursor:default}
.somm .sec{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.banda{background:var(--ink);color:var(--carta);padding:4px 24px;font-size:13px;font-weight:700;letter-spacing:.04em}
.striscia{display:flex;align-items:center;gap:18px;padding:5px 28px;border-bottom:1px solid var(--ink);font-size:13px}
.striscia .trk{grid-template-columns:auto auto auto auto;gap:0 8px}
.striscia .trk .k,.striscia .trk .d{grid-column:auto}
.striscia .trk .v{font-size:15px}

/* ---------- corpo e pezzi comuni ---------- */
.corpo{padding:10px 24px 12px;min-height:0;overflow:hidden;display:grid;gap:10px 20px;align-content:start}
.testa-pag{display:flex;justify-content:space-between;align-items:end;gap:16px}
.box{border:1.5px solid var(--ink);padding:8px 12px}
.box+.box{margin-top:8px}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:13px}
.ph b{color:var(--ink)}
.ph+.ph,.box+.ph,.ph+.box{margin-top:8px}
.az{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.corsivo{font-size:14px;font-style:italic;display:flex;gap:10px;align-items:baseline}
.corsivo b{font-style:normal;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rosso)}
.riga{display:grid;grid-template-columns:34px 172px 1fr 50px 150px 108px;align-items:center;gap:0 8px;height:39px;border-top:1px solid var(--grigio);cursor:pointer}
.riga:hover,.riga.sel{background:rgb(31 26 23 / .06)}
.riga .chi b{font-size:13px;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riga .chi span{font-size:12px;color:var(--grigio)}
.riga .atto{font-size:13px;line-height:1.2}
.riga .nota{color:var(--rosso);font-weight:700;font-size:12px}
.riga .punti{font-size:17px;font-weight:700;white-space:nowrap}
.riga .punti small{font-size:12px}
.riga .motto{font-size:12px;font-style:italic;line-height:1.2;color:var(--biro)}
.riga .azr{display:flex;gap:4px}
.voce{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-top:1px solid var(--grigio);font-size:13px}
.voce:first-of-type{border-top:0}
.voce small{grid-column:1/3;color:var(--grigio);font-size:12px}
.barra{height:10px;border:1.5px solid var(--ink);position:relative;margin:3px 0}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barra u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.pulsantiera{display:flex;gap:6px}

/* ---------- prima pagina ---------- */
.pagina{padding:10px 28px 10px;display:grid;grid-template-rows:auto auto auto 1fr auto;min-height:0}
.testata{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding-bottom:4px}
.testata .nome{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:800;font-size:70px;line-height:1.08;color:var(--rosso);text-align:center}
.g .testata .nome{font-size:34px;font-weight:700;padding:14px 0 6px}
.orecchio{font-size:13px;line-height:1.35;color:var(--grigio)}
.orecchio b{color:var(--ink)} .orecchio.dx{text-align:right}
.orecchio .trk{border:0;padding:0;margin-top:3px;display:inline-grid}
.sotto{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);padding:4px 0;color:var(--grigio)}
.apertura{display:grid;grid-template-columns:1fr 300px;gap:26px;padding:12px 0 10px;border-bottom:1px solid var(--ink)}
.g .apertura{grid-template-columns:1fr}
.not .o{font-size:15px;font-weight:700;line-height:1.3}
.not .o.crit{color:var(--rosso)}
.not h2{font-family:var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:700;line-height:1.06;margin:3px 0 5px;font-size:26px}
.not p{font-size:14px;line-height:1.35;color:var(--grigio)}
.lead h2{font-size:44px} .lead .o{font-size:17px} .lead p{font-size:16px}
.vignetta{border:2px solid var(--ink);height:150px;display:flex;align-items:center;justify-content:center;font-style:italic;color:var(--grigio);background:repeating-linear-gradient(45deg,transparent 0 4px,rgb(31 26 23 / .08) 4px 5px)}
.colonne{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;padding-top:8px}
.colonne article{padding:3px 16px 9px;border-right:1px solid var(--grigio)}
.colonne article:nth-child(3n+1){padding-left:0}
.colonne article:nth-child(3n){border-right:0;padding-right:0}
.piede{display:flex;justify-content:space-between;align-items:center;border-top:3px double var(--ink);padding-top:7px;font-size:14px}

/* ---------- cruscotto unico (C) ---------- */
.unico{grid-template-columns:440px 1fr 360px}
.unico .riga{grid-template-columns:28px 1fr 44px 96px;height:35px}
.unico .riga .motto{display:none}
.unico .riga .atto{font-size:12px;color:var(--grigio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unico h3.tit{font-size:19px}
.acc{border:1.5px solid var(--ink);margin-top:-1.5px}
.acc>button{display:flex;justify-content:space-between;width:100%;padding:4px 10px;font-weight:700;font-size:13px;text-align:left}
.acc.ap>button{background:var(--ink);color:var(--carta)}
.acc .dentro{padding:8px 10px;font-size:12px}

/* ---------- barra del prototipo ---------- */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px}
#proto .lab{min-width:210px;text-align:center;font-weight:700;font-size:13px}
</style>
</head>

}

      <svg viewBox="0 0 760 110" style="width:100%;max-width:760px;height:auto"><path d="M20 60h720" stroke="#1F1A17" stroke-width="2"/>${[1,2,3,4,5,6,7].map(n=>`<text x="${20+(n-1)*120}" y="92" font-size="13" text-anchor="middle">${n}</text><circle cx="${20+(n-1)*120}" cy="60" r="${[10,7,14,9,12,8,6][n-1]}" fill="${n===3?'var(--rosso)':'#1F1A17'}"/>`).join('')}<circle cx="320" cy="60" r="15" fill="var(--giallo)" stroke="#1F1A17" stroke-width="2"/><text x="320" y="30" font-size="13" text-anchor="middle" font-weight="700">tu · 3,5</text></svg>
      <div class="ph"><b>L’asse</b>: sette partiti IA più il tuo, posizione dichiarata e percepita, leader con caricatura, vocazione e regola di movimento in una riga, minaccia di scissione.</div>
      <div class="box"><div class="occ">Alleati</div>${[['Unione Riformista',38,'ultimatum · respinta la richiesta su Sviluppo economico'],['Terra e Lavoro',57,'stabile']].map(([n,v,c])=>`<div style="font-size:13px;margin-top:5px"><b>${n}</b> intesa ${v} <span class="muto">· ${c}</span><div class="barra"><i style="width:${v}%"></i><u style="left:40%"></u><u style="left:25%"></u></div></div>`).join('')}</div>`,
    dx:`<div class="ph"><b>Parlamento in carica</b>: seggi di Camera e Senato per partito.</div><div class="ph"><b>Casse dei partiti</b> in cifre, la tua con 2 per mille e donazioni.</div>`};
    if(st.camp==='partiti'&&inCampagna()){ const c=CAMPAGNA(); return {cols:'minmax(0,1fr) minmax(0,1fr) 250px', sx:p.sx, mid:c.sx, dx:p.dx+c.dx}; }
    return p; },
  registro: g=>({cols:'150px 1fr 330px', sx:`<h3 class="tit">Registro</h3>${[3,2,1,0].map(n=>`<div class="voce" style="${n===2?'font-weight:700':''}"><span>Turno ${n}</span><span>${n===2?'‹':''}</span></div>`).join('')}`,
    mid:`<div class="occ">Turno 2 · gennaio–marzo 2027 · 21 voci</div>${VOCI.concat(VOCI).slice(0,11).map(v=>`<div class="voce"><b>${esc(v.fatto)}</b><small>${esc(v.causa)}</small></div>`).join('')}`,
    dx:`<div class="box"><div class="occ">Riavvolgimento</div><h4 class="tit">Torna al turno 2</h4><div class="muto" style="font-size:13px">Riapre l’apertura del turno 2 e cancella il turno 3. Le stesse scelte danno lo stesso esito.</div>
      <div class="az">${st.conf?`<button class="btn p pieno">Conferma: cancella 1 turno</button><button class="btn p" data-conf="0">Annulla</button>`:`<button class="btn p" data-conf="1">Torna al turno 2</button>`}</div></div>
      <div class="ph"><b>Conferma sul posto</b>: il pulsante diventa due pulsanti. Nessuna finestra sopra la pagina.</div>`}),
  schema: g=>({cols:'1fr 300px', sx:`<h3 class="tit">Tavola n. ${T.turno} · Come funziona lo Stato</h3>
      <svg viewBox="0 0 860 560" height="560"><g stroke="var(--biro)" stroke-width="2" fill="none"><path d="M430 280L150 110M430 280L710 110M430 280L160 440M430 280L700 440M430 280L430 90"/><path d="M430 280L250 280M430 280L610 280" stroke="var(--rosso)" stroke-dasharray="7 5"/></g>
      <circle cx="430" cy="280" r="50" fill="#1F1A17"/><text x="430" y="278" text-anchor="middle" fill="#F4ECD8" font-size="13" font-weight="700">Presidente</text><text x="430" y="294" text-anchor="middle" fill="#F4ECD8" font-size="13">del Consiglio</text>
      ${[[150,110,'Camera',1],[710,110,'Senato',1],[430,90,'Mercati e UE',1],[250,280,'Sanità',0],[610,280,'Infrastrutture',0],[160,440,'Pensionati',2],[700,440,'Autonomi',2]].map(([x,y,t,k])=>k===2?`<ellipse cx="${x}" cy="${y}" rx="66" ry="20" fill="#EBCB9F" stroke="#1F1A17" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700">${t}</text>`:`<rect x="${x-66}" y="${y-17}" width="132" height="34" fill="${k?'#1F1A17':'#F4ECD8'}" stroke="#1F1A17" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${k?'#F4ECD8':'#1F1A17'}">${t}</text>`).join('')}</svg>`,
    dx:`<div class="ph"><b>Vista secondaria</b>: chi tocca chi in questo trimestre. I numeri nei tondi rimandano alle notizie della prima pagina.</div>`}),
};

// ======================= schermate =======================
function esito(){
  const g=corpoGrave('esito');
  const v = g ? [VOCE_GRAVE].concat(VOCI.filter((_,i)=>i!==2).map(x=>({...x,tit:null}))) : VOCI;
  const not = x=>`<div class="o ${x.c?'crit':''}">${esc(x.tit?x.fatto:(x.c?'In evidenza':'Notizia'))}</div><h2>${esc(x.tit||x.fatto)}</h2><p>${esc(x.causa)}</p>${x.ev&&st.evpos==='prima'?opzioni():''}`;
  const sA = st.v==='A' && st.pp!=='testata' ? '' : '';
  const dentro = st.pp==='dentro';
  const zero = st.stato==='zero';
  return `<div class="pagina ${g?'g':''}">
  <header class="testata">
    <div class="orecchio">Esito del trimestre<br><b>${T.esitoDi}</b><br>7 notizie in pagina, 14 nel registro${dentro?`<br>${trk('Consenso','44,6%',6,'▼ 0,9',1)}`:''}</div>
    <div class="nome">${g?'Esito del trimestre':'Il Pungolo'}</div>
    <div class="orecchio dx">n. ${T.numero} · turno ${T.turno}<br><b>${T.alVoto} turni al voto</b><br>${g?'':'Costa poco, punge tutti'}${dentro?`<br>${trk('Maggioranza','+18 / +8',5,'',1)} ${trk('Conti','171',6,'▲ 14',1)}`:''}</div>
  </header>
  <div class="sotto"><span>${g?'Edizione straordinaria':'Settimanale di satira e conti pubblici'}</span><span>${T.periodo}</span><span>${g?'In questo numero, niente commenti':'Si legge in cinque minuti, si discute per tre mesi'}</span></div>
  <div class="apertura"><article class="not lead">${not(v[0])}</article>${g?'':`<figure class="vignetta solo-ord">vignetta</figure>`}</div>
  <div class="colonne">${v.slice(1).map(x=>`<article class="not">${not(x)}</article>`).join('')}</div>
  <footer class="piede"><button class="link" data-go="${st.v==='C'?'cruscotto':'registro'}">Altre 14 notizie nel registro ›</button><button class="btn pieno" data-go="cruscotto">Vai al ${CASA[st.stato].toLowerCase()==='cruscotto'?'cruscotto':CASA[st.stato].toLowerCase()} ›</button></footer>
  </div>`;
}
function striscia(){
  const g=corniceGrave();
  return `<div class="striscia ${g?'g':''}"><b>${STATO[st.stato]}</b>${TRE()}<span style="margin-left:auto" class="muto">${T.alVoto} turni al voto</span></div>`;
}
function pagina(scr){
  const g=corpoGrave(scr);
  const indietro = st.v==='B' && scr!=='cruscotto' ? `<div class="testa-pag" style="grid-column:1/-1"><span></span><button class="btn" data-go="cruscotto">‹ Torna al cruscotto</button></div>` : '';
  if(scr==='cruscotto'){
    const c=casa();
    const snodo = st.v==='B' ? `<div class="pulsantiera" style="grid-column:1/-1">${sezioni().filter(x=>x[0]!=='cruscotto'&&!spenta(x[0])).map(([k,t])=>`<button class="btn" data-go="${k}">${k==='esito'?'‹ ':''}${t}${k==='esito'?'':' ›'}</button>`).join('')}<button class="btn" data-go="schema">Schema dello Stato ›</button></div>` : '';
    const cors = st.stato==='governo' ? `<div class="corsivo solo-ord" style="grid-column:1/-1"><b>Il corsivo</b><span>Piove sul Po e sui conti: l’alleato tiene il broncio, i mercati prendono appunti.</span></div>` : '';
    return `<div class="corpo ${g?'g':''}" style="grid-template-columns:1fr 380px">${snodo}${cors}<section>${c.sx}</section><section>${c.dx}</section></div>`;
  }
  let key=scr, sub='';
  if(scr==='paese'&&st.somm==='sei'){ sub=`<div class="pulsantiera" style="grid-column:1/-1">${[['mappa','Mappa e sondaggio'],['partiti','Partiti e coalizione']].map(([k,t])=>`<button class="btn ${st.sub===k?'pieno':''}" data-sub="${k}">${t}</button>`).join('')}</div>`; if(st.sub==='partiti') key='partiti'; }
  const s=SEZ[key](g);
  return `<div class="corpo ${g?'g':''}" style="grid-template-columns:${s.cols||'1fr 380px'}">${indietro}${sub}<section>${s.sx}</section>${s.mid?`<section>${s.mid}</section>`:''}<section>${s.dx}</section></div>`;
}
function unico(){
  const g=corpoGrave('cruscotto'), c=casa();
  const ACC = {mappa:['Mappa',()=>mappa(250,g)+'<div class="muto" style="margin-top:4px">Disoccupazione per regione. Livelli, segni e scheda: non entrano qui.</div>'],
    conti:['Bilancio e conti',()=>'Voci del bilancio, spread, grandezze vicine alle soglie, centro studi: una colonna di 340 px.'],
    partiti:['Partiti e alleati',()=>'Asse, intesa con le cause, casse.'],
    registro:['Registro',()=>'21 voci del turno 2 e «torna al turno N».'],
    schema:['Schema dello Stato',()=>'La rete non entra in 340 px: serve comunque una pagina sua.']};
  return `<div class="corpo unico ${g?'g':''}" style="${st.stato==='governo'||st.stato==='crisi'?'':'grid-template-columns:1fr 330px 300px'}">
    <section>${st.stato==='governo'||st.stato==='crisi'?`<h3 class="tit">${g?'Agenda dei ministri':'Il borsino dei ministri'}</h3>${AGENDA.map((m,i)=>`<div class="riga"><div>${faccia(m,24)}</div><div class="chi"><b>${m.dic}</b><div class="atto">${esc(m.atto)}</div></div><div class="punti">${m.sodd}</div><div class="azr"><button class="btn p">Ferma</button><button class="btn p">Dir.</button></div></div>`).join('')}`:c.sx}</section>
    <section>${st.stato==='governo'?evento():''}${st.stato==='governo'?chiede():c.dx}<div class="ph"><b>Aula e calendario</b>: cinque posti, linee e forbici. <b>Anteprima della misura</b>: si apre al posto di questo riquadro.</div><div class="az"><button class="link" data-go="esito">‹ Prima pagina</button></div></section>
    <section>${Object.entries(ACC).map(([k,[t,f]])=>`<div class="acc ${st.c3===k?'ap':''}"><button data-c3="${k}"><span>${t}</span><span>${st.c3===k?'▾':'▸'}</span></button>${st.c3===k?`<div class="dentro">${f()}</div>`:''}</div>`).join('')}</section>
  </div>`;
}
function edicola(){
  return `<div class="vS" style="grid-template-rows:auto 1fr"><header class="cornice" style="padding-bottom:8px"><div class="c1" style="padding:0"><div class="c-sx"><span class="nomino">Il Pungolo</span><span><b>Edicola</b><br>le tue partite, gli scenari, l’albo</span></div><span></span><span></span></div></header>
  <div class="corpo" style="grid-template-columns:1.2fr 1fr 1fr;padding-top:16px">
    <section><h3 class="tit">Partite in corso</h3>
      ${[['Rinascita Civica','Italia di oggi','turno 3 · aprile–giugno 2027','ieri, 22:41',1],['Lega dei Comuni','Debito al 160%','turno 11 · al governo','3 novembre',1],['Partito del Tè','Italia di oggi','turno 7','schema 3, atteso 4: non si apre',0]].map(([n,s,t,d,ok],i)=>`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h4 class="tit">${n}</h4><div class="muto" style="font-size:13px">${s} · ${t}<br>${ok?'ultimo salvataggio: ':''}<span class="${ok?'':'male'}">${d}</span></div></div>${ok?`<button class="btn ${i?'':'pieno'}" data-go="esito">Riprendi ›</button>`:''}</div></div>`).join('')}</section>
    <section><h3 class="tit">Nuova partita</h3>
      <div class="box"><div class="occ">Scenario di base</div><h4 class="tit">L’Italia di oggi</h4><div class="az"><button class="btn p pieno">Fonda il partito ›</button></div></div>
      <div class="box"><div class="occ">Scenario su misura</div><div class="ph" style="margin-top:4px"><b>Editor</b>: sei cursori, legge elettorale, disposizioni, riepilogo dal vivo con gli avvisi.</div><div class="az"><button class="btn p">Nuovo nell’editor ›</button><button class="btn p">Carica da file</button></div></div>
      <div class="ph"><b>Fondazione</b>: nome del partito e uno dei sei posti sull’asse, con istogramma e risultato atteso. Poi il turno zero.</div></section>
    <section><h3 class="tit">Albo</h3>
      ${[['Fronte del Buonsenso','9 anni al governo · 3 elezioni · 1 riavvolgimento'],['Rinascita Civica (prima)','2 anni al governo · abbandono']].map(([n,d])=>`<div class="box"><h4 class="tit">${n}</h4><div class="muto" style="font-size:13px">${d}</div><div class="ph" style="margin-top:6px">serie dei tre indicatori · eredità</div></div>`).join('')}</section>
  </div></div>`;
}
function render(){
  const S=document.getElementById('screen');
  if(st.scr==='partiti'&&st.somm==='sei'){ st.scr='paese'; st.sub='partiti'; }
  if(!['edicola','schema','info'].includes(st.scr) && (!sezioni().some(x=>x[0]===st.scr) || spenta(st.scr))) st.scr='cruscotto';
  if(st.scr==='info'&&st.acq!=='unico') st.scr='cruscotto';
  if(st.v==='C' && !['esito','cruscotto','edicola'].includes(st.scr)) st.scr='cruscotto';
  let h;
  if(st.scr==='edicola') h=edicola();
  else if(st.scr==='esito'){
    const sopra = st.pp==='striscia' ? (st.v==='A' ? cornice() : striscia()) : '<div></div>';
    h=`<div class="vS">${sopra}${esito()}</div>`;
  }
  else h=`<div class="vS">${cornice()}${st.v==='C'?unico():pagina(st.scr)}</div>`;
  S.innerHTML=h;
  document.getElementById('lab').textContent=`${VAR[st.v]} · ${st.scr}`;
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  const q=new URLSearchParams(); ['v','scr','stato','pp','reg','est','somm','spente','evpos','acq','govopp','camp','bil'].forEach(k=>q.set(k,st[k]));
  try{ history.replaceState(null,'','?'+q); }catch(e){}  // anteprima senza URL: si va avanti lo stesso
}
function fit(){ const s=document.getElementById('stage'); document.getElementById('screen').style.transform=`scale(${Math.min(s.clientWidth/1280,s.clientHeight/800)})`; }
function varia(d){ const k=Object.keys(VAR); st.v=k[(k.indexOf(st.v)+d+k.length)%k.length]; st.det=null; render(); }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-ev],[data-det],[data-c3],[data-conf],[data-sub],#prev,#next,#proto .seg button'); if(!t) return;
  if(t.id==='prev') return varia(-1);
  if(t.id==='next') return varia(1);
  if(t.closest('#proto .seg')){ st[t.parentNode.dataset.k]=t.dataset.v; if(t.parentNode.dataset.k==='stato'&&st.scr==='edicola') st.scr='cruscotto'; st.det=null; }
  else if(t.dataset.go){ st.scr=t.dataset.go; st.det=null; }
  else if(t.dataset.sub) st.sub=t.dataset.sub;
  else if(t.dataset.ev) st.ev=+t.dataset.ev;
  else if(t.dataset.c3) st.c3=t.dataset.c3;
  else if(t.dataset.conf) st.conf=+t.dataset.conf;
  else if(t.dataset.det){ if(e.target.closest('.azr')) return; st.det = t.dataset.det==='x'?null:+t.dataset.det; }
  render();
});
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') varia(-1); if(e.key==='ArrowRight') varia(1); });
addEventListener('resize',fit); new ResizeObserver(fit).observe(document.getElementById('stage')); render(); fit();
</script>
</body>
