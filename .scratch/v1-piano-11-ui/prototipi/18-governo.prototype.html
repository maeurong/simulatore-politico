<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Governo» (18), mappa v1-piano-11-ui.
  Domanda: com'è fatta la sezione Governo? Il borsino dei dieci ministri (storia 154: caricatura, voto con freccia,
  motto), le righe in evidenza (27), l'atto in agenda col motivo (26), Ferma e Dirotta che girano la carta (28, 37)
  con la regione bersaglio e il selettore (36), la carta del ministro a lato (25, 33), dimissioni, rosa, interim e
  rodaggio (34-35), cantieri (38), margine esaurito (29), i dicasteri con l'indicatore di servizio (24).
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Listino      — tabella densa da borsino, una riga per ministro; in nero le righe in evidenza, le altre in grigio
    B  Figurine     — album di dieci carte 5 × 2, la carta stessa gira su Ferma e Dirotta
    C  Per partito  — una colonna per partito della coalizione, con l'intesa in testa: chi tiene quali dicasteri
  In tutte la carta del ministro sta nel dettaglio a lato e gira su Ferma e Dirotta; Dirotta apre a lato gli altri
  atti e, per Infrastrutture e Sviluppo economico, la regione con mappa e lista.
  Stati, ?stato=: ordinario (Vista 03) · scelte (03 con Ferma, Dirotta l'atto, Dirotta la regione, dimissioni chieste,
    comandati davvero) · interim (chiuso il turno: Ambiente in interim con la rosa) · rodaggio (scelto il successore,
    chiuso ancora) · tecnico (spartizione con Giustizia a un tecnico) · scontenti (seme 4, turno 9, ministri in
    preavviso) · crisi (05) · grave (08)
  Altri parametri: ?conf=diretto|sulposto (Ferma subito col costo sul bottone, o con la conferma sul posto) ?fin= ?scala=
  Dati: viste/18-governo.json (genera/, tutto giocato) e le Viste 03 e 05. I costi di Ferma, Dirotta e Ferma il cantiere
  sono misurati comandando una copia della partita: la Vista non li porta (costo_ferma e costo_dirotta sono nella spec
  del core, PR delle esposizioni, in 11g). Rifatti qui dai dati, e quindi rimandi: l'indicatore di servizio di ogni
  dicastero (dicasteri.toml) e il perché dell'evidenza (regola di agenda.rs:570-576 con le posizioni di atti.toml).
  Motti: uno per dicastero, dal prototipo vincolante (ticket 09). Facce: variante 5 del 32, donne con labbra sempre,
  orecchino e cappello dall'hash. Le scelte restano in memoria. Stile: 08-fondamenta (forma A), cornice del 17.
  Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 12/11/2026), nel ticket 18: B · Figurine; Ferma diretto col costo sul bottone; Dirotta della regione
  con mappa e lista. Il file si apre su questa forma. Scartate: A e C dalla barra in basso, la conferma con ?conf=sulposto.
-->

<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo Governo · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.dl.crit{background:var(--rosso);color:var(--carta);padding:0 5px}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.fascia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fascia .cas{--cw:12px;--ch:8px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-top:var(--filo);font-size:var(--c-sec)}
.voce:first-child{border-top:0}
.voce small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.voce small::before{content:"perché: ";font-style:italic}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:center}
.dati dt{color:var(--grigio)}

/* cornice A · Gerenza */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez);margin-bottom:4px}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:2px}
.capo h3{margin:0}

/* evento (comune) */
.evento{border:var(--forte);padding:10px 14px;display:grid;gap:6px}
.evento+.evento{margin-top:8px}
.evento h4{font-size:var(--c-sez)}
.evento .opz{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opz .btn small{font-weight:400;font-size:var(--c-min);margin-left:5px}
.opz .btn.scelto small,.opz .btn:hover small{color:inherit}
.evento.crisi{border-color:var(--rosso);border-width:3px}
.g .evento{border:var(--doppio)}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.rosso{border-color:var(--rosso);color:var(--rosso)}
.chip.pieno{background:var(--ink);color:var(--carta)}
.chip.ok{border-color:var(--verde);color:var(--verde)}
.alleato{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);padding:2px 8px;font-size:var(--c-sec);cursor:pointer}
.alleato.no{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default}
.alleato.on{background:var(--giallo)}
.g .alleato.on{background:var(--ink);color:var(--carta)}

/* A · Ordine del giorno */
.odg .grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:10px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between}
.r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px 6px;border-bottom:var(--filo);cursor:pointer}
.r:hover{background:var(--velo)}
.r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.r .seg{width:14px;height:14px;border:1.5px solid var(--ink)}
.r .seg.fatto{background:var(--ink)}
.r .seg.info{border-style:dashed;border-color:var(--grigio)}
.r .seg.urg{border-color:var(--rosso);background:var(--retino)}
.r .t{font-weight:700;font-size:var(--c-corpo);line-height:1.2}
.r .t small{font-weight:400;color:var(--grigio);font-size:var(--c-sec)}
.r .s{grid-column:2;font-size:var(--c-min);color:var(--grigio);line-height:1.25}
.r .a{grid-row:1/span 2;grid-column:3;display:flex;gap:4px;align-items:center}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start}
.lato h4{font-size:var(--c-sez)}
.barra{height:8px;background:var(--velo);position:relative;border:1px solid var(--grigio)}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barra b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rosso)}
.forb{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:var(--c-min)}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.minis .m{display:flex;gap:6px;align-items:center;border:var(--filo);padding:3px 8px 3px 4px;font-size:var(--c-min);cursor:pointer;max-width:100%}
.minis .m b{font-size:var(--c-sec)}
.minis .m:hover{background:var(--velo)}

/* B · Tre colonne */
.tre{grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.tre>section{padding:0 var(--canale);border-left:var(--filo);display:grid;gap:8px;align-content:start;min-width:0}
.tre>section:first-child{padding-left:0;border-left:0}
.tre>section:last-child{padding-right:0}
.tre .capo h3{font-size:var(--c-riq)}
.art{border-top:1.5px solid var(--ink);padding-top:6px;display:grid;gap:4px}
.art:first-of-type{border-top:0;padding-top:0}
.art .occ{color:var(--ink);letter-spacing:.06em}
.art .occ.male{color:var(--rosso)}
.art h4{font-size:var(--c-riq)}
.art p{font-size:var(--c-sec);color:var(--grigio)}
.tre .evento h4{font-size:var(--c-riq)}

/* C · Pratica per pratica */
.prat{grid-template-rows:auto minmax(0,1fr) auto;height:100%;align-content:stretch}
.indice{display:flex;gap:0;border:var(--bordo);overflow:hidden}
.indice button{flex:1 1 0;min-width:0;padding:5px 8px;border-left:var(--filo);display:grid;gap:1px;text-align:left}
.indice button:first-child{border-left:0}
.indice button b{font-size:var(--c-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.indice button span{font-size:var(--c-min);color:var(--grigio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.indice button.qui{background:var(--ink);color:var(--carta)}
.indice button.qui span{color:var(--carta)}
.indice button.fatto b::before{content:"✓ "}
.indice button.urg{box-shadow:inset 0 -3px 0 var(--rosso)}
.pagC{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 calc(var(--canale)*1.5);align-content:start;min-height:0;overflow:hidden auto;padding-top:8px}
.pagC .num{font-family:var(--tit);font-size:var(--c-apre);font-weight:800;color:var(--rosso);line-height:1}
.pagC h2{font-size:var(--c-pag);margin:2px 0 6px}
.pagC .att{font-size:var(--c-lead);color:var(--grigio);max-width:60ch}
.pagC .scelte{display:grid;gap:6px;margin-top:12px}
.pagC .scelte .btn{text-align:left;padding:7px 12px;display:flex;justify-content:space-between;gap:12px}
.pagC .scelte .btn small{font-weight:400;font-size:var(--c-sec)}
.piedeC{display:flex;align-items:center;gap:10px;border-top:var(--doppio);padding-top:6px;font-size:var(--c-sec)}
.piedeC .sapere{flex:1;min-width:0;display:flex;gap:14px;overflow:hidden;white-space:nowrap}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:170px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}

/* ===== Governo (ticket 18) ===== */
.gov{grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.gov>.lato{overflow:hidden auto;min-height:0;padding-bottom:8px}
.gov>div{min-height:0;overflow:hidden auto}
.voto{display:inline-flex;align-items:baseline;gap:2px;font-weight:700;font-size:var(--c-num);line-height:1;white-space:nowrap}
.voto small{font-size:var(--c-min);font-weight:700}
.voto.basso{color:var(--rosso)}
.voto.crit{background:var(--rosso);color:var(--carta);padding:1px 4px}
.g .voto.crit{background:var(--ink)}
.motto{font-size:var(--c-min);color:var(--biro);line-height:1.25}
.fermo{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--grigio)}
.bollo{display:inline-block;border:2px solid var(--rosso);color:var(--rosso);font-family:var(--tit);font-weight:800;font-size:var(--c-sec);letter-spacing:.06em;text-transform:uppercase;padding:0 6px;transform:rotate(-4deg);white-space:nowrap}
.bollo.biro{border-color:var(--biro);color:var(--biro)}
.g .bollo{transform:none}
.vuota{font-size:var(--c-sec);color:var(--grigio);border:1.5px dashed var(--grigio);padding:2px 8px;display:inline-block}
.cap5{display:inline-flex;gap:2px;vertical-align:middle}
.cap5 i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.cap5 i.on{background:var(--ink)}
.cap5 i.meno{background:var(--retino)}
.asse{position:relative;height:22px;border-bottom:1.5px solid var(--ink);margin:2px 6px 14px}
.asse span{position:absolute;bottom:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ink)}
.asse span.tu{background:var(--carta);border:2px solid var(--biro)}
.g .asse span.tu{border-color:var(--ink)}
.asse em{position:absolute;bottom:8px;font-style:normal;font-size:var(--c-min);transform:translateX(-50%);white-space:nowrap}
.asse b{position:absolute;top:24px;font-size:var(--c-min);font-weight:400;color:var(--grigio)}
.sodd{position:relative;height:10px;border:1px solid var(--grigio);background:var(--velo)}
.sodd i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.sodd i.basso{background:var(--rosso)}
.sodd i.qui{background:var(--retino);border-right:1.5px solid var(--ink)}
.sodd b{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--rosso)}
.cause{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;font-size:var(--c-min)}
.cause .male{font-weight:700}
.sez-l{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);border-bottom:1.5px solid var(--ink);padding-bottom:2px;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:1.5px solid var(--rosso);padding:6px 8px;font-size:var(--c-sec)}
.conf p{flex-basis:100%}

/* la carta del ministro: due facce, gira su Ferma e Dirotta */
.carta3d{perspective:900px}
.carta3d .giro{position:relative;transform-style:preserve-3d}
.carta3d .giro.dietro{transform:rotateY(180deg)}
.carta3d .fronte,.carta3d .retro{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.carta3d .retro{position:absolute;inset:0;transform:rotateY(180deg)}
.carta{border:var(--forte);background:var(--carta);padding:10px 12px;display:grid;gap:7px;align-content:start}
.carta .su{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.carta .su h4{font-size:var(--c-sez)}
.carta.retro{display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;background:var(--carta)}
.carta.retro .bollo{font-size:var(--c-sez);padding:2px 12px}

/* A · Listino */
.lst{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.lst th{font-size:var(--c-min);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio);text-align:left;font-weight:700;border-bottom:1.5px solid var(--ink);padding:2px 6px}
.lst td{border-bottom:var(--filo);padding:4px 6px;vertical-align:middle}
.lst tr.riga{cursor:pointer}
.lst tr.riga:hover td{background:var(--velo)}
.lst tr.sel td{background:var(--velo)}
.lst tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.lst tr.ev td:first-child{box-shadow:inset 3px 0 0 var(--rosso)}
.lst tr.ev.sel td:first-child{box-shadow:inset 3px 0 0 var(--ink),inset 6px 0 0 var(--rosso)}
.lst tr.quieta{color:var(--grigio)}
.lst tr.quieta .voto{color:var(--grigio)}
.lst td.f{width:42px;padding:3px 4px 3px 8px}
.lst .nm b{font-size:var(--c-corpo);color:var(--ink)}
.lst .at{max-width:0;width:46%}
.lst .vuota{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 6px}
.lst td.nm{white-space:nowrap}
.lst td.dc{max-width:0;width:17%;font-size:var(--c-min)}
.lst td.dc>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .chip{padding:0 4px;line-height:1.3}
.lst .at>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .at small{display:block;font-size:var(--c-min);color:var(--grigio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst td.n{text-align:right;white-space:nowrap}
.lst td.azr{white-space:nowrap;text-align:right}
.serv{display:grid;grid-template-columns:auto 34px;gap:0 5px;align-items:center;font-size:var(--c-min);white-space:nowrap}
.serv .barra{height:6px}

/* B · Figurine */
.album{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-content:start}
.fig{perspective:800px;cursor:pointer;min-width:0}
.fig .giro{position:relative;transform-style:preserve-3d;height:100%}
.fig .giro.dietro{transform:rotateY(180deg)}
.fig .fr0,.fig .rt0{backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bordo);background:var(--carta);padding:6px 8px 8px;display:grid;gap:3px;align-content:start;height:100%}
.fig .rt0{position:absolute;inset:0;transform:rotateY(180deg);place-content:center;justify-items:center;text-align:center}
.fig.sel .fr0,.fig.sel .rt0{border-width:3px;padding:4.5px 6.5px 6.5px}
.fig.ev .fr0{box-shadow:inset 0 4px 0 var(--rosso)}
.fig .cima{display:flex;justify-content:space-between;align-items:start;gap:4px;font-size:var(--c-min);color:var(--grigio)}
.fig .cima .chip{padding:0 3px;line-height:1.3}
.fig .fr0 .vuota{font-size:var(--c-min);padding:1px 4px}
.fig .fz{justify-self:center}
.fig b.nm{font-size:var(--c-sec);line-height:1.15}
.fig .dc{font-size:var(--c-min);color:var(--grigio);line-height:1.2}
.fig .at{font-size:var(--c-min);line-height:1.25;border-top:var(--filo);padding-top:3px;margin-top:2px}
.fig .az{margin-top:3px;gap:3px}

/* C · Per partito */
.part{display:grid;grid-template-columns:repeat(var(--np),minmax(0,1fr));gap:0;align-content:start}
.part>section{padding:0 12px;border-left:var(--filo);display:grid;gap:6px;align-content:start;min-width:0}
.part>section:first-child{padding-left:0;border-left:0}
.part .capo h3{font-size:var(--c-riq)}
.mc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:center;border:var(--filo);padding:5px 7px;cursor:pointer}
.mc:hover{background:var(--velo)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mc.ev{border-left:4px solid var(--rosso)}
.mc .t{font-size:var(--c-sec);line-height:1.2;min-width:0}
.mc .t b{font-size:var(--c-sec)}
.mc .s{grid-column:1/-1;font-size:var(--c-min);color:var(--grigio);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* dirotta e regione */
.alt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:1px 8px;align-items:start;padding:5px 4px;border-bottom:var(--filo);cursor:pointer;font-size:var(--c-sec)}
.alt:hover{background:var(--velo)}
.alt.on{background:var(--giallo)}
.g .alt.on{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.alt.no{cursor:default;color:var(--grigio)}
.alt.no:hover{background:none}
.alt .o{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%;margin-top:2px}
.alt.on .o{background:var(--ink)}
.alt.no .o{border-style:dashed;border-color:var(--grigio)}
.alt small{grid-column:2/-1;font-size:var(--c-min);color:var(--grigio)}
.regsel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.reglist{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:var(--c-min);max-height:236px;overflow:auto;border-top:var(--filo)}
.reglist button{display:contents}
.reglist button>span{padding:1px 4px;border-bottom:1px solid var(--velo)}
.reglist button.on>span{background:var(--giallo);font-weight:700}
.g .reglist button.on>span{background:var(--velo)}
.reglist button.suo>span:first-child::after{content:" · del ministro";color:var(--grigio);font-weight:400}
.carta-it path.reg{cursor:pointer;stroke:var(--ink);stroke-width:.8;vector-effect:non-scaling-stroke}
.carta-it path.reg:hover{stroke-width:2}
.carta-it path.reg.suo{stroke:var(--ink);stroke-width:2.6}
.carta-it path.reg.on{stroke:var(--biro);stroke-width:3}
.leg{display:flex;gap:2px;align-items:center;font-size:var(--c-min);color:var(--grigio)}
.leg i{width:14px;height:8px;border:1px solid var(--grigio)}
.rosa{display:grid;gap:4px}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:var(--filo);padding:4px 8px;cursor:pointer}
.cand:hover{background:var(--velo)}
.cand.on{box-shadow:inset 0 0 0 2px var(--ink);background:var(--giallo)}
.g .cand.on{background:var(--velo)}
.cand small{font-size:var(--c-min);color:var(--grigio)}
</style>
</head>

const K = {carta:'#F4ECD8', ink:'#1F1A17', grigio:'#5E5750', rosso:'#B3122B', verde:'#2E6B45', biro:'#1D4E89', giallo:'#FFD23F'};
// tinta smorzata = un solo inchiostro steso sulla carta al t (come un retino pieno): niente colori fuori dai sette
const mix = (c,t)=>'#'+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*t+parseInt(K.carta.slice(i,i+2),16)*(1-t)).toString(16).padStart(2,'0')).join('');
const hash = s => { let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return h; };
// djb2 da solo cambia poco fra «Sara Rossi» e «Sara Russi»: lo rimescolo (finalizzatore di MurmurHash3)
const mescola = h => { h^=h>>>16; h=Math.imul(h,0x85ebca6b)>>>0; h^=h>>>13; h=Math.imul(h,0xc2b2ae35)>>>0; return (h^(h>>>16))>>>0; };
const leve = (h,basi)=>basi.map(b=>{ const v=h%b; h=Math.floor(h/b); return v; });
const ruolo = m => m.leader ? 'leader' : m.tecnico ? 'tecnico' : 'ministro';
const umore = m => m.sodd==null ? 0 : m.sodd<25 ? 2 : m.sodd<40 ? 1 : 0;

const NASI = [ // dalla radice (42,26) alla base (43,34); tutti oltre ogni naso reale

const MENTI = [['sfuggente','Q43 42 40 45'],['dritto','L45 41L44 46'],['doppio','L44.6 41Q48.5 42.6 45 45.2Q48 47.4 43.6 49']];
const forma = h => { const [naso,mento,fronte,cranio]=leve(h,[6,3,2,2]); return {naso,mento,fronte,cranio,resto:Math.floor(h/72)}; };
function profilo(id){
  const b = id.cranio ? 18 : 13;                                  // nuca lunga o corta
  const fr = id.fronte ? 'Q35 5 38 9L44 23' : 'Q38 6 41 11L43 23'; // fronte sfuggente o dritta
  const davanti = `L42 26${NASI[id.naso][1]}L43 35L44 39${MENTI[id.mento][1]}`;
  const giro = `C${b} 36 ${b} 9 30 7${fr}${davanti}L35 48L36 51`;
  return { b, tip:NASI[id.naso][2], davanti:'M42 26'+davanti.slice(6), naso:`M42 26${NASI[id.naso][1]}L43 35Z`,
    sagoma:`M20 44${giro}L37 61L23 61L21 47Z`, linea:`M23 57L21 47L20 44${giro}L37 57`,
    nuca:`M4 29L31 34L36 52L14 52Z` };
}

// stesso verso, in un solo path: la regola nonzero ne fa l'unione senza giunte.
const PENNI = new Map();

  PEN.setAttribute('d',d);

  const pt = Array.from({length:n+1},(_,i)=>{ const t=i/n, q=PEN.getPointAtLength(t*tot), s=Math.max(.25,Math.min(1,t/coda,(1-t)/coda)); return [q.x,q.y,nx*s,ny*s]; });

const TRIM = ['','Gennaio–marzo','Aprile–giugno','Luglio–settembre','Ottobre–dicembre'];
const per = d => `${TRIM[d.trimestre]} ${d.anno}`;

const V = () => D[st.stato];
const C = () => V().costi || {};
const grave = () => V().eventi.some(e=>e.tono==='grave');
const nomeP = id => V().nomi[id] || id;
const REGN = id => REGIONI[id] || id;
const pulito = r => String(r).replace(/^comando non ammesso: /,'');
const n0 = x => typeof x==='number' ? x : 0;
const CAUSE = {indicatore_in_calo:'indicatore di servizio in calo', obiettivo_raggiunto:'obiettivo raggiunto', dimissioni_chieste:'dimissioni chieste',
  atto_fermato:'atto fermato da te', atto_dirottato:'atto dirottato da te', cantiere_fermato:'cantiere fermato da te', proposta_respinta:'proposta respinta',
  budget_tagliato:'spesa del dicastero tagliata', norma_contro_posizione:'norma firmata contro la sua posizione', legge_respinta:'legge respinta in aula',
  fondi_tolti:'fondi spostati altrove', decreto_decaduto:'decreto non convertito', sfiduciato:'sfiduciato', uscita_dal_governo:'il suo partito è uscito dal governo', rimpasto:'rimpasto'};
const causa = c => CAUSE[c] || String(c||'').replaceAll('_',' ');
const fr = v => v==='pari' ? '' : `<svg class="fr ${v==='giu'?'giu':''}" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 .5 9.5 9.5H.5Z"/></svg>`;

// ======================= il ministero con le scelte fatte qui =======================
const M = d => V().ministeri.find(m=>m.dicastero===d);
const sc = d => st.sc[d] || {};
function agenda(m){                       // l'agenda come la vedrebbe la Vista dopo i comandi di qui
  const a=m.agenda, s=sc(m.dicastero); if(!a) return null;
  if(s.dim) return {...a, ritirata:true};
  if(s.ag==='ferma') return {...a, stato:'fermata', qui:true};
  if(s.ag){ const x = s.ag.atto ? m.atti.find(t=>t.id===s.ag.atto) : null;
    return {...a, atto:x?x.id:a.atto, nome:x?x.nome:a.nome, costo:x?x.costo:a.costo, regione:s.ag.regione||a.regione, stato:'dirottata', qui:true,
      motivo: s.ag.regione ? a.motivo.replace(/;?\s*[^;]*:\s*(ci votano|ne ha bisogno)[^;]*$/,'')+' · regione scelta da te' : a.motivo}; }
  return a;
}
function deltaQui(m){                     // soddisfazione persa coi comandi di qui, dai costi misurati
  const s=sc(m.dicastero), c=C()[m.dicastero]||{}; let d=0;
  if(s.ag==='ferma') d+=n0(c.ferma);
  else if(s.ag){ if(s.ag.atto) d+=n0(c.dirotta_atti?.[s.ag.atto]); if(s.ag.regione) d+=n0(c.dirotta_regioni?.[s.ag.regione]); }
  for(const a of s.cant||[]) d+=n0(c.ferma_cantiere?.[a]);
  return d;
}
const sodd = m => m.ministro ? clamp(m.ministro.soddisfazione + deltaQui(m),0,100) : null;
const variaz = m => (m.ministro?.variazioni||[]).filter(v=>v.turno>=V().turno-1);
const freccia = m => variaz(m).reduce((s,v)=>s+v.delta,0) + deltaQui(m);
const evid = m => !!(m.ministro && (m.agenda?.in_evidenza || m.ministro.minaccia || sodd(m)<SOGLIE.minaccia));
const dimChieste = m => m.dimissioni_chieste || sc(m.dicastero).dim;
function figura(m, px, x=m.ministro){
  if(!x) return `<span class="iniz" style="width:${px}px;height:${px}px;border-style:dashed;color:var(--grigio);font-size:${Math.max(11,Math.round(px*.3))}px">—</span>`;
  return faccia({nome:x.nome, part:nomeP(x.partito), dic:DIC[m.dicastero], sodd: x===m.ministro ? sodd(m) : x.soddisfazione, tecnico:x.tecnico, spinta:x.spinta}, px);
}
function voto(m){
  const s=sodd(m); if(s==null) return '<span class="voto muto">—</span>';
  const d=freccia(m), cl = s<SOGLIE.dimissioni ? 'crit' : s<SOGLIE.minaccia ? 'basso' : '';
  const dd = Math.abs(d)>=.5 ? `<small class="${d<0?'male':'bene'}">${fr(d<0?'giu':'su')}${num(Math.abs(d),0)}</small>` : '';
  return `<span class="voto ${cl}" title="soddisfazione">${num(s,0)}${dd}</span>`;
}
function chips(m){
  const x=m.ministro; if(!x) return `<span class="chip">interim</span>`;
  const o=[];
  if(dimChieste(m)) o.push('<span class="chip pieno">dimissioni chieste</span>');
  else if(sodd(m)<SOGLIE.dimissioni) o.push('<span class="chip rosso">si dimette a fine turno</span>');
  else if(sodd(m)<SOGLIE.minaccia) o.push('<span class="chip rosso">in preavviso</span>');
  if(x.rodaggio) o.push('<span class="chip">in rodaggio</span>');
  if(x.tecnico) o.push('<span class="chip">tecnico</span>');
  return o.join(' ');
}
const SENZA = {'margine esaurito':'Margine esaurito: nessun atto in questo turno', interim:'Interim: nessun atto finché non entra il successore', 'esercizio provvisorio':'Esercizio provvisorio: nessun atto'};
function atto(m, corto, conCosto){
  const a=agenda(m);
  if(!a) return `<span class="vuota">${conCosto&&m.cantieri.length?`<span class="muto">${m.cantieri.length} ${m.cantieri.length===1?'cantiere':'cantieri'} · </span>`:''}${esc(SENZA[m.motivo_senza_agenda]||m.motivo_senza_agenda||'Nessun atto')}</span>`;
  const reg = a.regione ? ` · <b>${esc(REGN(a.regione))}</b>` : '';
  const testa = a.ritirata ? `<span class="fermo">${esc(a.nome)}</span>${reg}` : a.stato==='fermata' ? `<span class="fermo">${esc(a.nome)}</span>${reg} <span class="bollo">Fermato</span>`
    : a.stato==='dirottata' ? `${esc(a.nome)}${reg} <span class="bollo biro">Dirottato</span>` : `${esc(a.nome)}${reg}`;
  const sotto = (conCosto&&!a.ritirata ? euro(a.costo)+' · ' : '') + (a.ritirata ? 'dimissioni chieste: l’atto non si fa' : a.motivo) + (conCosto&&m.cantieri.length ? ` · ${m.cantieri.length} ${m.cantieri.length===1?'cantiere':'cantieri'}` : '');
  return corto ? testa : `<div>${testa}</div><small>${esc(sotto)}</small>`;
}
// azioni sull'agenda: Ferma e Dirotta, col costo scritto quando si sa
function costoTxt(x){ if(x==null) return ''; if(typeof x!=='number') return ''; const v=Math.round(-x); return v>0 ? ` −${v}` : ' gratis'; }
function azioni(m, piccole){
  const a=m.agenda, p=piccole?'p':'', d=m.dicastero;
  if(!m.ministro || !a || dimChieste(m)) return '';
  if(a.stato!=='annunciata') return `<span class="min muto">${a.stato==='fermata'?'fermato':'dirottato'} in questo turno</span>`;
  const s=sc(d);
  if(s.ag) return `<button class="link" data-annulla="${d}">annulla</button>`;   // ponytail: solo qui; il core non ritira un Ferma
  if(st.ask===`ferma:${d}`) return `<span class="az" style="margin:0"><button class="btn ${p} via pieno" data-ferma="${d}">Conferma: ferma</button><button class="btn ${p}" data-ask="">Annulla</button></span>`;
  const cf=C()[d]?.ferma;
  const f = st.conf==='sulposto' ? `<button class="btn ${p}" data-ask="ferma:${d}">Ferma${costoTxt(cf)}</button>` : `<button class="btn ${p}" data-ferma="${d}" title="soddisfazione persa dal ministro">Ferma${costoTxt(cf)}</button>`;
  return `${f} <button class="btn ${p}" data-dir="${d}">Dirotta ›</button>`;
}
function servizio(m){
  const g=V().gr[IND[m.dicastero]], o=m.ministro?.obiettivo; if(!g) return '';
  const r = o ? clamp(g.v/o,0,1.2) : 0, ok = o && (g.verso==='sale' ? g.v>=o : g.v<=o);
  return `<span class="serv" title="${esc(g.nome)}: ${num(g.v)}${o?' · obiettivo '+num(o):''}"><span>${num(g.v)}</span><span class="barra"><i style="width:${(Math.min(r,1)*100).toFixed(0)}%;${ok?'background:var(--verde)':''}"></i>${o?'<b style="left:100%"></b>':''}</span></span>`;
}

// ======================= la carta del ministro (dettaglio a lato) =======================
function cap5(x){ const c=x.capacita, r=x.rodaggio?Math.max(1,c-1):c;
  return `<span class="cap5" title="capacità ${c}${x.rodaggio?', '+r+' nel rodaggio':''}">${[1,2,3,4,5].map(i=>`<i class="${i<=r?'on':i<=c?'meno':''}"></i>`).join('')}</span>`; }
function asse(x){
  const tu=V().mia, pc=v=>clamp(v,0,10)*10;
  return `<div class="asse"><span style="left:${pc(x.posizione)}%"></span><em style="left:${pc(x.posizione)}%">${esc(x.nome.split(' ').pop())} ${num(x.posizione)}</em>
    <span class="tu" style="left:${pc(tu)}%"></span><b style="left:0">sinistra 0</b><b style="right:0">10 destra</b><b style="left:${pc(tu)}%;transform:translateX(-50%);color:var(--biro)">tu ${num(tu)}</b></div>`;
}
function barraSodd(m){
  const x=m.ministro, s=sodd(m), q=deltaQui(m), b=x.soddisfazione;
  return `<div class="sodd"><i class="${s<SOGLIE.minaccia?'basso':''}" style="width:${s}%"></i>${q<0?`<i class="qui" style="left:${s}%;width:${b-s}%"></i>`:''}<b style="left:${SOGLIE.dimissioni}%"></b><b style="left:${SOGLIE.minaccia}%"></b></div>
    <div class="min muto" style="display:flex;justify-content:space-between"><span>sotto ${SOGLIE.dimissioni} si dimette, sotto ${SOGLIE.minaccia} in preavviso</span><span>${num(s,0)} su 100</span></div>`;
}
function cause(m){
  const vv=variaz(m).map(v=>[causa(v.causa)+(v.turno===V().turno?' (questo turno)':''), v.delta]);
  const s=sc(m.dicastero), c=C()[m.dicastero]||{};
  if(s.ag==='ferma') vv.push(['atto fermato da te, ora', n0(c.ferma)]);
  else if(s.ag){ if(s.ag.atto) vv.push(['atto dirottato da te, ora', n0(c.dirotta_atti?.[s.ag.atto])]); if(s.ag.regione) vv.push(['regione dirottata da te, ora', n0(c.dirotta_regioni?.[s.ag.regione])]); }
  for(const a of s.cant||[]) vv.push(['cantiere fermato da te, ora', n0(c.ferma_cantiere?.[a])]);
  if(!vv.length) return '<p class="min muto">Nessuna variazione negli ultimi due turni.</p>';
  return `<div class="cause">${vv.map(([t,d])=>`<span>${esc(t)}</span><span class="${d<0?'male':'bene'}">${d<0?'−':'+'}${num(Math.abs(d),1)}</span>`).join('')}</div>`;
}
function dimissioni(m){
  const x=m.ministro, d=m.dicastero; if(!x) return '';
  if(dimChieste(m)) return `<p class="sec"><b>Dimissioni chieste.</b> Esce alla chiusura; poi un turno di interim e la scelta fra tre successori${x.tecnico?' tecnici':' del suo partito'}.</p>`;
  const al = V().alleati[x.partito];
  const prezzo = x.tecnico ? 'Gratis: è un tecnico.' : al!=null ? `Costa ${COSTO_DIM} punti d’intesa a ${nomeP(x.partito)} (ora ${num(al,0)}).` : 'Nessun costo d’intesa: è del tuo partito.';
  if(st.ask===`dim:${d}`) return `<div class="conf"><p><b>Chiedi le dimissioni di ${esc(x.nome)}?</b> ${prezzo} Esce alla chiusura del turno${m.agenda?' e il suo atto non si fa':''}; non si torna indietro.</p>
    <button class="btn via pieno" data-dim="${d}">Conferma: chiedi le dimissioni</button><button class="btn" data-ask="">Annulla</button></div>`;
  return `<div class="az" style="margin-top:0"><button class="btn via" data-ask="dim:${d}">Chiedi le dimissioni</button><span class="min muto">${prezzo}</span></div>`;
}
function cantieri(m){
  if(!m.cantieri.length) return '';
  const s=sc(m.dicastero), c=C()[m.dicastero]?.ferma_cantiere||{};
  return `<div class="sez-l"><span>Cantieri</span><span>${m.cantieri.length}</span></div>${m.cantieri.map(k=>{
    const a=m.atti.find(t=>t.id===k.atto)||{nome:k.atto}, chiave=`cant:${m.dicastero}:${k.atto}`, fermo=(s.cant||[]).includes(k.atto);
    const reg = k.regione ? ` · ${esc(REGN(k.regione))}` : '';
    const az = fermo ? `<span class="bollo">Fermato</span> <span class="min male">persi ${euro(k.speso)}</span>`
      : st.ask===chiave ? `<div class="conf"><p>Fermare il cantiere? Si perdono ${euro(k.speso)} già spesi${typeof c[k.atto]==='number'?` e ${num(-c[k.atto],0)} punti di soddisfazione`:''}.</p><button class="btn p via pieno" data-cant="${m.dicastero}:${k.atto}">Conferma: ferma il cantiere</button><button class="btn p" data-ask="">Annulla</button></div>`
      : m.ministro ? `<button class="btn p" data-ask="${chiave}">Ferma il cantiere${costoTxt(c[k.atto])}</button>` : '';
    return `<div class="sec" style="display:grid;gap:3px"><div><b class="${fermo?'fermo':''}">${esc(a.nome)}</b>${reg}</div>
      <div class="min muto">ancora ${k.turni_mancanti} ${k.turni_mancanti===1?'turno':'turni'} · ${euro(k.rata)} a turno · spesi ${euro(k.speso)}</div><div>${az}</div></div>`; }).join('')}`;
}
function rosa(m){
  const ms = rosaUi(m.rosa.map(x=>({...x, nome:x.nome, part:nomeP(x.partito), dic:DIC[m.dicastero]})));
  const scelta = sc(m.dicastero).succ ?? m.scelta;
  return `<div class="sez-l"><span>Il successore</span><span>${scelta==null?'senza scelta: '+esc(m.rosa[0].nome):'scelto'}</span></div>
    <p class="min muto">${m.rosa[0].tecnico?'Tre tecnici':'Tre nomi del partito'}, dal più capace. Entra alla chiusura, poi un turno di rodaggio con la capacità ridotta di uno.</p>
    <div class="rosa">${ms.map((x,i)=>`<div class="cand ${scelta===i?'on':''}" data-succ="${m.dicastero}:${i}">${figura(m,40,x)}<div><b>${esc(x.nome)}</b> <small>${esc(nomeP(x.partito))}${x.tecnico?' · tecnico':''}</small><br><small>posizione ${num(x.posizione)} · tu ${num(V().mia)}</small></div>${cap5({...x,rodaggio:false})}</div>`).join('')}</div>`;
}
function rosaUi(ms){ const visti=new Set(); return ms.map(m=>{ const h=hid(m); let s=0, k; while(visti.has(k=VAR['5'].vista(h+s,donna(m)))) s++; visti.add(k); return s?{...m,spinta:s}:m; }); }
function carta(m){
  const x=m.ministro, d=m.dicastero;
  if(!x) return `<div class="carta"><div class="su">${figura(m,84)}<div><div class="occ">${esc(DIC[d])}</div><h4 class="tit">Interim</h4><div class="sec muto">${esc(causa(m.causa_dimissioni)||'')}</div></div></div>${m.rosa.length?rosa(m):''}${cantieri(m)}</div>`;
  const g=V().gr[IND[d]], a=agenda(m);
  const fronte = `<div class="carta fronte"><div class="su">${figura(m,84)}<div><div class="occ">${esc(DIC[d])}</div><h4 class="tit">${esc(x.nome)}</h4>
      <div class="sec muto">${esc(nomeP(x.partito))} · capacità ${cap5(x)}</div><div style="margin-top:3px">${chips(m)}</div></div></div>
    <div class="motto solo-ord">«${esc(MOTTI[DIC[d]]||'')}»</div>
    <div class="sez-l"><span>Soddisfazione</span>${voto(m)}</div>${barraSodd(m)}${cause(m)}
    <div class="sez-l"><span>Posizione</span><span></span></div>${asse(x)}
    ${g?`<div class="sez-l"><span>Obiettivo</span><span></span></div><p class="sec">${esc(g.nome)}: <b>${num(g.v)}</b>, obiettivo ${num(x.obiettivo)} (${g.verso==='sale'?'più è alto, meglio è':'più è basso, meglio è'}).</p>`:''}
    <div class="sez-l"><span>In agenda</span><span>${a?euro(a.costo):''}</span></div><div class="sec">${atto(m)}</div>
    ${m.agenda&&m.evid.length&&!a?.qui?`<p class="min male">in evidenza: ${esc(m.evid.join('; '))}</p>`:''}
    <div class="az" style="margin-top:0">${azioni(m)}</div>
    <p class="min muto">Margine del dicastero: ${euro(m.margine_residuo)}${m.proposta?` · proposta in sospeso: ${esc(m.proposta.motivo)} <button class="link">Cruscotto ›</button>`:''}</p>
    ${cantieri(m)}${dimissioni(m)}</div>`;
  if(grave()) return fronte;   // tono grave: niente carta che gira
  const s=sc(d), dietro = s.ag ? `<div class="carta retro">${figura(m,62)}<span class="bollo ${s.ag==='ferma'?'':'biro'}">${s.ag==='ferma'?'Fermato':'Dirottato'}</span>
      <b>${esc(a.nome)}${a.regione?' · '+esc(REGN(a.regione)):''}</b><span class="sec">${voto(m)} di soddisfazione</span><button class="link" data-volta="${d}">rigira la carta</button></div>` : '';
  return `<div class="carta3d"><div class="giro ${s.ag&&!s.volta?'dietro':''}" id="giro-${d}">${fronte}${dietro}</div></div>`;
}
// Dirotta: gli altri tre atti, e la regione se il dicastero ne ha una
function dirotta(m){
  const d=m.dicastero, a=m.agenda, c=C()[d]||{}, b=st.bozza||{};
  const att = m.atti.map(t=>{ const cur=t.id===a.atto, k=cur?0:c.dirotta_atti?.[t.id], no = !cur && k && typeof k!=='number' ? pulito(k.rifiuto) : (!t.pagabile && !cur ? (t.prerequisito_mancante||'margine insufficiente') : null);
    const on = (b.atto||a.atto)===t.id;
    const eff = t.effetti.map(e=>`${(V().gr[e.grandezza]||{}).nome||e.grandezza} ${e.migliora?'meglio':'peggio'}${e.ritardo?` fra ${e.ritardo} ${e.ritardo===1?'turno':'turni'}`:' subito'}`).join(', ');
    return `<div class="alt ${on?'on':''} ${no?'no':''}" ${no?'':`data-batto="${t.id}"`}><span class="o"></span><span><b>${esc(t.nome)}</b>${cur?' <span class="chip">in agenda</span>':''}</span>
      <span class="nf">${no?'':cur?'':typeof k==='number'?(Math.round(-k)>0?`−${Math.round(-k)}`:'gratis'):'?'}</span>
      <small>${euro(t.costo)}${t.turni>1?` · cantiere di ${t.turni} turni`:''} · ${esc(eff)}${no?` · <span class="male">${esc(no)}</span>`:''}</small></div>`; }).join('');
  let reg='';
  if(a.regione){
    const R=Object.entries(c.dirotta_regioni||{}), val=R.filter(([,v])=>typeof v==='number').map(([,v])=>-v), mx=Math.max(1e-9,...val);
    const cl = v => v<=0.05 ? 0 : 1+Math.min(3,Math.floor(4*v/mx*0.999));
    const tinte = grave()?RAMPG:RAMP, sel=b.regione||a.regione;
    const lista = Object.keys(REGIONI).map(r=>{ const v=c.dirotta_regioni?.[r], k=typeof v==='number'?Math.round(-v):null;
      return `<button class="${sel===r?'on':''} ${r===a.regione?'suo':''}" data-breg="${r}"><span>${esc(REGN(r))}</span><span class="nf">${r===a.regione?'':k==null?'—':k>0?'−'+k:'gratis'}</span></button>`; }).join('');
    reg = `<div class="sez-l"><span>Regione bersaglio</span><span>del ministro: ${esc(REGN(a.regione))}</span></div>
      <p class="min muto">${esc(a.motivo)}</p>
      <div class="regsel">${mappaCosto(170, r=>{ const v=c.dirotta_regioni?.[r]; return r===a.regione ? tinte[0] : typeof v==='number'?tinte[cl(-v)]:'var(--carta)'; }, sel, a.regione)}<div class="reglist">${lista}</div></div>
      <div class="leg">soddisfazione persa: ${tinte.slice(0,5).map((t,i)=>`<i style="background:${t}"></i>`).join('')} <span>da nulla a ${num(mx,0)}</span></div>`;
  }
  const tot = (b.atto&&b.atto!==a.atto?n0(c.dirotta_atti?.[b.atto]):0) + (b.regione&&b.regione!==a.regione?n0(c.dirotta_regioni?.[b.regione]):0);
  const cambia = (b.atto&&b.atto!==a.atto) || (b.regione&&b.regione!==a.regione);
  return `<div class="carta"><div class="su">${figura(m,62)}<div><div class="occ">Dirotta · ${esc(DIC[d])}</div><h4 class="tit">${esc(m.ministro.nome)}</h4><div class="sec muto">soddisfazione ${num(sodd(m),0)}: il ministro perde quanto teneva all’atto scartato</div></div></div>
    <div class="sez-l"><span>Atto</span><span>soddisfazione</span></div><div>${att}</div>${reg}
    <div class="az">${cambia?`<button class="btn pieno" data-fai="${d}">Dirotta${tot<-.5?` · −${Math.round(-tot)} di soddisfazione`:' · gratis'}</button>`:'<span class="sec muto">Scegli un altro atto o un’altra regione.</span>'}<button class="btn" data-dir="">Annulla</button></div></div>`;
}
function mappaCosto(h, tinta, sel, suo){
  const w=Math.round(h*GEO.w/GEO.h);
  return `<div class="carta-it"><svg viewBox="0 0 ${GEO.w} ${GEO.h}" height="${h}" width="${w}" role="radiogroup" aria-label="Regione bersaglio">${Object.keys(REGIONI).map(r=>{ const p=PATH[r]; if(!p) return '';
    return `<path class="reg ${r===sel?'on':''} ${r===suo?'suo':''}" d="${p.d}" fill="${tinta(r)}" role="radio" aria-checked="${r===sel}" data-breg="${r}"><title>${esc(REGN(r))}</title></path>`; }).join('')}</svg></div>`;
}
function lato(){
  const m = st.sel && M(st.sel);
  if(st.dir && M(st.dir)?.agenda) return `<aside class="lato">${dirotta(M(st.dir))}</aside>`;
  if(!m) return `<aside class="lato"><h4 class="tit">La carta del ministro</h4><p class="sec muto">Scegli un ministro: qui la sua carta, con soddisfazione e cause, posizione, obiettivo, cantieri e dimissioni.</p>
    <p class="sec">In evidenza ${V().ministeri.filter(evid).length} su 10: in preavviso, con un atto lontano dalla tua posizione o legato a un evento aperto.</p>
    ${V().ministeri.some(x=>!x.ministro&&x.rosa.length)?`<p class="sec male">C’è un dicastero in interim: scegli il successore.</p>`:''}</aside>`;
  return `<aside class="lato">${carta(m)}</aside>`;
}

// ======================= le tre forme =======================
const ordine = () => V().ministeri;   // l'ordine dei dicasteri dei dati
function formaA(){
  const head = `<tr><th></th><th>Ministro</th><th>Dicastero</th><th style="text-align:right">Voto</th><th>In agenda</th><th>Servizio</th><th></th></tr>`;
  const righe = ordine().map(m=>{ const x=m.ministro, a=agenda(m);
    const cl=['riga', st.sel===m.dicastero?'sel':'', evid(m)?'ev':'', !evid(m)&&x?'quieta':''].join(' ');
    return `<tr class="${cl}" data-sel="${m.dicastero}"><td class="f">${figura(m,34)}</td>
      <td class="nm">${x?`<b>${esc(x.nome)}</b> ${chips(m)}<br><span class="min">${esc(nomeP(x.partito))}</span>`:`<b>Interim</b><br>${m.rosa.length?'<span class="min male">scegli il successore ›</span>':''}`}</td>
      <td class="dc"><div>${esc(DIC[m.dicastero])}</div><div class="motto solo-ord">${x&&MOTTI[DIC[m.dicastero]]?'«'+esc(MOTTI[DIC[m.dicastero]])+'»':''}</div></td>
      <td class="n">${voto(m)}</td><td class="at">${atto(m,false,true)}</td>
      <td>${servizio(m)}</td><td class="azr">${azioni(m,true)}</td></tr>`; }).join('');
  return `<main class="corpo gov">${capoSez()}<div><table class="lst"><thead>${head}</thead><tbody>${righe}</tbody></table>
    <p class="min muto" style="margin-top:6px">In nero le righe in evidenza; le altre in grigio. Servizio: l’indicatore del dicastero contro l’obiettivo del ministro.</p></div>${lato()}</main>`;
}
function formaB(){
  const carte = ordine().map((m,i)=>{ const x=m.ministro, s=sc(m.dicastero), a=agenda(m), girata = s.ag && !s.volta && !grave();
    const fr0 = `<div class="fr0"><div class="cima"><span>n. ${i+1} ${chips(m)}</span>${voto(m)}</div><div class="fz">${figura(m,62)}</div>
      <b class="nm">${x?esc(x.nome):'Interim'}</b><span class="dc">${esc(DIC[m.dicastero])}${x?' · '+esc(nomeP(x.partito)):''}</span>
      ${x&&MOTTI[DIC[m.dicastero]]?`<span class="motto solo-ord">«${esc(MOTTI[DIC[m.dicastero]])}»</span>`:''}
      <div class="at">${x?atto(m,true):m.rosa.length?'<span class="male">scegli il successore ›</span>':''}${a&&!a.ritirata?` <span class="muto">· ${euro(a.costo)}</span>`:''}</div>
      <div class="az">${azioni(m,true)}</div></div>`;
    const rt0 = s.ag && a ? `<div class="rt0">${figura(m,48)}<span class="bollo ${s.ag==='ferma'?'':'biro'}">${s.ag==='ferma'?'Fermato':'Dirottato'}</span><span class="min"><b>${esc(a.nome)}</b>${a.regione?' · '+esc(REGN(a.regione)):''}</span>${voto(m)}<button class="link" data-volta="${m.dicastero}">rigira</button></div>` : '';
    return `<div class="fig ${st.sel===m.dicastero?'sel':''} ${evid(m)?'ev':''}" data-sel="${m.dicastero}"><div class="giro ${girata?'dietro':''}" id="giro-${m.dicastero}">${fr0}${rt0}</div></div>`; }).join('');
  return `<main class="corpo gov">${capoSez()}<div class="album">${carte}</div>${lato()}</main>`;
}
function formaC(){
  const gruppi = ['giocatore', ...Object.keys(V().alleati)];
  const col = p => { const ms=ordine().filter(m=>(m.ministro?.partito ?? m.rosa[0]?.partito ?? m.partito_interim)===p), al=V().alleati[p];
    return `<section><div class="capo"><h3 class="tit">${esc(nomeP(p))}</h3><span class="min muto">${ms.length} ${ms.length===1?'dicastero':'dicasteri'}${al!=null?` · intesa ${num(al,0)}`:''}</span></div>
      ${ms.map(m=>{ const x=m.ministro; return `<div class="mc ${st.sel===m.dicastero?'sel':''} ${evid(m)?'ev':''}" data-sel="${m.dicastero}">${figura(m,34)}
        <div class="t"><b>${x?esc(x.nome):'Interim'}</b> <span class="min muto">${esc(DIC[m.dicastero])}</span><br>${chips(m)}</div>${voto(m)}
        <div class="s">${x?atto(m,true):m.rosa.length?'scegli il successore ›':''}</div>${servizio(m)?`<div style="grid-column:1/-1">${servizio(m)}</div>`:''}
        ${azioni(m,true)?`<div class="az" style="grid-column:1/-1;margin-top:2px">${azioni(m,true)}</div>`:''}</div>`; }).join('')}</section>`; };
  const altri = ordine().filter(m=>!gruppi.includes(m.ministro?.partito ?? m.rosa[0]?.partito));
  return `<main class="corpo gov">${capoSez()}<div class="part" style="--np:${gruppi.length}">${gruppi.map(col).join('')}</div>${lato()}</main>`;
}
function capoSez(){
  const v=V(), n=v.ministeri.filter(evid).length;
  const nota = v.crisi ? 'Crisi di governo: solo ordinaria amministrazione.' : grave() ? '' : '';
  return `<div class="capo" style="grid-column:1/-1"><h3 class="tit">${grave()?'I ministri':'Il borsino dei ministri'}</h3><span class="sec muto">${per(v.data)} · ${n} in evidenza${nota?' · '+nota:''}</span></div>`;
}

// ======================= cornice (da 08, forma A, come nel 17) =======================
function caselle(pos,soglia=3,n=10){
  if(pos==null) return `<span class="cas vuoto">${'<i></i>'.repeat(n)}</span>`;
  const inp=pos<=soglia;
  return `<span class="cas ${inp?'inp':''}">${Array.from({length:n},(_,i)=>`<i class="${[i<soglia?'per':'', i===soglia-1?'sog':'', i<pos?'on':''].join(' ')}"></i>`).join('')}</span>`;
}
function tracciati(){
  const v=V(), m=v.margine, stretto=m?Math.min(...m):null;
  const t=[['Consenso',num(v.consenso)+'%', clamp(Math.round((v.consenso-25)/5),0,10)],
    ['Maggioranza C / S', m? m.map(x=>(x>0?'+':x<0?'−':'')+Math.abs(x)).join(' / ') : 'Camere sciolte', m? clamp(Math.round((stretto+9)/3),0,10) : null],
    ['Conti · spread', num(v.spread,0), clamp(Math.round((500-v.spread)/50),0,10)]];
  return `<div class="trks">${t.map(([k,val,pos])=>`<div class="trk"><span class="k">${k}</span>${caselle(pos)}<span class="v">${val}</span></div>`).join('')}</div>`;
}
const SEZ = [['prima','Prima pagina'],['cruscotto','Cruscotto'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function cornice(){
  const v=V(), b={};
  if(!v.presentabile) b.bilancio = v.crisi ? 'Crisi: solo ordinaria amministrazione' : 'La legge di bilancio si presenta in ottobre-dicembre';
  b.campagna='Si fa campagna solo nel turno prima del voto';
  const n = v.default_aperti + v.ministeri.filter(m=>!m.ministro&&m.rosa.length&&sc(m.dicastero).succ==null&&m.scelta==null).length;
  const stato = v.crisi ? 'Crisi di governo' : 'Al governo';
  const chi=`<span class="chi"><b>${stato}</b><br>${per(v.data)} · turno ${v.turno}<br><b>${v.turni_al_voto} turni al voto</b></span>`;
  const somm=`<nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}">${t}</button>` : `<button class="${k==='governo'?'qui':''}" ${k==='governo'?'aria-current="page"':''}>${t}</button>`).join('')}
    <span class="fuori"><button>Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav>`;
  const def = n ? `<button class="def">${n} ${n===1?'scelta va':'scelte vanno'} al default ›</button>` : `<span class="def tutte">nessuna scelta al default</span>`;
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino solo-ord">Il Pungolo</span>${chi}</div>${tracciati()}
    <div class="c-dx"><div class="pila"><button class="btn pieno">Chiudi il turno ›</button></div>${def}</div></div>${somm}</header>`;
}

// ======================= render =======================
const scr = document.getElementById('screen');
let limite='';
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const v=V();
  const banda = v.crisi ? `<div class="banda">Crisi di governo: solo ordinaria amministrazione. Allarga la maggioranza o dimettiti.</div>` : '';
  const corpo = st.v==='B' ? formaB() : st.v==='C' ? formaC() : formaA();
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${banda?'auto ':''}minmax(0,1fr)">${cornice()}${banda}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  if(st.anima){ const el=document.getElementById('giro-'+st.anima.d);   // la carta gira: Web Animations, molla dei movimenti (ticket 04)
    if(el && !grave()) el.animate([{transform:`rotateY(${st.anima.da}deg)`},{transform:`rotateY(${st.anima.a}deg)`}],{duration:520,easing:'cubic-bezier(.3,1.35,.5,1)'});
    st.anima=null; }
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')||el.closest('.retro,.rt0')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.corpo'), scorre = c && c.scrollHeight>c.clientHeight+1;
  const l=r.querySelector('.lato'), scorreL = l && l.getBoundingClientRect().bottom>R.bottom+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'il corpo scorre':'', scorreL?'il lato scorre':''].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else if(b.id==='azzera'){ st.sc={}; st.ask=null; st.dir=null; }
  else { st[b.parentElement.dataset.k]=b.dataset.v; if(b.parentElement.dataset.k==='stato'){ st.sc={}; st.sel=null; st.dir=null; st.ask=null; } }
  render();
});
const S_ = d => (st.sc[d] ||= {});
scr.addEventListener('click',e=>{
  const t=e.target, q=s=>t.closest(s);
  let x;
  if(x=q('[data-ferma]')){ const d=x.dataset.ferma; S_(d).ag='ferma'; S_(d).volta=false; st.ask=null; st.sel=d; st.anima={d,da:0,a:180}; }
  else if(x=q('[data-ask]')){ st.ask=x.dataset.ask||null; }
  else if(x=q('[data-dir]')){ st.dir=x.dataset.dir||null; st.bozza={}; if(st.dir) st.sel=st.dir; st.ask=null; }
  else if(x=q('[data-batto]')){ st.bozza={...st.bozza, atto:x.dataset.batto}; }
  else if(x=q('[data-breg]')){ st.bozza={...st.bozza, regione:x.dataset.breg}; }
  else if(x=q('[data-fai]')){ const d=x.dataset.fai, a=M(d).agenda, b=st.bozza||{};
    S_(d).ag={atto:b.atto&&b.atto!==a.atto?b.atto:null, regione:b.regione&&b.regione!==a.regione?b.regione:null}; S_(d).volta=false; st.dir=null; st.bozza={}; st.anima={d,da:0,a:180}; }
  else if(x=q('[data-annulla]')){ const d=x.dataset.annulla; delete S_(d).ag; }
  else if(x=q('[data-volta]')){ const d=x.dataset.volta; S_(d).volta=!S_(d).volta; st.anima={d,da:S_(d).volta?180:0,a:S_(d).volta?0:180}; }
  else if(x=q('[data-dim]')){ const d=x.dataset.dim; S_(d).dim=true; delete S_(d).ag; st.ask=null; }
  else if(x=q('[data-cant]')){ const [d,a]=x.dataset.cant.split(':'); (S_(d).cant ||= []).push(a); st.ask=null; }
  else if(x=q('[data-succ]')){ const [d,i]=x.dataset.succ.split(':'); S_(d).succ=+i; }
  else if(x=q('[data-sel]')){ if(t.closest('button')) return; const d=x.dataset.sel; st.sel = st.sel===d && !st.dir ? null : d; st.dir=null; st.ask=null; }
  else return;
  render();
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);

</script>
</body>
</html>
