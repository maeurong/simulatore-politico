<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Paese» (23), mappa v1-piano-11-ui.
  Domanda: com'è fatta la sezione Paese? Mappa delle 20 regioni con un livello alla volta (137-138) e i segni di atti,
  cantieri ed emergenze (139), la lista delle venti regioni accanto; la scheda della regione con i diciotto gruppi e gli
  elettori campione al clic (113, 140), seggi del Senato, forbice del sondaggio e disposizioni territoriali; il sondaggio
  del trimestre con gli istituti, gli incroci e la proiezione dei seggi (111); il sondaggio privato accanto (123); il
  selettore di regione dentro le altre sezioni (141).
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Atlante            — mappa e lista a pagina, il sondaggio nel dettaglio a lato finché non si sceglie una regione
    B  Sondaggio a fronte — sondaggio a pagina a sinistra, mappa e lista a destra, la scheda della regione a lato
    C  Schede             — tre schede a pagina (Mappa, Sondaggio, Incroci), dettaglio a lato
  ?ctx=paese|dirotta|campagna|perimetro: la sezione Paese, o il selettore di regione dentro un'altra sezione (141).
  Stati, ?stato=: governo (03) · opposizione (06) · zero (turno zero) · grave (tono grave, 08). Il cantiere finito non arriva
  giocando (opere: rimando), e il voto per regione nemmeno: livello barrato col rimando a 11g.
  Dati: viste/23-paese.json (genera/, tutto giocato). Le grandezze per regione, i gruppi, la pericolosità, il voto per
  regione e le opere finite NON sono nella Vista di oggi: genera/ le calcola con le regole della spec di core «esito e
  Vista completa» (PR delle esposizioni, 11g). Il margine del sondaggio è la formula della stessa spec.
  Geometria: quella del prototipo 07 (non l'ISTAT generalizzata del ticket «Mappa SVG delle regioni»).
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A). Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 12/11/2026), nel ticket 23: A · Atlante; consenso di default della coalizione; colori dei partiti nella
  mappa del voto e nelle barre; selettore nel dettaglio a lato (?ctx=). Il file si apre su questa forma. Scartate: B e C.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo Paese · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block;overflow:visible}

/* ===== token: copiati da 08-fondamenta (forma A) ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:9px;height:14px;border:1.5px solid var(--ink);flex:none}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:6px 10px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:baseline}
.dati dt{color:var(--grigio)}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.pieno{background:var(--rosso);border-color:var(--rosso);color:var(--carta)}
.g .chip.pieno{background:var(--ink);border-color:var(--ink)}

/* cornice A · Gerenza (da 08) */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);white-space:nowrap}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:10px var(--marg) 12px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative;grid-template-columns:minmax(0,1fr) var(--lato)}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez)}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:6px}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start;min-width:0}
.lato h4{font-size:var(--c-sez)}
.grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:6px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:8px}
.grp:first-child{margin-top:0}
.indietro{font-size:var(--c-sec);text-decoration:underline;text-underline-offset:2px;justify-self:start}
.rif{border-left:3px solid var(--rosso);padding:2px 8px;font-size:var(--c-sec);color:var(--rosso)}

/* livelli */
.livelli{display:flex;gap:0;border-bottom:var(--forte);align-items:end;flex-wrap:wrap}
.livelli button{padding:4px 11px;font-weight:700;color:var(--grigio);border:1.5px solid transparent;border-bottom:0;font-size:var(--c-sec)}
.livelli button.qui{color:var(--ink);border-color:var(--ink);background:var(--carta);margin-bottom:-2px;padding-bottom:6px}
.livelli button[aria-disabled=true]{text-decoration:line-through;font-weight:400;cursor:help}
.livelli .sub{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:4px;font-size:var(--c-sec)}
.livelli select{font:inherit;font-size:var(--c-sec);border:var(--bordo);background:var(--carta);padding:1px 4px}
.legenda{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--c-min);color:var(--grigio)}
.legenda .cl{display:flex;align-items:center;gap:0}
.legenda .cl span{display:grid;justify-items:center;gap:1px}
.legenda .cl i{width:34px;height:10px;border:1px solid var(--ink);border-right:0}
.legenda .cl span:last-child i{border-right:1px solid var(--ink)}
.legenda .sg{display:inline-flex;align-items:center;gap:3px}
.carta-it{position:relative}
.carta-it path.reg{cursor:pointer;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.carta-it path.reg:hover{stroke-width:2.5}
.carta-it path.reg:focus{outline:none}
.carta-it .anello{fill:none;stroke:var(--biro);stroke-width:3.5;vector-effect:non-scaling-stroke;pointer-events:none}
.g .carta-it .anello{stroke:var(--ink)}
.carta-it .fuoco{fill:none;stroke:var(--biro);stroke-width:2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none}

/* lista delle 20 */
.lista{display:grid;align-content:start;font-size:var(--c-sec)}
.lista .h{display:grid;grid-template-columns:minmax(0,1fr) 64px 58px;gap:6px;font-size:var(--c-min);color:var(--grigio);font-weight:700;border-bottom:1.5px solid var(--ink);padding:2px 4px}
.lista .h button{font-weight:700;color:var(--grigio);text-align:left}
.lista .h button.on{color:var(--ink);text-decoration:underline}
.lista .r{display:grid;grid-template-columns:minmax(0,1fr) 64px 58px;gap:6px;align-items:center;padding:2px 4px;border-bottom:var(--filo);cursor:pointer;line-height:1.25}
.lista .r:hover{background:var(--velo)}
.lista .r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.lista .r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.lista .r .n i{width:10px;height:10px;border:1px solid var(--ink);flex:none}
.lista .r .x{text-align:right;font-weight:700;white-space:nowrap}
.lista .r .s{display:flex;gap:2px;justify-content:flex-end}
.lista.due{grid-template-columns:1fr 1fr;column-gap:14px}
.lista.due .h{display:none}

/* sondaggio */
.tab{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.tab th{font-size:var(--c-min);text-align:right;color:var(--grigio);font-weight:700;padding:2px 5px;border-bottom:1.5px solid var(--ink);white-space:nowrap;vertical-align:bottom}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab td{padding:2px 5px;border-bottom:var(--filo);text-align:right;white-space:nowrap}
.tab td.media,.tab th.media{font-weight:700;background:var(--velo)}
.tab td.priv,.tab th.priv{font-weight:700;color:var(--biro);box-shadow:inset 1.5px 0 0 var(--biro)}
.g .tab td.priv,.g .tab th.priv{color:var(--ink)}
.tab tr.tu td{font-weight:700}
.tab tr[data-sel]{cursor:pointer}
.tab tr[data-sel]:hover td{background:var(--velo)}
.tab tr.sel td{background:var(--velo)}
.sw{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-right:5px;vertical-align:-1px}
.barp{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:2px 8px;align-items:center;font-size:var(--c-sec)}
.barp .b{height:12px;position:relative;background:none}
.barp .b i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barp .b u{position:absolute;top:-2px;bottom:-2px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);background:rgb(31 26 23 / .12)}
.barp .b em{position:absolute;inset:3px auto 3px 0;background:var(--biro)}
.barp .q{text-align:right;white-space:nowrap}
.barp .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barp .tu{font-weight:700}
.priv-box{border:var(--forte);padding:8px 10px;display:grid;gap:6px}
.priv-box .prezzo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seggi{display:grid;gap:3px}
.seggi .fila{display:flex;height:16px;border:1px solid var(--ink);position:relative}
.seggi .fila i{height:100%;border-right:2px solid var(--carta)}
.seggi .fila u{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--rosso)}

/* gruppi */
.gruppi{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,52px);gap:1px;font-size:var(--c-sec)}
.gruppi .hh{font-size:var(--c-min);color:var(--grigio);font-weight:700;text-align:center;border-bottom:1.5px solid var(--ink)}
.gruppi .hh:first-child{text-align:left}
.gruppi .rr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
.gruppi button{text-align:center;border:var(--filo);padding:1px 0;font-weight:700}
.gruppi button:hover{background:var(--velo)}
.gruppi button.sel{background:var(--ink);color:var(--carta)}
.elettori{display:grid;gap:5px}
.elettori .e{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 8px;align-items:center;border-bottom:var(--filo);padding-bottom:4px}
.elettori .e .vt{font-size:var(--c-sec)}
.elettori .e .mt{font-size:var(--c-min);color:var(--grigio);grid-column:2}
.dispo{display:grid;gap:3px}
.dispo .d{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;font-size:var(--c-sec);border-bottom:var(--filo);padding:2px 0}
.dispo .d .m{grid-column:1/-1;font-size:var(--c-min);color:var(--grigio)}

/* B e C */
.fronte{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 var(--canale)}
.fronte>section{min-width:0;display:grid;gap:6px;align-content:start}
.fronte>section+section{border-left:var(--filo);padding-left:var(--canale)}
.schede{display:flex;gap:0;border-bottom:var(--forte);margin-bottom:8px}
.schede button{padding:5px 14px;font-weight:700;color:var(--grigio);border:1.5px solid transparent;border-bottom:0}
.schede button.qui{color:var(--ink);border-color:var(--ink);background:var(--carta);margin-bottom:-2px;padding-bottom:7px}
.atlante{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;align-items:start}

/* selettore (141) */
.altrove{display:grid;gap:8px;align-content:start}
.altrove .finta{border:1.5px dashed var(--grigio);padding:10px;color:var(--grigio);font-size:var(--c-sec);min-height:120px}
.scegli{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;justify-items:start}
.scegli>div{width:100%}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:170px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
</style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>
<div id="proto">
  <button id="prev" title="forma precedente (←)">‹</button><span class="lab" id="lab"></span><button id="next" title="forma successiva (→)">›</button>
  <span class="cap">dove</span><span class="seg" data-k="ctx"><button data-v="paese">sezione Paese</button><button data-v="dirotta">dirottamento</button><button data-v="campagna">bersaglio di campagna</button><button data-v="perimetro">perimetro</button></span>
  <span class="cap">stato</span><span class="seg" data-k="stato" id="stati"></span>
  <span class="cap">finestra</span><span class="seg" data-k="fin"><button data-v="1280">1280×800</button><button data-v="1440">1440×900</button></span>
  <span class="cap">scala</span><span class="seg" data-k="scala"><button data-v="1">1×</button><button data-v="1.25">1,25×</button></span>
  <button id="azzera" title="annulla l'acquisto fatto qui">azzera acquisti</button>
  <span id="avv"></span>

function coal(){ const v=V(); const a = v.governa ? v.alleati.map(x=>x.partito) : (v.coalizione||[]).map(x=>x.partito||x); return ['giocatore',...a.filter(x=>x!=='giocatore')]; }
// Cinque classi a passi uguali di luminosità, interpolate in OKLab dalla carta all'inchiostro.
function lab(h){ const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);

const regV = id => (S().regioni||[]).find(r=>r.id===id);

// ============ segni: atti e cantieri regionali, opere finite, emergenze aperte ============
function segni(){

// Radiogroup: una fermata di Tab, frecce per muoversi, l'anello del fuoco ricopiato in coda con <use>.
function mappa(h, opz={}){

    const val = perim ? (perim.has(id)?'nel perimetro':'fuori') : opz.etichetta ? opz.etichetta(id) : (st.liv==='voto' ? (elezR(id)?'primo '+pnome(elezR(id).primo):'') : fmt(valore(id)));

  const mk=Object.entries(sg).map(([id,l])=>{ const p=PATH[id]; if(!p) return ''; const [cx,cy]=p.c;

function lista(due){

  return `<div class="lista ${due?'due':''}" role="radiogroup" aria-label="Le venti regioni in lista">

    ${ids.map(id=>`<div class="r ${st.sel===id?'sel':''}" role="radio" aria-checked="${st.sel===id}" tabindex="-1" data-reg="${id}"><span class="n"><i style="background:${tinta(id)}"></i>${esc(nomeR(id))}</span><span class="x">${x(id)}</span><span class="s">${(sg[id]||[]).map(s=>segnoMini(s.t)).join('')}</span></div>`).join('')}</div>`;
}

// ============ sondaggio ============
const margine = n => 2*Math.sqrt((D.effetto_disegno||1)*.25/n);
const media = () => { const is=V().sondaggio.istituti; return is[0].quote.map((_,j)=>is.reduce((s,r)=>s+r.quote[j],0)/is.length); };
const priv = () => st.comprato[st.stato] ? V().acquisti.sondaggio_privato : null;
const ordP = () => partiti().map((p,i)=>i).filter(i=>!partiti()[i].sciolto).sort((a,b)=>media()[b]-media()[a]);
// Quote sui votanti: il sondaggio porta l'astensione come ultima voce.
const sulVoto = q => q.map((x,j)=>j===AST()?x:x/(1-q[AST()]));
function istituti(stretto){
  const is=V().sondaggio.istituti, m=sulVoto(media()), pv=priv(), pr=pv&&sulVoto(pv.istituti[0].quote);
  const co=coal();
  return `<table class="tab"><tr><th>Partito</th>${stretto?'':is.map(r=>`<th>${esc(r.istituto.replace('Istituto ',''))}<br><span style="font-weight:400">±${num(margine(r.campione)*100,1)}</span></th>`).join('')}<th class="media">Media</th>${pv?`<th class="priv">Privato<br><span style="font-weight:400">±${num(margine(pv.istituti[0].campione)*100,1)}</span></th>`:''}</tr>
    ${ordP().map(i=>{ const p=partiti()[i]; return `<tr class="${p.id==='giocatore'?'tu':''}"><td><i class="sw" style="background:${PCOL[p.id]}"></i>${esc(p.nome)}${co.includes(p.id)&&p.id!=='giocatore'?' <span class="muto min">· coal.</span>':''}</td>${stretto?'':is.map(r=>`<td>${num(sulVoto(r.quote)[i]*100)}</td>`).join('')}<td class="media">${num(m[i]*100)}</td>${pv?`<td class="priv">${num(pr[i]*100)}</td>`:''}</tr>`; }).join('')}
    <tr><td class="muto">Astensione</td>${stretto?'':is.map(r=>`<td class="muto">${num(r.quote[AST()]*100,0)}</td>`).join('')}<td class="media muto">${num(m[AST()]*100,0)}</td>${pv?`<td class="priv">${num(pr[AST()]*100,0)}</td>`:''}</tr></table>
    <p class="min muto">Quote sui votanti; l’astensione sul totale. Tutti gli istituti condividono un errore che si vede solo al voto.</p>`;
}
function proiezione(){
  const pj=V().proiezione.filter(p=>p.camera+p.senato>0), co=coal(), tot={camera:400,senato:200};
  const fila=r=>`<div class="fila">${pj.map(p=>`<i title="${esc(pnome(p.partito))}: ${p[r]}" style="flex:${p[r]};background:${PCOL[p.partito]}"></i>`).join('')}<u style="left:50%"></u></div>`;
  const cc=r=>pj.filter(p=>co.includes(p.partito)).reduce((s,p)=>s+p[r],0);
  return `<div class="seggi"><div class="sec"><b>Camera</b> · la tua coalizione ${cc('camera')} su 400, ne servono 201</div>${fila('camera')}
    <div class="sec"><b>Senato</b> · ${cc('senato')} su 200, ne servono 101</div>${fila('senato')}
    <div class="legenda">${pj.map(p=>`<span class="sg"><i class="sw" style="background:${PCOL[p.partito]}"></i>${esc(pnome(p.partito))} ${p.camera}·${p.senato}</span>`).join('')}</div>
    <p class="min muto">Se si votasse oggi, con la media e la legge in vigore.</p></div>`;
}
function privato(){
  const pz=V().acquisti.prezzi.find(p=>p.acquisto==='sondaggio_privato').euro, gen=!!S().dopo, cassa=st.comprato[st.stato]?S().cassa_dopo:S().cassa_prima;
  if(priv()) return `<div class="priv-box"><div class="capo" style="margin:0"><b>Sondaggio privato</b><span class="sec muto">comprato · ${euro(pz)}</span></div>
    <p class="sec">Un istituto solo, campione ${num(priv().istituti[0].campione,0)}: sbaglia meno e la colonna sta accanto alla media. Vale per questo turno; gli incroci sono suoi.</p>
    ${st.rif?`<div class="rif">${esc(st.rif)}</div>`:`<button class="link" data-ricompra="1" style="justify-self:start">Compralo ancora</button>`}</div>`;
  return `<div class="priv-box"><b>Sondaggio privato</b><p class="sec">Un istituto con un campione più grande e meno errore suo. Lo leggi qui accanto alla media, e negli incroci.</p>
    <div class="prezzo"><button class="btn" ${gen?'data-compra="1"':'aria-disabled="true" data-perche="prototipo: acquisto non generato per questo stato"'}>Compra · ${euro(pz)}</button><span class="sec muto">cassa ${euro(cassa??0)}</span></div></div>`;
}
const NCOND = {dipendente_privato:'Dipendenti privati', dipendente_pubblico:'Dipendenti pubblici', autonomo:'Autonomi', pensionato:'Pensionati', disoccupato_inattivo:'Disoccupati e inattivi', studente:'Studenti'};
const NFAS = {bassa:'Fascia bassa', media:'Fascia media', alta:'Fascia alta'};
// Incroci: per riga la tua quota, la coalizione e il primo partito; il margine cresce nei sottocampioni piccoli.
function incroci(tipo, compatto){
  const src=(priv()||V().sondaggio)[tipo], co=coal(), nm = tipo==='condizioni'?NCOND:tipo==='fasce'?NFAS:Object.fromEntries(REG().map(r=>[r,nomeR(r)]));
  const rows=src.map(x=>{ const q=sulVoto(x.quote), m=margine(x.campione), tu=q[pIdx('giocatore')], c=co.reduce((s,p)=>s+(q[pIdx(p)]||0),0), pr=ordP().reduce((a,b)=>q[b]>q[a]?b:a, ordP()[0]);
    return `<tr data-sel="inc:${tipo}:${x.id}" class="${st.inc===tipo+':'+x.id?'sel':''}"><td>${esc(nm[x.id]||x.id)}</td><td class="muto">${num(x.campione,0)}</td><td><b>${num(tu*100)}</b> <span class="muto min">±${num(m*100,0)}</span></td>${compatto?'':`<td>${num(c*100)}</td>`}<td><i class="sw" style="background:${PCOL[partiti()[pr].id]}"></i>${esc(partiti()[pr].nome)}</td>${compatto?'':`<td>${num(q[AST()]*100,0)}</td>`}</tr>`; }).join('');
  return `<table class="tab"><tr><th>${tipo==='condizioni'?'Condizione':tipo==='fasce'?'Fascia di reddito':'Regione'}</th><th>campione</th><th>Tu</th>${compatto?'':'<th>Coalizione</th>'}<th>Primo</th>${compatto?'':'<th>Ast.</th>'}</tr>${rows}</table>`;
}
function dettaglioIncrocio(){
  const [,tipo,id]=st.inc.split(':'), x=(priv()||V().sondaggio)[tipo].find(r=>r.id===id), q=sulVoto(x.quote), m=margine(x.campione);
  const nm = tipo==='condizioni'?NCOND[id]:tipo==='fasce'?NFAS[id]:nomeR(id);
  return `<button class="indietro" data-inc="">‹ Torna al sondaggio</button><h4 class="tit">${esc(nm)}</h4>
    <p class="sec">Campione <b>${num(x.campione,0)}</b> · margine ±${num(m*100,1)} punti${priv()?' · dal sondaggio privato':''}.</p>${barreQuote(q,m)}
    <p class="sec">Approvazione del governo: <b>${num(x.approvazione,2)}</b> <span class="muto">(sotto zero, lo boccia)</span></p>${posizione(x.posizione)}`;
}
function barreQuote(q,m,pv){
  const mx=Math.max(...ordP().map(i=>q[i]+m),.01);
  return `<div class="barp">${ordP().map(i=>{ const p=partiti()[i], w=q[i]/mx*100, lo=Math.max(0,q[i]-m)/mx*100, hi=(q[i]+m)/mx*100;
    return `<span class="n ${p.id==='giocatore'?'tu':''}"><i class="sw" style="background:${PCOL[p.id]}"></i>${esc(p.nome)}</span><span class="b"><i style="width:${w.toFixed(1)}%;background:${PCOL[p.id]}"></i><u style="left:${lo.toFixed(1)}%;width:${(hi-lo).toFixed(1)}%"></u></span><span class="q ${p.id==='giocatore'?'tu':''}">${num(q[i]*100)}% <span class="muto min">${num(Math.max(0,q[i]-m)*100,0)}–${num((q[i]+m)*100,0)}</span></span>`; }).join('')}</div>`;
}
function posizione(p){
  const mx=Math.max(...p);
  return `<div><div class="grp"><span>Dove si collocano</span><span>da sinistra a destra</span></div><svg width="100%" height="44" viewBox="0 0 280 44" preserveAspectRatio="none" aria-label="Autocollocazione sui sette punti">${p.map((x,i)=>`<rect x="${i*40+4}" y="${36-x/mx*34}" width="32" height="${x/mx*34}" fill="var(--ink)"/><text x="${i*40+20}" y="44" font-size="9" text-anchor="middle" fill="var(--grigio)">${i+1}</text>`).join('')}</svg></div>`;
}
function sondaggioLato(){
  return `<div class="capo" style="margin:0"><h4 class="tit">Il sondaggio</h4><span class="sec muto">${per(V().data)}</span></div>${istituti(true)}${privato()}<div class="grp"><span>Seggi se si votasse oggi</span></div>${proiezione()}
    <div class="grp"><span>Incroci per condizione</span></div>${incroci('condizioni',true)}<p class="min muto">Scegli una regione sulla mappa per la sua scheda.</p>`;
}

// ============ scheda della regione ============
const MOT = {vicinanza:'gli è vicino', leader:'il leader', governo:'come governa', protesta:'per protesta'};
function scheda(id){
  const r=regV(id), x=incR(id, priv()?{sondaggio:priv()}:V()), q=sulVoto(x.quote), m=margine(x.campione), e=elezR(id), sg=segni()[id]||[];
  const dis=V().disposizioni.filter(d=>d.perimetro.includes(id));
  const conds=Object.keys(NCOND), fas=Object.keys(NFAS);
  const gruppi = r?.gruppi ? `<div class="grp"><span>I diciotto gruppi</span><span>quota degli elettori</span></div>
    <div class="gruppi"><span class="hh"></span>${fas.map(f=>`<span class="hh">${f}</span>`).join('')}
    ${conds.map((c,i)=>`<span class="rr">${NCOND[c]}</span>${fas.map((f,j)=>{ const k=`${c}|${f}`; return `<button data-gr="${k}" class="${st.gr===k?'sel':''}" aria-pressed="${st.gr===k}" title="${esc(NCOND[c])}, ${esc(NFAS[f].toLowerCase())}: tre elettori">${num(r.gruppi[i*3+j]*100,0)}%</button>`; }).join('')}`).join('')}</div>${st.gr?elettori(id):`<p class="min muto">Un clic su un gruppo: tre suoi elettori.</p>`}` : `<div class="ph"><b>I diciotto gruppi</b> · in 11g, PR delle esposizioni</div>`;
  const per3 = r?.pericolosita ? ['sisma','idro','incendi'].map(t=>`${{sisma:'terremoti',idro:'alluvioni e frane',incendi:'incendi'}[t]} <b>${r.pericolosita[t]>=2/3?'alta':r.pericolosita[t]>=1/3?'media':'bassa'}</b>`).join(' · ') : '—';
  return `<button class="indietro" data-reg="">‹ ${st.v==='A'?'Torna al sondaggio':'Chiudi la scheda'}</button>
    <div class="capo" style="margin:0"><h4 class="tit">${esc(nomeR(id))}</h4><span class="sec muto">${r?.macroarea?{nord:'Nord',centro:'Centro',mezzogiorno:'Mezzogiorno'}[r.macroarea]||r.macroarea:''}</span></div>
    ${sg.length?`<div class="dispo">${sg.map(s=>`<div class="d"><span>${segnoMini(s.t)} ${esc(s.txt)}</span></div>`).join('')}</div>`:''}
    <dl class="dati"><dt>Disoccupazione</dt><dd>${r?.disoccupazione!=null?`<b>${num(r.disoccupazione)}%</b> <span class="muto">· trimestre prima</span>`:'—'}</dd><dt>Reddito</dt><dd>${r?.reddito!=null?`<b>${num(r.reddito,0)} €</b> <span class="muto">l’anno per elettore, prezzi del 2026</span>`:'—'}</dd><dt>Pericolosità</dt><dd>${per3}</dd></dl>
    <div class="grp"><span>Sondaggio${priv()?' privato':''}</span><span>campione ${num(x.campione,0)} · ±${num(m*100,1)}</span></div>${barreQuote(q,m)}
    ${gruppi}
    <div class="grp"><span>Seggi del Senato</span><span>${e?'voto di '+per(V().elezioni.at(-1).data):'nessun voto'}</span></div>
    ${e?`<div class="legenda">${e.senato.map((n,i)=>n?`<span class="sg"><i class="sw" style="background:${PCOL[partiti()[i].id]}"></i>${esc(partiti()[i].nome)} <b style="color:var(--ink)">${n}</b></span>`:'').join('')}</div><p class="min muto">Primo partito: ${esc(pnome(e.primo))}. Prima del premio e delle cessioni in coalizione.</p>`:V().elezioni.length?`<div class="ph"><b>Seggi del Senato e primo partito</b> · in 11g, PR delle esposizioni</div>`:`<p class="min muto">Dopo il primo voto.</p>`}
    <div class="grp"><span>Disposizioni territoriali</span><span>${dis.length}</span></div>
    ${dis.length?`<div class="dispo">${dis.map(d=>`<div class="d"><span>${esc(d.nome)}</span><b>${esc((d.gradini.find(g=>g.id===d.in_vigore)||{}).nome||d.in_vigore)}</b><span class="m">${esc(d.legge)}${d.in_arrivo.length?' · in arrivo: '+d.in_arrivo.map(a=>esc((d.gradini.find(g=>g.id===a.gradino)||{}).nome||a.gradino)+' dal '+a.data.anno).join(', '):''} · <button class="link" style="font-size:inherit">in Aula ›</button></span></div>`).join('')}</div>`:`<p class="min muto">Nessuna: qui valgono solo le leggi nazionali.</p>`}`;
}
function elettori(id){
  const [c,f]=st.gr.split('|'), l=(S().campione||{})[`${id}|${c}|${f}`];
  if(!l) return `<div class="ph">Elettori campione non generati per questo stato</div>`;
  return `<div class="elettori">${l.map(e=>`<div class="e"><span class="tit" style="font-size:var(--c-riq);text-align:center">${e.eta}</span><span><b>${esc(e.nome)}</b> <span class="vt">· ${e.voto?'vota '+esc(pnome(e.voto)):'non vota'}</span></span><span class="mt">${e.voto?'Perché: '+(MOT[e.motivo]||e.motivo):(MOT[e.motivo]?'Non va a votare: '+MOT[e.motivo]:'Non va a votare')} · si colloca a ${e.posizione} su 7</span></div>`).join('')}
    <p class="min muto">Inventati, ricavati dal sondaggio: una faccia ai numeri, non lo stato vero.</p></div>`;
}

// ============ le tre forme ============
const H = () => +st.fin===1440 ? 900 : 800;
function capo(t,extra=''){ return `<div class="capo"><h3 class="tit">${t}</h3><span class="sec muto">${extra}</span></div>`; }
function lato(){ if(st.inc) return dettaglioIncrocio(); return st.sel ? scheda(st.sel) : sondaggioLato(); }
function formaA(){
  const h=H()-104-118;
  return `<div>${livelli()}<div class="atlante" style="margin-top:8px">${mappa(h)}<div style="display:grid;gap:8px">${lista()}${legenda()}</div></div></div><aside class="lato">${lato()}</aside>`;

      <div class="grp"><span>Incroci</span></div>${incroci('condizioni',true)}${incroci('fasce',true)}</section>
    <section>${livelli()}<div style="display:flex;justify-content:center">${mappa(h)}</div>${legenda()}${lista(true)}</section></div>

}
const SCHEDE=[['mappa','La mappa'],['sondaggio','Il sondaggio'],['incroci','Gli incroci']];
function formaC(){
  const tabs=`<div class="schede">${SCHEDE.map(([k,t])=>`<button class="${st.scheda===k?'qui':''}" data-scheda="${k}">${t}</button>`).join('')}</div>`;

}

// ============ il selettore dentro le altre sezioni (141) ============

    return `<div class="altrove">${capo('Aula e calendario','ospite: forma D del ticket 19')}<div class="finta">Calendario, schede e righe delle disposizioni: com’erano.</div></div>

      <div class="sec">${[...P].map(r=>esc(nomeR(r))).join(', ')}.<p class="min muto" style="margin-top:6px">A tratteggio il perimetro; la mappa qui non si sceglie, si legge. Nessun livello sotto.</p></div></div></aside>`; }

      <aside class="lato"><span class="occ">Dirotta · ${esc(ag.nome||'')}</span><h4 class="tit">Scegli la regione</h4>

      <div style="display:grid;gap:6px;align-content:start"><p class="sec">Il ministro ha scelto <b>${esc(nomeR(cur))}</b>: «${esc(ag.motivo||'')}».</p>
      ${sc!==cur?`<p class="sec">Verso <b>${esc(nomeR(sc))}</b>. Costo in soddisfazione: <span class="ph" style="padding:0 4px">costo_dirotta · in 11g</span></p><button class="btn pieno" style="justify-self:start">Dirotta verso ${esc(nomeR(sc))}</button>`:`<p class="min muto">Un clic su un’altra regione, o le frecce: la carta mostra dove va.</p>`}

}

// ============ cornice ============
function caselle(pos,soglia=3,n=10){ const inp=pos<=soglia;
  return `<span class="cas ${inp?'inp':''}">${Array.from({length:n},(_,i)=>`<i class="${[i===soglia-1?'sog':'', i<pos?'on':''].join(' ')}"></i>`).join('')}</span>`; }
function tracciati(){
  const v=V(), c=sulVoto(media())[pIdx('giocatore')]*100, co=coal(), sg=k=>v.seggi.filter(s=>co.includes(s.partito)).reduce((a,s)=>a+s[k],0), m=[sg('camera')-201, sg('senato')-101];
  const t=[['Consenso', num(c)+'%', clamp(Math.round((c-25)/5),0,10)],['Maggioranza C / S', v.turno===0?'—':m.map(x=>(x>0?'+':x<0?'−':'')+Math.abs(x)).join(' / '), v.turno===0?0:clamp(Math.round((Math.min(...m)+9)/3),0,10)],['Conti · spread', num(v.spread_pb,0), clamp(Math.round((500-v.spread_pb)/50),0,10)]];
  return `<div class="trks">${t.map(([k,val,pos])=>`<div class="trk"><span class="k">${k}</span>${caselle(pos)}<span class="v">${val}</span></div>`).join('')}</div>`;
}
const SEZ = [['prima','Prima pagina'],['cruscotto','Cruscotto'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function cornice(){
  const v=V(), b={}, qui={paese:'paese',dirotta:'governo',campagna:'campagna',perimetro:'aula'}[st.ctx];
  if(v.fase==='sciolte'||v.turno===0){ b.prima='Turno zero: non c’è un turno prima'; b.aula='Camere sciolte: niente aula fino al voto'; b.registro='Turno zero: nessun turno passato'; }
  if(!v.governa) b.governo='Non governi: nessun ministro tuo';
  if(!(v.bilancio.presentabile && v.governa)) b.bilancio='La legge di bilancio si presenta in ottobre-dicembre';
  if(st.ctx!=='campagna') b.campagna='Si fa campagna solo nel turno prima del voto';
  delete b[qui];
  const stato = v.turno===0 ? 'Turno zero · Camere sciolte' : v.crisi ? 'Crisi di governo' : v.governa ? 'Al governo' : 'All’opposizione';
  const cassa = st.comprato[st.stato]?S().cassa_dopo:S().cassa_prima;
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino solo-ord">Il Pungolo</span><span class="chi"><b>${stato}</b><br>${per(v.data)} · turno ${v.turno}<br>Partito del giocatore</span></div>${tracciati()}
    <div class="c-dx"><button class="btn pieno">Chiudi il turno ›</button>${cassa!=null?`<span class="def">cassa ${euro(cassa)}</span>`:''}</div></div>
    <nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}">${t}</button>` : `<button class="${k===qui?'qui':''}" ${k===qui?'aria-current="page"':''}>${t}</button>`).join('')}
    <span class="fuori"><button>Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav></header>`;
}

// ============ resa ============
function render(){
  if(!D.stati[st.stato]) st.stato='governo';
  if(livSpento(st.liv)) st.liv='consenso';
  const W=+st.fin, Hh=H(), z=Math.min(+st.scala, W/1024), lw=W/z, lh=Hh/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const v=V(), ge=v.eventi.find(e=>e.tono==='grave');
  const banda = v.crisi ? `<div class="banda">Crisi di governo: solo ordinaria amministrazione.</div>` : ge ? `<div class="banda">${esc(ge.nome)}${ge.regione?' · '+esc(ge.regione):''}</div>` : '';
  const corpo = `<main class="corpo">${st.ctx!=='paese'?altrove():st.v==='B'?formaB():st.v==='C'?formaC():formaA()}</main>`;
  scr.style.width=W+'px'; scr.style.height=Hh+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${banda?'auto ':''}minmax(0,1fr)">${cornice()}${banda}${corpo}</div>`;
  document.getElementById('lab').textContent = st.ctx==='paese' ? FORME[st.v] : 'selettore · '+st.ctx;
  document.getElementById('stati').innerHTML = Object.keys(D.stati).map(k=>`<button data-v="${k}">${STATI[k]||k}</button>`).join('');
  document.querySelectorAll('#proto .seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[sg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/Hh)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.corpo'), scorre = c && c.scrollHeight>c.clientHeight+1, l=r.querySelector('.lato'), ls = l && l.getBoundingClientRect().bottom>c.getBoundingClientRect().bottom+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'il corpo scorre':'', ls?'il lato scorre':''].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else if(b.id==='azzera'){ st.comprato={}; st.rif=null; }
  else { const k=b.parentElement.dataset.k; st[k]=b.dataset.v; if(k==='stato'||k==='ctx'){ st.sel=null; st.rif=null; st.gr=null; st.inc=null; st.scelta=null; } }
  render();
});
function scegli(id){ if(st.ctx==='paese'){ st.sel = id===st.sel ? null : id; st.gr=null; st.inc=null; } else if(st.ctx!=='perimetro') st.scelta=id; render();
  const el=scr.querySelector(`path[data-reg="${id}"]`); if(el) el.focus({preventScroll:true}); }
scr.addEventListener('click',e=>{
  const t=e.target, rg=t.closest('[data-reg]'), lv=t.closest('[data-liv]'), gr=t.closest('[data-gr]'), od=t.closest('[data-ord]'), sch=t.closest('[data-scheda]'), inc=t.closest('[data-inc]'), s=t.closest('[data-sel]');
  if(t.closest('[data-compra]')){ st.comprato[st.stato]=true; st.rif=null; }
  else if(t.closest('[data-ricompra]')){ st.rif=S().rifiuto_ripetuto; }
  else if(rg){ if(rg.dataset.reg) return scegli(rg.dataset.reg); st.sel=null; st.gr=null; }
  else if(lv){ st.liv=lv.dataset.liv; }
  else if(gr){ st.gr = st.gr===gr.dataset.gr ? null : gr.dataset.gr; }
  else if(od){ st.ord=od.dataset.ord; }
  else if(sch){ st.scheda=sch.dataset.scheda; st.inc=null; }
  else if(inc){ st.inc=null; }
  else if(s && s.dataset.sel.startsWith('inc:')){ const k=s.dataset.sel.slice(4); st.inc = st.inc===k?null:k; st.sel=null; }
  else return;
  render();
});
scr.addEventListener('change',e=>{ if(e.target.matches('[data-part]')) st.part=e.target.value; if(e.target.matches('[data-per]')) st.per=e.target.value; render(); });
// Frecce dentro il radiogroup della mappa: avanti e indietro nell'ordine della lista.
scr.addEventListener('keydown',e=>{
  const p=e.target.closest('path[data-reg]'); if(!p) return;
  const ids=REG(), i=ids.indexOf(p.dataset.reg);
  if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){ e.preventDefault(); e.stopPropagation(); const j=(i+(/Right|Down/.test(e.key)?1:ids.length-1))%ids.length;
    scr.querySelectorAll('path[data-reg]').forEach(x=>x.tabIndex=-1); const n=scr.querySelector(`path[data-reg="${ids[j]}"]`); n.tabIndex=0; n.focus();
    scr.querySelector('.fuoco')?.remove(); n.ownerSVGElement.insertAdjacentHTML('beforeend',`<use href="#r-${ids[j]}" class="fuoco"/>`); }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); scegli(p.dataset.reg); }
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.closest?.('[role=radiogroup]')) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
