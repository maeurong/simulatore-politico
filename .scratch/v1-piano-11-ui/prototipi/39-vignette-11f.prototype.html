<!doctype html>
<!--
  PROTOTIPO USA E GETTA — vignette della Prima pagina del «Pungolo», fetta 11f, Task 11 (17/11/2026).
  Domanda: per ciascuna delle cinque scene (Aula, Giuramento, Emergenza, Lettera, Cassa) quale delle tre varianti
  A/B/C va rifinita nel Task 12? Mario sceglie una variante per scena.
  Riquadro: quello della testa del prototipo 16 (figure.vignetta: bordo 2 px, 6×8 di margine, svg 300×150 al più
  150 px d'altezza, didascalia 13 px in grassetto), larghezza della colonna della testa a 1280 px (30%, 370 px).
  Metodo: il kit delle caricature dell'app (app/src/lib/caricature/kit.ts, poligoni del pennino già calcolati),
  profilo verso destra, figura campita di carta; le linee della scena col pennino a punta piatta del prototipo 32
  (punta lunga L, inclinata di 35°). Solo --ink e --carta; il retino è quello del 16, sullo sfondo e basta.
  Lista nera (spec:343): niente capelli, occhiali, barbe, baffi, collane, fiocchi. Bersaglio il palazzo: nessuna
  vittima disegnata, nell'Emergenza nessuna persona.
  Didascalie: dal file dei testi di Mario (docs/superpowers/plans/2026-11-17-piano-11f-testi.md), tali e quali.
  Font: Atkinson Hyperlegible Next e Fraunces dell'app (app/static/fonts, OFL), in locale; nei disegni nessun testo.
  ?prova = le 15 vignette nude a 300×150 e a 150×75, col controllo dei margini (getBBox, almeno 4 unità dal bordo).
  Non è codice di produzione. Buttare dopo il verdetto.
-->

<style>

@font-face{font-family:'Fraunces';src:url('../../../app/static/fonts/fraunces/Fraunces-Variable.ttf') format('truetype');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:root{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --tit:'Fraunces',Georgia,serif; --txt:'Atkinson Hyperlegible Next',sans-serif;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --forte:2px solid var(--ink); --filo:1px solid var(--grigio);
}
body{background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);padding:24px 32px 40px}
h1{font:800 30px/1.1 var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1}
.nota{color:var(--grigio);font-size:var(--c-sec);max-width:120ch;margin:6px 0 18px}
.scena{border-top:3px double var(--ink);padding:10px 0 16px}
.scena h2{font:700 23px/1.1 var(--tit);font-variation-settings:"SOFT" 100,"WONK" 1;display:flex;gap:12px;align-items:baseline}
.scena h2 small{font:400 var(--c-min)/1.3 var(--txt);color:var(--grigio)}
.tre{display:grid;grid-template-columns:repeat(3,370px);gap:28px;margin-top:8px}
.var h3{font-size:var(--c-sec);font-weight:700;margin-bottom:2px}
.var p{font-size:var(--c-min);color:var(--grigio);min-height:2.6em;margin-bottom:6px}
/* il riquadro della testa, dal prototipo 16 (righe 218-220) */
.vignetta{border:var(--forte);padding:6px 8px;display:grid;gap:4px;align-content:start}
.vignetta svg{width:100%;height:auto;max-height:150px}
.vignetta figcaption{font-size:var(--c-sec);text-align:center;font-weight:700}
.tipi{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tipi button{font-size:11px;border:1px solid var(--grigio);padding:0 5px;color:var(--grigio)}
.tipi button.qui{border-color:var(--ink);background:var(--ink);color:var(--carta)}
/* dentro i disegni */
.v .i{fill:var(--ink)} .v .c{fill:var(--carta)}
.v .filo,.v .fine{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.v .fine{stroke-width:1.5}
.v .bordo{fill:var(--carta);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.v .coll{stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
/* ?prova */
.prova{display:grid;grid-template-columns:repeat(5,auto);gap:14px 18px;justify-content:start;margin:8px 0 20px}
.prova figure{display:grid;gap:3px;font-size:11px;color:var(--grigio)}
.prova svg{outline:1px solid var(--ink)}
.esito{font:12px/1.4 ui-monospace,monospace;white-space:pre;background:var(--ink);color:var(--carta);padding:8px 10px;display:inline-block}
</style>

// una figura del kit a mezzo busto, nella tela 64×64 portata a (x,y) e scalata di s; rot ruota la testa sul collo
// (negativo = guarda in alto), come la posa del prototipo 32; `dietro` sta sotto la figura, nelle coordinate del kit
function fig(x,y,s,l,{rot=0,dietro=''}={}){
  const n=NASI[l.n], m=MENTI[l.m], f=FRONTI[l.f], u=NUCHE[l.u];

// ======================= il pennino della scena: dal prototipo 32 (pennello), una sottotraccia alla volta =======================
let PEN;
const CACHE = new Map();
function punta(d,L,a,coda,passo=.6){
  if(!PEN){ const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('style','position:absolute;width:0;height:0;visibility:hidden'); PEN=document.createElementNS(s.namespaceURI,'path'); s.appendChild(PEN); document.body.appendChild(s); }
  PEN.setAttribute('d',d);
  const tot=PEN.getTotalLength(), n=Math.max(8,Math.ceil(tot/passo)), nx=Math.cos(a*Math.PI/180)*L/2, ny=-Math.sin(a*Math.PI/180)*L/2;
  const pt=Array.from({length:n+1},(_,i)=>{ const t=i/n, q=PEN.getPointAtLength(t*tot), s=Math.max(.3,Math.min(1,t/coda,(1-t)/coda)); return [q.x,q.y,nx*s,ny*s]; });
  const r=v=>+v.toFixed(1); let out='';
  for(let i=0;i<n;i++){
    const [x0,y0,a0,b0]=pt[i], [x1,y1,a1,b1]=pt[i+1];
    let q=[[x0-a0,y0-b0],[x0+a0,y0+b0],[x1+a1,y1+b1],[x1-a1,y1-b1]];
    if(q.reduce((s,[x,y],j)=>{ const [X,Y]=q[(j+1)%4]; return s+x*Y-X*y; },0)<0) q.reverse();
    out+='M'+q.map(([x,y])=>`${r(x)} ${r(y)}`).join('L')+'Z';
  }
  return out;
}
// pen: tratto a pennino (poligono + filo di centro); campo: forma campita di carta col suo contorno a pennino
function pen(d,L=4,coda=.14,a=35){
  const k=`${d}|${L}|${coda}|${a}`;
  if(!CACHE.has(k)) CACHE.set(k, d.trim().split(/(?=M)/).map(s=>punta(s,L,a,/Z\s*$/i.test(s)?.04:coda)).join(''));
  return `<path class="i" d="${CACHE.get(k)}"/><path class="filo" d="${d}"/>`;
}
const campo = (d,L=4) => `<path class="c" d="${d}"/>${pen(d,L)}`;
const fine = (d,w=1.5,extra='') => `<path class="fine" style="stroke-width:${w}" ${extra} d="${d}"/>`;
const R = (x,y,w,h) => `M${x} ${y}L${x+w} ${y}L${x+w} ${y+h}L${x} ${y+h}Z`;
const C = (cx,cy,r) => `M${cx-r} ${cy}A${r} ${r} 0 1 0 ${cx+r} ${cy}A${r} ${r} 0 1 0 ${cx-r} ${cy}Z`;
const suolo = (a=12,b=288,y=132) => pen(`M${a} ${y}L${b} ${y}`,3.2);
const banco = (x,y,w,h) => campo(R(x,y,w,h),4.2)+fine(`M${x+6} ${y+7}L${x+w-6} ${y+7}`,1.2);

function aulaA(){ // l'emiciclo dei cartellini, il ministro al banco col pallottoliere
  const cx=210, by=128, arco=r=>`M${cx-r} ${by}A${r} ${r} 0 0 1 ${cx+r} ${by}`;
  const cart=(r,deg)=>{ const t=deg*Math.PI/180, x=+(cx-r*Math.cos(t)).toFixed(1), y=+(by-r*Math.sin(t)).toFixed(1);

  const pal = campo(R(96,80,28,26),3)+[87,94,101].map(y=>fine(`M97 ${y}L123 ${y}`,1.1)).join('')
    +[[101,87],[105,87],[118,87],[100,94],[111,94],[115,94],[119,94],[104,101],[108,101],[119,101]].map(([x,y])=>`<circle class="bordo" style="stroke-width:1.2" cx="${x}" cy="${y}" r="2.1"/>`).join('');
  return pen(arco(76)+arco(56)+arco(36),3.6)+pen(`M130 ${by}L290 ${by}`,3)+pen(`M198 ${by}L198 116L222 116L222 ${by}`,2.6)
    +[[76,24],[76,48],[76,79],[76,118],[76,146],[56,38],[56,97],[56,141],[36,62],[36,120]].map(([r,d])=>cart(r,d)).join('')
    +fig(22,46,1,F.a)+pal+banco(10,106,116,26);
}

// ======================= le schede =======================
const DID = { // didascalie dal file dei testi di Mario, tali e quali
  sfiducia_approvata:'«Ma non avevamo contato?»', bilancio_approvato:'«Torna tutto. Basta non fare la somma»',
  legge_respinta:'«Bellissima legge. Peccato per il voto»', sfiducia_presentata:'«Una mozione? Niente pausa caffè, oggi»',
  legge_approvata:'«Passata. Adesso qualcuno la legga»', governo_formato:'«Lo giuro. Per i dettagli, c’è il gabinetto»',
  'evento_risolto|emergenza':'«Gli stivali li restituisco lunedì»', 'evento_nato|emergenza':'«Qualcuno ha visto il fondo di riserva?»',
  ultimatum_posto:'«Ci scrivono gli alleati. Di solito telefonano»', minaccia_di_dimissioni:'«Firmo, ma a matita»',
  minaccia_di_scissione:'«Ce ne andiamo. Appena troviamo il nome»', ministro_esce:'«Le chiavi le lascio. L’auto blu la riporto domani»',
  'evento_risolto|situazione':'«Problema risolto. Lo dice la ricevuta»', reddito_deluso:'«La ripresa c’è. È solo timida»',
};
const SCENE = [
  { nome:'Aula', tipi:['sfiducia_approvata','bilancio_approvato','legge_respinta','sfiducia_presentata','legge_approvata'], v:[
    ['A','Emiciclo','La sala larga: i banchi coi cartellini alzati, il ministro al banco del governo col pallottoliere.',aulaA,'sfiducia_approvata'],
    ['B','Tabellone','I numeri come disegno: il tabellone dei voti mezzo pieno e mezzo vuoto, il ministro che alza la testa.',aulaB,'bilancio_approvato'],
    ['C','La pila','L’oggetto: il testo della legge in una pila più alta di chi l’ha votata, con la scala per leggerla.',aulaC,'legge_approvata']]},
  { nome:'Giuramento', tipi:['governo_formato'], v:[
    ['A','Mano alzata','Il rito: un ministro solo, mano alzata davanti al libro, sotto il festone.',giurA,'governo_formato'],
    ['B','Il rotolo','La formula: un rotolo che scende dal leggio e attraversa la sala.',giurB,'governo_formato'],
    ['C','Foto di rito','La squadra: tre ministri in fila, girati verso il fotografo col lampo.',giurC,'governo_formato']]},
  { nome:'Emergenza', tipi:['evento_risolto|emergenza','evento_nato|emergenza'], v:[
    ['A','Stivali in vetrina','Il ministro e gli stivali nuovi, mai usati, sotto la campana di vetro.',emeA,'evento_risolto|emergenza'],
    ['B','Ombrello sul palazzo','Il palazzo sotto la sua nuvola, con l’ombrello aperto sul frontone. Nessuna figura.',emeB,'evento_nato|emergenza'],
    ['C','Argine di faldoni','Un argine di faldoni col timbro in cima; di là l’acqua e la barchetta di carta. Nessuna figura.',emeC,'evento_nato|emergenza']]},
  { nome:'Lettera', tipi:['ultimatum_posto','minaccia_di_dimissioni','minaccia_di_scissione','ministro_esce'], v:[
    ['A','La busta','Il ministro davanti alla busta grande come la scrivania; accanto, il telefono muto.',letA,'ultimatum_posto'],
    ['B','A matita','Il foglio, la firma, la matita gigante e la gomma già pronta. Nessuna figura.',letB,'minaccia_di_dimissioni'],
    ['C','La porta','La porta socchiusa: targa svitata, chiave al chiodo, scatolone sulla soglia. Nessuna figura.',letC,'ministro_esce']]},
  { nome:'Cassa', tipi:['evento_risolto|situazione','reddito_deluso'], v:[
    ['A','Lo scontrino','Il registratore di cassa e uno scontrino che non finisce più, giù dal bancone.',casA,'evento_risolto|situazione'],
    ['B','La lente','Il grafico piatto con una gobbetta in fondo, e la lente che la ingrandisce.',casB,'reddito_deluso'],
    ['C','La cassaforte','La cassaforte aperta: una moneta sul cuscino e la ragnatela. Nessuna figura.',casC,'evento_risolto|situazione']]},
];
const tela = (fn,w,h) => `<svg class="v" viewBox="0 0 300 150" ${w?`width="${w}" height="${h}"`:''} aria-hidden="true"><rect width="300" height="150" fill="url(#ret)" opacity=".35"/><g class="disegno">${fn()}</g></svg>`;
const scelta = {};
function schede(){
  return `<h1>Vignette della 11f · cinque scene, tre varianti</h1>
  <p class="nota">Ogni vignetta sta nel riquadro della testa del prototipo 16, alla larghezza della colonna a 1280 px. Sotto, i tipi di voce che la scena serve: cliccali per provare le altre didascalie. Si sceglie una variante per scena; il Task 12 rifinisce quella. Le prove di resa a 300×150 e a metà: <a href="?prova">?prova</a>.</p>
  ${SCENE.map((s,i)=>`<section class="scena"><h2>${s.nome}<small>${s.tipi.map(t=>t.replace('|',' · ')).join(', ')}</small></h2><div class="tre">${s.v.map(([k,n,desc,fn,t0],j)=>{ const t=scelta[`${i}${j}`]||t0;
    return `<div class="var"><h3>${k} · ${n}</h3><p>${desc}</p><figure class="vignetta">${tela(fn)}<figcaption>${DID[t]}</figcaption></figure>
      <div class="tipi">${s.tipi.map(x=>`<button class="${x===t?'qui':''}" data-k="${i}${j}" data-t="${x}">${x.replace('|',' · ')}</button>`).join('')}</div></div>`; }).join('')}</div></section>`).join('')}`;
}
function prova(){
  const tutte = SCENE.flatMap(s=>s.v.map(([k,n,,fn])=>[`${s.nome} ${k} · ${n}`,fn]));
  return `<h1>Prove di resa · 300×150 e 150×75</h1><p class="nota">Il filo nero attorno a ogni tela è il bordo del riquadro. Sotto, il controllo: riquadro di ingombro del disegno (getBBox, più mezzo tratto) contro un margine di 4 unità.</p>
  <h2 style="font:700 18px var(--tit);margin-top:10px">300×150</h2><div class="prova">${tutte.map(([n,fn])=>`<figure>${tela(fn,300,150)}<figcaption>${n}</figcaption></figure>`).join('')}</div>
  <h2 style="font:700 18px var(--tit)">150×75</h2><div class="prova">${tutte.map(([n,fn])=>`<figure>${tela(fn,150,75)}<figcaption>${n}</figcaption></figure>`).join('')}</div>
  <div class="esito" id="esito"></div>`;
}
function controlla(){
  const nomi = SCENE.flatMap(s=>s.v.map(([k,n])=>`${s.nome} ${k}`));
  const g=[...document.querySelectorAll('.prova svg[width="300"] .disegno')];
  const righe=g.map((el,i)=>{ const b=el.getBBox(), m=+Math.min(b.x, b.y, 300-b.x-b.width, 150-b.y-b.height).toFixed(1)-1;
    return `${(m>=4?'ok  ':'NO  ')}${nomi[i].padEnd(14)} x ${b.x.toFixed(1)}–${(b.x+b.width).toFixed(1)}  y ${b.y.toFixed(1)}–${(b.y+b.height).toFixed(1)}  margine min ${m.toFixed(1)}`; });
  document.getElementById('esito').textContent = righe.join('\n') + `\n${righe.filter(r=>r.startsWith('ok')).length}/${righe.length} dentro il margine`;
}
const app=document.getElementById('app');
function render(){ app.innerHTML = location.search.includes('prova') ? prova() : schede(); if(location.search.includes('prova')) controlla(); }
app.addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(!b) return; scelta[b.dataset.k]=b.dataset.t; render(); });
render();
</script>
