<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Schema dello Stato» (29), mappa v1-piano-11-ui.
  Domanda: com'è fatto lo schema dello Stato, la vista secondaria a pagina intera (storia 157)? Chi tocca cosa nel
  turno, come rete con le note a biro; i tondi numerati che rimandano alle voci della prima pagina; da quali campi
  della Vista si compone, senza chiederne di nuovi; cosa mostra all'opposizione e al turno zero; il tono grave.
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Tavola a rete       — la rete del prototipo vincolante: Presidente del Consiglio al centro, dieci dicasteri in
       cerchio, Parlamento a sinistra, partiti sotto, Paese a destra; etichette a biro sui fili, tondi sui fili
    B  Tavola per poteri   — quattro colonne fisse (Partiti · Parlamento · Governo · Paese e mercati), una riga per
       soggetto, i fili da riga a riga col solo tondo; il testo sta nella riga e nel dettaglio a lato
    C  Indice dei fili     — nessuna rete a pagina: l'elenco dei fili raggruppato per chi tocca, con la frase intera;
       la rete piccola nel dettaglio a lato accende il filo scelto
    D  Mappa delle forze   — nata dal giro con Mario: sette blocchi fissi, i fili raggruppati per coppia di blocchi in
       una freccia col verso di chi muove e l'etichetta scritta; il dettaglio a lato la riapre filo per filo
  Stati, ?stato=: ordinario (Vista 04) · opposizione (28 «fine», turno 19) · grave (Vista 08) · zero (Vista 01).
  ?fili=tutti|notizie  ?bat=1|0 (battute a biro, solo A)  ?fin=1280|1440  ?scala=1|1.25
  Dati: le Viste giocate, ridotte ai campi che lo schema legge (ministeri con agenda, cantieri, proposta e minaccia;
  alleati e alleati_avversari; calendario ed esiti del trimestre chiuso; eventi; situazioni accese; spread_pb; seggi;
  mosse; posto_riservato; fase). Nessun campo nuovo. Le voci della prima pagina: quelle scritte a mano nel prototipo
  16 (stati «ordinario» e «fermata», che sono gli stessi turni), più quelle del tono grave scritte qui allo stesso
  modo dalla Vista prima e dopo la chiusura del turno 6 (viste/25-registro.json). L'esito lo porta la PR 1 del piano
  di core «esito e Vista completa». Battute a biro: BOZZA, una per tipo di filo.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A), cornice dal 28. Non è codice di produzione.
  Buttare dopo il verdetto.
  VERDETTO (Mario, 12/11/2026), nel ticket 29: B · Tavola per poteri; tutti i fili col filtro «Solo quelli in prima
  pagina»; battute a biro sì; al turno zero si apre col governo uscente e le Camere sciolte. Lo schema risponde a «chi
  muove cosa ora». Restano aperte, da risolvere dentro B nella fetta, le tre note di Mario: fili muti, groviglio sul
  Presidente, verso non chiaro. Si apre su B: le altre restano dalla barra in basso.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo schema dello Stato · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.dl.crit{background:var(--rosso);color:var(--carta);padding:0 5px}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.fascia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fascia .cas{--cw:12px;--ch:8px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-top:var(--filo);font-size:var(--c-sec)}
.voce:first-child{border-top:0}
.voce small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.voce small::before{content:"perché: ";font-style:italic}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:center}
.dati dt{color:var(--grigio)}

/* cornice A · Gerenza */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez);margin-bottom:4px}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:2px}
.capo h3{margin:0}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:170px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
/* i valori all'opposizione (+140 / +72) sono più larghi di quelli al governo: cornice più stretta */
.c1 .trk{padding:0 8px}
.c1 .trk .k{letter-spacing:.04em}
.c1 .trk .cas{--cw:8px}
.lato .tab th,.lato .tab td{padding:3px 4px;letter-spacing:0}
/* ===== aggiunte del 29 ===== */
.prova{display:inline-block;background:#ff8ad8;color:#111;font:700 11px/1.4 system-ui,sans-serif;padding:0 5px;letter-spacing:.03em;vertical-align:.1em;white-space:nowrap}
.somm .fuori button.qui{font-weight:700;text-decoration:none;background:var(--ink);color:var(--carta);padding:1px 8px}
.corpo.sch{grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:auto minmax(0,1fr);overflow:hidden;align-content:stretch}
.corpo.sch.lista{grid-template-columns:minmax(0,1fr) var(--lato)}
.st-testa{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end;gap:16px;border-bottom:var(--doppio);padding-bottom:5px}
.st-testa .tavola{font-size:var(--c-pag);display:block}
.st-testa .sub{font-size:var(--c-sec);color:var(--grigio)}
.st-testa .ctr{display:flex;gap:6px;align-items:center;flex:none}
.tav{min-width:0;min-height:0;position:relative}
.tav svg{display:block;position:absolute;left:0;top:0}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start;overflow:hidden auto;min-height:0}
.lato h4{font-size:var(--c-riq)}
.leg{display:grid;grid-template-columns:34px 1fr;gap:3px 8px;font-size:var(--c-min);align-items:center}
.leg svg{width:34px;height:14px}
.voci{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:var(--c-sec)}
.voci li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;cursor:pointer}
.voci li.no{cursor:default;color:var(--grigio)}
.voci li.no .tn{border-style:dashed;border-color:var(--grigio);color:var(--grigio)}
.voci li.on{background:var(--velo)}
.tn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--biro);color:var(--biro);font-size:var(--c-min);font-weight:700;background:var(--carta)}
.tn.m{border-color:var(--rosso);color:var(--rosso)}
.det{display:grid;gap:6px}
.det .cosa{font-size:var(--c-lead);font-weight:700;line-height:1.25}
.det .da{font-size:var(--c-sec)}
.fonte{font-size:var(--c-min);color:var(--grigio);font-family:ui-monospace,Menlo,monospace}
.fl{display:grid;gap:0}
.fl button{display:grid;grid-template-columns:auto 1fr;gap:6px;text-align:left;padding:4px 0;border-top:var(--filo);font-size:var(--c-sec)}
.fl button:hover{background:var(--velo)}
.fl .ver{font-weight:700;white-space:nowrap}
/* svg */
.nd{cursor:pointer}
.nd text{font-family:var(--txt);fill:var(--ink)}
.nd .b{fill:var(--carta);stroke:var(--ink);stroke-width:1.5}
.nd.ist .b{fill:var(--ink)} .nd.ist text{fill:var(--carta)}
.nd.pdc .b{fill:var(--ink)} .nd.pdc text{fill:var(--carta)}
.nd.par .b{stroke:var(--grigio);stroke-dasharray:0}
.nd.par.gov .b{stroke:var(--ink);stroke-width:2}
.nd.par.tuo .b{stroke:var(--rosso);stroke-width:2}
.nd.pae .b{fill:var(--velo);stroke:var(--grigio)}
.nd.sit .b{stroke:var(--rosso);stroke-width:2}
.nd.spento .b{stroke-dasharray:4 3;stroke:var(--grigio)} .nd.spento text{fill:var(--grigio)}
.nd.ist.spento .b{fill:var(--carta)}
.nd .s{font-size:12px;fill:var(--grigio)}
.nd.ist .s,.nd.pdc .s{fill:var(--carta);opacity:.85}
.fi{fill:none;stroke:var(--biro);cursor:pointer}
.fi.m{stroke:var(--rosso)}
.fi.r{stroke-dasharray:7 5}
.fi.c{stroke-dasharray:2 4;stroke-linecap:round}
.fi-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.et{font-family:var(--txt);font-size:13px;font-style:italic;fill:var(--biro);paint-order:stroke;stroke:var(--carta);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.et.m{fill:var(--rosso)}
.et.bt{font-size:12px;fill:var(--biro)}
.g .et{font-style:normal}
.tnd circle{fill:var(--carta);stroke:var(--biro);stroke-width:1.5}
.tnd.m circle{stroke:var(--rosso)}
.tnd text{font-family:var(--txt);font-size:11px;font-weight:700;fill:var(--biro);text-anchor:middle}
.tnd.m text{fill:var(--rosso)}
.blk.spento{opacity:.35}
.blk,.mb{cursor:pointer}
.fuoco .nd,.fuoco .fi,.fuoco .et,.fuoco .tnd{opacity:.16}
.fuoco .on{opacity:1!important}
.fuoco .fi.on{stroke-width:3.5}
.col-t{font-family:var(--txt);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;fill:var(--grigio)}
.col-l{stroke:var(--grigio);stroke-width:1}
/* C · indice */
.idx{overflow:hidden auto;min-height:0;padding-right:4px}
.idx .grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:10px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between}
.idx .grp:first-child{margin-top:0}
.ri{display:grid;grid-template-columns:24px minmax(150px,.9fr) 16px minmax(0,1.6fr) auto;gap:2px 8px;align-items:center;padding:5px 4px;border-bottom:var(--filo);cursor:pointer;font-size:var(--c-sec)}
.ri:hover{background:var(--velo)}
.ri.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ri .chi{white-space:normal;color:var(--ink);font-weight:700;font-size:var(--c-sec)}
.ri .chi small{display:block;font-weight:400;color:var(--grigio);font-size:var(--c-min)}
.ri .ar{color:var(--biro);font-weight:700}
.ri .ar.m{color:var(--rosso)}
.ri .q{font-size:var(--c-min);color:var(--grigio);white-space:nowrap}
.ri .r11{font-size:var(--c-min)}
.ri .cs{line-height:1.25}
.ri .cs small{display:block;color:var(--grigio);font-size:var(--c-min)}
.vuota{border:1.5px dashed var(--grigio);color:var(--grigio);padding:10px 14px;font-size:var(--c-sec)}
</style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>
<div id="proto">
  <button id="prev" title="forma precedente (←)">‹</button><span class="lab" id="lab"></span><button id="next" title="forma successiva (→)">›</button>
  <span class="cap">stato</span><span class="seg" data-k="stato"><button data-v="ordinario">al governo</button><button data-v="opposizione">all’opposizione</button><button data-v="grave">tono grave</button><button data-v="zero">turno zero</button></span>
  <span class="cap">fili</span><span class="seg" data-k="fili"><button data-v="tutti">tutti</button><button data-v="notizie">in prima pagina</button></span>
  <span class="cap">battute</span><span class="seg" data-k="bat"><button data-v="1">sì</button><button data-v="0">no</button></span>
  <span class="cap">finestra</span><span class="seg" data-k="fin"><button data-v="1280">1280×800</button><button data-v="1440">1440×900</button></span>
  <span class="cap">scala</span><span class="seg" data-k="scala"><button data-v="1">1×</button><button data-v="1.25">1,25×</button></span>
  <span id="nota" style="color:#aaa"></span><span id="avv"></span>

//        q (quando), fonte (campo della Vista), sez (sezione dove si decide o si legge), bt (tipo di battuta)}
function modello(){
  const v=V(), N=new Map(), F=[];
  const nodo = (id,o) => { if(!N.has(id)) N.set(id,{id,...o}); return id; };
  const gu = guida();
  nodo('pdc',{k:'pdc', t:'Presidente del Consiglio', s: sciolte() ? `uscente · ${nomeP(gu)}` : v.governa ? 'tu' : `guida: ${nomeP(gu)}`});
  nodo('camera',{k:'ist', t:'Camera', s: sciolte() ? 'sciolta' : `${tot('camera')} seggi`, spento:sciolte()});
  nodo('senato',{k:'ist', t:'Senato', s: sciolte() ? 'sciolto' : `${tot('senato')} seggi`, spento:sciolte()});
  nodo('mer',{k:'ist', t:'Mercati e UE', s:`spread ${v.spread} pb`});
  for(const m of v.ministeri){
    const mi=m.ministro;
    nodo('d:'+m.dicastero,{k:'dic', t:DS[m.dicastero]||dic(m.dicastero), lungo:dic(m.dicastero),
      s: mi ? `${mi.nome.split(' ').slice(-1)[0]} · ${nomeP(mi.partito)}` : 'interim', m});
  }
  const par = id => nodo('p:'+id,{k:'par', t:nomeP(id).replace('Estrema ','Estr. ').replace('Lista dei Territori','Lista Territori'), lungo:nomeP(id), s: sciolte() ? 'in campagna' : `seggi ${seg(id,'camera')} / ${seg(id,'senato')}`, gov:governo().includes(id), tuo:id===PG});
  const gra = g => nodo('g:'+g,{k:'pae', t:v.grandezze[g]||g.replaceAll('_',' '), s:'grandezza'});
  const reg = r => nodo('r:'+r,{k:'pae', t:regN(r), s:'regione'});
  // maggioranza
  if(!sciolte()) for(const r of ['camera','senato']){ const mg=margine(r);
    F.push({id:'magg:'+r, da:'pdc', a:r, et:`maggioranza ${sgn(Math.round(mg))}`, cosa:`Il governo ha ${governo().reduce((a,id)=>a+seg(id,r),0)} seggi su ${tot(r)} ${r==='camera'?'alla Camera':'al Senato'}: margine ${sgn(Math.round(mg))}`,
      m:mg<3, fonte:'seggi, partiti[].al_governo', sez:'Aula'}); }
  else F.push({id:'sciolte', da:'pdc', a:'camera', et:'si vota a fine turno', cosa:'Le Camere sono sciolte: il governo resta per gli affari correnti fino al voto', fonte:'fase', sez:'Campagna'});
  // ministri
  for(const m of v.ministeri){
    const d='d:'+m.dicastero, mi=m.ministro, a=m.agenda;
    if(a){ const e=a.effetti[0], tgt = a.regione ? reg(a.regione) : e ? gra(e.grandezza) : null;
      if(tgt) F.push({id:'ag:'+m.dicastero, da:d, a:tgt, et: a.regione ? `${e?(e.migliora?'▲ ':'▼ '):''}${(v.grandezze[e?.grandezza]||'').toLowerCase()}`.trim() || 'agenda' : `${e.migliora?'▲':'▼'} ${e.ritardo?'fra '+e.ritardo+' turni':'subito'}`,
        cosa:`${a.nome}${a.regione?' in '+regN(a.regione):''}: ${a.effetti.map(x=>`${x.migliora?'migliora':'peggiora'} ${(v.grandezze[x.grandezza]||x.grandezza).toLowerCase()}${x.ritardo?`, fra ${x.ritardo} ${x.ritardo===1?'turno':'turni'}`:', subito'}`).join('; ')}. Costo ${euro(a.costo)}, ${a.stato}.`,
        m: e && !e.migliora, r: e && e.ritardo>0, q:a.stato, fonte:'ministeri[].agenda, atti[].effetti', sez:'Governo', bt: e?.ritardo>2?'rit':null}); }
    m.cantieri.forEach((c,i)=>{ const e=c.effetti[0], tgt = c.regione ? reg(c.regione) : e ? gra(e.grandezza) : null; if(!tgt) return;
      F.push({id:`cant:${m.dicastero}:${i}`, da:d, a:tgt, et:`cantiere, ${c.turni_mancanti} ${c.turni_mancanti===1?'turno':'turni'}`, cosa:`Cantiere «${c.nome}»${c.regione?' in '+regN(c.regione):''}: mancano ${c.turni_mancanti} ${c.turni_mancanti===1?'turno':'turni'}${e?`; poi ${e.migliora?'migliora':'peggiora'} ${(v.grandezze[e.grandezza]||e.grandezza).toLowerCase()}`:''}`,
        c:1, fonte:'ministeri[].cantieri', sez:'Governo'}); });
    if(m.proposta){ const p=m.proposta, resp = mi?.causa_principale==='proposta_respinta';
      F.push({id:'prop:'+m.dicastero, da:d, a:'pdc', et:`chiede ${euro(p.importo)}`, val:p.importo, cosa:`${mi?mi.nome:'Il ministero'} chiede ${euro(p.importo)} per «${p.nome}»: ${p.motivo}${resp?'. L’ultima proposta è stata respinta':''}`,
        m:resp, q:p.rinviata?'rinviata':'in sospeso', fonte:'ministeri[].proposta', sez:'Cruscotto', bt:'prop'}); }
    if(mi?.minaccia) F.push({id:'min:'+m.dicastero, da:d, a:'pdc', et:'minaccia le dimissioni', cosa:`${mi.nome} minaccia le dimissioni: soddisfazione ${num(mi.soddisfazione)}, ${causa(mi.causa_principale)}`, m:1, fonte:'ministeri[].ministro.minaccia', sez:'Governo', bt:'min'});
    if(m.dimissioni_chieste) F.push({id:'dim:'+m.dicastero, da:'pdc', a:d, et:'dimissioni chieste', cosa:`Hai chiesto le dimissioni di ${mi?.nome||'?'}`, m:1, fonte:'ministeri[].dimissioni_chieste', sez:'Governo'});
  }
  // alleati
  for(const a of v.alleati){ const last=a.variazioni.at(-1);
    F.push({id:'al:'+a.partito, da:par(a.partito), a:'pdc', et:`intesa ${Math.round(a.intesa)}${a.ultimatum?' · ultimatum':''}`,
      cosa:`${nomeP(a.partito)}: intesa ${num(a.intesa)}${a.ultimatum?`, in ultimatum: ${causa(a.causa_ultimatum)}`:''}${a.causa_principale?`; pesa di più ${causa(a.causa_principale)}`:''}${a.variazioni.length?`. Ultimo turno: ${a.variazioni.map(x=>`${causa(x.causa)} ${sgn(+x.delta.toFixed(1)).replace('.',',')}`).join(', ')}`:''}`,
      m: a.ultimatum || (last && last.delta<0), fonte:'alleati', sez:'Partiti', bt:'al'}); }
  for(const a of v.alleati_avversari) F.push({id:'al:'+a.partito, da:par(a.partito), a:'pdc', et: a.fascia, cosa:`${nomeP(a.partito)} con ${nomeP(gu)}: intesa ${a.fascia}${a.causa_ultimatum?`, ${causa(a.causa_ultimatum)}`:''}`, m:a.fascia==='ultimatum', fonte:'alleati_avversari', sez:'Cruscotto', bt:a.fascia==='ultimatum'?'al':null});
  // aula
  for(const c of v.calendario){
    const da = c.promotore ? par(c.promotore) : c.proponente ? 'd:'+c.proponente : c.forma==='bilancio' ? 'd:economia_finanze' : 'pdc';
    const fra = fraT(c.voto, v.data), f=c.forbice;
    F.push({id:'cal:'+c.id, da, a:'camera', et: fra<=0 ? 'al voto a fine turno' : `in aula, ${TR[c.voto.trimestre]}`,
      cosa:`«${c.nome}»${c.promotore?`, nel posto riservato di ${nomeP(c.promotore)}`:c.proponente?`, del dicastero ${dic(c.proponente)}`:''}: al voto ${fra<=0?'a fine turno':'in '+per(c.voto)}. Sì attesi: Camera ${f.camera[0]}–${f.camera[1]} su ${f.maggioranza_camera}, Senato ${f.senato[0]}–${f.senato[1]} su ${f.maggioranza_senato}${f.in_bilico?', in bilico':''}`,
      r: fra>0, m: f.in_bilico, fonte:'calendario', sez:'Aula', bt: f.in_bilico?'bilico':null}); }
  const pr = prec(v.data);
  for(const e of v.esiti.filter(e=>ugD(e.data,pr))){
    const cal = v.calendario.find(c=>c.nome===e.nome);
    F.push({id:'es:'+e.nome, da:'camera', a:'senato', et: e.approvata ? 'legge approvata' : 'legge respinta',
      cosa:`${e.approvata?'Approvata':'Respinta'} «${e.nome}»: Camera ${e.camera.si} sì e ${e.camera.no} no, Senato ${e.senato.si} sì e ${e.senato.no} no`,
      m:!e.approvata, fonte:'esiti (trimestre chiuso)', sez:'Aula', bt: e.approvata?null:'esno'}); }
  if(v.posto_riservato && !v.governa) F.push({id:'posto', da:par(PG), a:'camera', et:'posto riservato: tuo', cosa:'Il posto riservato all’opposizione di questo turno è tuo, ed è libero', r:1, fonte:'posto_riservato', sez:'Aula'});
  // paese
  for(const e of v.eventi){
    const da = e.regione ? nodo('r:'+e.regione,{k:'pae', t:e.regione, s:'regione'}) : nodo('s:'+e.nome,{k:'sit', t:e.nome, s:'situazione accesa'});
    F.push({id:'ev:'+e.nome, nome:e.nome, costo:e.costo, da, a:'pdc', et: e.costo ? euro(e.costo) : 'si decide',
      cosa:`${e.nome}${e.regione?' in '+e.regione:''}${e.costo?`: ${euro(e.costo)}`:''}, ${e.causa}. ${v.governa?'Lo decidi tu':'Lo decide il governo'}; senza scelta: ${String(e.default||'').toLowerCase()}`,
      m:1, fonte:'eventi', sez:'Cruscotto', bt:'ev', grave:e.tono==='grave'}); }
  for(const s of v.situazioni) if(!v.eventi.some(e=>e.nome===s.nome)){
    nodo('s:'+s.nome,{k:'sit', t:s.nome, s:'situazione accesa'});
    F.push({id:'sit:'+s.nome, nome:s.nome, da:'s:'+s.nome, a:'pdc', et:'accesa', cosa:`${s.nome}: accesa. La Vista non dice quale dicastero la muove`, m:1, fonte:'situazioni', sez:'Conti'}); }
  F.push({id:'spread', da:'mer', a:'d:economia_finanze', et:`spread ${v.spread}`, cosa:`Spread a ${v.spread} punti base sul debito`, m:v.spread>350, fonte:'spread_pb', sez:'Conti', bt:'spread'});
  // nodi solo con un segno
  for(const mo of v.mosse) if(/scissione/i.test(mo.testo)) { par(mo.partito); N.get('p:'+mo.partito).nota=mo.testo; }
  // tondi
  const vo = VOCI[STATI[st.stato].v];
  const tondi = id => vo.map((x,i)=>x.k.includes(id)?i+1:0).filter(Boolean);
  F.forEach(f=>{ f.tondi=tondi(f.id); });
  N.forEach(n=>{ n.tondi=tondi('n:'+n.id); });
  return {N, F, Ftot:F.length};
}

// ======================= tracciati e cornice (dal 28) =======================
const fr = v => '';
function caselle(pos,soglia=3,n=10){
  if(pos==null) return `<span class="cas vuoto">${'<i></i>'.repeat(n)}</span>`;
  const inp=pos<=soglia;
  return `<span class="cas ${inp?'inp':''}">${Array.from({length:n},(_,i)=>`<i class="${[i<soglia?'per':'', i===soglia-1?'sog':'', i<pos?'on':''].join(' ')}"></i>`).join('')}</span>`;
}
function consenso(){
  const v=V(), q=v.quote, ast=q[q.length-1], ids=v.partiti.map(p=>p.id), c=id=>q[ids.indexOf(id)]/(1-ast)*100;
  return v.governa ? governo().reduce((a,id)=>a+c(id),0) : c(PG);
}
function tracciati(){
  const v=V(), m=[margine('camera'),margine('senato')], C=consenso();
  const t=[[v.governa?'Consenso':'Il tuo consenso', num(C)+'%', clamp(Math.round((C-25)/5),0,10)],
    sciolte() ? ['Maggioranza','al voto',null] : v.governa ? ['Maggioranza C / S', m.map(x=>sgn(Math.round(x))).join(' / '), clamp(Math.round((Math.min(...m)+9)/3),0,10)]
      : ['Per farlo cadere †', m.map(x=>Math.max(0,Math.ceil(x))).join(' / '), clamp(10-Math.round(Math.min(...m)/3),0,10)],
    ['Conti · spread', num(v.spread,0), clamp(Math.round((500-v.spread)/50),0,10)]];
  return `<div class="trks">${t.map(([k,val,pos])=>`<div class="trk"><span class="k">${k}</span>${caselle(pos)}<span class="v">${val}</span></div>`).join('')}</div>`;
}
const SEZ = [['prima','Prima pagina'],['cruscotto','Cruscotto'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function barrate(){
  const v=V(), b={};
  if(!v.governa){ b.governo='Non governi: i ministri sono del governo avversario'; b.bilancio='La legge di bilancio la presenta il governo'; }
  if(!v.campagna) b.campagna='Si fa campagna solo nel turno prima del voto';
  if(sciolte()){ b.aula='Le Camere sono sciolte'; b.prima='Al turno zero non c’è un esito'; }
  return b;
}
function cornice(){
  const v=V(), b=barrate();
  const chi=`<span class="chi"><b>${sciolte()?'Turno zero':v.governa?'Al governo':'All’opposizione'}</b><br>${Per(v.data)} · turno ${v.turno}<br><b>${v.turni_al_voto===1?'1 turno al voto':v.turni_al_voto+' turni al voto'}</b></span>`;
  const somm=`<nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}">${t}</button>` : `<button>${t}</button>`).join('')}
    <span class="fuori"><button class="qui" aria-current="page">Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav>`;
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino solo-ord">Il Pungolo</span>${chi}</div>${tracciati()}
    <div class="c-dx"><div class="pila"><button class="btn p">Avanti fino a novità ››</button><button class="btn pieno">Chiudi il turno ›</button></div></div></div>${somm}</header>`;
}

// ======================= disegno: misure e pezzi comuni =======================
const LW = (s,px,b) => Math.round(String(s).length*px*(b?.6:.54)) ;   // ponytail: stima della larghezza del testo, basta per i riquadri
function box(n){ const w=Math.max(LW(n.t,13,1), LW(n.s||'',12))+18, h=n.s?36:24; return {w,h}; }
function nodoSvg(n,x,y,o={}){
  const {w,h}=o.w?{w:o.w,h:o.h}:box(n), cl=['nd',n.k,n.gov?'gov':'',n.tuo?'tuo':'',n.spento?'spento':'',o.on?'on':''].join(' ');
  const forma = n.k==='pdc' ? `<rect class="b" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}"/>`
    : n.k==='pae'||n.k==='sit' ? `<rect class="b" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="8"/>`
    : `<rect class="b" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}"/>`;
  const al = o.al||'middle', tx = al==='start'?x-w/2+9:x;
  const t = n.s ? `<text x="${tx}" y="${y-3}" text-anchor="${al}" font-size="13" font-weight="700">${esc(n.t)}</text><text class="s" x="${tx}" y="${y+12}" text-anchor="${al}">${esc(n.s)}</text>`
    : `<text x="${tx}" y="${y+4.5}" text-anchor="${al}" font-size="13" font-weight="700">${esc(n.t)}</text>`;
  const tn = (n.tondi||[]).map((k,i)=>`<g class="tnd ${o.on?'on':''}"><circle cx="${x+w/2-2+i*18}" cy="${y-h/2}" r="9"/><text x="${x+w/2-2+i*18}" y="${y-h/2+4}">${k}</text></g>`).join('');
  return `<g class="${cl}" data-nodo="${esc(n.id)}" tabindex="0">${forma}${t}</g>${tn}`;
}
function tondoSvg(f,x,y,on){ return f.tondi.map((k,i)=>`<g class="tnd ${f.m?'m':''} ${on?'on':''}"><circle cx="${x+i*19}" cy="${y}" r="9"/><text x="${x+i*19}" y="${y+4}">${k}</text></g>`).join(''); }
function filoCl(f,on){ return ['fi',f.m?'m':'',f.r?'r':'',f.c?'c':'',on?'on':''].join(' '); }
const legati = (M,id) => new Set(M.F.filter(f=>f.da===id||f.a===id).flatMap(f=>[f.id,f.da,f.a]));
function inFuoco(M){ if(!st.sel) return null; const [t,id]=st.sel.split('|');
  if(t==='n') return legati(M,id).add(id);
  if(t==='f'){ const f=M.F.find(x=>x.id===id); return f ? new Set([f.id,f.da,f.a]) : null; }
  if(t==='v'){ const vo=VOCI[STATI[st.stato].v][+id-1]; const s=new Set(); M.F.filter(f=>vo.k.includes(f.id)).forEach(f=>[f.id,f.da,f.a].forEach(x=>s.add(x))); vo.k.filter(k=>k.startsWith('n:')).forEach(k=>s.add(k.slice(2))); return s; }
  return null; }
const battuta = f => st.bat==='1' && !grave() && f.bt && BATTUTE[f.bt] ? '«'+BATTUTE[f.bt]+'»' : '';

// ======================= A · Tavola a rete =======================
// Geometria fissa per tipo: il Presidente del Consiglio al centro, i dieci dicasteri in cerchio, il Parlamento a sinistra,
// i partiti sotto, il Paese a destra, i mercati in alto. Solo i nodi toccati da un filo, salvo istituzioni e dicasteri.
function posA(M,W,H,mini){
  const P={}, cx=W*.41, cy=H*.47, rx=W*(mini?.2:.19), ry=H*.37;
  P.pdc=[cx,cy]; P.mer=[W*.07,H*.06]; P.camera=[W*.06,H*.34]; P.senato=[W*.06,H*.62];
  Object.keys(DS).forEach((d,i)=>{ const a=-Math.PI/2+i*2*Math.PI/10; P['d:'+d]=[cx+rx*Math.cos(a), cy+ry*Math.sin(a)]; });
  const par=[...M.N.values()].filter(n=>n.k==='par'), pae=[...M.N.values()].filter(n=>n.k==='pae'||n.k==='sit');
  const pw=par.reduce((a,n)=>a+(mini?20:box(n).w+6),0), rk=Math.min(1.5,W*.96/pw); let px=W*.02;
  par.forEach(n=>{ const w=(mini?20:box(n).w+6)*rk; P[n.id]=[px+w/2, H*.94]; px+=w; });
  pae.sort((a,b)=>(a.k==='sit')-(b.k==='sit') || (a.s==='regione'?0:1)-(b.s==='regione'?0:1));
  pae.forEach((n,i)=>{ P[n.id]=[mini?W-30:W-box(n).w/2-3, H*(.04+.78*(i+.5)/pae.length)]; });
  return P;
}
function curva(A,B,k=.12){ const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, bx=mx+(B[1]-A[1])*k, by=my-(B[0]-A[0])*k; return {d:`M${A[0]},${A[1]} Q${bx},${by} ${B[0]},${B[1]}`, p:t=>[(1-t)*(1-t)*A[0]+2*(1-t)*t*bx+t*t*B[0], (1-t)*(1-t)*A[1]+2*(1-t)*t*by+t*t*B[1]]}; }
function svgA(M0,W,H,mini){
  // i cantieri e le grandezze che toccano solo loro compaiono al clic sul dicastero (o sul filo)
  const F0=inFuoco(M0), vis=f=>!f.c || (F0&&F0.has(f.id));
  const Fv=M0.F.filter(vis), usati=new Set(Fv.flatMap(f=>[f.da,f.a]));
  const M={N:new Map([...M0.N].filter(([id,n])=>!(n.k==='pae'||n.k==='sit'||n.k==='par') || usati.has(id) || (n.tondi||[]).length)), F:Fv};
  const P=posA(M,W,H,mini), F=inFuoco(M0), on=x=>F&&F.has(x);
  let fili='', et='', nodi='';
  const cnt={}, giaB=new Set(), vo=VOCI[STATI[st.stato].v];
  for(const f of M.F){ const A=P[f.da], B=P[f.a]; if(!A||!B) continue;
    const kk=f.da+'>'+f.a; cnt[kk]=(cnt[kk]||0)+1; const c=curva(A,B,.1+.09*(cnt[kk]-1)*(cnt[kk]%2?1:-1));
    fili+=`<path class="${filoCl(f,on(f.id))}" d="${c.d}" stroke-width="${f.c?1.6:2.2}"/><path class="fi-hit" d="${c.d}" data-filo="${esc(f.id)}"/>`;
    if(mini) continue;
    const zitto = /^(prop|ag|cant):/.test(f.id) && !f.tondi.length && !on(f.id);
    const [lx,ly]=c.p(.5), [tx,ty]=c.p(.3), b=f.tondi.length && !giaB.has(f.tondi[0]) && (giaB.add(f.tondi[0]),1) ? battuta(f) : '', lab = zitto ? '' : f.et;
    if(lab) et+=`<text class="et ${f.m?'m':''} ${on(f.id)?'on':''}" x="${lx}" y="${ly-4}" text-anchor="middle">${esc(lab)}</text>`;
    if(b && !f.c) et+=`<text class="et bt ${on(f.id)?'on':''}" x="${lx}" y="${ly+11}" text-anchor="middle">${esc(b)}</text>`;
    if(f.tondi.length) et+=tondoSvg(f,tx,ty,on(f.id));
  }
  for(const n of M.N.values()){ const p=P[n.id]; if(!p) continue;
    if(mini){ nodi+=`<g class="nd ${n.k} ${on(n.id)?'on':''}" data-nodo="${esc(n.id)}"><circle class="b" cx="${p[0]}" cy="${p[1]}" r="${n.k==='pdc'?9:5}"/>${on(n.id)?`<text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="var(--carta)" stroke-width="4">${esc(n.t)}</text>`:''}</g>`; continue; }
    nodi+=nodoSvg(n,p[0],p[1],{on:on(n.id)}); }
  return `<svg class="${F?'fuoco':''}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schema dello Stato: chi tocca chi in questo trimestre">${fili}${nodi}${et}</svg>`;
}

// ======================= B · Tavola per poteri =======================
// Quattro colonne fisse: Partiti · Parlamento · Governo · Paese. Ogni soggetto è una riga; il filo va da riga a riga e
// porta solo il tondo; ciò che dice si legge nella riga e nel dettaglio a lato.
const COL = [['par','Partiti'],['parl','Parlamento'],['gov','Governo'],['pae','Paese e mercati']];
const colDi = n => n.k==='par' ? 0 : n.id==='camera'||n.id==='senato' ? 1 : n.k==='dic'||n.k==='pdc' ? 2 : 3;
function svgB(M,W,H){
  const F=inFuoco(M), on=x=>F&&F.has(x), gap=W*.055, cw=(W-gap*3)/4, top=26;
  const cols=[[],[],[],[]]; for(const n of M.N.values()) cols[colDi(n)].push(n);
  cols[3].sort((a,b)=>(a.id==='mer'?-1:b.id==='mer'?1:0) || (a.k==='sit')-(b.k==='sit'));
  cols[2].sort((a,b)=>(a.k==='pdc'?-1:b.k==='pdc'?1:0));
  const P={}, R={};
  cols.forEach((L,c)=>{ const rh=Math.min(50,(H-top-4)/Math.max(L.length,1)), x=c*(cw+gap);
    L.forEach((n,i)=>{ const y=top+rh*i+rh/2; P[n.id]=[x,y,rh]; R[n.id]=c; }); });
  let s=COL.map(([,t],c)=>`<text class="col-t" x="${c*(cw+gap)}" y="14">${t}</text><line class="col-l" x1="${c*(cw+gap)}" x2="${c*(cw+gap)+cw}" y1="20" y2="20"/>`).join('');
  let fili='', tn='';

    const ca=R[f.da], cb=R[f.a]; let d, mid;
    if(ca===cb){ const x=A[0]-2, bend=14+Math.abs(B[1]-A[1])*.08; d=`M${x},${A[1]} C${x-bend},${A[1]} ${x-bend},${B[1]} ${x},${B[1]}`; mid=[x-bend*.75,(A[1]+B[1])/2]; }
    else { const xa = ca<cb ? A[0]+cw : A[0], xb = ca<cb ? B[0] : B[0]+cw; const k=(xb-xa)*.5;
      d=`M${xa},${A[1]} C${xa+k},${A[1]} ${xb-k},${B[1]} ${xb},${B[1]}`; mid=[(xa+xb)/2,(A[1]+B[1])/2]; }
    fili+=`<path class="${filoCl(f,on(f.id))}" d="${d}" stroke-width="${f.c?1.5:2}"/><path class="fi-hit" d="${d}" data-filo="${esc(f.id)}"/>`;
    if(f.tondi.length) tn+=tondoSvg(f,mid[0]-(f.tondi.length-1)*9,mid[1],on(f.id));
  }

    const corto=(t,px,b)=>{ const mx=Math.floor((cw-16)/(px*(b?.55:.5))); return t.length>mx ? t.slice(0,mx-1)+'…' : t; };
    const nn={...n, t:corto(n.lungo||n.t,13,1), s:corto(n.s,12)};
    nodi+=nodoSvg(nn,x+cw/2,y,{w:cw,h,on:on(n.id),al:'start'}); }
  return `<svg class="${F?'fuoco':''}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schema dello Stato per poteri">${s}${fili}${nodi}${tn}</svg>`;
}

function blkDi(n){ if(n.k==='pdc') return 'pdc'; if(n.k==='dic') return 'min'; if(n.id==='camera'||n.id==='senato') return 'parl'; if(n.id==='mer') return 'mer';

function bordo(R,x,y){ const cx=R.x+R.w/2, cy=R.y+R.h/2, dx=x-cx, dy=y-cy; const t=Math.min(Math.abs((R.w/2)/(dx||1e-9)), Math.abs((R.h/2)/(dy||1e-9))); return [cx+dx*t, cy+dy*t]; }

  const membri={}; for(const n of M.N.values()){ const b=blkDi(n); (membri[b]=membri[b]||[]).push(n); }
  const fasci={}; for(const f of M.F){ const a=M.N.get(f.da), b=M.N.get(f.a); if(!a||!b) continue; const k=blkDi(a)+'>'+blkDi(b); if(k.split('>')[0]===k.split('>')[1]) continue; (fasci[k]=fasci[k]||[]).push(f); }
  const sel=st.sel||'', selF = sel.startsWith('a|') ? sel.slice(2) : null, selB = sel.startsWith('b|') ? sel.slice(2) : null;

  if(vo){ M.F.filter(f=>vo.k.includes(f.id)).forEach(f=>{vivi.add(f.da);vivi.add(f.a);}); vo.k.filter(x=>x.startsWith('n:')).forEach(x=>vivi.add(x.slice(2))); }
  const fuoco = !!(selF||selB||vo||selN);
  const accesoF = k => selF===k || (selB && k.split('>').includes(selB)) || (vo && fasci[k].some(f=>vo.k.includes(f.id))) || (selN && fasci[k].some(f=>f.da===selN||f.a===selN));
  let s=`<defs><marker id="pu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--biro)"/></marker><marker id="pum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--rosso)"/></marker></defs>`;

  if(t==='n'){ const n=M.N.get(id); if(!n) return ''; const L=M.F.filter(f=>f.da===id||f.a===id);
    return `<div class="det box"><div class="occ">${esc(n.s)}</div><h4 class="tit">${esc(n.lungo||n.t)}</h4>${n.nota?`<div class="sec">${esc(n.nota)}</div>`:''}
      <div class="fl">${L.map(f=>{ const o=M.N.get(f.da===id?f.a:f.da); return `<button data-filo="${esc(f.id)}"><span class="ver ${f.m?'male':''}">${f.da===id?'→':'←'} ${esc(o.lungo||o.t)}</span><span>${esc(f.et)}${f.tondi.length?' · '+f.tondi.join(', '):''}</span></button>`; }).join('') || '<span class="sec muto">nessun filo in questo trimestre</span>'}</div>
      <div class="az"><button class="link" data-sel="">chiudi</button></div></div>`; }
  return '';
}
function lato(M, mini){
  return `<aside class="lato">${st.v==='D'?dettaglioD(M):''}${dettaglio(M)}${mini||''}<h4 class="tit">Le notizie del trimestre</h4>${vociHtml(M)}<h4 class="tit">Come si legge</h4>${legenda()}</aside>`;
}

// ======================= render =======================
let limite='', dim={W:800,H:560};
function corpo(M){
  const v=V();
  const testa = `<div class="st-testa"><div><span class="tit tavola">Tavola n. ${v.turno} · Come funziona lo Stato</span><span class="sub">Chi tocca chi in ${per(v.data)}${VOCI[STATI[st.stato].v].length?'. I numeri nei tondi rimandano alle notizie della prima pagina':''}.</span></div>
    <div class="ctr"><button class="btn p ${st.fili==='tutti'?'scelto':''}" data-fili="tutti">Tutti i fili · ${M.Ftot}</button><button class="btn p ${st.fili==='notizie'?'scelto':''}" data-fili="notizie">Solo quelli in prima pagina</button></div></div>`;
  if(st.v==='C'){ const mini=`<div class="box" style="padding:4px">${svgA(M,dim.L-30,250,1)}</div>`;
    return `<main class="corpo sch lista">${testa}<div class="idx">${indiceC(M)}</div>${lato(M,mini)}</main>`; }
  return `<main class="corpo sch">${testa}<div class="tav">${st.v==='D'?svgD(M,dim.W,dim.H):st.v==='B'?svgB(M,dim.W,dim.H):svgA(M,dim.W,dim.H)}</div>${lato(M)}</main>`;
}
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const M2=modello(); if(st.fili==='notizie') M2.F=M2.F.filter(f=>f.tondi.length);
  scr.style.width=W+'px'; scr.style.height=H+'px';
  const build = () => `<div class="vS ${grave()?'g':''} ${lw<1200?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">${cornice()}${corpo(M2)}</div>`;
  scr.innerHTML = build();
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  // seconda passata: l'area della tavola misurata davvero
  const r=scr.firstElementChild, k=scr.getBoundingClientRect().width/scr.offsetWidth || 1, t=r.querySelector('.tav, .idx'), la=r.querySelector('.lato');
  if(t){ const B=t.getBoundingClientRect(); const nW=Math.floor(B.width/k/z), nH=Math.floor(B.height/k/z), nL=Math.floor(la.getBoundingClientRect().width/k/z);
    if(nW>200 && nH>200 && (Math.abs(nW-dim.W)>2||Math.abs(nH-dim.H)>2||Math.abs((dim.L||0)-nL)>2)){ dim={W:nW,H:nH,L:nL}; scr.innerHTML=build(); } }
  document.getElementById('lab').textContent = FORME[st.v];
  document.getElementById('nota').textContent = STATI[st.stato].nota;
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.lato,.idx')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const sv=r.querySelector('.tav svg'); let fuoriSvg=0;
  if(sv){ const S=sv.getBoundingClientRect(); sv.querySelectorAll('text,rect').forEach(el=>{ const b=el.getBoundingClientRect(); if(b.left<S.left-1||b.right>S.right+1||b.top<S.top-1||b.bottom>S.bottom+1) fuoriSvg++; }); }
  const sc=[...r.querySelectorAll('.lato,.idx')].some(c=>c.scrollHeight>c.clientHeight+1);
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', fuoriSvg?`fuori dalla tavola: ${fuoriSvg}`:'', sc?'il lato scorre':''].filter(Boolean).join(' · ');
}
const scr=document.getElementById('screen');
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else { const k=b.parentElement.dataset.k; if(!k) return; st[k]=b.dataset.v; if(k==='stato') st.sel=null; }
  render();
});
scr.addEventListener('click',e=>{
  const t=e.target, q=s=>t.closest(s); let x;
  if(x=q('[data-fili]')) st.fili=x.dataset.fili;
  else if(x=q('[data-fascio]')){ const s='a|'+x.dataset.fascio; st.sel = st.sel===s ? null : s; }
  else if(st.v==='D' && (x=q('[data-blk]')) && !q('[data-nodo]')){ const s='b|'+x.dataset.blk; st.sel = st.sel===s ? null : s; }
  else if(x=q('[data-filo]')){ const s='f|'+x.dataset.filo; st.sel = st.sel===s ? null : s; }
  else if(x=q('[data-nodo]')){ const s='n|'+x.dataset.nodo; st.sel = st.sel===s ? null : s; }
  else if(x=q('[data-voce]')){ const s='v|'+x.dataset.voce; st.sel = st.sel===s ? null : s; }
  else if(x=q('[data-sel]')) st.sel = x.dataset.sel||null;
  else if(q('.tav') && !q('button')) st.sel=null;
  else return;
  render();
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); if(e.key==='Escape'){ st.sel=null; render(); } });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
</html>
