<!doctype html>
<!--
  PROTOTIPO USA E GETTA — scelte della fetta 11g «Vista completa», piano 11 UI (17/11/2026).
  Due decisioni di Mario, una scheda ciascuna; gli interruttori stanno nella barra in basso.

  1  Le donne nelle facce
     Domanda: come si disegna una donna nel kit di produzione, e nessuna faccia ricorda una politica vera?
     La spec (spec:342) dice «ciglia, naso all'85%, labbra rosse; orecchino e cappello secondo l'hash».
     tratti   A  come la spec: a tutte ciglia + naso all'85% + labbra; orecchino e cappello ciascuno sì/no dall'hash
                 (quattro combinazioni)
              B  a tutte ciglia + naso all'85%, poi UNO fra labbra, orecchino e cappello, dall'hash
              C  a tutte ciglia + labbra, naso intero, niente orecchino né cappello
     cappello f  a fantasia del colletto della stessa faccia (il tecnico: grigio come il suo abito)
              i  pieno d'inchiostro col nastro di carta
              c  carta col nastro d'inchiostro
     misura   come nella UI (album 62, rose 46, leader 46, prova 84) oppure tutte a 34 · 46 · 62 · 84
     fondo    carta · giallo · rosso (i fondi sotto le soglie 40 e 25), forzato su tutte le facce
     Contenuti: «Rosa e governo» (album di dieci figurine e tre rose da tre), «Leader» (schede dei partiti con la
     coccarda), «Prova di riconoscimento» (tutte le donne delle Viste campione, numerate, senza nomi; «nomi» li mostra).
     Facce: escono dal codice vero. Un entry TS nello scratchpad importa app/src/lib/caricature/kit.ts (profilo,
     FANTASIE, OGGETTI) e caricatura.ts (leveDi, salti, saltiDeiLeader), rifà in stringa il markup di
     Caricatura.svelte, e rolldown lo imbottiglia in un IIFE (`Car`) incollato qui sotto. CSS di Caricatura.svelte e
     pattern di Fantasie.svelte copiati dai file allo stesso giro. esbuild non c'è in app/node_modules: rolldown sì.
     Inventato qui, ed è la proposta per la produzione:
       - i tratti femminili, presi dal 32 (variante 5, :515-530): ciglia, labbra rosse col filo di carta, orecchino
         giallo, cappello a tesa col nastro; il cappello nel 32 prendeva il colore del colletto, qui segue «cappello»;
       - il naso all'85%: il pennino di produzione è un poligono solo, fatto di sette pezzi (nuca, fronte, naso, mento,
         due spalle, orecchio, uno per «M»). Il terzo pezzo, il naso (NASI[i].pen), si toglie e si ridisegna a parte con
         transform="translate(6.3 3.9) scale(.085)", cioè scale(.1) con la scala dell'85% intorno alla radice (420,260)
         in decimi. Sagoma, filo e punta dell'ombra scalano le coordinate del tracciato del naso come profilo5 del 32;
         il filo da 1,4 tiene unita la base del naso al labbro, che resta dov'è;
       - orecchino e cappello dall'hash: i bit che restano dopo le sei leve di leveDi (floor(h / 864), poi % 2 e
         floor(/ 2) % 2 in A, % 3 in B). djb2 e mescola sono copiati da caricatura.ts:11-23 perché non sono esportati;
         l'autoverifica del bundle controlla su 600 chiavi che la copia dia le stesse leve.
     Non cambiato: la regola della rosa (salti) è quella di produzione, chiave naso:colletto senza il genere; il 32
     metteva il genere nella chiave (:586). Nessun tono grave qui.
     Dati: le Viste in viste/*.json (ogni oggetto con giocatore, fase e regioni: 123 Viste). Album: i dieci ministri di
     27-trattativa · guida (sei donne). Rose: 05-crisi (Economia), 30-eredita (Ambiente), 17-cruscotto ·
     crisi_provvisorio (Sanità). Leader: la Vista con più leader donne. Prova: ogni donna fra ministre e rosa (chiave
     nome + partito + ruolo, salto della prima comparsa: 0 da ministra, quello della rosa da candidata) e ogni leader
     donna (salto di saltiDeiLeader della sua Vista). Conti nella pagina.

  2  La spartizione in corso
     Domanda: con lo schema 19 la Vista porta la spartizione in corso del core (Vista.spartizione: dicastero, peso,
     partito o null = tecnico, di_default) e l'intesa di partenza vera per alleato: la pagina parte da lì, o resta
     la bozza vuota di oggi (trattativa.ts:24-34, Spartizione.svelte)?
     sp  A  la pagina si apre con le righe già compilate dalla spartizione in corso (all'inizio, il default); ogni clic
            manda subito la spartizione intera; pallino blu dove partito ≠ di_default; «Torna alla spartizione di default»
         B  come oggi: bozza vuota, il comando parte solo a bozza completa; la spartizione in corso del core in una
            colonna a destra, in grigio
     Nel lato, in tutte e due: gli alleati con richiesta, offerta e intesa di partenza a dieci caselle coi fili di
     soglie.ultimatum (40) e soglie.uscita (25), «entra in ultimatum» sotto 40, «può uscire» sotto 25 (storia 86).
     Sottoscheda «Ribaltone», senza varianti: la pagina del ribaltone col lato «Il ribaltone» (27-trattativa:607), i
     partiti nell'ordine del core, seggi Camera · Senato dall'ultima Vista.elezioni, il primo segnato.
     Dati: viste/27-trattativa.json. Stato «premio»: vista (la 02) per dicasteri, spartizione, richieste, soglie; le
     cinque «proposte» con la loro spartizione e le intese di partenza vere dopo il comando. Una combinazione che è una
     delle cinque mostra le sue intese; le altre dicono «non nel campione» (offerta e intesa non si rifanno qui).
     Stato «guida»: vista.ribaltone (coalizione, primo) e vista.elezioni.at(-1).voti.
     Inventato: nulla nei numeri; i testi della pagina sono quelli di interfaccia.json dove esistono (trattativa.*,
     ribaltone.*), il resto è del prototipo. I bottoni del ribaltone non fanno nulla. Il risultato del voto in testa
     (storia 84) è omesso: non cambia fra A e B.

  Stile e token: prototipi/08-fondamenta.prototype.html (forma A), via 38 (testa e schede) e 27 (barra in basso,
  righe, lato). Finestra 1280×800 o 1440×900 dalla barra. Script di costruzione nello scratchpad, non nel repo.
  Non è codice di produzione. Buttare dopo il verdetto.
-->

const voci = k => k==='misura' ? [['ui',OPZ.misura.ui], ...Object.entries(OPZ.misura).filter(([v])=>v!=='ui')] : Object.entries(OPZ[k]);

// ======================= 1 · Le donne nelle facce =======================
const TRATTI = {
  A:['Come la spec','Ciglia, naso all’85% e labbra a tutte; orecchino e cappello ciascuno sì o no dall’hash: quattro combinazioni.'],
  B:['Uno dall’hash','Ciglia e naso all’85% a tutte, poi uno solo fra labbra, orecchino e cappello.'],
  C:['Ciglia e labbra','Naso intero, niente orecchino né cappello: la donna si legge solo dall’occhio e dalla bocca.'],
};
const CAPP = {f:['A fantasia','La stessa fantasia del colletto della faccia; il tecnico grigio.'], i:['Inchiostro','Pieno d’inchiostro, nastro di carta.'], c:['Carta','Carta col nastro d’inchiostro.']};
const varianti = (k,T) => Object.entries(T).map(([v,[n,d]])=>`<div class="var ${st[k]===v?'qui':''}"><span class="l">${v}</span><b>${esc(n)}</b><span class="d">${esc(d)}</span></div>`).join('');
const partitoRiga = x => `<span><i class="sw" style="background:${col(x.pid)}"></i>${esc(x.partito)}</span>`;

function rosaGoverno(){
  const a = D.album, px=misura(62), pr=misura(46);
  const figurine = a.voci.map(x=>`<div class="fig">${faccia(x,px,{dic:x.dic})}<b>${esc(x.nome)}</b>${partitoRiga(x)}<span class="muto">${esc(DIC[x.dic])}</span></div>`).join('');
  const rose = D.rose.map(r=>`<section class="rosa"><h4>${esc(DIC[r.dic])}</h4>${r.voci.map(x=>`<div class="cand">${faccia(x,pr)}<span><b>${esc(x.nome)}</b><small>${esc(x.partito)}${x.ruolo==='tecnico'?' · tecnico':''}${x.salto?` · salto ${x.salto}`:''}</small></span></div>`).join('')}<span class="min muto">${esc(r.da)}</span></section>`).join('');
  return `<div class="sez-l">Il governo<span>${esc(a.da)} · ${a.voci.filter(x=>x.donna).length} donne su ${a.voci.length}</span></div><div class="album">${figurine}</div>
    <div class="sez-l">Tre rose da tre<span>la regola della rosa di produzione: naso e colletto, senza il genere</span></div><div class="rose">${rose}</div>`;
}
function leader(){
  const l=D.leader, px=misura(46);
  const schede = l.voci.map(x=>`<div class="scheda" style="--pc:${col(x.pid)}">${faccia(x,px)}<span><b>${esc(x.partito)}</b><small>${esc(x.nome)}</small></span></div>`).join('');
  return `<div class="sez-l">Le schede dei partiti<span>${esc(l.da)} · ${l.voci.filter(x=>x.donna).length} leader donne su ${l.voci.length}</span></div><div class="par">${schede}</div>
    <p class="nota">Il partito del giocatore non si disegna. I salti sono quelli di <code>saltiDeiLeader</code> sulla Vista.</p>`;
}
function prova(){
  const px=misura(84), mostra=st.nomi==='si';
  const celle = D.prova.map((x,i)=>`<figure>${faccia({...x,donna:true},px)}<figcaption><b>${i+1}</b>${mostra?`<br>${esc(x.nome)}<br>${esc(x.chiave)}${x.ruolo==='leader'?' · leader':''}`:''}</figcaption></figure>`).join('');
  return `<div class="sez-l">Tutte le donne delle Viste campione<span>${D.prova.length} facce, ${mostra?'coi nomi':'senza nomi'}</span></div>
    <div class="prova" style="--cella:${Math.max(px, mostra?110:px)+8}px">${celle}</div>`;
}
function facce(){
  const c=D.conti, corpo = {rosa:rosaGoverno, leader, prova}[st.vedi]();
  const capp = st.tratti==='C' ? '<p class="nota">In C nessuna ha il cappello: l’interruttore non cambia nulla.</p>' : varianti('cappello',CAPP);
  return `<div class="dom"><div class="pag">${corpo}</div>${lato(`
    <p class="q"><b>Come si disegna una donna?</b> La spec dice «ciglia, naso all’85%, labbra rosse; orecchino e cappello secondo l’hash» (spec:342). Le facce sono quelle del kit di produzione; i segni femminili vengono dal 32.</p>
    <div class="sez-l">tratti</div>${varianti('tratti',TRATTI)}
    <div class="sez-l">cappello<span>dove c’è</span></div>${capp}
    <div class="sez-l">nella prova</div>
    <div class="conti"><span>ministre e candidate in rosa (nome, partito, ruolo)</span><b>${c.nMin}</b><span>di cui nomi distinti</span><b>${c.nomiDistinti}</b><span>leader donne</span><b>${c.nLea}</b><span>con due facce in due Viste (salto diverso)</span><b>${c.dueFacce}</b></div>
    <p class="nota"><b>Prova:</b> nessuna ricorda una politica vera? Le facce sono numerate; «nomi» nella barra le scopre. La faccia di una ministra è quella della figurina (salto 0); da candidata in rosa può saltare alla combinazione successiva.</p>`)}</div>`;
}

// ======================= 2 · La spartizione in corso =======================
const SP = D.SP, SO = SP.soglie;
const DEF_SP = Object.fromEntries(SP.spartizione.map(x=>[x.dicastero,x.di_default]));
const PESO = Object.fromEntries(SP.spartizione.map(x=>[x.dicastero,x.peso]));
const CHI = ['giocatore', null, ...SP.richieste.map(r=>r.partito)];
const chiave = s => SP.dicasteri.map(d=>s[d.id]===null?'tecnico':s[d.id]).join(',');
const PROP = new Map(SP.proposte.map((p,i)=>[chiave(p.sp),i]));
const nomeB = o => o==='giocatore' ? 'Tu' : o===null ? 'Tecnico' : SP.partiti[o].nome;
let core, cur, bozza, mandati;
function azzera(){
  core = {sp:Object.fromEntries(SP.spartizione.map(x=>[x.dicastero,x.partito])), i:0, richieste:SP.richieste};
  cur = {...core.sp}; bozza = {}; mandati = 0;
}
function manda(s){ const i=PROP.get(chiave(s)); core = {sp:{...s}, i:i??null, richieste:i==null?null:SP.proposte[i].richieste}; mandati++; }
azzera();

const pesi = n => `<span class="pesi" title="${n} punt${n>1?'i':'o'}">${'<i></i>'.repeat(n)}</span>`;
const bott = (d,sel) => `<span class="chi2">${CHI.map(o=>`<button class="op ${o===null?'tec':''}" aria-pressed="${sel===o}" style="${o===null?'':`--pc:${col(o)};--tx:${testoSu(o)}`}" data-as="${d}|${o}">${esc(nomeB(o))}</button>`).join('')}</span>`;
const fx = v => v/10*16-1;
function intesa(it){
  const n = it==null ? 0 : Math.round(it/10), rs = it!=null && it<SO.ultimatum;
  return `<div class="ib"><span class="cas ${it==null?'vuoto':''}">${Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''} ${rs?'rs':''}"></i>`).join('')}</span>
    <b style="left:${fx(SO.ultimatum)}px"></b><em style="left:${fx(SO.ultimatum)+1}px">${SO.ultimatum}</em><b style="left:${fx(SO.uscita)}px"></b><em style="left:${fx(SO.uscita)+1}px">${SO.uscita}</em></div>`;
}
function alleati(){
  return SP.richieste.map(r0=>{
    const p=SP.partiti[r0.partito], r=core.richieste?.find(x=>x.partito===r0.partito);
    const x={ruolo:'leader', chiave:p.nome, nome:p.leader, salto:SP.salti[r0.partito], donna:p.donna};
    const it = r ? r.intesa_partenza : null;
    const avv = it==null ? '' : it<SO.uscita ? '<span class="chip rosso">può uscire</span>' : it<SO.ultimatum ? '<span class="chip rosso">entra in ultimatum</span>' : '';
    return `<div class="all" style="--pc:${col(r0.partito)}">${faccia(x,34)}
      <span><b>${esc(p.nome)}</b> <span class="min muto">${esc(p.leader)}</span></span>
      <span class="sec">${r ? `chiede <b>${num(r.richiesta)}</b> punti, ne offri <b>${r.offerta}</b>` : `chiede <b>${num(r0.richiesta)}</b> punti; offerta: non nel campione`}</span>
      <div class="largo">${intesa(it)}<span class="ints"><b class="${it!=null&&it<SO.ultimatum?'male':''}">${it==null?'intesa di partenza: non nel campione':`parte da ${num(it,0)}`}</b>${avv}</span></div></div>`;
  }).join('');
}
function comando(){
  const B=st.sp==='B', fatto = mandati>0;
  if(B && !fatto) return `<div class="cmd"><b>Nessun comando</b><span class="min muto">La Vista resta quella del turno: la spartizione in corso è il default.</span></div>`;
  if(!fatto) return `<div class="cmd"><b>Spartizione in corso del core</b><span class="min muto">Nel campione: «${esc(SP.proposte[0].nome)}». Nessun comando ancora mandato.</span></div>`;
  return `<div class="cmd"><b>Mandato <code>proponi_spartizione</code>, dieci dicasteri</b><span class="min ${core.i==null?'male':'muto'}">${core.i==null?'Non nel campione: le intese vere non ci sono.':`Nel campione: «${esc(SP.proposte[core.i].nome)}», le intese sono quelle dopo il comando.`}</span><span class="min muto">comandi mandati: ${mandati}</span></div>`;
}
function spartizione(){
  const A = st.sp==='A', s = A ? cur : bozza, n = SP.dicasteri.filter(d=>bozza[d.id]!==undefined).length;
  const cambiata = A && SP.dicasteri.some(d=>cur[d.id]!==DEF_SP[d.id]);
  const righe = SP.dicasteri.map(d=>`<tr class="${A && cur[d.id]!==DEF_SP[d.id]?'mod':''}"><td class="d">${esc(d.nome)}</td><td>${pesi(PESO[d.id])}</td><td>${bott(d.id,s[d.id])}</td>${A?'':`<td class="ora">${esc(nomeB(core.sp[d.id]))}</td>`}</tr>`).join('');
  const riga = A
    ? `La pagina si apre sulla spartizione in corso del core: all’inizio il default. Ogni clic manda la spartizione intera.`
    : n<SP.dicasteri.length ? `Assegnati ${n} su ${SP.dicasteri.length}. La proposta parte quando sono tutti assegnati; da lì ogni clic la sostituisce.` : 'Tutti assegnati: la proposta è partita, ogni clic la sostituisce.';
  const pie = A
    ? `<p class="min muto">• cambiato rispetto alla spartizione di default.</p>${cambiata?`<div class="az"><button class="link" data-act="reset">Torna alla spartizione di default</button></div>`:''}`
    : `<p class="min muto">Senza proposta, a fine turno vale la spartizione di default. La colonna grigia è la spartizione in corso del core.</p>${n?`<div class="az"><button class="btn p" data-act="svuota">Svuota la bozza</button></div>`:''}`;
  return `<div class="dom"><div class="pag">
    <p class="q"><b>Da dove parte la pagina della spartizione?</b> Con lo schema 19 la Vista porta la spartizione in corso del core e l’intesa di partenza vera di ogni alleato. ${A?'<b>A</b>: righe già compilate, ogni clic manda tutto.':'<b>B</b>: la bozza vuota di oggi, il comando solo a bozza completa.'}</p>
    <div class="riga"><h3 class="tit" style="font-size:var(--c-sez)">La trattativa</h3><span class="sec muto">${esc(SP.come)}</span></div>
    <p class="min muto" aria-live="polite">${riga}</p>
    <table class="rig"><thead><tr><th>Dicastero</th><th>Peso</th><th>A chi</th>${A?'':'<th>In corso</th>'}</tr></thead><tbody>${righe}</tbody></table>${pie}
    <p class="nota">Nel campione ci sono cinque proposte: ${SP.proposte.map(p=>`«${esc(p.nome)}»`).join(', ')}. Ogni altra combinazione dice «non nel campione». Nessuna delle cinque porta un’intesa sotto ${SO.uscita}: «può uscire» qui non si vede.</p>
  </div>${lato(`${comando()}<div class="sez-l">gli alleati<span>soglie: ultimatum ${SO.ultimatum}, uscita ${SO.uscita}</span></div>${alleati()}`)}</div>`;
}
function ribaltone(){
  const R=D.RIB, sum=i=>R.coalizione.reduce((a,id)=>a+R.voti[id][i],0), P=R.partiti[R.primo];
  const righe = R.coalizione.map(id=>`<div class="prom ${id===R.primo?'primo':''}"><span><i class="sw" style="background:${col(id)}"></i>${esc(R.partiti[id].nome)}${id===R.primo?' <span class="chip">primo per seggi: la guida</span>':''}</span><span class="num">${R.voti[id][0]} · ${R.voti[id][1]}</span></div>`).join('');
  return `<div class="dom"><div class="pag"><div class="gui">
    <p class="occ">Il ribaltone</p><p class="grande">Il governo è caduto, e tu stai nella nuova maggioranza.</p>
    <p>Il primo per seggi del ribaltone ha la guida: puoi chiederla a lui, o restare fuori.</p>
    <div class="az"><button class="btn pieno">Chiedi la guida ›</button><button class="btn">Resta fuori</button></div>
    <p class="min muto">Se il primo per seggi te la cede, l’incarico passa a te; se no, ti dice perché e puoi ancora restare fuori.</p>
    <p class="nota">Nel prototipo i bottoni non fanno nulla. ${esc(R.come)}. Il primo è ${esc(P.nome)}, leader ${esc(P.leader)}.</p></div></div>
    ${lato(`<h4 class="tit" style="font-size:var(--c-sez)">Il ribaltone</h4>${righe}<div class="prom"><span class="muto">insieme</span><span class="num">${sum(0)} · ${sum(1)}</span></div>
    <p class="min muto">Nell’ordine del core (<code>vista.ribaltone.coalizione</code>). Seggi Camera · Senato dal voto di ${R.data.trimestre}° trimestre ${R.data.anno} (<code>elezioni.at(-1)</code>).</p>`)}</div>`;
}

// ======================= barra, disegno, clic =======================
function barra(){
  const segs = [['s','scheda']];
  if(st.s==='facce') segs.push(['vedi','contenuto'],['tratti','tratti'],['cappello','cappello'],['misura','misura'],['fondo','fondo'], ...(st.vedi==='prova'?[['nomi','nomi']]:[]));
  else segs.push(['pag','pagina'], ...(st.pag==='sp'?[['sp','sp']]:[]));
  segs.push(['fin','finestra']);
  document.getElementById('proto').innerHTML = segs.map(([k,cap])=>`<span class="cap">${cap}</span><span class="seg" data-k="${k}">${voci(k).map(([v,l])=>`<button data-v="${v}" class="${st[k]===v?'on':''}" aria-pressed="${st[k]===v}">${esc(l)}</button>`).join('')}</span>`).join('')+'<span id="avv"></span>';
}
const scr = document.getElementById('screen');
function render(){
  const W=+st.fin, H=W===1440?900:800;
  const pag = st.s==='facce' ? facce() : st.pag==='rib' ? ribaltone() : spartizione();
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS"><header class="barra"><h1>Scelte della 11g</h1><nav class="schede">${Object.entries(OPZ.s).map(([k,l])=>`<button class="btn ${st.s===k?'scelto':''}" data-k="s" data-v="${k}">${l}</button>`).join('')}</nav>
    <span class="nota">Gli interruttori stanno nella barra in basso.</span></header>${pag}</div>`;
  barra();
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  salva(); tagli();
}
// testi che escono dal loro riquadro (come nel 27): oltre il bordo destro dello schermo o della propria colonna, o più larghi del proprio box
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0; const chi=[];
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect(), cs=getComputedStyle(el);
    const col = el.parentElement?.closest('.pag,.lato,.barra'), C = col?.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (C && (b.right>C.right+1 || b.left<C.left-1)));
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/auto|scroll/.test(cs.overflowY);
    if(fuori||stretto){ n++; chi.push(el); } });
  window.__tagli = chi;
  document.getElementById('avv').textContent = n ? `tagli: ${n}` : '';
}
document.getElementById('proto').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return; const k=b.parentElement.dataset.k;
  st[k]=b.dataset.v; if(k==='sp') azzera(); render();
});
scr.addEventListener('click',ev=>{
  const x=ev.target.closest('[data-k],[data-as],[data-act]'); if(!x) return;
  if(x.dataset.k){ st[x.dataset.k]=x.dataset.v; render(); return; }
  if(x.dataset.as){
    const [d,o0]=x.dataset.as.split('|'), o=o0==='null'?null:o0;
    if(st.sp==='A'){ if(cur[d]===o) return; cur[d]=o; manda(cur); }
    else { if(bozza[d]===o) return; bozza[d]=o; if(SP.dicasteri.every(x=>bozza[x.id]!==undefined)) manda(bozza); }
  } else if(x.dataset.act==='reset'){ cur={...DEF_SP}; manda(cur); }
  else if(x.dataset.act==='svuota'){ bozza={}; }
  render();
});
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
</html>
