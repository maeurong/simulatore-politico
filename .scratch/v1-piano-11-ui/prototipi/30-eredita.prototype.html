<!--
  PROTOTIPO USA E GETTA — ticket «Eredità» (30), mappa v1-piano-11-ui.
  Domanda: com'è fatta l'eredità, la casa della partita finita? Anni al governo, leggi ancora in vigore, indicatori contro
  il turno zero, riavvolgimenti (storia 149); la serie dei tre indicatori e i risultati di ogni elezione; la bozza dopo la
  sconfitta per seggi, con «torna a un turno» e la conferma sul posto che la manda nell'albo (storia 150). L'abbandono
  resta nell'edicola (ticket 13): qui solo la fine senza seggi. Si rilegge dall'albo con la stessa composizione?
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Ultima edizione — la pagina di giornale della fine: titolo sul voto perso, tre colonne (elezioni, Paese che lasci,
       leggi che restano), i tre grafici in fondo; la bozza nel dettaglio a lato, «Torna a un turno ›» porta al Registro
    B  Consuntivo     — il bilancio di fine partita come un listino: quattro numeri in testa, la tabella contro il turno
       zero con il righello, i tre grafici grandi a pagina; la bozza è una banda sotto la cornice, con «Torna a prima del
       voto» diretto e il Registro per gli altri turni
    C  Cronologia     — la partita su un asse solo: le tre serie una sopra l'altra sullo stesso tempo, legislature a fasce,
       voti e leggi segnati sull'asse; un turno scelto si apre nel dettaglio a lato con «Torna al turno N» sul posto
  Stati, ?stato=: bozza (finita senza seggi, dentro la partita, con la cornice) · albo (la stessa eredità riletta
  dall'edicola, confermata: niente cornice, «‹ Edicola», nessuna azione).
  ?fin=1280|1440  ?scala=1|1.25
  Dati: viste/30-eredita.json, giocata da genera/ (seme e mosse nel campo «come» del JSON): `voce_albo()` della partita
  finita senza seggi, `eredita()`, la Vista e i cambi di legge per chiusura, che `genera/` legge confrontando la Vista prima
  e dopo ogni chiusura (la Vista dice la legge in vigore, non quando è entrata). Nessun dato forzato. Titoli: BOZZA.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A), cornice dal 29, grafici e barre del voto dal 13.
  Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 12/11/2026), nel ticket 30: A · Ultima edizione, col riavvolgimento di B: nel dettaglio a lato
  «Torna al turno N · prima del voto ›» diretto con la conferma sul posto, «Un altro turno, nel Registro ›» per gli altri,
  poi «Conferma l'eredità». Dall'albo dell'edicola si rilegge la stessa pagina, senza cornice e senza azioni. Il file si
  apre su A col verdetto applicato; B e C restano dalla barra in basso.
-->

function anni(a){ if(!a) return 'mai al governo'; const y=Math.floor(a), m=Math.round((a-y)*12);
  return [y?`${y} ann${y===1?'o':'i'}`:'', m?`${m} mes${m===1?'e':'i'}`:''].filter(Boolean).join(' e ')+' al governo'; }
const fr = v => v ? `<svg class="fr ${v==='giu'?'giu':''}" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 .5 9.5 9.5H.5Z"/></svg>` : '<span aria-hidden="true">= </span>';

    ${A.indicatori.map(i=>{ const d=i.fine-i.turno_zero, dec=i.id==='spread'?0:1, v=d>0?'su':d<0?'giu':'';
      const g = GIUDIZIO[i.id] ? (d>0?'male':'bene') : 'muto', fermo=Math.abs(d)<.05;
      return `<span>${esc(i.nome)}</span><span class="r">${num(i.turno_zero,dec)}</span><span class="r"><b>${num(i.fine,dec)}</b></span><span class="r dl ${fermo?'muto':g}">${fr(fermo?'':v)}${num(Math.abs(d),dec)}</span>`; }).join('')}</div>`;
}
let GR=[];
function grafico(titolo, serie, fmt, opz={}){
  const id=GR.length, W=opz.w||290, H=opz.h||58, pad={l:2,r:52,t:6,b:14};
  const tutti=serie.flatMap(s=>s.v).concat(opz.zero?[0]:[]), lo=Math.min(...tutti), hi=Math.max(...tutti), sp=(hi-lo)||1;
  const n=serie[0].v.length, x=i=>pad.l+(W-pad.l-pad.r)*(n<2?0:i/(n-1)), y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-lo)/sp);
  const voti=votoIdx.map(i=>`<line x1="${x(i)}" x2="${x(i)}" y1="${pad.t-4}" y2="${H-pad.b}" stroke="var(--grigio)" stroke-dasharray="2 2"/><text x="${x(i)+3}" y="${pad.t+4}">voto</text>`).join('');
  const zero=opz.zero&&lo<0&&hi>0?`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)" stroke-width="1"/><text x="${pad.l+2}" y="${y(0)-3}">metà più uno</text>`:'';
  const linee=serie.map(s=>`<polyline fill="none" stroke="var(--ink)" stroke-width="2" ${s.trat?'stroke-dasharray="5 3"':''} stroke-linejoin="round" points="${s.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`).join('');
  const etich=serie.length>1?serie.map(s=>`<text x="${W-pad.r+4}" y="${y(s.v[n-1])+4}" style="fill:var(--ink)">${s.nome}</text>`).join(''):'';
  GR.push({serie,fmt,x,n,W});
  const ultimo=serie.map(s=>fmt(s.v[n-1])).join(' / ');
  return `<div class="gr"><div class="k"><span>${titolo}</span><b>${ultimo}</b></div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titolo)}, dal turno zero alla fine">${voti}${zero}${linee}${etich}
      <text x="${pad.l}" y="${H-2}">turno 0</text><text x="${W-pad.r}" y="${H-2}" text-anchor="end">${n-1}</text>
      <line class="cross" x1="0" x2="0" y1="${pad.t}" y2="${H-pad.b}" stroke="var(--rosso)" stroke-width="1" visibility="hidden"/>
      <rect data-gr="${id}" x="0" y="0" width="${W-pad.r}" height="${H}" fill="transparent"/></svg></div>`;
}
const SERIE3 = [

const grafici = (w,h) => SERIE3.map(([t,s,f,o])=>grafico(t,s,f,{...o,w,h})).join('');

}
function leggi(){

const mioUltimo = () => { const v=ultimoVoto.voti.find(v=>v[0]===MIO); return v?v[1]:0; };

const occhiello = () => `Voto di ${per(ultimoVoto.data)} · ${pct(mioUltimo())}, nessun seggio`;

// ===== azioni della bozza (conferme sul posto, ossatura) =====
const cosaCancella = t => `${t===TURNO_VOTO?`Si cancella la chiusura del turno ${t}`:`Si cancellano le chiusure dal turno ${t} al ${TURNO_VOTO}`}, col voto di ${per(ultimoVoto.data)}, e l’eredità in bozza. Il riavvolgimento si conta; con le stesse scelte il caso dà lo stesso esito.`;
function azioniBozza(dove){
  if(!bozza()) return '';
  if(st.conf==='eredita') return `<p class="sec male">Confermata, l’eredità va nell’albo e non si torna più a nessun turno: la partita esce da quelle in corso.</p>
    <div class="az"><button class="btn via pieno" data-fai="conferma">Conferma: manda nell’albo</button><button class="btn" data-conf="">Annulla</button></div>`;
  const conf = `<button class="btn via" data-conf="eredita">Conferma l’eredità</button>`;
  if(dove==='registro') return `<div class="az"><button class="btn pieno" data-fai="registro">Torna a un turno ›</button>${conf}</div>`;
  // verdetto: A col riavvolgimento di B, il turno del voto diretto e il Registro per gli altri
  if(dove==='voto') return st.conf==='t'+votoPrima() ? `<div style="display:grid;gap:4px">${tornaA(votoPrima())}</div>`
    : `<div class="az" style="flex-direction:column;align-items:start">${tornaA(votoPrima()).replace('›',`· prima del voto ›`)}<button class="link" data-fai="registro">Un altro turno, nel Registro ›</button></div><div class="az" style="margin-top:2px">${conf}</div>`;
  return `<div class="az">${conf}</div>`;
}
function tornaA(t, piccolo){
  if(!bozza()) return '';
  const P=piccolo?' p':'';
  if(st.conf==='t'+t) return `<p class="sec male">${cosaCancella(t)}</p><div class="az"><button class="btn via pieno${P}" data-fai="torna" data-t="${t}">Conferma: torna al turno ${t}</button><button class="btn${P}" data-conf="">Annulla</button></div>`;
  return `<button class="btn pieno${P}" data-conf="t${t}">Torna al turno ${t} ›</button>`;
}

const SEZ = [['prima','Prima pagina'],['cruscotto','Eredità'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function cornice(){
  const b={governo:'Partita finita: nessun governo da guidare', aula:'Partita finita: niente più voti in aula', bilancio:'Partita finita', campagna:'Partita finita'};
  if(!bozza()) b.registro='Eredità confermata: non si torna a un turno';
  const ult=S[S.length-1], m=[ult.margine_camera, ult.margine_senato];
  const cas=(pos)=>`<span class="cas fermo">${Array.from({length:10},(_,i)=>`<i class="${i===2?'sog':''} ${i<pos?'on':''}"></i>`).join('')}</span>`;
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const t=[['Il tuo consenso', num(mioUltimo()*100)+'%', cl(Math.round((mioUltimo()*100-25)/5),0,10)], ['Seggi', '0 / 0', 0], ['Conti · spread', num(ult.spread_pb,0), cl(Math.round((500-ult.spread_pb)/50),0,10)]];
  const trks=`<div class="trks">${t.map(([k,v,p])=>`<div class="trk fermo"><span class="k">${k}</span>${cas(p)}<span class="v">${v}</span></div>`).join('')}</div>`;
  const chi=`<span class="chi"><b>Partita finita</b><br>${Per(D.vista.data)} · turno ${D.vista.turno}<br><b>Senza seggi</b></span>`;
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino">Il Pungolo</span>${chi}</div>${trks}
    <div class="c-dx"><span>Nessun turno da chiudere</span><span>fermi al voto di ${per(ultimoVoto.data)}</span></div></div>
    <nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}">${t}</button>` : `<button class="${k==='cruscotto'?'qui':''}" ${k==='registro'?'data-fai="registro"':''}>${t}</button>`).join('')}
    <span class="fuori"><button>Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav></header>`;
}
const testaAlbo = () => `<header class="testa"><button class="link">‹ Edicola</button><span class="nomino">Il Pungolo</span><span class="dove">Albo · ${esc(MIO)}</span><span class="fuori"><button class="link">Impostazioni</button></span></header>`;
function riga(){
  return `${esc(A.scenario)} · ${Per(A.inizio)} – ${per(A.fine)} · ${A.turni} turni · ${anni(A.anni_al_governo)} · ${A.riavvolgimenti?A.riavvolgimenti+' riavvolgimenti':'nessun riavvolgimento'}`;
}

// ===== A · Ultima edizione =====
function vA(){
  const lato = bozza()
    ? `<div><div class="occ">Eredità in bozza</div><h3 class="tit">Non è ancora scritta</h3></div>
       <p class="sec">Senza seggi al voto la partita è finita, ma come ogni voto anche questo si può riavvolgere: torna al trimestre prima delle urne, o scegli un altro turno nel Registro. Finché non la confermi, l’eredità resta in bozza e la partita resta fra quelle in corso nell’edicola.</p>
       ${azioniBozza('voto')}`
    : `<div><div class="occ">Albo · ${esc(A.scenario)}</div><h3 class="tit">${esc(MIO)}</h3></div><span class="bollo">${esc(A.esito)}</span>
       <p class="sec muto">Eredità confermata: la partita non si riapre. L’albo la conserva anche quando una versione nuova non aprirà più i salvataggi.</p>`;
  return `<div class="corpo" style="grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:minmax(0,1fr);height:100%">
    <div style="display:grid;gap:12px;align-content:start;min-height:0;overflow:hidden auto">
      <article class="apre"><div><div class="o">${occhiello()}</div><h2 class="tit">${TITOLO}<span class="bz">BOZZA</span></h2></div><span class="bollo">${esc(A.esito)}</span>
        <p>${riga()}.</p></article>
      <div class="col3">
        <section><div class="titsez"><h4 class="tit">Le elezioni</h4></div>${elezioni()}</section>
        <section><div class="titsez"><h4 class="tit">Il Paese che lasci</h4><span class="dx min muto">contro il turno zero</span></div>${indicatori()}</section>
        <section><div class="titsez"><h4 class="tit">Le leggi che restano</h4><span class="dx min muto">${LEGGI.length}</span></div>${leggi()}</section>
      </div>
      <div class="gr3">${grafici(250,64)}</div>
    </div>
    <aside class="lato">${lato}</aside></div>`;
}

// ===== B · Consuntivo =====
function righello(i, w){
  // ponytail: la scala del righello va dal minimo al massimo della serie quando c'è (spread), altrimenti ±50% attorno al turno zero
  const lo=Math.min(i.turno_zero,i.fine), hi=Math.max(i.turno_zero,i.fine), sp=(hi-lo)||1, a=lo-sp*.6, b=hi+sp*.6, x=v=>4+(w-8)*(v-a)/(b-a);
  const g = GIUDIZIO[i.id] ? ((i.fine-i.turno_zero)>0?'var(--rosso)':'var(--verde)') : 'var(--ink)';
  return `<svg width="${w}" height="26" viewBox="0 0 ${w} 26"><line x1="4" x2="${w-4}" y1="13" y2="13" stroke="var(--grigio)"/>
    <line x1="${x(i.turno_zero)}" x2="${x(i.fine)}" y1="13" y2="13" stroke="${g}" stroke-width="3"/>
    <circle cx="${x(i.turno_zero)}" cy="13" r="4" fill="var(--carta)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="${x(i.fine)}" cy="13" r="4.5" fill="${g}"/>
    <text x="${x(i.turno_zero)}" y="25" text-anchor="middle">0</text><text x="${x(i.fine)}" y="8" text-anchor="middle" style="fill:var(--ink)">fine</text></svg>`;
}
function vB(){
  const banda = bozza() ? (st.conf==='t'+votoPrima()||st.conf==='eredita'
      ? `<div class="banda"><span>${st.conf==='eredita'?'Confermata, l’eredità va nell’albo e non si torna più a nessun turno.':cosaCancella(votoPrima())}</span><span class="dx">${st.conf==='eredita'
          ?`<button class="btn via pieno p" data-fai="conferma">Conferma: manda nell’albo</button>`:`<button class="btn via pieno p" data-fai="torna" data-t="${votoPrima()}">Conferma: torna al turno ${votoPrima()}</button>`}<button class="btn p" data-conf="">Annulla</button></span></div>`
      : `<div class="banda"><span><b>Eredità in bozza.</b> Senza seggi al voto di ${per(ultimoVoto.data)}: puoi ancora tornare indietro.</span>
        <span class="dx"><button class="btn pieno p" data-conf="t${votoPrima()}">Torna a prima del voto · turno ${votoPrima()} ›</button><button class="link" data-fai="registro">Un altro turno, nel Registro ›</button><button class="btn via p" data-conf="eredita">Conferma l’eredità</button></span></div>`) : '';
  const w=230;
  return `${banda}<div class="corpo" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">
    <div style="grid-column:1/-1;display:flex;align-items:baseline;gap:14px"><h3 class="tit" style="font-size:var(--c-pag)">Il consuntivo di ${esc(MIO)}</h3><span class="bollo">${esc(A.esito)}</span><span class="sec muto" style="margin-left:auto">${esc(A.scenario)} · ${Per(A.inizio)} – ${per(A.fine)}</span></div>
    <div class="quattro" style="grid-column:1/-1">
      <div><div class="k">Al governo</div><div class="n">${anni(A.anni_al_governo).replace(' al governo','')}</div><div class="min muto">su ${anni(A.turni/4).replace(' al governo','')} di partita</div></div>
      <div><div class="k">Leggi ancora in vigore</div><div class="n">${LEGGI.length}</div><div class="min muto">${LEGGI.map(l=>esc(l.nome)).join(' · ')||'nessuna'}</div></div>
      <div><div class="k">Elezioni</div><div class="n">${A.elezioni.length}</div><div class="min muto">${A.elezioni.map(e=>{const m=e.voti.find(v=>v[0]===MIO); return `${e.data.anno}: ${m?pct(m[1]):'—'}`;}).join(' · ')}</div></div>
      <div><div class="k">Riavvolgimenti</div><div class="n">${A.riavvolgimenti}</div><div class="min muto">${A.riavvolgimenti?'turni rigiocati':'nessun turno rigiocato'}</div></div>
    </div>
    <section><div class="titsez"><h4 class="tit">I tre indicatori, turno per turno</h4></div><div style="display:grid;gap:10px">${grafici(470,74)}</div></section>
    <section style="display:grid;gap:14px;align-content:start">
      <div><div class="titsez"><h4 class="tit">Il Paese, contro il turno zero</h4></div>
        <div class="righ"><span class="h">Indicatore</span><span class="h">dal turno zero alla fine</span><span class="h" style="text-align:right">fine</span>
        ${A.indicatori.map(i=>{ const d=i.fine-i.turno_zero, dec=i.id==='spread'?0:1, g=GIUDIZIO[i.id]?(d>0?'male':'bene'):'muto';
          return `<span>${esc(i.nome)}</span>${righello(i,w)}<span style="text-align:right;white-space:nowrap"><b>${num(i.fine,dec)}</b> <span class="dl ${g}">${fr(d>0?'su':'giu')}${num(Math.abs(d),dec)}</span></span>`; }).join('')}</div></div>
      <div><div class="titsez"><h4 class="tit">Le elezioni</h4></div>${elezioni()}</div>
      <div><div class="titsez"><h4 class="tit">Le leggi che restano</h4></div>${leggi()}</div>
    </section></div>`;
}
const votoPrima = () => TURNO_VOTO;   // tornare al turno del voto = riaprire il trimestre che vota

// ===== C · Cronologia =====
let CRONO=null;
function vC(){
  const W=Math.round(dimC.W), rows=[['Consenso coalizione',S.map(p=>p.consenso*100),v=>num(v)+'%'],['Margine C / S',S.map(p=>p.margine_camera),segno,S.map(p=>p.margine_senato)],['Spread',S.map(p=>p.spread_pb),v=>num(v,0)+' pb']];
  const n=S.length, pad={l:118,r:14}, x=i=>pad.l+(W-pad.l-pad.r)*i/(n-1), rh=70, top=40, H=top+rows.length*rh+60+LEGGI.length*15;
  CRONO={x,n,W};
  // legislature: dall'inizio della serie e da ogni voto
  // una legislatura va da un voto al successivo; il voto si tiene alla chiusura del turno che porta la sua data
  const tagli=[...new Set([0,...votoIdx,n-1])].sort((a,b)=>a-b);
  const fasce=tagli.slice(0,-1).map((a,k)=>{ const e=A.elezioni.find(e=>ug(e.data,S[a].data));
    return `<rect x="${x(a)}" y="${top-6}" width="${x(tagli[k+1])-x(a)}" height="${rows.length*rh+6}" fill="${k%2?'var(--velo)':'transparent'}"/><text x="${x(a)+6}" y="${top-12}" style="fill:var(--ink);font-weight:700">${e?`${k+1}ª legislatura, dal voto di ${per(e.data)}`:'Prima del voto'}</text>`; }).join('');
  const gr=rows.map(([t,v,f,v2],r)=>{ const all=v.concat(v2||[]).concat(r===1?[0]:[]), lo=Math.min(...all), hi=Math.max(...all), sp=(hi-lo)||1, y0=top+r*rh, y=val=>y0+8+(rh-22)*(1-(val-lo)/sp);
    const pl=(arr,tr)=>`<polyline fill="none" stroke="var(--ink)" stroke-width="2" ${tr?'stroke-dasharray="5 3"':''} points="${arr.map((q,i)=>`${x(i).toFixed(1)},${y(q).toFixed(1)}`).join(' ')}"/>`;
    return `<text x="0" y="${y0+18}" style="fill:var(--ink);font-weight:700">${t}</text><text x="0" y="${y0+34}">${(v2?[f(v[n-1]),f(v2[n-1])].join(' / '):f(v[n-1]))} alla fine</text>
      <line x1="${pad.l}" x2="${W-pad.r}" y1="${y0+rh-6}" y2="${y0+rh-6}" stroke="var(--grigio)" stroke-width=".5"/>
      ${r===1&&lo<0&&hi>0?`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink)"/><text x="${W-pad.r}" y="${y(0)-3}" text-anchor="end">metà più uno</text>`:''}
      ${pl(v)}${v2?pl(v2,1):''}`; }).join('');
  const yA=top+rows.length*rh;
  const voti=votoIdx.map(i=>{ const e=A.elezioni.find(e=>ug(e.data,S[i].data)), m=e.voti.find(v=>v[0]===MIO);
    const cx=Math.max(pad.l+40, Math.min(W-pad.r-40, x(i)));
    return `<line x1="${x(i)}" x2="${x(i)}" y1="${top-6}" y2="${yA+4}" stroke="var(--rosso)" stroke-width="1.5"/><rect x="${cx-40}" y="${yA+22}" width="80" height="17" fill="var(--rosso)"/><text x="${cx}" y="${yA+34}" text-anchor="middle" style="fill:var(--carta);font-weight:700">voto · ${m?pct(m[1]):''}</text>`; }).join('');
  // le leggi entrano alla chiusura: il segno sta sul turno dopo; etichetta a sinistra del segno, una riga per legge
  const pins=LEGGI.filter(l=>l.chiusura!=null).map((l,k)=>{ const i=S.findIndex(p=>p.turno===l.chiusura+1); const xi=x(i<0?n-1:i), yy=yA+56+k*15;
    return `<path d="M${xi},${yy-9} l-5,9 h10 z" fill="var(--ink)"/><text x="${xi-9}" y="${yy}" text-anchor="end" style="fill:var(--ink)">legge: ${esc(l.nome)}</text>`; }).join('');
  const hit=S.map((p,i)=>{ const w=(W-pad.l-pad.r)/(n-1); const sel=st.sel===p.turno;
    return `<g class="hit" data-turno="${p.turno}"><rect class="c" x="${x(i)-w/2}" y="${top-6}" width="${w}" height="${rows.length*rh+6}" fill="${sel?'rgb(255 210 63 / .45)':'transparent'}"/></g>`; }).join('');
  const assex=S.map((p,i)=>p.data.trimestre===1?`<text x="${x(i)}" y="${yA+14}" text-anchor="middle">${p.data.anno}</text>`:'').join('');
  const svg=`<svg width="${W}" height="${H+14}" viewBox="0 0 ${W} ${H+14}">${fasce}${hit}${gr}${voti}${pins}${assex}</svg>`;
  const p = st.sel!=null ? S.find(q=>q.turno===st.sel) : null;
  const lato = p ? `<div><div class="occ">Turno ${p.turno}</div><h3 class="tit">${Per(p.data)}</h3></div>
      <dl class="dati"><dt>Il tuo consenso</dt><dd><b>${pct(p.consenso)}</b></dd><dt>Margine Camera</dt><dd>${segno(p.margine_camera)}</dd><dt>Margine Senato</dt><dd>${segno(p.margine_senato)}</dd><dt>Spread</dt><dd>${num(p.spread_pb,0)} pb</dd></dl>
      ${A.elezioni.some(e=>ug(e.data,p.data))?`<p class="sec"><b>In questo turno si vota.</b> Tornarci riapre il trimestre prima delle urne.</p>`:''}
      ${bozza()?`<div class="az">${tornaA(p.turno)}</div><button class="link" data-fai="registro">Le notizie del turno ${p.turno} nel Registro ›</button>`:''}
      <button class="link" data-sel="">‹ Il bilancio della partita</button>`
    : `<div><div class="occ">${bozza()?'Eredità in bozza':'Albo · '+esc(A.scenario)}</div><h3 class="tit">${esc(MIO)}</h3></div><span class="bollo">${esc(A.esito)}</span>
      <p class="sec">${riga()}.</p>
      ${bozza()?`<p class="sec">Scegli un turno sull’asse per tornarci: ogni voto, anche l’ultimo, si può riavvolgere.</p>`:''}
      <div><h4 class="tit" style="margin-bottom:4px">Contro il turno zero</h4>${indicatori()}</div>
      <div><h4 class="tit" style="margin-bottom:4px">Le leggi che restano</h4>${leggi()}</div>
      ${azioniBozza('lato')}`;
  return `<div class="corpo" style="grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:minmax(0,1fr);height:100%">
    <div style="display:grid;gap:10px;align-content:start;min-height:0;overflow:hidden auto">
      <div><div style="font-size:17px;font-weight:700">${occhiello()}</div><h2 class="tit" style="font-size:var(--c-pag)">${TITOLO}<span class="bz">BOZZA</span></h2></div>
      <div class="crono" id="crono">${svg}</div>
      <div><div class="titsez"><h4 class="tit">Le elezioni</h4></div><div style="display:grid;grid-template-columns:repeat(${A.elezioni.length},minmax(0,1fr));gap:var(--canale)">${[...A.elezioni].reverse().map(e=>elezioniDi(e)).join('')}</div></div>
    </div>
    <aside class="lato">${lato}</aside></div>`;
}
function elezioniDi(e){ const s=A.elezioni; A.elezioni=[e]; const h=elezioni(); A.elezioni=s; return `<div>${h}</div>`; }
let dimC={W:760};

// ===== montaggio =====
const scr=document.getElementById('screen');
let limite='';
function render(){
  GR=[];
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  scr.style.width=W+'px'; scr.style.height=H+'px';
  const corpo = st.v==='B'?vB():st.v==='C'?vC():vA();
  const rows = st.v==='B'&&bozza() ? 'auto auto minmax(0,1fr)' : 'auto minmax(0,1fr)';
  const build = () => `<div class="vS ${lw<1200?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-rows:${rows}">${bozza()?cornice():testaAlbo()}${st.v==='C'?vC():corpo}</div>`;
  scr.innerHTML = build();
  if(st.v==='C'){ const c=scr.querySelector('#crono'); if(c){ const k=scr.getBoundingClientRect().width/scr.offsetWidth||1, nW=Math.floor(c.getBoundingClientRect().width/k/z); if(nW>300&&Math.abs(nW-dimC.W)>2){ dimC.W=nW; GR=[]; scr.innerHTML=build(); } } }
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  const r=scr.firstElementChild, sc=[...r.querySelectorAll('.corpo,.corpo>div,.lato')].some(c=>c.scrollHeight>c.clientHeight+1);
  document.getElementById('avv').textContent=[limite, sc?'la pagina scorre':'', st.msg].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else { const k=b.parentElement.dataset.k; if(!k) return; st[k]=b.dataset.v; }
  st.conf=null; st.sel=null; st.msg=''; render();
});
scr.addEventListener('click',e=>{
  const q=s=>e.target.closest(s); let x; st.msg='';
  if(x=q('[data-fai]')){ const f=x.dataset.fai;
    st.msg = f==='registro' ? '(apre il Registro: «Torna al turno N» in testa a ogni turno, ticket 25)'
      : f==='conferma' ? '(conferma_eredita: l’app apre l’Edicola con la voce d’albo aperta, come dopo l’abbandono)'
      : `(riavvolgi(${x.dataset.t}): si riapre la prima pagina del turno ${x.dataset.t})`;
    st.conf=null; }
  else if(x=q('[data-conf]')) st.conf=x.dataset.conf||null;
  else if(x=q('[data-sel]')) { st.sel=null; st.conf=null; }
  else if(x=q('[data-turno]')){ const t=+x.dataset.turno; st.sel = st.sel===t?null:t; st.conf=null; }
  else return;
  render();
});
scr.addEventListener('mousemove',e=>{
  scr.querySelectorAll('.tip').forEach(t=>t.remove()); scr.querySelectorAll('.cross').forEach(c=>c.setAttribute('visibility','hidden'));
  const r=e.target.closest('[data-gr]'); if(!r) return;
  const g=GR[+r.dataset.gr], svg=r.ownerSVGElement, B=svg.getBoundingClientRect(), fx=(e.clientX-B.left)/B.width*g.W;
  let i=0, best=1e9; for(let j=0;j<g.n;j++){ const d=Math.abs(g.x(j)-fx); if(d<best){best=d;i=j;} }
  const c=svg.querySelector('.cross'); c.setAttribute('x1',g.x(i)); c.setAttribute('x2',g.x(i)); c.setAttribute('visibility','visible');
  const t=document.createElement('div'); t.className='tip'; t.textContent=`turno ${S[i].turno}, ${per(S[i].data)}: ${g.serie.map(s=>(s.nome?s.nome+' ':'')+g.fmt(s.v[i])).join(' · ')}`;
  const box=svg.parentElement; box.appendChild(t); t.style.left=Math.min(g.x(i), g.W-t.offsetWidth)+'px'; t.style.top='-6px';
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); if(e.key==='Escape'){ st.sel=null; st.conf=null; render(); } });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
</html>
