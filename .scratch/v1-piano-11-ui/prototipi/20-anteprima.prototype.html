<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Anteprima della misura» (20), mappa v1-piano-11-ui.
  Domanda: com'è fatta l'anteprima della misura, il mobile appeso (storia 156)? Costo esatto, effetti a fasce, ritardo,
  gruppi colpiti, linee e forbice (55); il perimetro di una disposizione territoriale (141); l'oscillazione smorzata solo
  a un gesto, mai in loop; il test della misura comprato con la cassa (123) e come cambia ciò che si legge. Si apre a
  lato: in Aula per una legge, sul cruscotto per una proposta e per il decreto di un evento.
  Tre varianti via ?ant=A|B|C (frecce ← →):
    A  Cartellino    — un foglio appeso a uno spillo nel dettaglio a lato; al gesto oscilla tutto intero
    B  Mobile a fili — dall'asta pendono Voto, Conti e un pezzo per effetto, ciascuno su un filo lungo quanto il suo
       ritardo (una riga per ritardo diverso, coi turni scritti); al gesto oscillano a cascata, i fili lunghi più lenti
    C  Prima e dopo  — un foglio fermo: ora / con la misura, effetti con quando e quanto, il voto in una frase; al gesto
       oscillano solo le righe che sono cambiate
  Casi, ?caso=: riforma · zes · autonomia · due · costituzionale · elettorale · inesame · calendario · opposizione
    (Aula, forma D del ticket 19) · proposta · accogli · decreto · grave (cruscotto ridotto dal ticket 17).
  Altri parametri: ?apre=lato|largo (il dettaglio resta largo com'è o si allarga a metà pagina) ?mov=1|2|0 ?fin ?scala.
  Gesti che fanno oscillare: aprire l'anteprima, cambiare un gradino della bozza con l'anteprima aperta (righe delle
  disposizioni a sinistra), comprare il test, «ripeti il gesto». Mai in tono grave né col movimento spento.
  Dati: viste/20-anteprima.json (genera/, tutto giocato sul 03, seme 4): anteprime vere di salario minimo (7, 9, 11 €/h),
  ZES (0, 0,75, 2,3 mld), autonomia, numero dei parlamentari, salario minimo con le pensioni, proporzionale al 3%,
  proposta sul nucleare, decreto di Accogli; decreto d'evento sul codice degli appalti (seme 4 turno 2, seme 7 turno 8 in
  tono grave); il test comprato su salario minimo e ZES; rifiuti veri (decontribuzione già in esame, test ripetuto,
  anteprima all'opposizione). Ospite: il prototipo dell'Aula (19) in forma D. Mappa a tessere, non quella ISTAT.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A). Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 12/11/2026), nel ticket 20: D · Cartellino col prima e dopo (il cartellino di A con la tabella di C),
  aggiunta dopo il primo giro; si apre nel dettaglio a lato, alla sua larghezza; costo, effetti e gruppi di una misura in
  calendario e norme del decreto d'evento rimandati al core. Il file si apre su D. Scartate: A, B e C dalla barra in basso.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo Anteprima della misura · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.dl.crit{background:var(--rosso);color:var(--carta);padding:0 5px}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.fascia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fascia .cas{--cw:12px;--ch:8px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-top:var(--filo);font-size:var(--c-sec)}
.voce:first-child{border-top:0}
.voce small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.voce small::before{content:"perché: ";font-style:italic}
.voce small.np::before{content:none}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:center}
.dati dt{color:var(--grigio)}

/* cornice A · Gerenza */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez);margin-bottom:4px}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:2px}
.capo h3{margin:0}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.rosso{border-color:var(--rosso);color:var(--rosso)}
.chip.pieno{background:var(--ink);color:var(--carta)}
.chip.ok{border-color:var(--verde);color:var(--verde)}
.alleato{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);padding:2px 8px;font-size:var(--c-sec);cursor:pointer}
.alleato.no{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default}
.alleato.on{background:var(--giallo)}
.g .alleato.on{background:var(--ink);color:var(--carta)}

/* A · Ordine del giorno */
.odg .grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:10px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between}
.r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px 6px;border-bottom:var(--filo);cursor:pointer}
.r:hover{background:var(--velo)}
.r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.r .seg{width:14px;height:14px;border:1.5px solid var(--ink)}
.r .seg.fatto{background:var(--ink)}
.r .seg.info{border-style:dashed;border-color:var(--grigio)}
.r .seg.urg{border-color:var(--rosso);background:var(--retino)}
.r .t{font-weight:700;font-size:var(--c-corpo);line-height:1.2}
.r .t small{font-weight:400;color:var(--grigio);font-size:var(--c-sec)}
.r .s{grid-column:2;font-size:var(--c-min);color:var(--grigio);line-height:1.25}
.r .a{grid-row:1/span 2;grid-column:3;display:flex;gap:4px;align-items:center}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start}
.lato h4{font-size:var(--c-sez)}
.barra{height:8px;background:var(--velo);position:relative;border:1px solid var(--grigio)}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barra b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rosso)}
.forb{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:var(--c-min)}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.minis .m{display:flex;gap:6px;align-items:center;border:var(--filo);padding:3px 8px 3px 4px;font-size:var(--c-min);cursor:pointer;max-width:100%}
.minis .m b{font-size:var(--c-sec)}
.minis .m:hover{background:var(--velo)}
.piedeC{display:flex;align-items:center;gap:10px;border-top:var(--doppio);padding-top:6px;font-size:var(--c-sec)}
.piedeC .sapere{flex:1;min-width:0;display:flex;gap:14px;overflow:hidden;white-space:nowrap}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}

/* ===== Aula: pezzi comuni ===== */
.schede{display:flex;gap:2px;border-bottom:var(--forte);margin-bottom:6px}
.schede button{padding:4px 12px;font-weight:700;color:var(--grigio);border:1.5px solid transparent;border-bottom:0;white-space:nowrap}
.schede button.qui{color:var(--ink);border-color:var(--ink);background:var(--carta);margin-bottom:-2px;padding-bottom:6px}
.schede button small{font-weight:400;margin-left:4px}
.posti{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px}
.posto{border:var(--bordo);padding:5px 8px;display:grid;gap:2px;align-content:start;min-height:64px;cursor:pointer;min-width:0}
.posto:hover{background:var(--velo)}
.posto.sel{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--velo)}
.posto .k{font-size:var(--c-min);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posto b{font-size:var(--c-sec);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.posto .s{font-size:var(--c-min);color:var(--grigio)}
.posto.libero{border-style:dashed;border-color:var(--grigio);cursor:default}
.posto.libero b{color:var(--grigio);font-weight:400}
.posto.mio{border-color:var(--rosso)}
.posto.chiuso{background:var(--retino);border-style:dashed;cursor:default}
.r11g{display:inline-block;border:1.5px dashed var(--grigio);color:var(--grigio);font-size:var(--c-min);padding:0 5px;white-space:nowrap;cursor:help}
.lin{display:inline-flex;gap:2px;vertical-align:middle}
.lin i{width:11px;height:11px;border:1.5px solid var(--ink);flex:none}
.lin i.si{background:var(--ink)}
.lin i.g{border-color:var(--rosso)} .lin i.g.si{background:var(--rosso)}
.fb{position:relative;display:inline-block;vertical-align:middle;height:10px;border:1px solid var(--grigio);background:var(--carta);width:90px;flex:none}
.forb .fb{width:auto;display:block}
.mini .fb{width:70px}
.fb i{position:absolute;top:0;bottom:0;background:var(--retino);border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.fb b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.tb{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.tb th{font-size:var(--c-min);text-transform:uppercase;letter-spacing:.06em;color:var(--grigio);text-align:left;font-weight:700;padding:3px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.tb td{padding:4px 6px;border-bottom:var(--filo);vertical-align:top}
.tb tr.clic{cursor:pointer} .tb tr.clic:hover td{background:var(--velo)} .tb tr.sel td{background:var(--velo);box-shadow:inset 0 1.5px 0 var(--ink),inset 0 -1.5px 0 var(--ink)}
.tb td.n{text-align:right;white-space:nowrap;font-weight:700}
.tb .grp td{font-size:var(--c-min);text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink);padding-top:10px;border-bottom:1.5px solid var(--ink)}
.arr{color:var(--biro);font-weight:700;white-space:nowrap}
.scala{display:flex;gap:4px;flex-wrap:wrap}
.gr{border:1.5px solid var(--ink);padding:2px 8px;font-size:var(--c-sec);white-space:nowrap;cursor:pointer;background:var(--carta)}
.gr.vig{background:var(--ink);color:var(--carta)}
.gr.bozza{background:var(--giallo);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.gr.arrivo{border-color:var(--biro);color:var(--biro);border-style:dashed}
.gr.bloc{background:var(--retino);color:var(--grigio);border-style:dashed;cursor:not-allowed}
.gr.spento{color:var(--grigio);border-color:var(--grigio);border-style:dashed}
.g .gr.bozza{background:var(--carta);box-shadow:inset 0 0 0 3px var(--ink)}
.sg{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px;gap:2px 8px;font-size:var(--c-sec);align-items:center}
.sg .h{font-size:var(--c-min);color:var(--grigio);text-transform:uppercase;letter-spacing:.06em}
.sg .n{text-align:right;font-weight:700}
.em{border-top:var(--filo);padding-top:6px;display:grid;gap:3px}
.voti{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:var(--c-sec);align-items:center}
.conta{height:8px;background:var(--carta);border:1px solid var(--grigio);position:relative}
.conta i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.conta b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rosso)}
.bozzab{border:var(--forte);padding:8px 10px;display:grid;gap:6px;background:var(--carta)}
.bozzab.vuota{border-style:dashed;border-color:var(--grigio);color:var(--grigio)}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* A · Ordine dei lavori */
.ola{grid-template-columns:minmax(0,1fr) var(--lato)}

/* B · Emiciclo */
.emi{grid-template-columns:minmax(0,1fr) minmax(250px,26%);grid-template-rows:auto minmax(0,1fr)}
.striscia{grid-column:1/-1;display:flex;gap:0;border:var(--bordo)}
.striscia button{flex:1 1 0;min-width:0;padding:5px 8px;border-left:var(--filo);display:grid;gap:1px;text-align:left}
.striscia button:first-child{border-left:0}
.striscia button .k{font-size:var(--c-min);color:var(--grigio);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.striscia button b{font-size:var(--c-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.striscia button.qui{background:var(--ink);color:var(--carta)} .striscia button.qui .k{color:var(--carta)}
.striscia button.libero{color:var(--grigio)} .striscia button.libero b{font-weight:400}
.striscia button.bil{box-shadow:inset 0 -3px 0 var(--rosso)}
.palco{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0 var(--canale);align-content:start;min-height:0;overflow:hidden auto}
.palco h2{font-size:var(--c-pag)}
.emic text{font:700 13px var(--txt);fill:var(--ink)}

/* C · Codice */
.cod{grid-template-columns:minmax(0,1fr) var(--lato)}
.dr{display:grid;grid-template-columns:minmax(150px,24%) minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:5px 4px;border-bottom:var(--filo)}
.dr .nm{font-weight:700;font-size:var(--c-sec);line-height:1.2}
.dr .nm small{display:block;font-weight:400;color:var(--grigio);font-size:var(--c-min)}
.dr .x{font-size:var(--c-min);color:var(--grigio);text-align:right;white-space:nowrap}
.dr.sel{background:var(--velo)}
.cg{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:12px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:end;gap:8px}
.cg:first-child{margin-top:0}
.mini{display:grid;gap:0}
.mini .mr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;padding:5px 0;border-bottom:var(--filo);cursor:pointer;font-size:var(--c-sec)}
.mini .mr:hover{background:var(--velo)}
.mini .mr small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
/* ===================== ticket 20: l'anteprima della misura ===================== */
.ola.largo{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.indietro{justify-self:start}
.ola>.lato{position:sticky;top:0;align-self:start;overflow:hidden auto;overscroll-behavior:contain}
.ante,.cart{display:grid;gap:9px;align-content:start;min-width:0}
.occ.k{color:var(--ink)}
.blk{display:grid;gap:4px}
.cost{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cost b{font:700 var(--c-sez)/1.1 var(--tit);font-variation-settings:var(--wonk)}
.cambia{font-size:var(--c-sec);display:grid;gap:1px}
.cambia .da{color:var(--grigio);text-decoration:line-through}
.eff{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 10px;align-items:center;font-size:var(--c-sec)}
.f3{display:inline-flex;gap:2px;vertical-align:-1px}
.f3 i{width:11px;height:9px;border:1.5px solid currentColor}
.f3 i.on{background:currentColor}
.tst{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 10px;align-items:center;font-size:var(--c-sec);border:var(--bordo);padding:6px 8px}
.tst .occ,.tst>.min:last-child{grid-column:1/-1}
.dove{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.dove rect{fill:var(--carta);stroke:var(--grigio);stroke-width:1}
.dove rect.on{fill:var(--ink);stroke:var(--ink)}
.emi2{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;align-items:end;max-width:400px}
.emi2 p{font-size:var(--c-min)}

/* A · Cartellino */
.cart{position:relative;border:var(--forte);background:var(--carta);padding:14px 14px 12px;margin-top:20px;transform-origin:50% -20px;box-shadow:3px 4px 0 rgb(31 26 23 / .16)}
.cart::before{content:"";position:absolute;left:50%;top:-20px;width:1.5px;height:20px;background:var(--ink)}
.cart .spillo{position:absolute;left:calc(50% - 6px);top:-27px;width:13px;height:13px;border-radius:50%;background:var(--rosso);border:1.5px solid var(--ink)}
.g .cart{box-shadow:none}

/* B · Mobile a fili */
.mob{position:relative;margin-top:4px;--rot:76px}
.mob .asta{position:absolute;left:calc(var(--rot) + 8px);right:8px;top:0;height:2px;background:var(--ink);transform-origin:50% 0}
.mob .asta::before{content:"";position:absolute;left:calc(50% - 5px);top:-9px;width:10px;height:10px;border:1.5px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0}
.mob .gd{position:absolute;left:0;right:0;border-top:1px dashed var(--grigio);pointer-events:none}
.mob .gd span{position:absolute;left:0;top:2px;width:calc(var(--rot) - 6px);font-size:var(--c-min);line-height:1.2;color:var(--grigio)}
.mob .pz{position:absolute;top:2px;width:var(--w);margin-left:calc(var(--w) / -2);transform-origin:50% 0}
.mob .pz::before{content:"";position:absolute;left:50%;top:0;width:1.5px;height:var(--l);background:var(--ink)}
.mob .pz .c{margin-top:var(--l);border:var(--bordo);background:var(--carta);padding:4px 6px 5px;display:grid;gap:1px;font-size:var(--c-sec);line-height:1.2;position:relative;z-index:1}
.mob .pz .c .occ{font-size:var(--c-min);letter-spacing:0;text-transform:none;hyphens:auto;-webkit-hyphens:auto}
.mob .pz .c b{font-size:var(--c-sec)}

/* C · Prima e dopo */
.led{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.led th{text-align:left;font-size:var(--c-min);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio);font-weight:700;padding:8px 6px 2px 0;border-bottom:var(--bordo)}
.led th:nth-child(n+2),.led td:nth-child(n+2){text-align:right}
.led td{padding:4px 6px 4px 0;border-top:var(--filo);vertical-align:top;transform-origin:0 0}
.led td.n{font-weight:700;white-space:nowrap}
.led td[colspan]{text-align:left}

/* cruscotto ridotto */
.evb{display:grid;gap:5px;margin-top:8px}
.evb .r{margin-top:4px}
</style>
</head>

const TUTTE = [...Object.entries(A20.anteprime).filter(([k])=>k!=='accogli').map(([k,x])=>({k,...x})), ...A20.gradini.map(x=>({k:chiaveV(x.valori),...x}))];
X.anteprime.push(...TUTTE.filter(x=>x.anteprima).map(x=>({valori:x.valori, a:x.anteprima, stati:'ordinario'})));
const TESTK = {[chiaveV(A20.anteprime.riforma.valori)]:'riforma', [chiaveV(A20.anteprime.territoriale_zes.valori)]:'territoriale_zes'};
const PREZZO = Number(A20.test.riforma.prezzi.find(p=>p.acquisto==='test_misura').euro);
const HOST = () => st.stato==='gravedec' ? A20.host_grave : A20.host03;

const CASI = {
  riforma:{lab:'Riforma', stato:'ordinario', bozza:{salario_minimo:'11'}},
  zes:{lab:'Territoriale · ZES', stato:'ordinario', bozza:{credito_zes:'2_3'}},
  autonomia:{lab:'Territoriale · Nord', stato:'ordinario', bozza:{autonomia_differenziata:'intese_complete'}},
  due:{lab:'Due disposizioni', stato:'ordinario', bozza:{salario_minimo:'11', regime_pensioni:'quota_base_universale'}},
  costituzionale:{lab:'Costituzionale', stato:'ordinario', bozza:{numero_parlamentari:'300_150'}},
  elettorale:{lab:'Elettorale', stato:'ordinario', bozza:'pronta3', tab:'el'},
  inesame:{lab:'Già in esame', stato:'ordinario', bozza:{decontribuzione:'30'}},
  calendario:{lab:'In calendario', stato:'ordinario', ante:'m:0', sel:'m:0', tab:'aula'},
  opposizione:{lab:'All’opposizione', stato:'opplibero', bozza:{cittadinanza:'ius_soli_temperato'}},
  proposta:{lab:'Proposta del ministro', stato:'ordinario', ctx:'cruscotto', ante:'p:ambiente_energia'},
  accogli:{lab:'Proposta di fondi', stato:'ordinario', ctx:'cruscotto', ante:'p:infrastrutture_trasporti'},
  decreto:{lab:'Decreto d’evento', stato:'ordinario', ctx:'cruscotto', ante:'decreto'},
  grave:{lab:'Tono grave', stato:'gravedec', ctx:'cruscotto', ante:'decreto_grave'},
};
function applyCaso(k){
  const c=CASI[k]||CASI.riforma; if(c.stato!==st.stato) st.test=null; st.caso=k; st.stato=c.stato; st.ctx=c.ctx||'aula';
  st.sc={em:{},fid:{},lin:{},ref:{}}; st.nuove=[]; st.rif=null; st.conf=null; st.testNo=false; st.prevC=null;
  st.bozza = c.bozza==='pronta3' ? Object.fromEntries(V().disposizioni.filter(z=>z.norma==='elettorale' && X.pronte.proporzionale_3[z.id]!==z.in_vigore).map(z=>[z.id,X.pronte.proporzionale_3[z.id]])) : {...(c.bozza||{})};
  st.tab = c.tab || (c.bozza?'disp':'aula');
  st.sel = c.sel || (c.bozza && c.bozza!=='pronta3' ? 'd:'+Object.keys(c.bozza)[0] : null);
  st.ante = c.ante || (c.bozza?'bozza':null); st.gesto=true; st.scorri=true;
}

// ---------- i dati dell'anteprima aperta ----------
function anteDati(){
  const s=st.ante; if(!s) return null;
  if(s==='bozza'){
    const val=Object.entries(st.bozza).map(([disposizione,gradino])=>({disposizione,gradino}));
    if(!val.length) return {vuota:true};
    if(opp()) return {valori:val, rifiuto:X.rifiuto_proposta, opp:true};
    const t = st.stato==='ordinario' && TUTTE.find(x=>chiaveV(x.valori)===chiaveV(val));
    return t ? {valori:val, a:t.anteprima, rifiuto:t.rifiuto, k:t.k} : {valori:val, manca:true};
  }
  if(s.startsWith('m:')){
    const m=misure().find(x=>'m:'+x.id===s); if(!m) return {vuota:true};
    const vero = (m.valori||[]).some(x=>x.disposizione==='decontribuzione');
    return {misura:m, valori:m.valori, inesame:true,
      rifiuto: vero ? A20.anteprime.territoriale_decontribuzione.rifiuto : `comando non ammesso: ${m.nome.split(':')[0]} è già in esame`, ricostruito:!vero};
  }
  if(s==='p:infrastrutture_trasporti') return {a:A20.anteprime.accogli.anteprima, k:'accogli', decreto:'fondi'};
  if(s==='p:ambiente_energia') return {a:A20.anteprime.proposta_nucleare.anteprima, valori:A20.anteprime.proposta_nucleare.valori, k:'proposta_nucleare', proposta:true};
  if(s.startsWith('p:')) return {manca:true};
  if(s==='decreto'||s==='decreto_grave') return {a:A20[s].anteprima, valori:A20[s].valori, k:s, decreto:'disposizioni'};
  return {vuota:true};
}

// ---------- pezzi comuni ----------
const euroS = c => { const a=Math.abs(c); return a>=1e9 ? num(a/1e9,1)+' mld €' : a>=1e6 ? num(a/1e6, a<1e7?2:0)+' mln €' : a.toLocaleString('it-IT',{useGrouping:'always'})+' €'; };
const grC = id => gr(id).replace(/ \(.*\)$/,'');
const FASCE = {poco:1, medio:2, molto:3};
const f3 = f => `<span class="f3" title="${f}">${[1,2,3].map(i=>`<i class="${i<=FASCE[f]?'on':''}"></i>`).join('')}</span>`;
function dopoT(r){ let {anno,trimestre}=V().data; for(let i=0;i<r;i++){ trimestre++; if(trimestre>4){trimestre=1;anno++;} } return per({anno,trimestre}).toLowerCase(); }
const ritTxt = r => r===0 ? 'subito' : `dopo ${r} ${r===1?'turno':'turni'}${r>=8?` · ${num(r/4,0)} anni`:''}`;
function formaLab(d){
  if(d.decreto==='fondi') return 'Decreto · fondi';
  if(d.decreto) return 'Decreto · disposizioni';
  if(d.proposta) return `Proposta del ministro ${dic(d.a.proponente)}`;
  return {riforma:'Legge ordinaria', elettorale:'Legge elettorale', costituzionale:'Norma costituzionale', conversione:'Conversione di decreto'}[d.a.forma]||d.a.forma;
}
function costo(d){
  const c=Number(d.a.costo_annuo);
  if(d.decreto==='fondi') return {n:euroS(c), s:'l’importo del decreto'};
  if(!c) return {n:'Saldo zero', s:d.decreto?'il decreto non sposta fondi':'non cambia i conti'};
  return c>0 ? {n:'+'+euroS(c), s:'di spesa in più ogni anno'} : {n:'−'+euroS(c), s:'di spesa in meno ogni anno'};
}
function chiStima(d){
  const p=d.a.proponente, M=p && HOST().ministri[p];
  if(!M) return 'Senza ministro proponente: la stima è neutra.';
  return `Stima di ${esc(M.nome)}, ministro ${esc(dic(p))}: capacità ${M.capacita} su 5, e più è bassa più spesso la fascia è sbagliata di una.`;
}
function cambia(d){
  if(d.decreto==='fondi') return `<p class="sec">Fondi a ${esc(dic(d.a.proponente))} per l’atto del ministro.</p>`;
  return `<div class="cambia">${(d.valori||[]).map(x=>{const z=disp(x.disposizione); return z?`<div>${esc(z.nome)}: <span class="da">${esc(gN(z,z.in_vigore))}</span> → <b>${esc(gN(z,x.gradino))}</b></div>`:'';}).join('')}</div>`;
}
const effTesto = e => `${e.migliora?'migliora':'peggiora'} · ${e.fascia}`;
function effRighe(d){
  const E=d.a.effetti; if(!E.length) return `<p class="sec muto">Nessun effetto sulle grandezze${d.a.forma==='elettorale'?': cambia i seggi':d.a.forma==='costituzionale'?': cambia le istituzioni':''}.</p>`;
  return `<div class="eff">${E.map(e=>`<span>${esc(grC(e.grandezza))}</span><span class="${e.migliora?'bene':'male'} nf">${f3(e.fascia)} ${effTesto(e)}</span><span class="min muto">${ritTxt(e.ritardo)}</span>`).join('')}</div>`;
}
const testDi = d => st.test && TESTK[chiaveV(d.valori)]===st.test ? A20.test[st.test].test : null;
function cassa(){ return st.test ? A20.test[st.test].cassa_dopo : HOST().cassa; }
function testBtn(d){
  if(d.decreto==='fondi') return `<p class="min muto">Il test si compra su una bozza di disposizioni: un decreto di fondi non ne ha.</p>`;
  const k=TESTK[chiaveV(d.valori)]||'';
  if(st.test && st.test!==k) return `<div class="conf"><button class="btn p" aria-disabled="true" data-perche="un test per turno">Compra il test · ${euroS(PREZZO)}</button><span class="min male">${esc(A20.test.riforma.rifiuto_ripetuto.replace('comando non ammesso: ',''))}</span></div>`;
  return `<div class="conf"><button class="btn p" data-test="${k}">Compra il test · ${euroS(PREZZO)}</button><span class="min muto">dalla cassa del partito, ${euroS(cassa())} · uno per turno</span></div>
    ${st.testNo&&!k?`<div class="ph">Nel prototipo il test è vero solo sul salario minimo a 11 €/h e sulla ZES a 2,3 miliardi.</div>`:''}`;
}
function gruppi(d, tabella){
  const g=d.a.gruppi, T=testDi(d);
  if(T) return `<div class="tst"><span class="occ k">Il test · reazione al governo fra due turni</span>
    ${Object.keys(COND).map(c=>{ const r=T.reazioni.find(x=>x.condizione===c), s=r.segno;
      return `<span>${COND[c]}${g.includes(c)?' <span class="chip">toccati</span>':''}</span><span class="nf ${s>0?'bene':s<0?'male':'muto'}">${s?f3(r.fascia):''} ${s>0?'a favore':s<0?'contro':'indifferenti'}</span><span class="min muto">${s?r.fascia:''}</span>`;}).join('')}
    <span class="min muto">Stima col suo errore, più larga sui gruppi piccoli. Comprato: −${euroS(PREZZO)}, cassa ${euroS(cassa())}.</span></div>`;
  return `<div class="blk"><span class="occ k">Gruppi toccati</span><div>${g.length?g.map(c=>`<span class="chip">${COND[c]}</span>`).join(' '):'<span class="sec muto">nessuno direttamente</span>'}</div>
    <p class="min muto">Chi la misura tocca, non come reagirà: lo dice il test.</p>${testBtn(d)}</div>`;
}
function perimetro(d){ return [...new Set((d.valori||[]).flatMap(x=>disp(x.disposizione)?.perimetro||[]))]; }
function mappa(d, c=17){
  const P=new Set(perimetro(d)); if(!P.size) return '';
  const W=6*c+2, H=8*c+2;
  return `<div class="dove"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="vale in ${P.size} regioni">${Object.entries(TESS).map(([id,[x,y]])=>`<rect x="${x*c+1}" y="${y*c+1}" width="${c-3}" height="${c-3}" class="${P.has(id)?'on':''}"><title>${REGN[id]}</title></rect>`).join('')}</svg>
    <div><span class="occ k">Dove vale · ${P.size} regioni</span><p class="sec">${[...P].map(r=>REGN[r]).join(', ')}</p><p class="min muto">Tessere del prototipo; nell’app la mappa ISTAT.</p></div></div>`;
}
function verdetto(f){
  if(!f.in_bilico) return {t:'passa', c:'bene'};
  return (f.camera[1]<f.maggioranza_camera || f.senato[1]<f.maggioranza_senato) ? {t:'non passa', c:'male'} : {t:'in bilico', c:'male'};
}
function voto(d, forma){
  const a=d.a, f=a.forbice, v=verdetto(f), sul = d.decreto ? 'sulla conversione' : 'al voto';
  const linee = `<div class="conf"><span class="sec muto">Linee</span>${lineeHtml(a)}<span class="min muto">pieno = sì · rosso = tu</span></div>`;
  if(forma==='barre') return `<div class="blk"><span class="occ k">Il voto, ${sul}</span>
    <p class="sec">Alla Camera <b>${f.camera[0]}–${f.camera[1]} sì</b>, ne servono ${f.maggioranza_camera}; al Senato <b>${f.senato[0]}–${f.senato[1]}</b> su ${f.maggioranza_senato}: <b class="${v.c}">${v.t}</b>.</p>
    <div class="forb" style="grid-template-columns:auto minmax(0,1fr)"><span class="sec">Camera</span>${fb(f,'camera')}<span class="sec">Senato</span>${fb(f,'senato')}</div>${linee}</div>`;
  return `<div class="blk"><span class="occ k">Il voto, ${sul} · <span class="${v.c}">${v.t}</span></span><div class="emi2">${emiciclo({forbice:f},'camera',560)}${emiciclo({forbice:f},'senato',560)}</div>${linee}</div>`;
}
function nota(d){
  if(d.decreto) return 'Vale da subito; a fine turno il Parlamento lo converte, o decade e i suoi effetti cessano.';
  if(d.proposta) return 'Accolta, entra in calendario come legge; rinviata, torna al turno dopo.';
  if(d.a.forma==='costituzionale') return `Due deliberazioni a distanza di un turno; senza i due terzi alla seconda (${Math.ceil(tot('camera')*2/3)} e ${Math.ceil(tot('senato')*2/3)}), referendum confermativo.`;
  if(d.a.forma==='elettorale') return 'Seggi attesi sul sondaggio pubblico, con la legge nuova.';
  return 'Legge ordinaria: si vota alla fine del turno dopo.';
}
const seggi = d => d.a.seggi?.length ? seggiTab(d.a.seggi,'Seggi in più o in meno') : '';
const testa = d => `<span class="occ">${esc(formaLab(d))} · anteprima</span><h4 class="tit">${esc(d.a.nome)}</h4>`;

// ---------- A · Cartellino: un foglio appeso a uno spillo, che oscilla tutto intero ----------
function anteA(d){
  const c=costo(d);
  return `<div class="cart osc"><i class="spillo"></i>${testa(d)}
    <div class="cost"><b>${c.n}</b><span class="sec muto">${c.s}</span></div>${cambia(d)}
    <div class="blk"><span class="occ k">Effetti stimati</span>${effRighe(d)}<p class="min muto">${chiStima(d)}</p></div>
    ${gruppi(d)}${mappa(d)}${voto(d)}${seggi(d)}<p class="min muto">${nota(d)}</p></div>`;
}

// ---------- B · Mobile a fili: ogni pezzo pende da un filo lungo quanto il suo ritardo ----------
function anteB(d){
  const a=d.a, c=costo(d), v=verdetto(a.forbice);
  const P=[{k:'Voto', t:v.t, s:`Camera ${a.forbice.camera.join('–')} su ${a.forbice.maggioranza_camera}`, r:0, cls:v.c},
           {k:'Conti', t:c.n, s:c.s, r:0}, ...a.effetti.map(e=>({k:grC(e.grandezza), t:effTesto(e), s:'', r:e.ritardo, cls:e.migliora?'bene':'male', f:e.fascia}))];
  const R=[...new Set(P.map(p=>p.r))].sort((x,y)=>x-y), riga=r=>R.indexOf(r), PASSO=62, n=P.length;
  const H = 34 + (R.length-1)*PASSO + 92;
  const pezzi = P.map((p,i)=>{ const L=22+riga(p.r)*PASSO;
    return `<div class="pz osc" style="left:calc(var(--rot) + (100% - var(--rot)) * ${((i+.5)/n).toFixed(3)});--l:${L}px;--w:min(132px, (100% - var(--rot)) / ${n} - 6px)" data-l="${L}"><div class="c"><span class="occ k">${esc(p.k)}</span><b class="${p.cls||''}">${p.f?f3(p.f)+' ':''}${esc(p.t)}</b>${p.s?`<span class="min muto">${esc(p.s)}</span>`:''}</div></div>`;}).join('');
  const guide = R.map(r=>`<div class="gd" style="top:${2+22+riga(r)*PASSO}px"><span>${r?`+${r} ${r===1?'turno':'turni'}<br>${dopoT(r)}`:'subito'}</span></div>`).join('');
  return `<div class="ante">${testa(d)}<p class="min muto">${chiStima(d)}</p>
    <div class="mob" style="height:${H}px"><div class="asta osc"></div>${guide}${pezzi}</div>${cambia(d)}
    ${gruppi(d)}${mappa(d)}${voto(d)}${seggi(d)}<p class="min muto">${nota(d)}</p></div>`;
}

// ---------- C · Prima e dopo: un foglio fermo; si muove solo la riga che cambia ----------
function tabella(d, conGruppi){
  const a=d.a, c=costo(d), T=testDi(d), righe=[];
  const r = (k, cells, cls='') => righe.push(`<tr class="${cls}" data-k="${esc(k)}">${cells}</tr>`);
  righe.push(`<tr><th>Cosa cambia</th><th>ora</th><th>con la misura</th></tr>`);
  if(d.decreto==='fondi') r('fondi', `<td>Fondi a ${esc(dic(a.proponente))}</td><td class="muto">—</td><td class="n">${c.n}</td>`);
  (d.valori||[]).forEach(x=>{ const z=disp(x.disposizione); if(z) r('v:'+x.disposizione, `<td>${esc(z.nome)}</td><td class="muto">${esc(gN(z,z.in_vigore))}</td><td class="n">${esc(gN(z,x.gradino))}</td>`); });
  if(d.decreto!=='fondi') r('costo', `<td>Spesa ogni anno</td><td class="muto">—</td><td class="n">${c.n}</td>`);
  righe.push(`<tr><th>Effetti stimati</th><th>quando</th><th>quanto</th></tr>`);
  if(!a.effetti.length) r('nessuno', `<td colspan="3" class="muto">nessuno sulle grandezze</td>`);
  a.effetti.forEach(e=>r('e:'+e.grandezza, `<td>${esc(grC(e.grandezza))}</td><td class="muto">${ritTxt(e.ritardo)}</td><td class="n ${e.migliora?'bene':'male'}">${f3(e.fascia)} ${effTesto(e)}</td>`));
  if(!conGruppi) return `<table class="led">${righe.join('')}</table>`;
  righe.push(`<tr><th>${T?'Gruppi · il test':'Gruppi'}</th><th>${T?'toccati':''}</th><th>${T?'reazione':''}</th></tr>`);
  if(T) Object.keys(COND).forEach(k=>{ const x=T.reazioni.find(y=>y.condizione===k), s=x.segno;
    r('g:'+k, `<td>${COND[k]}</td><td class="muto">${a.gruppi.includes(k)?'sì':''}</td><td class="n ${s>0?'bene':s<0?'male':'muto'}">${s?f3(x.fascia)+' ':''}${s>0?'a favore':s<0?'contro':'indifferenti'}</td>`); });
  else r('g', `<td colspan="3">${a.gruppi.length?a.gruppi.map(k=>COND[k]).join(', '):'<span class="muto">nessuno direttamente</span>'}</td>`);
  return `<table class="led">${righe.join('')}</table>`;
}
function anteC(d){
  return `<div class="ante">${testa(d)}${tabella(d, true)}<p class="min muto">${chiStima(d)}</p>
    ${testDi(d)?'':testBtn(d)}${mappa(d)}${voto(d,'barre')}${seggi(d)}<p class="min muto">${nota(d)}</p></div>`;
}

// ---------- D · il cartellino di A col prima e dopo di C (scelta di Mario del 12/11) ----------
function anteD(d){
  return `<div class="cart osc"><i class="spillo"></i>${testa(d)}${tabella(d, false)}<p class="min muto">${chiStima(d)}</p>
    ${gruppi(d)}${mappa(d)}${voto(d)}${seggi(d)}<p class="min muto">${nota(d)}</p></div>`;
}

// ---------- rifiuti, vuoti e l'anteprima nel dettaglio ----------
function anteprimaHtml(){
  const d=anteDati(), cr=st.ctx==='cruscotto';
  const back=`<button class="link indietro" data-ante="">‹ ${cr?'Torna alla riga':d&&d.misura?'Torna alla misura':'Torna alla bozza'}</button>`;
  if(!d||d.vuota) return back+`<p class="sec muto">La bozza è vuota.</p>`;
  if(d.manca) return back+`<div class="ph">Anteprima che qui non gira. Nel prototipo sono vere: salario minimo (7, 9, 11 €/h), ZES, autonomia, numero dei parlamentari, salario minimo con le pensioni, la proporzionale al 3%, la proposta sul nucleare, il decreto di fondi e quello d’evento.</div>`;
  if(!d.a){
    const t = d.misura ? d.misura.nome : (d.valori||[]).map(x=>{const z=disp(x.disposizione); return z?`${z.nome}: ${gN(z,x.gradino)}`:'';}).join('; ');
    let h=back+`<span class="occ">Anteprima</span><h4 class="tit">${esc(t)}</h4><p class="sec male"><b>Il core la rifiuta:</b> «${esc(d.rifiuto.replace('comando non ammesso: ',''))}»${d.ricostruito?' <span class="min muto">(testo ricostruito sul rifiuto vero)</span>':''}</p>`;
    if(d.inesame) h+=`<div class="ph"><b>Buco della Vista.</b> Una misura in calendario porta linee e forbice, non costo, effetti né gruppi; <b>anteprima</b> la rifiuta perché è già in esame. Senza un dato nuovo del core, l’anteprima si legge solo prima di presentare.</div>${testBtn(d)}`;
    else if(d.opp) h+=`<div class="ph">All’opposizione l’anteprima arriva con <b>anteprima_proposta</b>, rimandata al piano di core (fetta 11g).</div>`;
    else { const m=misure().find(x=>(x.valori||[]).some(y=>(d.valori||[]).some(z=>z.disposizione===y.disposizione))); if(m) h+=`<p class="sec">In esame: ${esc(m.nome)} <button class="link" data-sel="m:${m.id}">apri ›</button></p>`; }
    return h;
  }
  return back+({A:anteA,B:anteB,C:anteC,D:anteD}[st.ant]||anteD)(d);
}

// ---------- il cruscotto ridotto (ospite delle proposte e dei decreti) ----------
function cruscottoHost(){
  const v=V(), H=HOST(), ev=(st.stato==='gravedec'?v.eventi:H.eventi)[0], sel=st.ante, grave=st.stato==='gravedec';
  const kd = grave ? 'decreto_grave' : 'decreto', dz=A20[kd].valori[0], z=disp(dz.disposizione);
  const riga = (k, t, s, az) => `<div class="r ${sel===k?'sel':''}"><span class="seg"></span><span class="t">${t}</span><span class="a">${az}</span><span class="s">${s}</span></div>`;
  const evento = ev ? `<div class="box evb"><span class="occ">${esc(ev.famiglia)}${ev.regione?' · '+esc(ev.regione):''}</span><h4 class="tit">${esc(ev.nome)} · ${euroS(Number(ev.costo))}</h4>
    <p class="sec muto">${esc(ev.causa)}</p><p class="sec">Fondo di riserva rimasto: <b class="${Number(H.fondo_residuo||v.fondo_residuo||0)<Number(ev.costo)?'male':''}">${euroS(Number(H.fondo_residuo??v.fondo_residuo??0))}</b></p>
    <div class="az">${ev.opzioni.map(o=>`<button class="btn p ${o.default?'scelto':''}">${esc(o.nome)}</button>`).join('')}</div>
    ${riga(kd, `Decreto sulle norme dell’evento: ${esc(z.nome)} → ${esc(gN(z,dz.gradino))}`, `l’evento apre il decreto · quali norme lo dirà il core <span class="r11g" data-perche="la Vista non dice quali disposizioni il decreto dell’evento ammette">rimando</span>`, `<button class="btn p">Emana il decreto</button><button class="link" data-ante="${kd}">Anteprima ›</button>`)}</div>` : '';
  const props = grave ? '' : `<h4 class="tit" style="margin-top:12px">Proposte dei ministri</h4>${H.proposte.map(p=>riga('p:'+p.dicastero, esc(p.proposta.nome), `${esc(dic(p.dicastero))} · ${esc(p.proposta.motivo)}`,
      `<button class="btn p">Accogli</button><button class="btn p">Rinvia</button><button class="btn p">Respingi</button><button class="link" data-ante="p:${p.dicastero}">Anteprima ›</button>`)).join('')}`;
  return `<main class="corpo ola ${st.ante&&st.apre==='largo'?'largo':''}"><div><div class="capo"><h3 class="tit">Cruscotto</h3><span class="sec muto">Ordine del giorno, ridotto dal prototipo del cruscotto</span></div>${evento}${props}</div>
    <aside class="lato">${st.ante?anteprimaHtml():'<p class="sec muto">Scegli una riga.</p>'}</aside></main>`;
}

// ---------- l'oscillazione: solo dopo un gesto, smorzata, mai in loop ----------
function oscilla(){
  const co=scr.querySelector('.corpo'), la=co&&co.querySelector(':scope>.lato');
  if(la) la.style.maxHeight=(co.clientHeight-26)+'px';
  if(st.scorri && co){ st.scorri=false; const r=co.querySelector('.dr.sel'); if(r) co.scrollTop=r.offsetTop-co.clientHeight/3; }
  if(!st.gesto) return; st.gesto=false;
  const k = st.mov==='2' ? .5 : 1;
  if(st.mov==='0' || V().grave) return;
  const r=scr.firstElementChild, onda=(el, amp, dur, delay=0)=>el.animate(
    [0,1,-.72,.5,-.33,.2,-.1,.04,0].map(x=>({transform:`rotate(${(x*amp).toFixed(2)}deg)`})), {duration:dur*k, delay:delay*k, easing:'ease-in-out'});
  if(st.ant==='A'||st.ant==='D') r.querySelectorAll('.cart.osc').forEach(el=>onda(el, 4.5, 1900));
  if(st.ant==='B'){ r.querySelectorAll('.asta.osc').forEach(el=>onda(el, 2, 2000));
    r.querySelectorAll('.pz.osc').forEach((el,i)=>{ const L=+el.dataset.l; onda(el, 9-Math.min(5,L/40), 1300+L*5, 60+i*70); }); }
  if(st.ant==='C'){
    const ora={}; r.querySelectorAll('.led tr[data-k]').forEach(tr=>ora[tr.dataset.k]=tr.innerHTML);
    if(st.prevC) r.querySelectorAll('.led tr[data-k]').forEach(tr=>{ if(st.prevC[tr.dataset.k]!==ora[tr.dataset.k]) tr.querySelectorAll('td').forEach(td=>onda(td, 1.6, 1200)); });
    st.prevC=ora;
  }
}

// ======================= calendario: tutte le misure, vere e presentate qui =======================
function misure(){ return [...V().calendario, ...st.nuove]; }
function forma(m){
  return {riforma:'Legge ordinaria', elettorale:'Legge elettorale', conversione:'Conversione di decreto', bilancio:'Legge di bilancio', sfiducia:'Mozione di sfiducia',
    costituzionale:`Costituzionale · ${m.deliberazione||1}ª deliberazione`}[m.forma] || m.forma;
}
function chiLaPorta(m){
  if(m.finta) return 'presentata adesso (in memoria)';
  if(m.promotore) return m.promotore==='giocatore' ? 'tua proposta, nel posto riservato' : `proposta di ${nomeP(m.promotore)}, nel posto riservato all'opposizione`;
  if(m.proponente) return `del ministro ${dic(m.proponente)}`;
  if(m.forma==='bilancio') return 'del governo';
  return opp() ? 'del governo' : 'presentata da te';
}
// ponytail: i posti li conta qui la UI come `presenta` (parlamento/mod.rs:585-602); in 11g li porta Vista.posti.
function posti(){
  const M=misure(), dentro=f=>M.filter(f);
  const dec=dentro(m=>m.forma==='conversione'), bil=dentro(m=>m.forma==='bilancio');
  const ord=dentro(m=>(m.forma==='riforma'||m.forma==='elettorale') && !m.promotore);
  const cos=dentro(m=>m.forma==='costituzionale'), ris=dentro(m=>m.promotore);
  const P=[{k:'Decreti', tipo:'dec', m:dec, sempre:true}];
  for(let i=0;i<3;i++) P.push({k:`Ordinaria ${i+1}/3`, tipo:'ord', m:ord[i]?[ord[i]]:[]});
  if(ord.length>3) P[3].m.push(...ord.slice(3));
  P.push({k:'Costituzionale', tipo:'cos', m:cos});
  P.push({k:'Opposizione', tipo:'ris', m:ris});
  return {P, bil, liberi:{ord:3-Math.min(3,ord.length), cos:cos.length?0:1, ris:V().posto_riservato}};
}
function lineeHtml(m){
  const L=Object.fromEntries((m.linee||[]).map(l=>[l.partito,l.si]));
  return `<span class="lin" title="linee: pieno = sì">${partiti().map(p=>`<i class="${L[p]?'si':''} ${p==='giocatore'?'g':''}" title="${esc(nomeP(p))}: ${L[p]?'sì':'no'}"></i>`).join('')}</span>`;
}
function fb(f, ramo){
  if(!f) return '<span class="r11g">dall’anteprima</span>';
  const T=tot(ramo), [a,b]=f[ramo], mg=f['maggioranza_'+ramo];
  return `<span class="fb" title="sì attesi ${a}–${b}, ne servono ${mg}"><i style="left:${a/T*100}%;width:${Math.max(1,(b-a)/T*100)}%"></i><b style="left:${mg/T*100}%"></b></span>`;
}
const bilico = m => m.forbice?.in_bilico ? '<span class="chip rosso">in bilico</span>' : '';
const emAperti = m => (m.emendamenti||[]).filter(e=>e.stato==='aperto');
const sceltiEm = m => emAperti(m).filter(e=>st.sc.em[m.id+':'+e.partito]!=null).length;

// ======================= dettaglio: una misura =======================
function dettMisura(m){
  const v=V(), f=m.forbice, ramo=r=>f?`<span class="sec">${r==='camera'?'Camera':'Senato'}</span>${fb(f,r)}<span class="sec nf">${f[r][0]}–${f[r][1]} <span class="muto">su ${f['maggioranza_'+r]}</span></span>`:'';
  const L=Object.fromEntries((m.linee||[]).map(l=>[l.partito,l.si]));
  let h=`<span class="occ">${esc(forma(m))}</span><h4 class="tit">${esc(m.nome)}</h4><p class="sec muto">${esc(chiLaPorta(m))} · ${quando(m.voto||v.data)}</p>`;
  if(m.finta) return h+`<div class="ph">Linee, forbice ed emendamenti arrivano dalla Vista al turno dopo; qui si vedrebbero subito con <b>anteprima</b>.</div>`+annulla(m);
  h+= st.v==='D' && f ? `<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:8px;align-items:end">${emiciclo(m,'camera',560)}${emiciclo(m,'senato',560)}</div>${bilico(m)}`
    : `<div class="forb" style="grid-template-columns:auto minmax(0,1fr) auto">${ramo('camera')}${ramo('senato')}</div>${bilico(m)}`;
  h+=`<div class="dati">${partiti().map(p=>`<dt>${esc(nomeP(p))}</dt><dd class="${L[p]?'':'muto'}"><b>${L[p]?'sì':'no'}</b></dd>`).join('')}</div>`;
  if(m.forma==='elettorale' && m.seggi?.length) h+=seggiTab(m.seggi,'Seggi con la legge nuova, sul sondaggio pubblico');
  if(m.forma==='costituzionale') h+=`<p class="sec">Due deliberazioni a distanza di almeno un turno. Senza i due terzi alla seconda (${Math.ceil(tot('camera')*2/3)} alla Camera, ${Math.ceil(tot('senato')*2/3)} al Senato), referendum confermativo.</p>`;
  // emendamenti: al governo li decide il giocatore
  const E=m.emendamenti||[];
  if(E.length) h+=`<div class="em"><span class="occ" style="color:var(--ink)">Emendamenti degli alleati</span>${E.map(e=>{
    const k=m.id+':'+e.partito, s=st.sc.em[k];
    const az = e.stato!=='aperto' ? `<span class="chip">${e.stato}</span>` : v.governa ? `<span class="az" style="margin:0"><button class="btn p ${s===true?'scelto':''}" data-em="${k}" data-o="1">Accogli</button><button class="btn p ${s===false?'scelto':''}" data-em="${k}" data-o="0">Respingi</button></span>` : '';
    return `<div class="voce" style="border-top:0"><span><b>${esc(nomeP(e.partito))}</b>: ${esc(e.testo)}</span>${az}<small>${esc(e.motivo)}${e.stato==='aperto'&&v.governa?'. Senza scelta: resta aperto, si vota il testo com’è':''}</small></div>`;}).join('')}<span class="min muto">Respingere costa intesa e franchi tiratori.</span></div>`;
  // fiducia
  if(v.governa && ['riforma','elettorale','conversione'].includes(m.forma) && !m.promotore){
    const no=m.alleati_contro_fiducia||[], on=m.fiducia||st.sc.fid[m.id];
    const chiede=st.conf==='fid'+m.id && !on;
    h+=`<div class="em"><div class="conf">${on?'<span class="chip pieno">Fiducia posta</span>':chiede?`<button class="btn via pieno" data-fid="${m.id}">Conferma: poni la fiducia</button><button class="btn p" data-conf="">Annulla</button>`:`<button class="btn" data-conf="fid${m.id}">Poni la fiducia</button>`}
      <span class="sec">${no.length?`<b class="male">Voterebbero no: ${no.map(nomeP).join(', ')}</b>`:'Nessun alleato voterebbe no'}</span></div>
      <span class="min muto">Cadono emendamenti e franchi tiratori, si vota in un turno; costa intesa, e se manca la maggioranza il governo cade.</span></div>`;
  }
  // linea del giocatore: all'opposizione su tutto, al governo sulle proposte dell'opposizione
  if(opp() || m.promotore && m.promotore!=='giocatore'){
    const s = m.id in st.sc.lin ? st.sc.lin[m.id] : m.linea_giocatore, dflt=L.giocatore;
    h+=`<div class="em"><span class="occ" style="color:var(--ink)">La tua linea</span><div class="conf">
      <button class="btn p ${s===true?'scelto':''}" data-lin="${m.id}" data-o="1">Sì</button><button class="btn p ${s===false?'scelto':''}" data-lin="${m.id}" data-o="0">No</button>
      <button class="btn p ${s==null?'scelto':''}" data-lin="${m.id}" data-o="">Come da posizione (${dflt?'sì':'no'})</button></div></div>`;
  }
  return h+`<button class="link" style="justify-self:start" data-ante="m:${m.id}">Anteprima della misura ›</button>`;
}
const annulla = m => `<button class="btn p" data-ritira="${m.id}">Ritira (solo nel prototipo)</button>`;
function seggiTab(S, tit){
  return `<div><span class="occ" style="color:var(--ink)">${tit}</span><div class="sg"><span class="h">partito</span><span class="h n">Camera</span><span class="h n">Senato</span>
    ${partiti().map(p=>{const x=S.find(s=>s.partito===p)||{camera:0,senato:0}; const sg=n=>`<span class="n ${n>0?'bene':n<0?'male':'muto'}">${n>0?'+':n<0?'−':''}${Math.abs(n)}</span>`;

function scala(d){

function bozzaBox(){
  const v=V(), B=Object.entries(st.bozza);
  if(!B.length) return `<div class="bozzab vuota sec">La bozza è vuota: ${st.v==="D"?"apri una disposizione con «Cambia ›» e ":""}clicca un gradino per metterlo in una legge.</div>`;
  const ds=B.map(([id])=>disp(id)), nor=new Set(ds.map(d=>d.norma));
  const tipo = nor.has('costituzionale') ? 'norma costituzionale' : nor.has('elettorale') ? 'legge elettorale' : 'legge di riforma';
  const val=B.map(([disposizione,gradino])=>({disposizione,gradino})), A=antePer(val);
  const {liberi}=posti(), cos=tipo==='norma costituzionale';
  const misto = nor.size>1 && nor.has('costituzionale');
  const verbo = opp() ? 'Porta nel posto riservato' : cos ? 'Proponi la norma costituzionale' : `Presenta la ${tipo}`;
  const no = misto ? 'una norma costituzionale non si mescola alle altre' : opp() ? (v.posto_riservato?'':'il posto riservato di questo turno è già occupato')
    : cos ? (liberi.cos?'':'calendario pieno: il posto costituzionale è occupato') : (liberi.ord?'':'calendario pieno: tre leggi ordinarie già in esame');

    ${st.rif?`<p class="sec male"><b>Rifiutata:</b> ${esc(st.rif)}</p>`:''}
    <div class="conf"><button class="btn pieno" data-presenta="${esc(no)}">${verbo}</button><button class="link" data-svuota>svuota</button>${no?`<span class="min muto">${esc(no)}</span>`:''}</div></div>`;
}
function rifBozza(val){ const t=st.stato==='ordinario' && TUTTE.find(x=>x.rifiuto && chiaveV(x.valori)===chiaveV(val)); return t ? t.rifiuto.replace('comando non ammesso: ','') : ''; }

function emiciclo(m, ramo, W){
  const T=tot(ramo), f=m.forbice, rows=ramo==='camera'?9:6, R0=W*.2, R1=W*.48, P=[];
  const rr=Array.from({length:rows},(_,i)=>R0+(R1-R0)*i/(rows-1)), sum=rr.reduce((a,b)=>a+b,0);
  let left=T; rr.forEach((r,i)=>{ const n=i===rows-1?left:Math.round(T*r/sum); left-=n;
    for(let j=0;j<n;j++){ const a=Math.PI*(1-(j+.5)/n); P.push({a, x:W/2+r*Math.cos(a), y:W*.5-r*Math.sin(a)}); } });
  P.sort((p,q)=>q.a-p.a);
  const [lo,hi]=f?f[ramo]:[0,0], mg=f?f['maggioranza_'+ramo]:0, rad=ramo==='camera'?W/90:W/62;
  const am=Math.PI*(1-mg/T);
  return `<div><svg class="emic" viewBox="0 0 ${W} ${W*.56}" width="100%" role="img" aria-label="${ramo}: sì attesi da ${lo} a ${hi}, ne servono ${mg}">
    <defs><pattern id="rt${ramo}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="var(--carta)"/><rect width="1.4" height="4" fill="var(--ink)"/></pattern></defs>
    ${P.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${i<lo?'var(--ink)':i<hi?`url(#rt${ramo})`:'var(--carta)'}" stroke="var(--ink)" stroke-width="1"/>`).join('')}
    <line x1="${W/2+R0*.8*Math.cos(am)}" y1="${W*.5-R0*.8*Math.sin(am)}" x2="${W/2+(R1+rad*2)*Math.cos(am)}" y2="${W*.5-(R1+rad*2)*Math.sin(am)}" stroke="var(--rosso)" stroke-width="2.5"/>
    </svg><p class="sec" style="text-align:center"><b>${ramo==='camera'?'Camera':'Senato'}</b> · ${lo}–${hi} sì · ne servono ${mg}</p></div>`;
}

}
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));

function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo,.palco')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.corpo'), scorre = c && c.scrollHeight>c.clientHeight+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'il corpo scorre':''].filter(Boolean).join(' · ');

      const m={id:finte++, finta:!A, nome:val.map(z=>`${disp(z.disposizione).nome}: ${gN(disp(z.disposizione),z.gradino)}`).join('; '), valori:val,
        forma: nor.has('costituzionale')?'costituzionale':nor.has('elettorale')?'elettorale':'riforma', promotore: opp()?'giocatore':null, voto:{...V().data, trimestre:V().data.trimestre%4+1, anno:V().data.anno+(V().data.trimestre===4)},

  }
  else if(d.svuota!=null){ st.bozza={}; st.rif=null; }
  else if(d.ritira){ st.nuove=st.nuove.filter(m=>String(m.id)!==d.ritira); st.sel=null; }

function perche(e){

  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
