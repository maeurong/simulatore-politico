<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Bilancio» (22), mappa v1-piano-11-ui.
  Domanda: com'è fatto il passaggio del bilancio? Bozza con le cifre nominali dell'anno prima e «indicizza» per tutto o
  per voce col costo esatto (40); aliquote delle quattro imposte, budget dei dicasteri in funzionamento e margine, fondo
  di riserva, saldo contro il tetto UE (39, 43) con la perdita reale accanto (41); emendamenti degli alleati (44);
  presentazione e riepilogo del presentato; esercizio provvisorio (45); posto del piano strutturale riveduto (51) e
  dell'avviso del MES.
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Prospetto — un solo foglio di ragioneria (entrate, dicasteri, fondo) con «in vigore» e «proposta» affiancati;
       a lato il conto (saldo contro il tetto, costo sulla bozza) sopra il dettaglio della riga e gli emendamenti
    B  Bilancia  — in testa il giogo della spesa netta contro il tetto UE a tutta pagina; sotto entrate e spesa a
       fronte, i dicasteri come barre (salari, acquisti, margine, resto), gli emendamenti appuntati sulle righe
    C  Iter      — la legge per passi (Indicizza · Imposte · Dicasteri e margine · Presenta · Emendamenti), un passo per
       pagina; a lato il conto sempre aperto
  Stati, ?stato=: bozza (2027T4, prima di presentare) · presentato (emendamenti aperti) · decisi (Centrodestra accolto,
  Destra respinto) · ripresentato (indicizzato per tutto, dopo) · provvisorio (2030T1, esercizio provvisorio) ·
  opposizione (2027T4, governo IA; ?opp=barrata|lettura).
  Dati: viste/22-bilancio.json (genera/, tutto giocato). Riepiloghi veri di `riepilogo_bilancio` per la bozza, per
  «indicizza» su tutto, sulle soglie Irpef e su ogni dicastero da solo, Iva al 24%, primo scaglione al 21%, margine della
  Sanità raddoppiato dal funzionamento o in disavanzo, Iva al 95% (rifiuto); `riepilogo_presentato` dopo la
  presentazione, «se accogli» per emendamento. Nel prototipo una modifica alla volta: le combinazioni le calcola il core.
  Le cifre del bilancio presentato la Vista non le porta: qui sono ricostruite dalla bozza (vedi domanda nel ticket).
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A), cornice da 21-conti. Non è codice di produzione.

  VERDETTO (Mario, 12/11/2026), nel ticket 22: B · Bilancia. Cifre del presentato rimandate al core; funzionamento
  tagliato scritto dalla UI (salari e acquisti sulla bozza, la regola a parole); all'opposizione la sezione è barrata
  e il riepilogo del governo va in Aula; dopo la presentazione «Modifica e ripresenta». Il file si apre su B.
  Scartate: A e C dalla barra, ?opp=lettura.
-->

<head>
<meta charset="utf-8">
<title>Prototipo Bilancio · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block;overflow:visible}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:baseline}
.dati dt{color:var(--grigio)}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.rosso{border-color:var(--rosso);color:var(--rosso)}
.chip.pieno{background:var(--rosso);border-color:var(--rosso);color:var(--carta)}
.g .chip.pieno{background:var(--ink);border-color:var(--ink)}

/* cornice A · Gerenza (da 08) */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);white-space:nowrap}
.pila{display:flex;flex-direction:column;gap:3px}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative;
  grid-template-columns:minmax(0,1fr) var(--lato)}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez)}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:4px}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start;min-width:0}
.lato h4{font-size:var(--c-sez)}
.grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:8px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:8px}
.grp:first-child{margin-top:0}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:baseline;padding:3px 4px;border-bottom:var(--filo);cursor:pointer;font-size:var(--c-sec)}
.r:hover{background:var(--velo)}
.r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .x{white-space:nowrap;font-weight:700;text-align:right}
.r .x small{font-weight:400;color:var(--grigio);margin-left:6px}
.r.tre{grid-template-columns:minmax(0,1fr) 62px 66px}
.tab{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.tab th{font-size:var(--c-min);text-align:right;color:var(--grigio);font-weight:700;padding:2px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab td{padding:3px 6px;border-bottom:var(--filo);text-align:right;white-space:nowrap}
.tab tr[data-sel]{cursor:pointer}
.tab tr[data-sel]:hover td{background:var(--velo)}
.tab tr.sel td{background:var(--velo)}
.pb{display:inline-block;height:7px;background:var(--rosso);vertical-align:middle;margin-left:5px}
.pb.bene{background:var(--verde)}
.num4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.num4 .c{border-top:1.5px solid var(--ink);padding-top:3px;cursor:pointer}
.num4 .c:hover{background:var(--velo)}
.num4 .c .k{font-size:var(--c-min);color:var(--grigio);line-height:1.2}
.num4 .c .v{font-family:var(--tit);font-size:var(--c-pag);font-weight:800;line-height:1.05}
.num4 .c .r2{font-size:var(--c-min);color:var(--grigio)}
.riv{font-size:var(--c-sec);display:grid;gap:2px;margin-top:4px}
.sit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 4px;border-bottom:var(--filo);cursor:pointer;align-items:center}
.sit:hover{background:var(--velo)}
.sit.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sit .n{font-weight:700;font-size:var(--c-sec)}
.sit .d{grid-column:1/-1;font-size:var(--c-min);color:var(--grigio)}
.sit svg{grid-column:1/-1}
.sit.on .n{color:var(--rosso)}
.studi{border:var(--forte);padding:10px 12px;display:grid;gap:8px}
.studi .prezzo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.fan .k{font-size:var(--c-min);color:var(--grigio)}
.rif{border-left:3px solid var(--rosso);padding:2px 8px;font-size:var(--c-sec);color:var(--rosso)}
.indietro{font-size:var(--c-sec);text-decoration:underline;text-underline-offset:2px;justify-self:start}

/* A · Listino */
.listino{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:0;align-content:start}
.listino>section{padding:0 14px;border-left:var(--filo);display:grid;gap:6px;align-content:start;min-width:0}
.listino>section:first-child{padding-left:0;border-left:0}
.listino h3.tit{font-size:var(--c-riq)}

/* B · Strumenti */
.strum{display:grid;gap:10px;align-content:start}
.termo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border-bottom:var(--doppio);padding-bottom:6px}
.termo .t{display:grid;justify-items:center;gap:2px;padding:0 6px;border-left:var(--filo);cursor:pointer;text-align:center}
.termo .t:first-child{border-left:0}
.termo .t:hover{background:var(--velo)}
.termo .t.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.termo .t b{font-size:var(--c-sec);line-height:1.15}
.termo .t.on b{color:var(--rosso)}
.termo .t span{font-size:var(--c-min);color:var(--grigio);line-height:1.2}
.mezzo{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 var(--canale)}
.mezzo>div{min-width:0}
.mezzo .num4{grid-template-columns:repeat(4,minmax(0,1fr))}
.barre{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:3px 10px;align-items:center;font-size:var(--c-sec)}
.barre>div{cursor:pointer}
.barre .sp{height:12px;display:flex}
.barre .sp i{height:100%;border-right:1px solid var(--carta)}
.tess{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tess button{border:var(--filo);padding:3px 5px;display:grid;font-size:var(--c-min);line-height:1.2;min-width:0}
.tess button:hover{background:var(--velo)}
.tess button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--grigio)}
.tess button b{font-size:var(--c-sec)}
.tess button.sel{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--velo)}

/* C · Schede */
.schede{display:flex;gap:0;border-bottom:var(--forte);margin-bottom:8px}
.schede button{padding:5px 14px;font-weight:700;color:var(--grigio);border:1.5px solid transparent;border-bottom:0}
.schede button.qui{color:var(--ink);border-color:var(--ink);background:var(--carta);margin-bottom:-2px;padding-bottom:7px}
.schede button small{font-weight:400;margin-left:4px}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:150px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
</style>
<style>
/* ===== Bilancio ===== */
.conto{border:var(--forte);padding:8px 10px;display:grid;gap:6px}

.em{border:1.5px solid var(--ink);padding:6px 8px;display:grid;gap:4px;font-size:var(--c-sec)}

.em .t{font-weight:700}

/* B */
.giogoB{border-bottom:var(--doppio);padding-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;align-items:end}
.fronte{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:0 var(--canale)}

.leg{display:flex;gap:12px;font-size:var(--c-min);color:var(--grigio)}

  const tutto = puoModificare()? (st.mod==='tutto' ? `<span class="az"><span class="min bene">indicizzato per tutto</span><button class="link" data-mod="">annulla</button></span>` : `<span class="az"><button class="btn" data-mod="tutto">Indicizza tutto</button><span class="min muto">${euroS(S().var.tutto.riepilogo.costo_spesa)} spesa · ${euroS(-S().var.tutto.riepilogo.costo_entrate)} gettito</span></span>`) : '';
  return `<table class="tab"><tr><th>Voce</th><th>${o.anno} in vigore</th><th>${annoB()} ${presentato()?'presentata':'proposta'}</th><th>Reale</th><th style="text-align:right">${tutto}</th></tr>
    <tr class="sez"><td colspan="5">Entrate · aliquote</td></tr>${rowsI}${altre}
    <tr class="sez"><td colspan="5">Spesa dei dicasteri · annua</td></tr>${rowsD}

}
function stepper(mod,val){
  const on=st.mod===mod;
  const giu = mod==='irpef21' ? (on?'':`data-mod="irpef21"`) : (on?`data-mod=""`:'aria-disabled="true"');
  const su = mod==='iva24' ? (on?'aria-disabled="true"':`data-mod="iva24"`) : (on?`data-mod=""`:'aria-disabled="true"');
  const g2 = mod==='irpef21' ? (on?'aria-disabled="true"':`data-mod="irpef21"`) : giu;
  const s2 = mod==='irpef21' ? (on?`data-mod=""`:'aria-disabled="true"') : su;
  return `<span class="step"><button ${g2} title="−1 punto">−</button><span>${pct(val)}</span><button ${s2} title="+1 punto">+</button></span>`;
}
function emendamenti(compatto){

    const az = e.stato==='aperto' ? `<div class="riga"><button class="btn" data-emend="accogli:${e.partito}">Accogli</button><button class="btn" data-emend="respingi:${e.partito}">Respingi</button>${a?`<span class="min muto">se accogli: ${euroS(a.costo_spesa)} · spesa netta ${seg(a.crescita_spesa_netta)}%</span>`:''}</div><span class="nota">Senza scelta: resta aperto, si vota il testo com’è.</span>`
      : `<div class="riga"><span class="chip ${e.stato==='respinto'?'rosso':''}">${e.stato}</span>${e.stato==='respinto'&&al?`<span class="min muto">intesa di ${esc(pnome(e.partito))} ${num(al.intesa,0)}</span>`:''}</div>`;
    return `<div class="em ${e.stato==='aperto'?'':'chiuso'}"><span class="t">${esc(pnome(e.partito))}</span>${compatto?'':`<span>${esc(e.testo)}</span>`}<span class="min muto">${esc(e.motivo)}</span>${az}</div>`;}).join('');
}
function presenta(){

    return `<div class="esito"><b>Presentata · si vota a fine turno</b><span>Camera ${f.camera[0]}–${f.camera[1]} sì · ne servono ${f.maggioranza_camera}</span><span>Senato ${f.senato[0]}–${f.senato[1]} sì · ne servono ${f.maggioranza_senato}</span></div>

    <span class="nota">${prov?'Si vota a fine turno. Se cade anche questa, il governo si dimette.':'Si vota a fine turno. Se cade: esercizio provvisorio da gennaio, con le cifre del '+vecchio().anno+' e nessuna misura con costo.'}</span>
    ${st.nota?`<span class="nota">${esc(st.nota)}</span>`:''}`;

function segnaposti(){
  return `<div class="ph"><b>Piano strutturale riveduto</b> · nel primo anno di un governo nuovo (storia 51). Lo porta il piano di core strutturale: la prima fetta dopo di quello lo riempie.</div>

}
function banda(){

// ============ dettaglio a lato ============
function dettaglio(){
  const s=st.sel, r=riep().r, b=proposta(), o=vecchio();
  const ind=`<button class="indietro" data-sel="">‹ Torna al conto</button>`;
  if(!s) return null;
  if(s.startsWith('dic:')){
    const id=s.slice(4), d=b.dicasteri.find(x=>x.id===id), z=S().bozza.dicasteri.find(x=>x.id===id), mi=V().ministri[id], p=r?perdita(r,id):null;
    const resto=d.spesa-d.salari-d.acquisti-d.margine;
    const sanita=id==='sanita'&&puoModificare();
    return `${ind}<h4 class="tit">${esc(dic(id))}</h4><span class="sec muto">${mi?esc(mi.nome)+' · '+esc(pnome(mi.partito)):'interim'}</span>
      <dl class="dati"><dt>spesa annua</dt><dd><b>${euro(d.spesa)}</b>${d.spesa!==z.spesa?` <span class="min">(bozza ${euro(z.spesa)})</span>`:''}</dd>
      <dt>funzionamento</dt><dd>salari ${euro(d.salari)} · acquisti ${euro(d.acquisti)}</dd><dt>margine</dt><dd><b>${euro(d.margine)}</b>${d.margine!==z.margine?` <span class="min">(bozza ${euro(z.margine)})</span>`:''}</dd><dt>resto</dt><dd>${euro(resto)}</dd>
      <dt>reale</dt><dd>${reale(p)} dal bilancio ${o.anno}</dd></dl>
      ${p>.05?`<p class="sec">${esc(dic(id))}: ${reale(p)} reale dal bilancio ${o.anno}.</p>`:''}
      ${azDic(id,r)}
      ${sanita?`<div class="grp"><span>Allarga il margine</span></div>
        <div class="riga" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ${st.mod==='marg_f'?'pieno':''}" data-mod="${st.mod==='marg_f'?'':'marg_f'}">dal funzionamento</button><button class="btn ${st.mod==='marg_d'?'pieno':''}" data-mod="${st.mod==='marg_d'?'':'marg_d'}">in disavanzo</button></div>
        <span class="nota">Nel prototipo: il margine raddoppia (+${euro(z.margine)}). Dal funzionamento costa zero al conto, ma la qualità del servizio sanitario peggiora con ritardo; in disavanzo pesa sul tetto.</span>`:''}`;
  }
  if(s.startsWith('irpef:')){
    const i=+s.slice(6), x=b.aliquote.irpef[i], p=r?perdita(r,'scaglione '+(i+1)):null;
    return `${ind}<h4 class="tit">Irpef · ${i+1}° scaglione</h4><dl class="dati"><dt>aliquota</dt><dd><b>${pct(x.aliquota)}</b></dd><dt>soglia</dt><dd>${x.fino_a?num(x.fino_a,0)+' €':'nessuna: l’ultimo'}</dd>${x.fino_a?`<dt>soglia reale</dt><dd>${reale(p)} dal ${o.anno}</dd>`:''}</dl>
      ${x.fino_a&&p>.05?`<p class="sec">La soglia è ferma a ${num(x.fino_a,0)} € nominali: con i prezzi saliti, più reddito paga l’aliquota sopra.</p>`:''}`;
  }
  if(s==='fondo') return `${ind}<h4 class="tit">Fondo di riserva</h4><dl class="dati"><dt>${annoB()}</dt><dd><b>${euro(b.fondo_riserva)}</b></dd><dt>rimasto ${o.anno}</dt><dd>${euro(o.fondo_residuo)}</dd></dl>
    <p class="sec">Lo spende solo il Presidente del Consiglio, sulle emergenze. Non si indicizza con «tutto».</p>${V().eventi.map(e=>`<div class="r"><span class="n">${esc(e.nome)}</span><span class="x">${e.costo?euro(e.costo):''}</span></div>`).join('')}`;
  if(['iva','ires','contributi'].includes(s)) return `${ind}<h4 class="tit">${s==='iva'?'Iva':s==='ires'?'Ires':'Contributi'}</h4><dl class="dati"><dt>aliquota</dt><dd><b>${pct(b.aliquote[s])}</b></dd><dt>in vigore</dt><dd>${pct(o.aliquote[s])}</dd></dl>
    <p class="nota">Nel prototipo si muove solo l’Iva, a 24% (e a 95% per vedere il rifiuto: <button class="link" data-mod="rif">prova</button>).</p>`;
  return null;
}
function lato(){
  const d=dettaglio();
  if(d) return d;
  return `${conto(presentato()?'Il conto della presentata':'Il conto')}${presentato()?emendamenti(true):''}${presenta()}`;
}

function testa(){
  const v=V();
  const t = presentato()? `Legge di bilancio ${annoB()} · presentata` : st.stato==='provvisorio' ? `Legge di bilancio ${annoB()} · esercizio provvisorio` : `Legge di bilancio ${annoB()} · bozza`;

}
function formaA(){
  return `<div>${testa()}${banda()}${prospetto()}<div style="display:grid;gap:6px;margin-top:8px">${presentato()?emendamenti(false):''}${segnaposti()}</div></div><aside class="lato">${lato()}</aside>`;

  const ent=`<section><div class="grp"><span>Entrate</span><span>aliquote ${annoB()}</span></div>
    ${b.aliquote.irpef.map((s,i)=>{ const p=r?perdita(r,'scaglione '+(i+1)):null; return `<div class="imp ${st.sel==='irpef:'+i?'sel':''}" data-sel="irpef:${i}"><span>Irpef ${s.fino_a?'fino a '+num(s.fino_a/1000,0)+' mila':'oltre'}</span><span class="v">${i===0&&puoModificare()?stepper('irpef21',s.aliquota):pct(s.aliquota)}</span>${s.fino_a?`<span class="d">soglia ${reale(p)} reale${i===0&&puoModificare()&&p>.05&&st.mod!=='scaglioni'?` · <button class="link" data-mod="scaglioni">indicizza le soglie</button> ${euroS(-S().var.scaglioni.riepilogo.costo_entrate)}`:''}</span>`:''}</div>`;}).join('')}
    ${[['iva','Iva'],['ires','Ires'],['contributi','Contributi']].map(([k,t])=>`<div class="imp ${st.sel===k?'sel':''}" data-sel="${k}"><span>${t}</span><span class="v">${k==='iva'&&puoModificare()?stepper('iva24',b.aliquote[k]):pct(b.aliquote[k])}</span></div>`).join('')}
    <div class="imp ${st.sel==='fondo'?'sel':''}" data-sel="fondo"><span>Fondo di riserva</span><span class="v" style="font-size:var(--c-lead)">${euro(b.fondo_riserva)}</span></div>
    ${segnaposti()}</section>`;
  const spe=`<section><div class="grp"><span>Spesa dei dicasteri</span>${puoModificare()?(st.mod==='tutto'?`<span class="bene">indicizzato per tutto · <button class="link" data-mod="">annulla</button></span>`:`<span><button class="link" data-mod="tutto">Indicizza tutto</button> ${euroS(S().var.tutto.riepilogo.costo_spesa)}</span>`):''}</div>
    <div class="leg"><span><i style="background:var(--ink)"></i>salari</span><span><i style="background:var(--grigio)"></i>acquisti</span><span><i style="background:var(--biro)"></i>margine</span><span><i style="background:var(--retino);border:1px solid var(--grigio)"></i>resto</span><span>· reale dal ${o.anno}</span></div>
    ${b.dicasteri.map(d=>{ const p=r?perdita(r,d.id):null, w=x=>(x/mx*100).toFixed(2)+'%', resto=d.spesa-d.salari-d.acquisti-d.margine;
      return `<div class="barD ${st.sel==='dic:'+d.id?'sel':''}" data-sel="dic:${d.id}"><span class="n">${esc(dic(d.id))}</span><span class="sp"><i style="width:${w(d.salari)};background:var(--ink)"></i><i style="width:${w(d.acquisti)};background:var(--grigio)"></i><i style="width:${w(Math.max(d.margine,mx*.004))};background:var(--biro)"></i><i style="width:${w(resto)};background:var(--retino);outline:1px solid var(--grigio);outline-offset:-1px"></i></span><span class="x" style="text-align:right;font-weight:700">${mld(d.spesa)}</span><span style="display:flex;gap:6px;justify-content:space-between">${reale(p)} ${azDic(d.id,r)}</span>${presentato()?slip(d.id):''}${funz(d)}</div>`;}).join('')}
    ${presentato()?'':''}</section>`;
  const latoB = dettaglio() || `${presentato()?emendamenti(true):''}${presenta()}${!presentato()?`<p class="nota">Il giogo in testa è il conto: spesa netta contro il tetto UE dell’anno, costo sulla bozza.</p>`:''}`;

const SERVIZIO = {sanita:'la qualità del servizio sanitario'}; // ponytail: nel prototipo solo la Sanità si ritocca
function funz(d){

  return `<span class="slip" style="border-color:var(--ink);color:var(--ink)"><span>${parti} sulla bozza${ds<0||da<0?` · ${SERVIZIO[d.id]||'il servizio'} peggiora con ritardo`:''}</span></span>`;

const PASSI=[['indicizza','Indicizza'],['imposte','Imposte'],['dicasteri','Dicasteri e margine'],['presenta','Presenta'],['emendamenti','Emendamenti']];

  if(passo==='imposte') main=`<table class="tab"><tr><th>Imposta</th><th>${o.anno}</th><th>${annoB()}</th><th>soglia reale</th></tr>
      ${b.aliquote.irpef.map((s,i)=>`<tr data-sel="irpef:${i}" class="${st.sel==='irpef:'+i?'sel':''}"><td>Irpef ${s.fino_a?'fino a '+num(s.fino_a,0)+' €':'oltre'}</td><td class="mut">${pct(o.aliquote.irpef[i].aliquota)}</td><td>${i===0&&puoModificare()?stepper('irpef21',s.aliquota):pct(s.aliquota)}</td><td>${s.fino_a?reale(r?perdita(r,'scaglione '+(i+1)):null):''}</td></tr>`).join('')}
      ${[['iva','Iva'],['ires','Ires'],['contributi','Contributi']].map(([k,t])=>`<tr data-sel="${k}" class="${st.sel===k?'sel':''}"><td>${t}</td><td class="mut">${pct(o.aliquote[k])}</td><td>${k==='iva'&&puoModificare()?stepper('iva24',b.aliquote[k]):pct(b.aliquote[k])}</td><td></td></tr>`).join('')}</table>`;
  if(passo==='dicasteri') main=`<table class="tab"><tr><th>Dicastero</th><th>Spesa</th><th>Salari</th><th>Acquisti</th><th>Margine</th><th>Reale</th></tr>
      ${b.dicasteri.map(d=>`<tr data-sel="dic:${d.id}" class="${st.sel==='dic:'+d.id?'sel':''}"><td>${esc(dic(d.id))}</td><td>${mld(d.spesa)}</td><td>${mld(d.salari)}</td><td>${mld(d.acquisti)}</td><td><b>${num(d.margine/1e9,2)} mld</b></td><td>${reale(r?perdita(r,d.id):null)}</td></tr>`).join('')}
      <tr data-sel="fondo" class="${st.sel==='fondo'?'sel':''}"><td>Fondo di riserva</td><td>${euro(b.fondo_riserva)}</td><td colspan="4" class="mut">fuori dai dicasteri</td></tr></table>
      <p class="nota" style="margin-top:6px">Il margine si allarga togliendo al funzionamento o in disavanzo: scegli un dicastero (nel prototipo, la Sanità).</p>`;
  if(passo==='presenta') main=`${conto('Riepilogo prima di presentare')}<div style="margin-top:8px;display:grid;gap:6px">${presenta()}</div><div style="margin-top:10px;display:grid;gap:6px">${segnaposti()}</div>`;
  if(passo==='emendamenti') main= presentato()? `${presenta()}<div style="margin-top:8px;display:grid;gap:6px">${emendamenti(false)}</div>` : `<p class="sec muto">Gli alleati chiedono emendamenti dopo la presentazione: indicizzare i loro dicasteri che perdono oltre la soglia.</p>`;
  const i=PASSI.findIndex(p=>p[0]===passo);
  const nav = !presentato()&&i<3 ? `<div class="avanti"><span>${i>0?`<button class="link" data-passo="${PASSI[i-1][0]}">‹ ${PASSI[i-1][1]}</button>`:''}</span><button class="link" data-passo="${PASSI[i+1][0]}">${PASSI[i+1][1]} ›</button></div>` : '';
  const latoC = dettaglio() || (passo==='presenta' ? `<p class="sec muto">Il conto è nella pagina.</p>` : conto(presentato()?'Il conto della presentata':'Il conto'));
  return `<div>${testa()}${banda()}${tabs}${main}${nav}</div><aside class="lato">${latoC}</aside>`;
}
function opposizione(){
  const rp=S().rp;
  if(st.opp==='barrata') return `<div style="grid-column:1/-1;display:grid;gap:8px;max-width:640px"><div class="ph">La sezione è barrata nel sommario («Non governi: il bilancio lo presenta il governo») e non si apre. Qui solo per confronto con «in lettura».</div>
    <p class="sec">Il core rifiuta il riepilogo a chi non governa: «${esc(S().rifiuto.rifiuto)}». Il bilancio del governo si legge in Aula, sulla riga «Legge di bilancio».</p></div>`;
  const prima=D.bozza.v, v=V();
  return `<div><div class="capo"><h3 class="tit">Legge di bilancio ${v.data.anno+1} · del governo</h3><span class="sec muto">In aula, si vota a fine turno. Tu decidi la linea in Aula.</span></div>
    <table class="tab"><tr><th>Voce</th><th>Reale dopo il bilancio</th></tr>${rp.perdita_reale.map(p=>`<tr><td>${p.voce.startsWith('scaglione')?'Irpef, soglia '+p.voce.slice(10):esc(dic(p.voce))}</td><td>${reale(p.perdita)}</td></tr>`).join('')}</table>
    <p class="nota" style="margin-top:6px">Le cifre del bilancio IA la Vista non le porta: solo il riepilogo, che è pubblico.</p></div>
    <aside class="lato"><div class="conto"><h4 class="tit">Il conto del governo</h4><div class="big">${seg(rp.crescita_spesa_netta)}%</div>${giogo(rp)}<span class="sec">${saldoFrase(rp)}</span>
    <div class="costi"><div><div class="k">spesa in più della bozza</div><div class="v">${euroS(rp.costo_spesa)}</div></div><div><div class="k">gettito perso</div><div class="v">${euroS(rp.costo_entrate)}</div></div></div></div><button class="link">Aula ›</button></aside>`;
}

// ============ resa ============
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const v=V();
  const bandaG = v.crisi ? `<div class="banda">Crisi di governo: solo ordinaria amministrazione.</div>` : grave() ? `<div class="banda">${esc(v.eventi.find(e=>e.tono==='grave').nome)}</div>` : '';
  const corpo = `<main class="corpo">${st.stato==='opposizione'?opposizione():st.v==='B'?formaB():st.v==='C'?formaC():formaA()}</main>`;
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${bandaG?'auto ':''}minmax(0,1fr)">${cornice()}${bandaG}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[sg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.corpo'), scorre = c && c.scrollHeight>c.clientHeight+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'il corpo scorre':''].filter(Boolean).join(' · ');
}
function vai(stato){ st.stato=stato; st.sel=null; st.mod=''; st.nota=''; }
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else if(b.id==='azzera'){ st.mod=''; st.nota=''; }
  else if(b.parentElement.dataset.k==='stato') vai(b.dataset.v);
  else st[b.parentElement.dataset.k]=b.dataset.v;
  render();
});
scr.addEventListener('click',e=>{
  const t=e.target, md=t.closest('[data-mod]'), em=t.closest('[data-emend]'), ps=t.closest('[data-passo]'), pr=t.closest('[data-presenta]'), sv=t.closest('[data-stato]'), s=t.closest('[data-sel]');
  if(md){ if(md.getAttribute('aria-disabled')==='true') return; st.mod=md.dataset.mod; e.stopPropagation(); }
  else if(em){ const [az,p]=em.dataset.emend.split(':'); if(st.stato==='presentato'){ vai('decisi'); st.nota=''; } }
  else if(pr){ if(st.stato==='bozza'){ const m=st.mod; vai(m==='tutto'?'ripresentato':'presentato'); } else if(st.stato==='provvisorio'){ st.nota='Nel prototipo la presentazione si prova sulla bozza del 2027.'; } }
  else if(sv){ vai(sv.dataset.stato); }
  else if(ps){ st.passo=ps.dataset.passo; st.sel=null; }
  else if(s){ st.sel = s.dataset.sel===st.sel ? null : (s.dataset.sel||null); }
  else return;
  render();
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
