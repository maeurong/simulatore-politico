  PROTOTIPO USA E GETTA — ticket «Conti» (21), mappa v1-piano-11-ui.
  Domanda: com'è fatta la sezione Conti? Bilancio in vigore con la perdita reale di ogni voce (41) e il fondo di riserva
  residuo; grandezze con la distanza dalla soglia e situazioni accese (121, 132); prima stima e revisione (119); spread
  (52); posto di PDE, conto di controllo, MES e ristrutturazione (50) e dei redditi per fascia (116), che porta il piano
  di core «esito e Vista completa» in 11g; il centro studi comprato con la cassa (123) con la previsione a quattro turni.
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Listino   — pagina economica a tre colonne (bilancio · economia · soglie), centro studi nel dettaglio a lato
    B  Strumenti — in testa le sei situazioni come termometri con le due soglie, sotto i numeri del trimestre e lo
       spread, in fondo il bilancio a barre; il centro studi si sovrappone ai numeri della prima stima
    C  Schede    — quattro schede (Bilancio, Economia, Soglie, Europa e debito) a tabella piena, dettaglio a lato;
       il centro studi sta nella scheda Economia
  Stati, ?stato=: ordinario (03) · opposizione (06) · accese (due situazioni accese) · vicina (recessione al primo
  trimestre sotto soglia) · spread (205 pb, recessione) · senza (bilancio non presentato da due anni) · zero · crisi ·
  grave (Viste 01, 05, 08, senza centro studi generato).
  Dati: viste/21-conti.json (genera/, tutto giocato): il centro studi comprato davvero in sei stati, con la cassa prima e
  dopo, il rifiuto del secondo acquisto e la `serie` (passacarte di 11a). Nel prototipo «Compra» mostra la Vista dopo
  l'acquisto. PDE, conto di controllo, MES, ristrutturazione e redditi per fascia: segnaposto, nessun numero inventato.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A). Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 12/11/2026), nel ticket 21: A · Listino con le grandezze a lato (?gr=lato); trimestri oltre la soglia
  e debito sul PIL rimandati al core. Il file si apre su questa forma. Scartate: B e C dalla barra, ?gr=pagina.
-->

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;

  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;

  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}

/* cornice A · Gerenza (da 08) */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}

.def{font-size:var(--c-min);color:var(--grigio);white-space:nowrap}
.pila{display:flex;flex-direction:column;gap:3px}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}

.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative;
  grid-template-columns:minmax(0,1fr) var(--lato)}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez)}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:4px}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start;min-width:0}
.lato h4{font-size:var(--c-sez)}
.grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:8px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:8px}
.grp:first-child{margin-top:0}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:baseline;padding:3px 4px;border-bottom:var(--filo);cursor:pointer;font-size:var(--c-sec)}
.r:hover{background:var(--velo)}
.r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .x{white-space:nowrap;font-weight:700;text-align:right}
.r .x small{font-weight:400;color:var(--grigio);margin-left:6px}
.r.tre{grid-template-columns:minmax(0,1fr) 62px 66px}
.tab{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.tab th{font-size:var(--c-min);text-align:right;color:var(--grigio);font-weight:700;padding:2px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab td{padding:3px 6px;border-bottom:var(--filo);text-align:right;white-space:nowrap}
.tab tr[data-sel]{cursor:pointer}
.tab tr[data-sel]:hover td{background:var(--velo)}
.tab tr.sel td{background:var(--velo)}
.pb{display:inline-block;height:7px;background:var(--rosso);vertical-align:middle;margin-left:5px}
.pb.bene{background:var(--verde)}
.num4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.num4 .c{border-top:1.5px solid var(--ink);padding-top:3px;cursor:pointer}
.num4 .c:hover{background:var(--velo)}
.num4 .c .k{font-size:var(--c-min);color:var(--grigio);line-height:1.2}
.num4 .c .v{font-family:var(--tit);font-size:var(--c-pag);font-weight:800;line-height:1.05}

.riv{font-size:var(--c-sec);display:grid;gap:2px;margin-top:4px}
.sit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:5px 4px;border-bottom:var(--filo);cursor:pointer;align-items:center}

.listino{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:0;align-content:start}

.termo .t.on b{color:var(--rosso)}
.termo .t span{font-size:var(--c-min);color:var(--grigio);line-height:1.2}
.mezzo{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 var(--canale)}
.mezzo>div{min-width:0}
.mezzo .num4{grid-template-columns:repeat(4,minmax(0,1fr))}
.barre{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:3px 10px;align-items:center;font-size:var(--c-sec)}
.barre>div{cursor:pointer}
.barre .sp{height:12px;display:flex}
.barre .sp i{height:100%;border-right:1px solid var(--carta)}
.tess{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tess button{border:var(--filo);padding:3px 5px;display:grid;font-size:var(--c-min);line-height:1.2;min-width:0}
.tess button:hover{background:var(--velo)}
.tess button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--grigio)}
.tess button b{font-size:var(--c-sec)}
.tess button.sel{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--velo)}

/* C · Schede */
.schede{display:flex;gap:0;border-bottom:var(--forte);margin-bottom:8px}
.schede button{padding:5px 14px;font-weight:700;color:var(--grigio);border:1.5px solid transparent;border-bottom:0}
.schede button.qui{color:var(--ink);border-color:var(--ink);background:var(--carta);margin-bottom:-2px;padding-bottom:7px}
.schede button small{font-weight:400;margin-left:4px}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:150px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
</style>

function grNome(g){ const m=g.nome.match(/^(.*?) \((.*)\)$/); return m?[m[1],m[2]]:[g.nome, 'indice, 100 al turno zero']; }
function grValore(g){
  if(g.valori.length>1){ const a=Math.min(...g.valori), b=Math.max(...g.valori); return `${num(a)}–${num(b)}<small>20 regioni</small>`; }
  const x=g.valori[0], base=grNome(g)[1].startsWith('indice')?100:0, d=x-base, buono=(g.verso==='sale')===(d>0);
  return `${num(x)}<small class="${Math.abs(d)<.05?'':buono?'bene':'male'}">${Math.abs(d)<.05?'=':seg(d)}</small>`;
}
function grandezze(){
  const g=V().grandezze;
  return GR.map(([t,a,b])=>`<div class="grp"><span>${t}</span></div>${g.slice(a,b).map(x=>`<div class="r ${st.sel==='gr:'+x.id?'sel':''}" data-sel="gr:${x.id}"><span class="n">${esc(grNome(x)[0])}</span><span class="x">${grValore(x)}</span></div>`).join('')}`).join('');
}
function bilancioTab(){
  const b=V().bilancio, mx=Math.max(5,...b.dicasteri.map(d=>Math.abs(d.perdita_reale)));
  const pr=p=>`<span class="${p>0?'male':'bene'}">${p>0?'−':'+'}${num(Math.abs(p))}%</span><span class="pb ${p>0?'':'bene'}" style="width:${(Math.abs(p)/mx*22).toFixed(0)}px"></span>`;
  return `<table class="tab"><tr><th>Dicastero</th><th>Spesa</th><th>Reale</th></tr>
    ${b.dicasteri.map(d=>`<tr data-sel="dic:${d.id}" class="${st.sel==='dic:'+d.id?'sel':''}"><td>${esc(dic(d.id))}</td><td>${mld(d.spesa)}</td><td>${pr(d.perdita_reale)}</td></tr>`).join('')}</table>
    <table class="tab" style="margin-top:6px"><tr><th>Irpef</th><th>Aliquota</th><th>Soglia reale</th></tr>
    ${b.aliquote.irpef.map((s,i)=>`<tr data-sel="irpef:${i}" class="${st.sel==='irpef:'+i?'sel':''}"><td>${s.fino_a?'fino a '+num(s.fino_a,0)+' €':'oltre'}</td><td>${num(s.aliquota*100,0)}%</td><td>${b.perdita_reale_scaglioni[i]!=null?pr(b.perdita_reale_scaglioni[i]):'<span class="muto">—</span>'}</td></tr>`).join('')}</table>
    <div class="sec muto" style="margin-top:4px">Iva ${num(b.aliquote.iva*100,0)}% · Ires ${num(b.aliquote.ires*100,0)}% · contributi ${num(b.aliquote.contributi*100,0)}%</div>`;
}
function fondo(){
  const b=V().bilancio, r=b.fondo_riserva? b.fondo_residuo/b.fondo_riserva : 0;
  return `<div class="r" data-sel="fondo" style="grid-template-columns:minmax(0,1fr) auto"><span class="n"><b>Fondo di riserva</b> · ${b.anno}</span><span class="x">${euro(b.fondo_residuo)}</span><span class="min muto" style="grid-column:1/-1">rimasti di ${euro(b.fondo_riserva)}</span>
    <span style="grid-column:1/-1;height:6px;border:1px solid var(--grigio);position:relative;margin-top:3px"><i style="position:absolute;inset:0 auto 0 0;width:${(r*100).toFixed(0)}%;background:var(--ink)"></i></span></div>`;
}
const STIMA = [['crescita_pil','PIL','annualizzato sul trimestre prima'],['disoccupazione','Disoccupazione',''],['inflazione_annua','Inflazione','sull’anno prima'],['disavanzo','Disavanzo','% del PIL del trimestre']];
function quattro(cls=''){
  const s=V().statistica, cs=studi();
  return `<div class="num4 ${cls}">${STIMA.map(([k,n,nota])=>`<div class="c" data-sel="stat:${k}"><div class="k">${n}${nota?' · '+nota:''}</div>
    <div class="v">${k==='crescita_pil'?seg(s.prima_stima[k]):num(s.prima_stima[k])}%</div>${cs?`<div class="r2">centro studi: <b>${k==='crescita_pil'?seg(cs.stima[k]):num(cs.stima[k])}%</b></div>`:''}</div>`).join('')}</div>`;
}
function revisione(){
  const r=V().statistica.revisione;
  if(!r) return `<div class="riv muto">Nessuna revisione: è il primo trimestre.</div>`;
  return `<div class="riv"><span class="muto">Rivista la stima di ${per(r.trimestre)}:</span>${STIMA.map(([k,n])=>{ const d=r.riveduta[k]-r.prima_stima[k];
    return `<span>${n} ${num(r.prima_stima[k])} → <b>${num(r.riveduta[k])}</b> <span class="${Math.abs(d)<.05?'muto':''}">(${seg(d)})</span></span>`;}).join('')}</div>`;
}
function grafSpread(W=260,H=70){
  const sr=S().serie.map(p=>p.spread_pb); if(sr.length<2) return `<div class="sec muto">La serie dello spread parte da questo turno.</div>`;
  const top=Math.max(600,...sr)+20, x=i=>(i/(sr.length-1)*W).toFixed(1), y=v=>(H-v/top*H).toFixed(1), s5=y(550);
  return `<svg width="100%" height="${H+14}" viewBox="0 -4 ${W} ${H+18}" aria-label="Spread per turno">
    <line x1="0" x2="${W}" y1="${s5}" y2="${s5}" stroke="var(--rosso)" stroke-dasharray="4 3"/><text x="${W}" y="${+s5-3}" text-anchor="end" font-size="10" fill="var(--rosso)">aste scoperte · 550</text>
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--grigio)"/>
    <polyline points="${sr.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <circle cx="${x(sr.length-1)}" cy="${y(sr.at(-1))}" r="3.5" fill="var(--ink)"/>
    <text x="0" y="${H+12}" font-size="10" fill="var(--grigio)">turno ${S().serie[0].turno}</text><text x="${W}" y="${H+12}" text-anchor="end" font-size="10" fill="var(--grigio)">turno ${S().serie.at(-1).turno}</text></svg>`;
}
function spread(grande){
  return `<div data-sel="spread" style="cursor:pointer"><div class="grp"><span>Spread Btp-Bund</span><span style="color:var(--ink)">${num(V().spread_pb,0)} pb</span></div>${grafSpread(grande?360:260, grande?110:56)}</div>`;
}
function europa(compatto){
  const r=(t,x)=>`<div class="r" style="cursor:default;grid-template-columns:minmax(0,1fr)"><span class="n" style="white-space:normal">${t}${x&&!compatto?` <span class="muto">· ${x}</span>`:''}</span></div>`;
  return `<div class="ph" style="display:grid;gap:2px"><b>Regole UE · in 11g</b>${r('Procedura per disavanzo eccessivo','stato, da quanti turni')}${r('Conto di controllo','% del PIL')}${compatto?'':r('Ultimo controllo, deviazione','% del PIL')+r('Proiezione al prossimo controllo','aprile–giugno')+r('Fondi di coesione','sospesi o no')+r('Margine UE per l’energia','anno')}
    <b style="margin-top:6px">Debito · in 11g</b>${r('Programma del MES','fine, disposizioni vincolate')}${r('Ristrutturazione','premio sullo spread, fine')}</div>`;
}
function redditi(){
  return `<div class="ph" style="display:grid;gap:2px"><b>Redditi per fascia · in 11g</b>${['bassa','media','alta'].map(f=>`<div class="r" style="cursor:default;grid-template-columns:minmax(0,1fr)"><span class="n">Fascia ${f} <span class="muto">· reddito, crescita, attesa</span></span></div>`).join('')}</div>`;
}
const PREV=[['pil','PIL','sull’anno prima'],['disoccupazione','Disoccupazione',''],['inflazione','Inflazione','sull’anno prima'],['debito','Debito','% del PIL, quattro trimestri']];
function ventaglio(prev,k,W=170,H=58){
  const c=prev.map(p=>p[k].centro), s=prev.map(p=>p[k].sigma), lo=Math.min(...c.map((v,i)=>v-2*s[i])), hi=Math.max(...c.map((v,i)=>v+2*s[i]));
  const x=i=>(8+i*(W-16)/(c.length-1)).toFixed(1), y=v=>(H-(v-lo)/(hi-lo)*H).toFixed(1);
  const banda=m=>`${c.map((v,i)=>x(i)+','+y(v+m*s[i])).join(' ')} ${c.map((v,i)=>x(i)+','+y(v-m*s[i])).reverse().join(' ')}`;
  return `<svg width="100%" height="${H+14}" viewBox="0 0 ${W} ${H+14}" aria-hidden="true"><polygon points="${banda(2)}" fill="var(--ink)" opacity=".08"/><polygon points="${banda(1)}" fill="var(--ink)" opacity=".18"/>
    <polyline points="${c.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${c.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="var(--ink)"/>`).join('')}
    <text x="${x(0)}" y="${H+12}" font-size="10" fill="var(--grigio)">${perC(prev[0].data)}</text><text x="${x(c.length-1)}" y="${H+12}" font-size="10" text-anchor="end" fill="var(--grigio)">${perC(prev.at(-1).data)}</text></svg>`;
}
function centroStudi(largo){
  const cs=studi(), p=prezzo(), gen=S().cassa_prima!=null;
  if(!cs) return `<div class="studi"><div class="tit" style="font-size:var(--c-riq)">Centro studi</div>
    <p class="sec">La stima del trimestre chiuso, migliore della prima stima, e la previsione dei prossimi quattro trimestri con la forchetta. Vale per questo turno.</p>
    <div class="prezzo"><button class="btn ${gen?'':'x'}" ${gen?'data-compra="1"':'aria-disabled="true" data-perche="prototipo: centro studi non generato per questo stato"'}>Compra · ${euro(p)}</button><span class="sec muto">cassa ${euro(cassa())}</span></div></div>`;
  return `<div class="studi"><div class="capo" style="margin:0"><span class="tit" style="font-size:var(--c-riq)">Centro studi</span><span class="sec muto">comprato · ${euro(p)}</span></div>
    <div class="sec">Stima di ${per(V().statistica.trimestre)}: PIL <b>${seg(cs.stima.crescita_pil)}%</b> (prima stima ${seg(V().statistica.prima_stima.crescita_pil)}), inflazione <b>${num(cs.stima.inflazione_annua)}%</b> (${num(V().statistica.prima_stima.inflazione_annua)}), disoccupazione <b>${num(cs.stima.disoccupazione)}%</b> (${num(V().statistica.prima_stima.disoccupazione)}).</div>
    <div class="fan" style="${largo?'grid-template-columns:repeat(4,minmax(0,1fr))':''}">${PREV.map(([k,n,nota])=>{ const f=cs.previsione.at(-1)[k];
      return `<div><div class="k"><b style="color:var(--ink)">${n}</b>${nota?' · '+nota:''}</div>${ventaglio(cs.previsione,k)}<div class="min">${perC(cs.previsione.at(-1).data)}: <b>${num(f.centro)}%</b> ± ${num(f.sigma)}</div></div>`;}).join('')}</div>
    <div class="min muto">Fascia scura: due volte su tre. Chiara: diciannove volte su venti.</div>
    ${st.rif?`<div class="rif">${esc(st.rif)}</div>`:`<button class="link" data-ricompra="1" style="justify-self:start">Compralo ancora</button>`}</div>`;
}

// ============ dettaglio a lato ============
function dettaglio(){
  const v=V(), k=st.sel||'', [t,id]=k.split(':'), back=`<button class="indietro" data-sel="">‹ Torna al centro studi</button>`;
  if(t==='sit'){ const s=v.situazioni[+id], gr=v.grandezze.find(g=>g.id===s.misura);
    return `${back}<h4 class="tit">${esc(s.nome)} ${s.accesa?'<span class="chip pieno">accesa</span>':''}</h4>${righello(s,360,30)}
      <dl class="dati"><dt>Valore ufficiale</dt><dd><b>${num(s.valore)}${unita(s)}</b> · ${s.misura==='crescita_pil'?'prima stima della crescita':gr?esc(gr.nome)+', alla chiusura precedente':'misura del motore'}</dd>
      <dt>Si accende</dt><dd>${sale(s)?'sopra':'sotto'} ${num(s.accensione)}${s.misura==='crescita_pil'?', due trimestri di fila':''}</dd><dt>Si spegne</dt><dd>${sale(s)?'sotto':'sopra'} ${num(s.spegnimento)}</dd></dl>
      <p class="sec"><b>${distanza(s)}</b>.</p>
      <p class="sec muto">Quando si accende apre un evento, e poi pesa finché non torna oltre lo spegnimento: la banda a retino è l’isteresi. Scandali ed emergenze improvvise non si vedono qui.</p>
      ${s.misura==='crescita_pil'?`<p class="sec ph">Il conto dei trimestri sotto soglia la Vista non lo porta: la frase «da un trimestre» è il nodo da decidere.</p>`:''}`; }
  if(t==='dic'){ const d=v.bilancio.dicasteri.find(x=>x.id===id);
    return `${back}<h4 class="tit">${esc(dic(id))}</h4><p class="sec"><b>${dic(id)}: ${d.perdita_reale>0?'−':'+'}${num(Math.abs(d.perdita_reale))}% reale</b> dal bilancio ${v.bilancio.anno}. La cifra è nominale: l’inflazione ne mangia il potere d’acquisto finché un bilancio non la indicizza.</p>
      <dl class="dati"><dt>Spesa</dt><dd><b>${euro(d.spesa)}</b> all’anno</dd><dt>Salari</dt><dd>${euro(d.salari)}</dd><dt>Acquisti</dt><dd>${euro(d.acquisti)}</dd><dt>Margine</dt><dd>${euro(d.margine)}</dd></dl>
      <button class="link" style="justify-self:start">Indicizzalo nella legge di bilancio ›</button>`; }
  if(t==='irpef'){ const s=v.bilancio.aliquote.irpef[+id], p=v.bilancio.perdita_reale_scaglioni[+id];
    return `${back}<h4 class="tit">Irpef ${s.fino_a?'fino a '+num(s.fino_a,0)+' €':'oltre l’ultima soglia'}</h4><p class="sec">${p!=null?`Soglia erosa del <b>${num(p)}%</b>: con i prezzi saliti, un reddito fermo in termini reali passa allo scaglione dopo prima di quanto passava.`:'L’ultimo scaglione non ha soglia: nessuna erosione.'}</p>`; }
  if(t==='gr'){ const g=v.grandezze.find(x=>x.id===id), [n,u]=grNome(g);
    const reg = g.valori.length>1 ? `<p class="sec">Una per regione: da <b>${num(Math.min(...g.valori))}</b> a <b>${num(Math.max(...g.valori))}</b>.</p><button class="link" style="justify-self:start">Le regioni in Paese ›</button>` : `<p class="sec"><b>${num(g.valori[0])}</b> · ${esc(u)}. ${g.verso==='sale'?'Meglio se sale':'Meglio se scende'}.</p>`;
    const sit=v.situazioni.find(s=>s.misura===id);
    return `${back}<h4 class="tit">${esc(n)}</h4>${reg}<p class="min muto">Alla chiusura precedente: le grandezze arrivano con un turno di ritardo.</p>${sit?`<div class="grp"><span>Soglia</span></div>${situazione(sit,v.situazioni.indexOf(sit))}`:''}`; }
  if(t==='stat'){ const s=v.statistica, r=s.revisione, cs=studi(), n=STIMA.find(x=>x[0]===id);
    return `${back}<h4 class="tit">${n[1]}</h4><dl class="dati"><dt>Prima stima</dt><dd><b>${num(s.prima_stima[id])}%</b> · ${per(s.trimestre)}</dd>${cs?`<dt>Centro studi</dt><dd><b>${num(cs.stima[id])}%</b></dd>`:''}${r?`<dt>Rivista</dt><dd>${per(r.trimestre)}: ${num(r.prima_stima[id])} → <b>${num(r.riveduta[id])}</b></dd>`:''}</dl>
      <p class="sec muto">La prima stima ha un errore; la revisione arriva il turno dopo ed è il valore vero.</p>`; }
  if(k==='grandezze') return `${back}<h4 class="tit">Le grandezze</h4><p class="min muto">Alla chiusura precedente; indici a 100 al turno zero, tranne dove è scritta l’unità.</p>${grandezze()}`;
  if(t==='spread') return `${back}<h4 class="tit">Spread · ${num(v.spread_pb,0)} pb</h4>${grafSpread(360,120)}<p class="sec">Piatto finché i conti reggono, poi sale sempre più in fretta. Oltre 550 punti si aprono le aste scoperte.</p><p class="sec ph">Il TPI azzera il premio di sfiducia solo con le regole UE rispettate: lo stato della PDE arriva in 11g. La soglia di 550 è una manopola: numero fisso della UI o rimando, è la domanda del ticket «Scale dei tracciati».</p>`;
  if(t==='fondo'){ const b=v.bilancio; return `${back}<h4 class="tit">Fondo di riserva ${b.anno}</h4><p class="sec">Restano <b>${euro(b.fondo_residuo)}</b> di ${euro(b.fondo_riserva)}. Paga gli eventi: quando è finito, il costo va a debito.</p>${v.eventi.length?`<div class="grp"><span>Eventi aperti</span></div>${v.eventi.map(e=>`<div class="r" style="cursor:default"><span class="n">${esc(e.nome)}</span><span class="x">${euro(e.costo)}</span></div>`).join('')}`:''}`; }
  return centroStudi(false);
}

// ============ le tre forme ============
function capo(t,extra=''){ return `<div class="capo"><h3 class="tit">${t}</h3><span class="sec muto">${extra}</span></div>`; }
function formaA(){
  const v=V();
  return `<div><div class="listino">
    <section>${capo('Il bilancio '+v.bilancio.anno, v.bilancio.esercizio_provvisorio?'esercizio provvisorio':'in vigore')}${bilancioTab()}${fondo()}</section>
    <section>${capo('L’economia', per(v.statistica.trimestre))}<div class="grp"><span>Prima stima</span></div>${quattro()}${revisione()}${spread()}<div class="ph"><b>Debito / PIL · in 11g</b> <span class="muto">· alla chiusura precedente, esatto</span></div>${europa(true)}${redditi()}</section>
    <section>${capo('Le soglie', v.situazioni.filter(s=>s.accesa).length+' accese')}${v.situazioni.map((s,i)=>situazione(s,i)).join('')}${st.gr==='lato'?`<div class="r ${st.sel==='grandezze'?'sel':''}" data-sel="grandezze" style="margin-top:6px"><span class="n"><b>Le 21 grandezze</b> <span class="muto">· alla chiusura precedente</span></span><span class="x">›</span></div>`:grandezze()}</section>
  </div></div><aside class="lato">${dettaglio()}</aside>`;
}
function formaB(){
  const v=V(), b=v.bilancio, tot=Math.max(...b.dicasteri.map(d=>d.spesa));
  const termo=v.situazioni.map((s,i)=>{ const vs=[s.valore,s.accensione,s.spegnimento]; let lo=Math.min(...vs),hi=Math.max(...vs); const pad=Math.max((hi-lo)*.5,Math.abs(s.accensione)*.08,1); lo-=pad; hi+=pad;
    const H=96, y=t=>(H-(t-lo)/(hi-lo)*H).toFixed(1), a=+y(s.accensione), sp=+y(s.spegnimento), val=+y(clamp(s.valore,lo,hi));
    const zona=sale(s)?[0,a]:[a,H];
    return `<div class="t ${s.accesa?'on':''} ${st.sel==='sit:'+i?'sel':''}" data-sel="sit:${i}"><b>${esc(s.nome)}</b>
      <svg width="46" height="${H+8}" viewBox="-12 -4 46 ${H+8}" aria-hidden="true"><rect x="0" y="${zona[0]}" width="22" height="${zona[1]-zona[0]}" fill="var(--rosso)" opacity=".18"/>
      <rect x="0" y="${Math.min(a,sp)}" width="22" height="${Math.abs(a-sp)}" fill="var(--ink)" opacity=".18"/><rect x="0" y="0" width="22" height="${H}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
      <rect x="5" y="${val}" width="12" height="${H-val}" fill="${s.accesa?'var(--rosso)':'var(--ink)'}"/>
      <line x1="-6" x2="28" y1="${a}" y2="${a}" stroke="var(--rosso)" stroke-width="2"/><line x1="-3" x2="25" y1="${sp}" y2="${sp}" stroke="var(--ink)" stroke-dasharray="2 2"/></svg>
      <span><b class="nf" style="font-size:var(--c-sec)">${num(s.valore)}${unita(s)}</b></span><span>${s.accesa?'<span class="chip pieno">accesa</span>':distanza(s).replace(/^si accende /,'').replace(': mancano',' · mancano')}</span></div>`;}).join('');
  const cs=studi();
  return `<div class="strum"><div class="termo">${termo}</div>
    <div class="mezzo"><div>${capo('Il trimestre', per(v.statistica.trimestre)+(cs?' · prima stima e centro studi':' · prima stima'))}${quattro()}${revisione()}</div>
      <div>${spread()}${europa(true)}</div></div>
    <div class="mezzo"><div>${capo('Il bilancio '+b.anno, 'spesa: salari · acquisti · margine')}<div class="barre">${b.dicasteri.map(d=>`<div data-sel="dic:${d.id}" class="sec" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${st.sel==='dic:'+d.id?'font-weight:700':''}">${esc(dic(d.id))}</div>
        <div data-sel="dic:${d.id}" class="sp" style="width:${(d.spesa/tot*100).toFixed(1)}%"><i style="flex:${d.salari};background:var(--ink)"></i><i style="flex:${d.acquisti};background:var(--grigio)"></i><i style="flex:${d.spesa-d.salari-d.acquisti};background:var(--velo);outline:1px solid var(--grigio)"></i></div>
        <div data-sel="dic:${d.id}" class="nf">${mld(d.spesa)} <span class="${d.perdita_reale>0?'male':'bene'}">${d.perdita_reale>0?'−':'+'}${num(Math.abs(d.perdita_reale))}%</span></div>`).join('')}</div>${fondo()}</div>
      <div>${capo('Le grandezze','alla chiusura precedente')}<div class="tess" style="grid-template-columns:repeat(3,minmax(0,1fr))">${v.grandezze.map(g=>`<button class="${st.sel==='gr:'+g.id?'sel':''}" data-sel="gr:${g.id}"><span>${esc(grNome(g)[0])}</span><b>${grValore(g).replace(/<small[^>]*>/,' <small>')}</b></button>`).join('')}</div>${redditi()}</div></div>
  </div><aside class="lato">${dettaglio()}</aside>`;
}
const SCHEDE=[['bilancio','Bilancio'],['economia','Economia'],['soglie','Soglie'],['europa','Europa e debito']];
function formaC(){
  const v=V(), acc=v.situazioni.filter(s=>s.accesa).length;
  const tabs=`<div class="schede">${SCHEDE.map(([k,t])=>`<button class="${st.scheda===k?'qui':''}" data-scheda="${k}">${t}${k==='soglie'&&acc?`<small class="male">${acc} accese</small>`:''}${k==='europa'?'<small class="muto">11g</small>':''}</button>`).join('')}</div>`;
  let main='';
  if(st.scheda==='bilancio') main=`<div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0 var(--canale)"><div>${bilancioTab()}</div><div>${fondo()}<p class="sec muto" style="margin-top:8px">La perdita reale è dal bilancio ${v.bilancio.anno}: la cifra è nominale finché un bilancio non la indicizza.</p></div></div>`;
  if(st.scheda==='economia') main=`<div class="grp"><span>Prima stima · ${per(v.statistica.trimestre)}</span></div>${quattro('').replace('num4','num4" style="grid-template-columns:repeat(4,minmax(0,1fr))')}${revisione()}<div style="margin-top:8px">${centroStudi(true)}</div>${redditi()}`;
  if(st.scheda==='soglie') main=`<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 var(--canale)"><div><div class="grp"><span>Situazioni</span><span>${acc} accese</span></div>${v.situazioni.map((s,i)=>situazione(s,i)).join('')}</div><div>${grandezze()}</div></div>`;
  if(st.scheda==='europa') main=`<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 var(--canale)"><div>${spread(true)}</div><div>${europa(false)}</div></div>`;
  const lato = st.sel ? dettaglio() : st.scheda==='economia' ? `<p class="sec muto">Scegli un numero per la sua storia: prima stima, revisione, centro studi.</p>` : centroStudi(false);
  return `<div>${tabs}${main}</div><aside class="lato">${lato}</aside>`;
}

// ============ resa ============
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const v=V();
  const banda = v.crisi ? `<div class="banda">Crisi di governo: solo ordinaria amministrazione.</div>` : grave() ? `<div class="banda">${esc(v.eventi.find(e=>e.tono==='grave').nome)}</div>` : '';
  const corpo = `<main class="corpo">${st.v==='B'?formaB():st.v==='C'?formaC():formaA()}</main>`;
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${banda?'auto ':''}minmax(0,1fr)">${cornice()}${banda}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[sg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.corpo'), scorre = c && c.scrollHeight>c.clientHeight+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'il corpo scorre':''].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else if(b.id==='azzera'){ st.comprato={}; st.rif=null; }
  else { st[b.parentElement.dataset.k]=b.dataset.v; if(b.parentElement.dataset.k==='stato'){ st.sel=null; st.rif=null; } }
  render();
});
scr.addEventListener('click',e=>{
  const t=e.target, c=t.closest('[data-compra]'), rc=t.closest('[data-ricompra]'), sch=t.closest('[data-scheda]'), s=t.closest('[data-sel]');
  if(c){ st.comprato[st.stato]=true; st.rif=null; st.sel=null; }
  else if(rc){ st.rif=S().rifiuto_ripetuto; }
  else if(sch){ st.scheda=sch.dataset.scheda; st.sel=null; }
  else if(s){ st.sel = s.dataset.sel===st.sel ? null : (s.dataset.sel||null); }
  else return;
  render();
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
