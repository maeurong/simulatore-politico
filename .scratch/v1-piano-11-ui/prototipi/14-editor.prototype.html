<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Scenario ed editor» (14), mappa v1-piano-11-ui.
  Domanda: com'è fatta la scelta dello scenario e l'editor (storie 2-7)?
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Banco        — l'editor a pagina (scenario, Paese, regole del voto, leggi) e il riepilogo dal vivo nel dettaglio a lato
    B  Numero zero  — il riepilogo è la pagina: prima pagina di prova coi sei posti; i cursori in un banco di regia in basso,
                      regole e leggi nel dettaglio a lato a richiesta
    C  Fascicolo    — cinque passi in un sommario (scenario, Paese, regole, leggi, riepilogo e salva) e una striscia
                      fissa coi numeri chiave
  Altri parametri: ?prova=base|Crisi|Elettorato a sinistra|Incoerente   ?fin=1280|1440   ?scala=1|1.25
  Dati: .scratch/v1-piano-11-ui/viste/14-editor.json (genera/): intervalli dei sei cursori dallo scenario di base,
  impostazioni elettorali, 46 disposizioni coi gradini (35 ordinarie, 2 costituzionali, 9 elettorali), `riepilogo()` vero su otto scenari di prova e su nove passi per
  cursore. Fra un passo e l'altro, o con più cursori mossi, il prototipo APPROSSIMA (passo più vicino, effetti sommati,
  seggi non ricalcolati per i ritocchi elettorali) e lo dice nella barra in basso. Il saldo delle disposizioni lo somma
  il prototipo dai gradini. Gli scenari salvati sono quattro delle prove.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A), via 13-edicola. Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 11/11/2026), nel ticket 14: A · Banco; catalogo dell'editor da una funzione nuova del core con passacarte
  in 11a; il cursore dell'inflazione resta, con la nota che pesa dal primo trimestre; scenari solo dalla cartella del gioco.
  Il file si apre su questa forma. Scartate: B e C dalla barra in basso.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo scenario ed editor · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec)}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.lnk-via{color:var(--rosso);text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.bollo{display:inline-block;border:3px double var(--rosso);color:var(--rosso);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:1px 9px;transform:rotate(-5deg);font-size:var(--c-min);white-space:nowrap}
.bollo.ink{border-color:var(--ink);color:var(--ink)}
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
h3.tit{font-size:var(--c-sez)}
h4.tit{font-size:var(--c-riq)}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:baseline}
.dati dt{color:var(--grigio)}

/* ===== testa dell'edicola (niente cornice: fuori dalla partita) ===== */
.testa{display:flex;align-items:end;gap:16px;padding:12px var(--marg) 8px;border-bottom:var(--doppio)}
.testa .nomino{font-size:30px}
.testa .dove{font-family:var(--tit);font-size:var(--c-sez);font-weight:600}
.testa .fuori{margin-left:auto;display:flex;gap:16px;align-items:center;padding-bottom:3px}
.corpo{padding:14px var(--marg) 16px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:12px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
.titsez{display:flex;align-items:baseline;gap:12px;border-bottom:var(--forte);padding-bottom:4px;margin-bottom:2px}
.titsez .tit{font-size:var(--c-riq)}
.titsez .dx{margin-left:auto}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px}
#proto .lab{min-width:130px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
/* ===== editor ===== */
.corpo.A{grid-template-columns:minmax(0,1fr) var(--lato)}
.sx{display:grid;gap:16px;align-content:start;min-width:0;overflow:hidden auto;padding-right:6px}
.lato.fermo{align-self:start;position:sticky;top:0;max-height:100%;overflow:hidden auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--ink);padding:3px 10px;font-size:var(--c-sec);font-weight:700;background:var(--carta)}
.chip:hover{background:var(--velo)}
.chip.qui{background:var(--ink);color:var(--carta)}
.chip.nuovo{border-style:dashed}
.stato-sc{font-size:var(--c-sec);color:var(--grigio)}
.stato-sc b{color:var(--ink)}
.curs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px var(--canale)}
.cur{display:grid;gap:2px;padding:6px 8px 8px;border-left:3px solid transparent}
.cur.mosso{border-left-color:var(--giallo);background:var(--velo)}
.cur .r1{display:flex;align-items:baseline;gap:8px}
.cur .r1 .nm{font-weight:700}
.cur .r1 .v{margin-left:auto;font-family:var(--tit);font-weight:700;font-size:var(--c-num)}
.cur .r1 .v small{font:400 var(--c-min) var(--txt);color:var(--grigio)}
.cur .pista{position:relative;height:22px}
.cur input[type=range]{width:100%;margin:0;height:22px}
.cur .tacca{position:absolute;top:15px;width:2px;height:9px;background:var(--rosso);pointer-events:none;transform:translateX(-1px)}
.cur .r3{display:flex;justify-content:space-between;font-size:var(--c-min);color:var(--grigio)}
.cur .r3 .al{color:var(--rosso);font-weight:700}
.cur .base{font-size:var(--c-min)}
.cur.compatto{padding:4px 6px 4px}
.cur.compatto .r1 .v{font-size:var(--c-riq);white-space:nowrap}
.cur.compatto .r1 .v small{display:none}
.cur.compatto .r3{display:none}
.cur.compatto .r1 .al{font-size:var(--c-min);color:var(--rosso);font-weight:700}
.param{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:var(--c-sec);padding:3px 0;border-bottom:var(--filo)}
.param.mosso{background:linear-gradient(90deg,var(--velo),transparent)}
.param .nm b{font-weight:700}
.param .era{font-size:var(--c-min);color:var(--grigio)}
.seg2{display:inline-flex;border:1.5px solid var(--ink)}
.seg2 button{padding:1px 8px;font-size:var(--c-min);font-weight:700;border-left:1.5px solid var(--ink);white-space:nowrap}
.seg2 button:first-child{border-left:0}
.seg2 button.qui{background:var(--ink);color:var(--carta)}
.seg2 button.part::after{content:"•";color:var(--rosso);margin-left:3px}
.seg2 button.qui.part::after{color:var(--giallo)}
select{font:inherit;font-size:var(--c-sec);border:1.5px solid var(--ink);background:var(--carta);padding:1px 4px;color:var(--ink)}
.gruppo-d{display:grid;gap:0}
.gruppo-d>.occ{color:var(--ink);padding:6px 0 2px;border-bottom:var(--bordo)}
.rifiuto{border:2px solid var(--rosso);color:var(--rosso);padding:6px 10px;font-size:var(--c-sec);font-weight:700}
.rifiuto span{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.posti{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.posti th{font-size:var(--c-min);letter-spacing:.06em;text-transform:uppercase;color:var(--grigio);font-weight:700;text-align:right;padding:2px 4px;border-bottom:var(--filo)}
.posti th:first-child,.posti td:first-child{text-align:left}
.posti td{padding:3px 4px;border-bottom:var(--filo);text-align:right;white-space:nowrap}
.posti tr.no td{background:repeating-linear-gradient(45deg,transparent 0 6px,rgb(179 18 43 / .08) 6px 7px)}
.posti .co{font-size:var(--c-min);color:var(--grigio);text-align:left;white-space:normal}
.qb{display:inline-block;height:8px;background:var(--rosso);vertical-align:middle;margin-right:4px}
.qb.co{background:var(--ink)}
.conti{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.conto{border-top:var(--forte);padding-top:3px}
.conto .k{font-size:var(--c-min);color:var(--grigio);letter-spacing:.06em;text-transform:uppercase}
.conto .n{font-family:var(--tit);font-weight:700;font-size:var(--c-pag);line-height:1.05}
.conto .d{font-size:var(--c-min)}
.avv{display:grid;gap:6px}
.av{border-left:4px solid var(--rosso);padding:3px 8px;font-size:var(--c-sec)}
.av.lieve{border-left-color:var(--grigio)}
.av b{display:block}
.salva{display:grid;gap:6px;border-top:var(--doppio);padding-top:8px}
.salva .riga{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.salva input{font:inherit;border:1.5px solid var(--ink);background:var(--carta);padding:3px 6px;min-width:0;flex:1}
.btn[disabled]{opacity:.4;pointer-events:none}
.nota-proto{font-size:var(--c-min);color:var(--grigio);font-style:italic}
/* B */
.B .pag{display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0;overflow:hidden}
.B .foglio{padding:10px 28px 10px;overflow:hidden auto;display:grid;gap:12px;align-content:start;min-width:0}
.B .lato{border:0;border-left:var(--bordo);width:var(--lato);overflow:hidden auto;padding:12px 16px}
.B h2.tit{font-size:var(--c-apre);line-height:1.04}
.B .catenaccio{font-size:var(--c-lead);color:var(--grigio)}
.B .ap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;border-bottom:1px solid var(--ink);padding-bottom:12px}
.regia{border-top:var(--doppio);padding:4px 20px 6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:0 18px;align-items:end;background:var(--carta)}
.regia .alt{grid-column:4;grid-row:1/3;align-self:center}
.regia .alt{display:grid;gap:4px;padding-bottom:4px}
.colonne-posti{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:190px;border-bottom:var(--forte);position:relative}
.colonne-posti .cp{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;text-align:center;font-size:var(--c-min)}
.colonne-posti .st{display:flex;flex-direction:column-reverse;background:var(--grigio)}
.colonne-posti .st i{display:block;background:var(--rosso)}
.colonne-posti .cp.no .st{background:repeating-linear-gradient(45deg,var(--grigio) 0 3px,transparent 3px 6px)}
.colonne-posti .soglia{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink);font-size:var(--c-min);pointer-events:none}
.colonne-posti .soglia span{position:absolute;right:0;top:-15px;background:var(--carta);padding:0 3px}
.sotto-posti{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;text-align:center;font-size:var(--c-min)}
.sotto-posti b{font-size:var(--c-sec)}
/* C */
.C .pag{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.somm{border-right:var(--bordo);padding:14px 0;display:grid;align-content:start;gap:2px}
.somm button{padding:7px 16px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.somm button .nn{font-family:var(--tit);color:var(--grigio);font-size:var(--c-riq);width:16px}
.somm button.qui{background:var(--ink);color:var(--carta)}
.somm button.qui .nn{color:var(--giallo)}
.somm button .seg{margin-left:auto;font-size:var(--c-min);font-weight:400;color:var(--rosso)}
.striscia{display:flex;gap:22px;align-items:center;padding:6px var(--marg);border-bottom:var(--forte);font-size:var(--c-sec);flex-wrap:wrap}
.striscia .k{font-size:var(--c-min);letter-spacing:.06em;text-transform:uppercase;color:var(--grigio)}
.striscia b{font-family:var(--tit);font-size:var(--c-riq)}
.pallini{display:inline-flex;gap:3px;vertical-align:middle}
.pallini i{width:11px;height:11px;border-radius:50%;background:var(--ink)}
.pallini i.no{background:transparent;border:1.5px solid var(--rosso)}
.C .passo{padding:14px var(--marg);overflow:hidden auto;display:grid;gap:14px;align-content:start;min-width:0}
.C .passo h2.tit{font-size:var(--c-pag)}
.C .piede{display:flex;justify-content:space-between;border-top:var(--filo);padding-top:8px}
</style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>
<div id="proto">
  <button id="prev" title="forma precedente (←)">‹</button><span class="lab" id="lab"></span><button id="next" title="forma successiva (→)">›</button>
  <span class="cap">salta a</span><span class="seg" data-k="prova"><button data-v="base">base</button><button data-v="Crisi">crisi</button><button data-v="Elettorato a sinistra">elettorato a sinistra</button><button data-v="Incoerente">legge incoerente</button></span>
  <span class="cap">finestra</span><span class="seg" data-k="fin"><button data-v="1280">1280×800</button><button data-v="1440">1440×900</button></span>
  <span class="cap">scala</span><span class="seg" data-k="scala"><button data-v="1">1×</button><button data-v="1.25">1,25×</button></span>
  <span id="avv"></span>
</div>

const ORD = D.disposizioni.filter(d=>d.norma==='ordinaria');
const GRUPPI = [...new Set(ORD.map(d=>d.dicastero||'Regioni'))];
const PARTITI = {sinistra:'Sinistra',centrosinistra:'Centrosinistra',centro:'Centro',centrodestra:'Centrodestra',destra:'Destra',estrema_destra:'Estrema destra',estrema_sinistra:'Estrema sinistra',giocatore:'voi'};
const nomeG = (d,id) => (d.gradini.find(g=>g.id===id)||{nome:id}).nome;
const carica = s => JSON.parse(JSON.stringify(s));
function scegliProva(n){
  if(n==='base'){ st.sc=carica(BASE.scenario); st.sorgente='base'; }
  else { st.sc=carica(PROVE[n].scenario); st.sorgente=n; }
  st.mosso=false; st.conf=null; st.nome=st.sorgente==='base'?'':st.sc.nome; ULTIMO_VALIDO=BASE.riepilogo;
}
scegliProva(st.prova);

// ===== riepilogo: vero dove genera/ l'ha calcolato, altrimenti approssimato e dichiarato =====
const gradinoElett = id => st.sc.disposizioni[id] ?? D.leggi_elettorali[st.sc.cursori.legge_elettorale][id];
let APPROSSIMATO = [];
function riep(){
  APPROSSIMATO=[];
  const sc=st.sc, key=JSON.stringify([sc.cursori,sc.disposizioni]);
  const prova=D.riepiloghi.find(r=>JSON.stringify([r.scenario.cursori,r.scenario.disposizioni])===key);
  if(prova) return prova.errore ? {errore:prova.errore} : prova.riepilogo;
  if(gradinoElett('coalizioni')==='no' && gradinoElett('premio')==='coalizione')
    return {errore:PROVE['Incoerente'].errore};
  const b=BASE.riepilogo, r=carica(b);
  const legge=sc.cursori.legge_elettorale;
  if(legge!=='legge_180'){ const p=PROVE['Proporzionale puro'].riepilogo; r.posizioni=carica(p.posizioni); if(legge!=='proporzionale_puro') APPROSSIMATO.push('seggi del proporzionale puro al posto di quello al 3%'); }
  if(ELETT.some(d=>d.id in sc.disposizioni)) APPROSSIMATO.push('parametri elettorali ritoccati: seggi non ricalcolati');
  if(COST.some(d=>d.id in sc.disposizioni)) APPROSSIMATO.push('Costituzione ritoccata: seggi non ricalcolati');
  const mossi=Object.keys(D.griglia).filter(k=>Math.abs(sc.cursori[k]-CUR[k].valore)>1e-9);
  for(const k of mossi){
    const v=sc.cursori[k]; let g=D.griglia[k][0];
    for(const p of D.griglia[k]) if(Math.abs(p.valore-v)<Math.abs(g.valore-v)) g=p;
    if(Math.abs(g.valore-v)>1e-6) APPROSSIMATO.push(`${ETI[k].nm.toLowerCase()} al passo ${num(g.valore)}`);
    for(const f of ['spread_pb','interessi_pil','disavanzo_pil']) r[f]+=g.riepilogo[f]-b[f];
    if(k==='orientamento'){ r.posizioni=carica(g.riepilogo.posizioni); if(legge!=='legge_180') APPROSSIMATO.push('orientamento con legge diversa'); }
  }
  if(mossi.length>1) APPROSSIMATO.push('cursori sommati uno per uno');
  r.spread_pb=Math.round(r.spread_pb);
  r.saldo_disposizioni_pil=ORD.concat(COST).reduce((s,d)=>s+(d.id in sc.disposizioni ? (d.gradini.find(g=>g.id===sc.disposizioni[d.id]).saldo - d.gradini.find(g=>g.id===d.partenza).saldo) : 0),0);
  const soglia=PROVE['Debito al tetto'].riepilogo.avvisi.find(a=>a.tipo==='crisi_del_debito').soglia_pb;
  const senza=r.posizioni.filter(p=>!p.maggioranza).map(p=>p.posizione);
  r.avvisi=[...(senza.length?[{tipo:'senza_maggioranza',posizioni:senza}]:[]), ...b.avvisi.filter(a=>a.tipo==='situazioni_accese'), ...(r.spread_pb>soglia?[{tipo:'crisi_del_debito',spread_pb:r.spread_pb,soglia_pb:soglia}]:[])];
  return r;
}

// ===== pezzi =====
function testa(sotto){
  const esci = st.esci
    ? `<span class="sec male">Le modifiche non salvate si perdono.</span><button class="btn via pieno p" data-esci-ok>Esci comunque</button><button class="btn p" data-esci="0">Resta</button>`
    : `<button class="link" data-esci="1">‹ Edicola</button>`;
  return `<div class="testa">${esci}<span class="nomino">Il Pungolo</span><span class="dove">Nuova partita · ${sotto||'lo scenario'}</span>
    <span class="fuori" data-vivo><span class="stato-sc">${statoScenario()}</span></span></div>`;
}
function statoScenario(){
  if(st.sorgente==='base' && !st.mosso) return 'Scenario: <b>Italia di oggi</b>';
  if(!st.mosso) return `Scenario su misura: <b>${esc(st.sorgente)}</b>`;
  return `Su misura: <b>${st.sorgente==='base'?'nuovo, senza nome':esc(st.sorgente)+', modificato'}</b> · non salvato`;
}
function scelta(){
  const ch=(id,txt,cl='')=>`<button class="chip ${cl} ${st.sorgente===id&&!st.mosso?'qui':''}" data-sc="${esc(id)}">${esc(txt)}</button>`;
  return `<div class="chips" data-vivo>${ch('base','Italia di oggi')}<span class="min muto">·</span>${st.salvati.map(n=>ch(n,n)).join('')}
    <button class="chip nuovo" data-sc="base" data-nuovo>+ Nuovo su misura</button></div>
    <p class="min muto">I tuoi scenari sono i file nella cartella del gioco. «Italia di oggi» non si cambia: toccare un cursore apre uno scenario su misura nuovo.</p>`;
}
function cursore(k, compatto){
  const c=CUR[k], v=st.sc.cursori[k], e=ETI[k], at=(x)=>((x-c.min)/(c.max-c.min)*100).toFixed(2)+'%';
  const al = v<=c.min+1e-9 ? 'fermo al limite della taratura' : v>=c.max-1e-9 ? 'fermo al limite della taratura' : '';
  const u = typeof e.u==='function'? e.u(v) : e.u;
  return `<div class="cur ${compatto?'compatto':''} ${Math.abs(v-c.valore)>1e-9?'mosso':''}">
    <div class="r1"><span class="nm">${e.nm}</span>${compatto&&al?'<span class="al">al limite</span>':''}<span class="v">${e.f(v)} <small>${u}</small></span></div>
    <div class="pista"><input type="range" min="${c.min}" max="${c.max}" step="${PASSO[k]}" value="${v}" data-cur="${k}" aria-label="${e.nm}"><span class="tacca" style="left:${at(c.valore)}" title="oggi"></span></div>
    <div class="r3"><span>${e.f(c.min)}</span>${al?`<span class="al">${al}</span>`:compatto?'':`<span class="base">▴ oggi ${e.f(c.valore)}</span>`}<span>${e.f(c.max)}</span></div>${k==='inflazione'&&!compatto?'<div class="min muto">Non cambia il riepilogo: pesa dal primo trimestre, sul tasso della BCE e sul bilancio dell’anno dopo.</div>':''}</div>`;
}
const PAESE = ['debito_pil','disoccupazione','inflazione','ricchezza','eta_mediana','orientamento'];
function seg(d, scelto, attr){
  return `<span class="seg2">${d.gradini.map(g=>`<button class="${g.id===scelto?'qui':''} ${g.id===d.partenza?'part':''}" ${attr}="${d.id}" data-g="${g.id}" title="${g.id===d.partenza?'in vigore oggi':''}">${esc(g.nome)}</button>`).join('')}</span>`;
}
function regole(r){
  const L=st.sc.cursori.legge_elettorale;
  const rit=ELETT.filter(d=>d.id in st.sc.disposizioni);
  return `<div class="param"><span class="nm"><b>Legge elettorale</b><br><span class="era">punto di partenza: i nove parametri sotto</span></span>
      <select data-legge>${Object.keys(D.leggi_elettorali).map(n=>`<option value="${n}" ${n===L?'selected':''}>${LEGGI[n]}</option>`).join('')}</select></div>
    ${r.errore?`<div class="rifiuto">Questa combinazione non fa una legge.<span>${esc(r.errore.replace(/^.*legge elettorale: /,''))}: il riepilogo resta all’ultima valida.</span></div>`:''}
    ${ELETT.map(d=>{ const g=gradinoElett(d.id), m=d.id in st.sc.disposizioni;
      return `<div class="param ${m?'mosso':''}"><span class="nm">${esc(d.nome)}${m?` <span class="era">· la legge scelta dice ${esc(nomeG(d,D.leggi_elettorali[L][d.id]))}</span>`:''}</span>${seg({...d,partenza:D.leggi_elettorali[L][d.id]}, g, 'data-el')}</div>`; }).join('')}
    ${rit.length?`<p class="min muto">${rit.length===1?'Un ritocco':rit.length+' ritocchi'} alla ${LEGGI[L]}. Cambiare legge li toglie.</p>`:''}
    <div class="occ" style="color:var(--ink);margin-top:8px">Costituzione</div>
    ${COST.map(d=>{ const g=st.sc.disposizioni[d.id]??d.partenza; return `<div class="param ${g!==d.partenza?'mosso':''}"><span class="nm">${esc(d.nome)}</span>${seg(d,g,'data-dp')}</div>`; }).join('')}`;
}
function leggi(filtro){
  const cambiate=ORD.filter(d=>d.id in st.sc.disposizioni).length;
  return `<p class="min muto">${ORD.length} disposizioni, ognuna col valore in vigore oggi (•). ${cambiate?`<b class="male">${cambiate} cambiate</b>: entrano come leggi del governo uscente.`:''}</p>
    ${GRUPPI.filter(g=>!filtro||filtro===g).map(gr=>`<div class="gruppo-d"><div class="occ">${esc(gr)}</div>
      ${ORD.filter(d=>(d.dicastero||'Regioni')===gr).map(d=>{ const g=st.sc.disposizioni[d.id]??d.partenza, gg=d.gradini.find(x=>x.id===g), s=gg.saldo-d.gradini.find(x=>x.id===d.partenza).saldo;
        return `<div class="param ${g!==d.partenza?'mosso':''}"><span class="nm">${esc(d.nome)}${g!==d.partenza?` <span class="era">· oggi ${esc(nomeG(d,d.partenza))}${s?`, ${sg(s,2)}% del PIL`:''}</span>`:''}</span>
          ${d.gradini.length>4?`<select data-dsel="${d.id}">${d.gradini.map(x=>`<option value="${x.id}" ${x.id===g?'selected':''}>${esc(x.nome)}${x.id===d.partenza?' •':''}</option>`).join('')}</select>`:seg(d,g,'data-dp')}</div>`; }).join('')}</div>`).join('')}`;
}
const coal = p => p.coalizione.map(id=>PARTITI[id]||id).join(', ');
function tabPosti(r){
  const b=BASE.riepilogo.posizioni;
  return `<table class="posti"><thead><tr><th>Posto</th><th>Voi</th><th>Coalizione</th><th>Camera</th><th>Senato</th><th>Magg.</th></tr></thead><tbody>
    ${r.posizioni.map((p,i)=>`<tr class="${p.maggioranza?'':'no'}"><td><b>${num(p.posizione)}</b></td>
      <td><span class="qb" style="width:${p.quota_attesa*70}px"></span>${pct(p.quota_attesa)}</td>
      <td>${pct(p.quota_coalizione)}</td><td>${p.seggi_camera}</td><td>${p.seggi_senato}</td>
      <td>${p.maggioranza?'<span class="bene">sì</span>':'<b class="male">no</b>'}</td></tr>
      <tr><td></td><td class="co" colspan="5">con ${esc(coal(p))}</td></tr>`).join('')}</tbody></table>
    <p class="min muto">Consenso atteso fondando il partito a quel posto, prima delle campagne. Maggioranza: oltre metà dei seggi in tutte e due le Camere (201 e 101).</p>`;
}
function conti(r){
  const b=BASE.riepilogo, d=(x,y,dec,inv)=>{ const z=x-y; if(Math.abs(z)<(dec?.005:.5)) return '<span class="muto">come oggi</span>'; return `<span class="${z>0?'male':'bene'}">${sg(z,dec)} su oggi</span>`; };
  return `<div class="conti">
    <div class="conto"><div class="k">Spread</div><div class="n">${r.spread_pb}</div><div class="d">punti base · ${d(r.spread_pb,b.spread_pb,0)}</div></div>
    <div class="conto"><div class="k">Interessi</div><div class="n">${num(r.interessi_pil)}%</div><div class="d">del PIL · ${d(r.interessi_pil,b.interessi_pil,1)}</div></div>
    <div class="conto"><div class="k">Disavanzo</div><div class="n">${num(r.disavanzo_pil)}%</div><div class="d">del PIL · ${d(r.disavanzo_pil,b.disavanzo_pil,1)}</div></div></div>
    ${Math.abs(r.saldo_disposizioni_pil)>1e-9?`<p class="sec">E le disposizioni cambiate pesano <b class="${r.saldo_disposizioni_pil>0?'male':'bene'}">${sg(r.saldo_disposizioni_pil,2)}% del PIL</b> all’anno, dal primo trimestre: il disavanzo del turno zero non le contiene ancora.</p>`:''}`;
}
function avvisi(r){
  const t={senza_maggioranza:a=>({cl:'',h:'Nessuna maggioranza da '+(a.posizioni.length>1?'questi posti: ':'questo posto: ')+a.posizioni.map(x=>num(x)).join(', '),s:'Lì nessuna coalizione con voi supera il 42% atteso. Si può giocare lo stesso.'}),
    situazioni_accese:a=>({cl:'lieve',h:'Già accesa al turno zero: '+a.nomi.join(', '),s:'C’è anche nell’Italia di oggi.'}),
    crisi_del_debito:a=>({cl:'',h:`Crisi del debito: spread a ${a.spread_pb}`,s:`Sopra la soglia di ${a.soglia_pb} punti la crisi parte al turno zero.`})};
  return `<div class="avv">${r.avvisi.map(a=>{ const x=t[a.tipo](a); return `<div class="av ${x.cl}"><b>${esc(x.h)}</b>${x.s}</div>`; }).join('')}</div>`;
}
function salva(r){
  const conf = st.conf==='sovrascrivi';
  const base = st.sorgente==='base' && !st.mosso;
  return `<div class="salva">
    ${base?`<p class="sec">Si gioca l’Italia di oggi.</p>`:`<div class="riga"><input data-nome placeholder="Nome dello scenario" value="${esc(st.nome)}" aria-label="Nome dello scenario">
      ${conf?`<button class="btn via pieno" data-salva="1">Conferma: sostituisci «${esc(st.nome)}»</button><button class="btn" data-conf-annulla>Annulla</button>`
           :`<button class="btn" data-salva="0" ${st.nome.trim()&&st.mosso?'':'disabled'}>Salva</button>`}</div>
      ${conf?`<p class="min male">Esiste già uno scenario con questo nome: il file si riscrive.</p>`:`<p class="min muto">${st.mosso?'Salvare non serve per giocare: serve per rigiocarlo.':'Salvato.'}</p>`}`}
    <div class="riga"><button class="btn pieno" data-avanti ${r.errore?'disabled':''}>Fonda il partito ›</button>${r.errore?'<span class="min male">prima una legge elettorale che regga</span>':''}</div></div>`;
}

// ===== forme =====
function vista(){
  const r0=riep(), r=r0.errore?{...ULTIMO_VALIDO,errore:r0.errore}:r0; if(!r0.errore) ULTIMO_VALIDO=r0;
  if(st.v==='A') return testa()+`<div class="corpo A">
      <div class="sx">
        <section><div class="titsez"><h3 class="tit">Scenario</h3></div>${scelta()}</section>
        <section><div class="titsez"><h3 class="tit">Il Paese al turno zero</h3><span class="dx min muto">▴ è il valore di oggi</span></div><div class="curs">${PAESE.map(k=>cursore(k)).join('')}</div></section>
        <section><div class="titsez"><h3 class="tit">Le regole del voto</h3></div>${regole(r)}</section>
        <section><div class="titsez"><h3 class="tit">Le leggi in vigore</h3></div>${leggi()}</section>
      </div>
      <aside class="lato fermo" data-vivo style="${r.errore?'opacity:.55':''}"><div><div class="occ">Riepilogo dal vivo</div><h3 class="tit">Se si fondasse oggi</h3></div>
        ${avvisi(r)}${conti(r)}${tabPosti(r)}${salva(r)}</aside></div>`;
  if(st.v==='B'){
    const senza=r.avvisi.find(a=>a.tipo==='senza_maggioranza'), crisi=r.avvisi.find(a=>a.tipo==='crisi_del_debito');
    const tit = r.errore ? 'La legge elettorale non sta in piedi' : crisi ? `Spread a ${r.spread_pb}: si parte in crisi del debito` : senza ? `Da ${senza.posizioni.length} posti su sei non c’è maggioranza` : 'Da ogni posto c’è una maggioranza possibile';
    const lato = st.latoB==='regole' ? `<div class="occ">Regole del voto</div>${regole(r)}` : st.latoB==='leggi' ? `<div class="occ">Leggi in vigore</div>${leggi()}` : st.latoB==='scenario' ? `<div class="occ">Scenario</div>${scelta()}${salva(r)}` : '';
    return testa('numero zero')+`<div class="pag" style="grid-template-columns:minmax(0,1fr) ${lato?'auto':'0'}"><div class="foglio" data-vivo>
      <div class="ap"><div><div class="occ">Numero zero · ${statoScenario().replace(/<[^>]+>/g,'')}</div><h2 class="tit">${esc(tit)}</h2>
        <p class="catenaccio">${r.errore?esc(r.errore.replace(/^.*legge elettorale: /,''))+'. Il giornale resta all’ultima legge valida.':'Il consenso atteso a ogni posto dell’asse, prima delle campagne, con la coalizione migliore che vi accoglie.'}</p></div>
        <div>${avvisi(r)}</div></div>
      <div>${graficoPosti(r)}</div>
      <div class="ap" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);border:0"><div>${conti(r)}</div>
        <div class="az" style="align-content:start"><button class="btn pieno" data-avanti ${r.errore?'disabled':''}>Fonda il partito ›</button><button class="btn" data-latob="scenario">Scenario e salva</button></div></div>
    </div>${lato?`<aside class="lato">${lato}<button class="link" data-latob="">Chiudi</button></aside>`:'<div></div>'}</div>
    <div class="regia">${PAESE.map(k=>cursore(k,true)).join('')}<div class="alt"><button class="btn p ${st.latoB==='regole'?'pieno':''}" data-latob="regole">Regole del voto ›</button><button class="btn p ${st.latoB==='leggi'?'pieno':''}" data-latob="leggi">Leggi in vigore ›</button></div></div>`;
  }
  // C
  const PASSI=[['scenario','Scenario'],['paese','Il Paese'],['regole','Regole del voto'],['leggi','Leggi in vigore'],['riepilogo','Riepilogo e salva']];
  const segni={paese:PAESE.filter(k=>Math.abs(st.sc.cursori[k]-CUR[k].valore)>1e-9).length, regole:(r.errore?'!':ELETT.concat(COST).filter(d=>d.id in st.sc.disposizioni).length+(st.sc.cursori.legge_elettorale!=='legge_180'?1:0)), leggi:ORD.filter(d=>d.id in st.sc.disposizioni).length};
  const i=PASSI.findIndex(p=>p[0]===st.passoC), corpo={
    scenario:`<h2 class="tit">Da dove si parte</h2>${scelta()}`,
    paese:`<h2 class="tit">Il Paese al turno zero</h2><div class="curs">${PAESE.map(k=>cursore(k)).join('')}</div>`,
    regole:`<h2 class="tit">Le regole del voto</h2>${regole(r)}`,
    leggi:`<h2 class="tit">Le leggi in vigore</h2>${leggi()}`,
    riepilogo:`<h2 class="tit">Se si fondasse oggi</h2><div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--canale)"><div>${tabPosti(r)}</div><div style="display:grid;gap:12px;align-content:start">${avvisi(r)}${conti(r)}${salva(r)}</div></div>`}[st.passoC];
  return testa(PASSI[i][1].toLowerCase())+`<div class="pag" style="grid-template-rows:auto minmax(0,1fr)">
    <div class="striscia" data-vivo style="grid-column:1/-1"><span><span class="k">Spread</span> <b>${r.spread_pb}</b></span><span><span class="k">Disavanzo</span> <b>${num(r.disavanzo_pil)}%</b></span>
      <span><span class="k">Maggioranza dai sei posti</span> <span class="pallini">${r.posizioni.map(p=>`<i class="${p.maggioranza?'':'no'}" title="${num(p.posizione)}"></i>`).join('')}</span></span>
      <span class="${r.avvisi.length>1?'male':'muto'}">${r.avvisi.length} avvis${r.avvisi.length===1?'o':'i'}</span>${r.errore?'<b class="male">legge elettorale da sistemare</b>':''}
      <span style="margin-left:auto"><button class="btn pieno p" data-avanti ${r.errore?'disabled':''}>Fonda il partito ›</button></span></div>
    <nav class="somm" data-vivo>${PASSI.map(([id,t],j)=>`<button class="${id===st.passoC?'qui':''}" data-passo="${id}"><span class="nn">${j+1}</span>${t}${segni[id]?`<span class="seg">${segni[id]==='!'?'da sistemare':segni[id]+' cambi'}</span>`:''}</button>`).join('')}</nav>
    <div class="passo">${corpo}<div class="piede">${i>0?`<button class="link" data-passo="${PASSI[i-1][0]}">‹ ${PASSI[i-1][1]}</button>`:'<span></span>'}${i<PASSI.length-1?`<button class="btn" data-passo="${PASSI[i+1][0]}">${PASSI[i+1][1]} ›</button>`:''}</div></div></div>`;
}
function graficoPosti(r){
  const H=190, tetto=.8, y=q=>q/tetto*100;
  return `<div class="colonne-posti">${r.posizioni.map(p=>`<div class="cp ${p.maggioranza?'':'no'}"><span class="sec"><b>${pct(p.quota_coalizione)}</b></span>
      <div class="st" style="height:${y(p.quota_coalizione)}%"><i style="height:${p.quota_attesa/p.quota_coalizione*100}%"></i></div></div>`).join('')}
    <div class="soglia" style="bottom:${y(.42)}%"><span>42% atteso</span></div></div>
    <div class="sotto-posti">${r.posizioni.map(p=>`<div><b>${num(p.posizione)}</b><br><span class="male">voi ${pct(p.quota_attesa)}</span><br>${p.seggi_camera} + ${p.seggi_senato} seggi<br>${p.maggioranza?'<span class="bene">maggioranza</span>':'<b class="male">senza</b>'}<br><span class="muto">${esc(coal(p).replace(', voi',''))}</span></div>`).join('')}</div>
    <p class="min muto">Colonna: la coalizione migliore a quel posto; in rosso la vostra parte. A righe dove manca la maggioranza.</p>`;
}

// ===== motore del prototipo =====
const scr=document.getElementById('screen'); let limite='';
function render(){
  const W=+st.fin, H=W===1440?900:800, chiesta=+st.scala, z=Math.min(chiesta,W/1024), lw=W/z, lh=H/z;
  limite = z<chiesta ? `scala fermata a ${z.toLocaleString('it-IT',{maximumFractionDigits:2})}×` : '';
  const html=vista(), foc=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.cur;
  const sx=scr.querySelector('.sx,.passo,.lato'), top=sx?sx.scrollTop:0;
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${st.v}" style="zoom:${z};width:${lw}px;height:${lh}px;${st.v==='A'?'':'grid-template-rows:auto minmax(0,1fr) auto'}">${html}</div>`;
  const sx2=scr.querySelector('.sx,.passo,.lato'); if(sx2) sx2.scrollTop=top;
  if(foc){ const el=scr.querySelector(`[data-cur="${foc}"]`); if(el) el.focus(); }
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  document.getElementById('avv').textContent=[limite, APPROSSIMATO.length?'≈ '+APPROSSIMATO.join('; '):'riepilogo vero (genera/)', st.msg].filter(Boolean).join(' · ');
}
// durante il trascinamento: si ridisegnano solo le parti vive, il cursore resta quello che si tiene in mano
function vivo(){
  const tmp=document.createElement('div'); tmp.innerHTML=vista();
  const a=[...scr.querySelectorAll('[data-vivo]')], b=[...tmp.querySelectorAll('[data-vivo]')];
  const ca=[...scr.querySelectorAll('.cur')], cb=[...tmp.querySelectorAll('.cur')];
  if(a.length!==b.length||ca.length!==cb.length) return render();
  a.forEach((el,i)=>{ el.innerHTML=b[i].innerHTML; el.className=b[i].className; el.setAttribute('style',b[i].getAttribute('style')||''); });
  ca.forEach((el,i)=>{ el.className=cb[i].className; el.querySelector('.r1').innerHTML=cb[i].querySelector('.r1').innerHTML; el.querySelector('.r3').innerHTML=cb[i].querySelector('.r3').innerHTML; });
  document.getElementById('avv').textContent=[limite, APPROSSIMATO.length?'≈ '+APPROSSIMATO.join('; '):'riepilogo vero (genera/)'].filter(Boolean).join(' · ');
}
scr.addEventListener('change',e=>{ if(e.target.dataset.cur) render(); });
const tocca=()=>{ if(!st.mosso){ st.mosso=true; if(st.sorgente==='base') st.nome=''; } st.conf=null; };
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else { st[b.parentElement.dataset.k]=b.dataset.v; if(b.parentElement.dataset.k==='prova') scegliProva(b.dataset.v); }
  st.msg=''; st.esci=false; render();
});
scr.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.cur){ st.sc.cursori[t.dataset.cur]=+t.value; tocca(); vivo(); }
  else if(t.dataset.nome!==undefined){ st.nome=t.value; st.conf=null; const b=scr.querySelector('[data-salva]'); if(b) b.disabled=!(t.value.trim()&&st.mosso); }
});
scr.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.legge!==undefined){ st.sc.cursori.legge_elettorale=t.value; ELETT.forEach(d=>delete st.sc.disposizioni[d.id]); tocca(); render(); }
  else if(t.dataset.dsel){ const d=DISP[t.dataset.dsel]; if(t.value===d.partenza) delete st.sc.disposizioni[d.id]; else st.sc.disposizioni[d.id]=t.value; tocca(); render(); }
});
scr.addEventListener('click',e=>{
  const q=s=>e.target.closest(s); let x; st.msg='';
  if(x=q('[data-esci]')){ if(x.dataset.esci==='1' && !st.mosso){ st.msg='(torna all’Edicola)'; } else st.esci=x.dataset.esci==='1'; }
  else if(q('[data-esci-ok]')){ st.esci=false; st.msg='(torna all’Edicola, modifiche perse)'; }
  else if(x=q('[data-sc]')){ if(x.dataset.nuovo!==undefined){ scegliProva('base'); st.mosso=true; } else { scegliProva(x.dataset.sc in PROVE||x.dataset.sc==='base'?x.dataset.sc:'base'); } }
  else if(x=q('[data-el]')){ const d=DISP[x.dataset.el], L=D.leggi_elettorali[st.sc.cursori.legge_elettorale][d.id]; if(x.dataset.g===L) delete st.sc.disposizioni[d.id]; else st.sc.disposizioni[d.id]=x.dataset.g; tocca(); }
  else if(x=q('[data-dp]')){ const d=DISP[x.dataset.dp]; if(x.dataset.g===d.partenza) delete st.sc.disposizioni[d.id]; else st.sc.disposizioni[d.id]=x.dataset.g; tocca(); }
  else if(x=q('[data-salva]')){ const n=st.nome.trim(); if(x.dataset.salva==='0' && st.salvati.includes(n)) st.conf='sovrascrivi';
    else { if(!st.salvati.includes(n)) st.salvati.push(n); st.sorgente=n; st.mosso=false; st.conf=null; st.sc.nome=n; PROVE[n]={scenario:carica(st.sc)}; } }
  else if(q('[data-conf-annulla]')){ st.conf=null; }
  else if(q('[data-avanti]')){ st.msg=`(apre la Fondazione, ticket 15, con ${st.sorgente==='base'&&!st.mosso?'lo scenario di base':'questo scenario su misura'})`; }
  else if(x=q('[data-passo]')){ st.passoC=x.dataset.passo; }
  else if(x=q('[data-latob]')){ st.latoB=x.dataset.latob||null; }
  else return;
  render();
});
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
