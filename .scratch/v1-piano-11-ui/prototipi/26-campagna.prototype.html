<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Campagna» (26), mappa v1-piano-11-ui.
  Domanda: com'è fatta la sezione Campagna? La coalizione da dichiarare con disponibilità e causa, e i seggi delle liste
  comuni da cedere (storie 77-78); fino a tre bersagli fra condizioni e regioni, ciascuno con la sua leva e l'anteprima a
  fasce (127); fino a due promesse (128); il riposizionamento di mezzo punto col rischio di scissione (126); le casse dei
  rivali (129); il sondaggio privato; l'avviso della campagna tagliata. Vale al turno zero e nel turno del voto; altrove barrata.
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Tavolo        — tre colonne a pagina (Coalizione · Spesa · Posizione e promesse), la cassa nel dettaglio a lato
    B  Cassa ripartita — in testa la cassa divisa fra le spese contro quelle dei rivali; a pagina i 26 bersagli in tabella,
                       un clic e diventano spesa; coalizione, posizione e promesse in linguette nel dettaglio a lato
    C  Ordine del giorno — righe come nel cruscotto, ognuna col suo default scritto; la riga scelta si apre a lato
  Stati, ?stato=: zero (seme 4 a 4,5, turno zero) · governo (seme 4, turno 20, ultimo della legislatura, al governo)
    · opposizione (seme 1 a 1,5, turno 20, minaccia di scissione già accesa) · cessione (seme 2 a 2,5, turno zero: la
    Sinistra entra con 30 seggi ceduti) · tagliata (lo zero con 1.000.000 € di campagna, poi il sondaggio privato)
    · barrata (un turno qualsiasi fuori dal voto).
  Dati: viste/26-campagna.json (genera/, tutto giocato), incollato ridotto da uno script usa e getta. Ogni disponibilità è
  quella vera della coalizione scelta (tutti i 128 o 256 sottoinsiemi provati col comando), ogni fascia è `anteprima_campagna`
  vera, ogni rifiuto è il testo del core. Gli importi vanno a gradini (25.000-800.000 €, più 500.000 per la campagna tagliata) perché le anteprime sono
  pre-calcolate: nel gioco l'importo è libero. La causa delle leve diverse da «persuadere» cambia solo il verbo (l'anteprima
  non dipende dalla leva). Simulati e marcati: le soglie di scissione nella Vista e le intese che le promesse costano agli
  alleati (rimandi al core). Le scelte restano in memoria, niente comandi veri.
  VERDETTO (Mario, 12/11/2026), nel ticket 26: A · Tavolo; anteprima del core per riposizionamento (con le soglie nella
  Vista) e per le promesse al governo; l'avviso della campagna tagliata lo scrive la UI. Il file si apre su A; B e C
  restano dalla barra in basso.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A). Mappa: 23-paese. Non è codice di produzione. Buttare dopo il verdetto.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo campagna · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/*CSS_BASE: da 25-registro, che lo copia da 08-fondamenta*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS.g ::selection{background:var(--ink);color:var(--carta)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.vS *{scrollbar-width:thin;scrollbar-color:var(--grigio) transparent}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.muto{color:var(--grigio)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}

/* cornice A · Gerenza (08) */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em;display:flex;gap:12px;align-items:baseline}
.banda.riav{background:var(--biro)}
.banda button{color:inherit;text-decoration:underline;text-underline-offset:2px;font-weight:700}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:150px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}

/*FINE_CSS_BASE*/
/* ===== mappa (23-paese) ===== */
.carta-it{position:relative}
.carta-it path.reg{cursor:pointer;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.carta-it path.reg:hover{stroke-width:2.5}
.carta-it .anello{fill:none;stroke:var(--biro);stroke-width:3.5;vector-effect:non-scaling-stroke;pointer-events:none}
.lista{display:grid;align-content:start;font-size:var(--c-sec)}
.lista.due{grid-template-columns:1fr 1fr;column-gap:14px}
.lista .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:2px 4px;border-bottom:var(--filo);cursor:pointer;line-height:1.25}
.lista .r:hover{background:var(--velo)}
.lista .r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.lista .r.preso{color:var(--grigio);cursor:not-allowed}
.lista .r .x{font-weight:700;white-space:nowrap;font-size:var(--c-min)}

/* ===== campagna (comune) ===== */
.corpo{min-height:0;min-width:0;overflow:hidden;display:grid;position:relative}
.corpo>*{min-width:0;min-height:0}
.col{overflow:auto;min-height:0;padding:10px var(--canale) 12px}
.col+.col{border-left:var(--filo)}
.lato{border-left:var(--forte);padding:12px var(--canale) 12px;overflow:auto;min-height:0}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:6px;flex-wrap:wrap}
.capo .tit{font-size:var(--c-sez)}
.capo.p .tit{font-size:var(--c-riq)}
.h5{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);font-weight:700;margin:12px 0 4px}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.nota{border-top:1.5px dashed var(--grigio);padding:5px var(--marg) 6px;font-size:var(--c-min);color:var(--grigio);line-height:1.35}
.nota b{color:var(--ink)}
.rim{display:inline-block;border:1.5px dashed var(--biro);color:var(--biro);font-size:var(--c-min);padding:0 5px;font-weight:700;white-space:nowrap}
.rif{border:1.5px solid var(--rosso);color:var(--rosso);font-size:var(--c-sec);padding:4px 8px;margin:4px 0}
.avv{border:1.5px solid var(--rosso);padding:7px 10px;font-size:var(--c-sec);margin:6px 0;display:grid;gap:3px}
.avv b{color:var(--rosso)}
.avv .rim,.conf .rim{white-space:normal}
.conf{border:1.5px solid var(--rosso);padding:8px 11px;margin:6px 0;font-size:var(--c-sec);display:grid;gap:4px}
.conf .az{margin-top:2px}
.fatto{border:1.5px solid var(--verde);color:var(--verde);padding:4px 8px;font-size:var(--c-sec);font-weight:700}
.g .fatto{border-color:var(--ink);color:var(--ink)}
.pdot{width:10px;height:10px;border:1px solid var(--ink);flex:none;display:inline-block}
/* righe dei partiti */
.pr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:5px 2px 6px;border-top:var(--filo)}
.pr:first-of-type{border-top:0}
.pr .n{font-weight:700;font-size:var(--c-sec);display:flex;gap:0 6px;align-items:center;flex-wrap:wrap;min-width:0;overflow:hidden}
.pr .c{grid-column:2/-1;font-size:var(--c-min);color:var(--grigio)}
.pr .c::before{content:"perché: ";font-style:italic}
.pr.dentro{background:var(--velo)}
.pr .ces{grid-column:2/-1}
.si{color:var(--verde);font-weight:700;font-size:var(--c-min);white-space:nowrap}
.no{color:var(--rosso);font-weight:700;font-size:var(--c-min);white-space:nowrap}
.g .si,.g .no{color:var(--ink)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--ink)}
.step button{padding:0 7px;font-weight:700}
.step button:disabled{color:var(--grigio);cursor:default}
.step span{padding:0 8px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);font-weight:700;font-size:var(--c-sec);min-width:84px;text-align:center}
.seg2{display:inline-flex;border:1.5px solid var(--ink)}
.seg2 button{padding:1px 8px;font-size:var(--c-min);font-weight:700}
.seg2 button+button{border-left:1.5px solid var(--ink)}
.seg2 button.on{background:var(--ink);color:var(--carta)}
/* spesa */
.sp{border:var(--bordo);padding:7px 9px;margin-bottom:8px;display:grid;gap:5px}
.sp .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sp .t b{font-family:var(--tit);font-variation-settings:var(--wonk);font-size:var(--c-lead)}
.sp .cau{font-size:var(--c-min);color:var(--grigio)}
.sp.vuota{border-style:dashed;border-color:var(--grigio);color:var(--grigio);font-size:var(--c-sec)}
.fascia{display:inline-flex;gap:3px;align-items:center;font-size:var(--c-min);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.fascia i{width:12px;height:9px;border:1.5px solid var(--ink)}
.fascia i.on{background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1.5px solid var(--ink);padding:0 7px;font-size:var(--c-min);font-weight:700}
.chip:hover{background:var(--ink);color:var(--carta)}
.chip:disabled{border-color:var(--grigio);color:var(--grigio);background:none;cursor:not-allowed}
/* asse della posizione */
.asse{position:relative;height:46px;margin:6px 0 2px;overflow:hidden}
.asse .lin{position:absolute;left:0;right:0;top:22px;border-top:1.5px solid var(--ink)}
.asse .tk{position:absolute;top:17px;height:11px;border-left:1.5px solid var(--ink)}
.asse .tk span{position:absolute;top:12px;left:-4px;font-size:var(--c-min);color:var(--grigio)}
.asse .pt{position:absolute;top:15px;width:14px;height:14px;margin-left:-7px;border:2px solid var(--ink);border-radius:50%;background:var(--carta)}
.asse .pt.d{background:var(--ink)}
.asse .pt.nuovo{border-color:var(--biro);background:var(--biro)}
.asse .pt.nuovo.p{background:var(--carta)}
.asse .ip{position:absolute;top:0;font-size:var(--c-min);white-space:nowrap;transform:translateX(-50%);font-weight:700}
.asse .alt{position:absolute;top:19px;width:8px;height:8px;margin-left:-4px;background:var(--grigio)}
.dist{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:var(--c-sec)}
.dist dt{color:var(--grigio)}
.metro{position:relative;height:14px;border:1.5px solid var(--ink);margin:4px 0 14px}
.metro i{position:absolute;top:0;bottom:0;left:0;background:var(--ink)}
.metro i.nuovo{background:var(--biro);opacity:.55}
.metro b{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--rosso)}
.metro b span{position:absolute;top:16px;left:-14px;font-size:var(--c-min);color:var(--rosso);white-space:nowrap;font-weight:400}
.g .metro b{border-color:var(--ink)} .g .metro b span{color:var(--ink)}
/* cassa */
.conto{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:var(--c-sec)}
.conto .tot{border-top:var(--bordo);font-weight:700;padding-top:2px}
.conto .neg{color:var(--rosso)}
.barc{display:flex;height:18px;border:1.5px solid var(--ink);margin:4px 0}
.barc i{height:100%;border-right:1.5px solid var(--carta)}
.riv{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:2px 8px;align-items:center;font-size:var(--c-sec)}
.riv .b{height:10px}
.riv .x{text-align:right;font-weight:700;white-space:nowrap}
.riv .pm{grid-column:2/-1;font-size:var(--c-min);color:var(--grigio);margin:-1px 0 3px}
.riv .tu{font-weight:700}
/* B · tabella dei bersagli */
.tb{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.tb th{font-size:var(--c-min);color:var(--grigio);text-align:right;font-weight:700;border-bottom:1.5px solid var(--ink);padding:2px 6px;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:2px 6px;border-bottom:var(--filo);text-align:right;white-space:nowrap}
.tb tr.cl{cursor:pointer}
.tb tr.cl:hover{background:var(--velo)}
.tb tr.preso{background:var(--velo);box-shadow:inset 3px 0 0 var(--ink)}
.tb tr.sez td{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);font-weight:700;border-bottom:1.5px solid var(--ink);padding-top:8px}
.ling{display:flex;gap:2px;border-bottom:var(--forte);margin-bottom:8px}
.ling button{padding:3px 5px;font-size:var(--c-min);font-weight:700;color:var(--grigio);border:1.5px solid transparent;border-bottom:0}
.ling button.on{color:var(--ink);border-color:var(--ink);margin-bottom:-2px;background:var(--carta)}
/* C · ordine del giorno */
.odg{display:grid;align-content:start}
.og{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 6px;border-top:var(--filo);cursor:pointer}
.og:hover{background:var(--velo)}
.og.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.og .num{font-family:var(--tit);font-weight:700;font-size:var(--c-riq);color:var(--grigio)}
.og .q{font-weight:700}
.og .s{grid-column:2;font-size:var(--c-sec)}
.og .d{grid-column:2;font-size:var(--c-min);color:var(--grigio)}
.og .d::before{content:"senza scelta: ";font-style:italic}
.og .a{grid-row:1/span 3;grid-column:3}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
</style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="step"><button data-euro="${i}:-1" ${ie<=0?'disabled':''}>−</button><span>${euro(s.euro)}</span><button data-euro="${i}:1" ${ie>=EUR.length-1?'disabled':''}>+</button></span>${a?fascia(a.intensita):''}</div>

function aggiungi(){

    <div class="chips">${COND.map(c=>`<button class="chip" data-nuovo="c:${c}" ${presi.has('c:'+c)?'disabled title="Bersaglio ripetuto"':''}>${NCOND[c]}</button>`).join('')}<button class="chip" data-regione>una regione ›</button></div>

}
function pannelloSpesa(){
  return `${st.spese.map(slot).join('')}${aggiungi()}<p class="min muto">Si paga in chiusura, prima del voto. Le fasce dicono quanto pesa la spesa sugli elettori del bersaglio: per raddoppiare l’effetto serve il quadruplo.</p>`;
}

// ======================= posizione =======================
const SOGLIE = {minaccia:.5, scissione:1};   // SIMULATE: rimando al core, oggi sono manopole fuori dalla Vista
function asse(dich,perc,nd,np){
  const x = p => (4+(p-1)/6*92)+'%';
  const altri = P().filter(p=>p.id!=='giocatore'&&!p.sciolto).map(p=>`<i class="alt" style="left:${x(p.posizione_dichiarata)}" title="${esc(p.nome)} ${num(p.posizione_dichiarata)}"></i>`).join('');
  return `<div class="asse"><div class="lin"></div>${[1,2,3,4,5,6,7].map(k=>`<i class="tk" style="left:${x(k)}"><span>${k}</span></i>`).join('')}${altri}
    <i class="pt" style="left:${x(perc)}" title="percepita"></i><i class="pt d" style="left:${x(dich)}" title="dichiarata"></i>
    ${nd!=null?`<i class="pt nuovo p" style="left:${x(np)}"></i><i class="pt nuovo" style="left:${x(nd)}"></i>`:''}</div>
    <div class="min muto">● dichiarata · ○ percepita · ■ gli altri partiti${nd!=null?' · in blu dopo lo spostamento':''}</div>`;
}
function metro(d,nd){
  const w = x => clamp(x/1.2*100,0,100)+'%';
  return `<div class="metro"><i style="width:${w(d)}"></i>${nd!=null?`<i class="nuovo" style="width:${w(nd)}"></i>`:''}<b style="left:${w(SOGLIE.minaccia)}"><span>minaccia</span></b><b style="left:${w(SOGLIE.scissione)}"><span>scissione</span></b></div>`;
}
function pannelloPosizione(){
  const g=G(), d=Math.abs(g.posizione_percepita-g.posizione_dichiarata), pr=PROVE()&&PROVE().riposiziona;
  if(!pr) return `<div class="ph">Prototipo: in questo stato i riposizionamenti non sono provati.</div>`;
  const fatto = st.rip!=null ? pr[st.rip] : null, sc = st.ripScelta!=null ? pr[st.ripScelta] : null, mostra = fatto||(!st.rip&&sc&&!sc.rifiuto?sc:null);
  const nd = mostra ? Math.abs(mostra.perc-mostra.dich) : null;
  return `${asse(g.posizione_dichiarata,g.posizione_percepita, mostra?.dich, mostra?.perc)}
    <dl class="dist"><dt>Dichiarata</dt><dd>${num(g.posizione_dichiarata,2)}${mostra?` → <b>${num(mostra.dich,2)}</b>`:''}</dd><dt>Percepita</dt><dd>${num(g.posizione_percepita,2)}${mostra?` → <b>${num(mostra.perc,2)}</b>`:''} <span class="min muto">(fa metà strada)</span></dd>
      <dt>Distanza</dt><dd><b>${num(d,2)}</b>${nd!=null?` → <b>${num(nd,2)}</b>`:''} ${d>=SOGLIE.minaccia?'<span class="no">minaccia di scissione accesa</span>':''}</dd></dl>
    ${metro(d,nd)}<div class="min" style="margin-top:-4px"><span class="rim">soglie nella Vista · rimando al core</span></div>
    ${st.rip!=null ? `<div class="fatto">Riposizionato a ${num(fatto.dich,2)}: non si cambia più in questa campagna.</div>` : `
    <div class="az">${['-0.5','-0.25','0.25','0.5'].map(k=>`<button class="btn p ${st.ripScelta===k?'scelto':''}" data-rip="${k}">${(+k>0?'+':'−')+num(Math.abs(+k),2)}</button>`).join('')}</div>
    ${sc&&sc.rifiuto?`<div class="rif">${esc(sc.rifiuto.replace('comando non ammesso: ',''))}</div>`:''}
    ${sc&&!sc.rifiuto?(st.ripConf?`<div class="conf"><p>Ti sposti a <b>${num(sc.dich,2)}</b>; la percepita va a ${num(sc.perc,2)} e la distanza ${nd>d?'sale':'scende'} a <b>${num(nd,2)}</b>${nd>=SOGLIE.scissione?': <b>oltre la soglia, il partito si scinde in chiusura</b>':nd>=SOGLIE.minaccia?': sopra la soglia della minaccia':''}. Si fa una volta sola in questa campagna.</p><div class="az"><button class="btn pieno" data-ripsi>Conferma lo spostamento</button><button class="btn" data-ripno>Annulla</button></div></div>`:`<div class="az"><button class="btn pieno" data-ripchiedi>Spostati a ${num(sc.dich,2)} ›</button></div>`):''}
    <p class="min muto">Gratis, una volta, al massimo mezzo punto, senza scavalcare un altro partito.</p>`}`;
}

// ======================= promesse =======================
const dispOk = () => V().disposizioni;   // `prometti` accetta ogni disposizione del catalogo
const nomeG = (d,g) => (d.gradini.find(x=>x.id===g)||{}).nome || g;
function pannelloPromesse(){
  const fatte=st.promFatte, ds=dispOk();
  const lista = st.prom.map((p,i)=>{ const d=V().disposizioni.find(x=>x.id===p[0]); return `<div class="pr dentro"><span class="pdot" style="background:var(--ink)"></span><span class="n">${esc(d.nome)}: ${esc(nomeG(d,p[1]))}</span>${fatte?'':`<button class="link" data-promtogli="${i}">togli</button>`}<span class="min muto" style="grid-column:2/-1">oggi ${esc(nomeG(d,d.in_vigore))}</span></div>`; }).join('');
  const costo = V().governa ? (()=>{ const real = st.prom.length===2 && st.prom.every(p=>['reddito_minimo:universale','eta_pensionabile:64'].includes(p.join(':'))) && S().promesse_alleati;
      return `<div class="avv"><span><b>Al governo costa intesa:</b> ogni alleato contrario a una promessa ne perde.</span>${real?real.map(a=>`<span>${esc(pn(a.partito))}: ${num(a.variazioni.filter(v=>v.causa==='promessa').reduce((s,v)=>s+v.delta,0),0)} d’intesa${a.ultimatum?' · <b>già in ultimatum</b>':''}</span>`).join(''):''}<span><span class="rim">chi è contrario, prima del sì · rimando al core</span>${real?' <span class="min muto">(cifre vere: le due promesse in prova)</span>':''}</span></div>`; })() : '';
  const scelta = st.promDisp ? V().disposizioni.find(d=>d.id===st.promDisp) : null;
  const sceglitore = fatte || st.prom.length>=2 ? '' : `<div class="h5">Promessa ${st.prom.length+1} di 2</div>
    <select data-promdisp style="border:1.5px solid var(--ink);padding:2px 4px;max-width:100%"><option value="">una disposizione…</option>${ds.filter(d=>!st.prom.some(p=>p[0]===d.id)).map(d=>`<option value="${d.id}" ${st.promDisp===d.id?'selected':''}>${esc(d.nome)}</option>`).join('')}</select>
    ${scelta?`<div class="chips" style="margin-top:4px">${scelta.gradini.map(g=>`<button class="chip" data-promg="${g.id}" ${g.id===scelta.in_vigore?'title="in vigore"':''}>${esc(g.nome)}${g.id===scelta.in_vigore?' · in vigore':''}</button>`).join('')}</div>`:''}`;
  const conf = fatte ? `<div class="fatto">Promesse fatte: si verificano al voto dopo.</div>` : st.prom.length ? (st.promConf ? `<div class="conf"><p>Prometti ${elenco(st.prom.map(p=>{ const d=V().disposizioni.find(x=>x.id===p[0]); return '«'+d.nome+': '+nomeG(d,p[1])+'»'; }))}. Persuadono subito chi sta più vicino al gradino promesso; al voto dopo, mantenute, alzano la fiducia, mancate la tolgono il doppio. Si fa una volta sola in questa campagna.</p><div class="az"><button class="btn pieno" data-promsi>Conferma ${st.prom.length===1?'la promessa':'le promesse'}</button><button class="btn" data-promno>Annulla</button></div></div>` : `<div class="az"><button class="btn pieno" data-promchiedi>Prometti ›</button></div>`) : '';
  return `${lista||'<p class="sec muto">Nessuna promessa.</p>'}${st.rifP?`<div class="rif">${esc(st.rifP)}</div>`:''}${sceglitore}${costo}${conf}
    <p class="min muto">Fino a due, ciascuna a un gradino diverso dal vigente.</p>`;
}

// ======================= cassa, rivali, sondaggio =======================
function pannelloCassa(){
  const c0=cassa0(), sp=totale(), t=taglio(), tagliati=st.spese.filter((s,i)=>t[i]<s.euro);
  const avv = tagliati.length ? `<div class="avv"><span><b>La cassa non basta più.</b> La campagna chiede ${euro(sp)}, dopo il sondaggio ne restano ${euro(cassa())}: in chiusura le spese si tagliano in ordine, ${elenco(tagliati.map(s=>bnome(s.bersaglio)+' '+(t[st.spese.indexOf(s)]?'scende a '+euro(t[st.spese.indexOf(s)]):'cade')))}.</span><span class="min">Una scissione in chiusura porterebbe via altra cassa. Nell’esito: la voce «campagna tagliata».</span></div>` : '';
  return `<div class="conto"><span>Cassa</span><b>${euro(c0)}</b>${st.privato?`<span>Sondaggio privato</span><span class="neg">−${euro(prezzo())}</span>`:''}${st.spese.map(s=>`<span>${esc(BNome(s.bersaglio))} · ${LV[s.leva].toLowerCase()}</span><span class="neg">−${euro(s.euro)}</span>`).join('')}

}

  return `<div class="riv">${ps.map(p=>`<span class="${p.id==='giocatore'?'tu':''}">${esc(p.id==='giocatore'?'Tu':p.nome)}</span><i class="b" style="width:${p.cassa/mx*100}%;background:${pcol(p.id)}"></i><span class="x">${euro(p.cassa)}</span>
    ${p.promesse.length?`<span class="pm">promesse in sospeso: ${esc(p.promesse.map(x=>x.disposizione+': '+x.gradino).join('; '))}</span>`:''}`).join('')}</div>
    <p class="min muto">I partiti IA decidono la campagna in chiusura. Quanto e dove hanno speso lo dice l’esito del voto${st.stato==='zero'?': in questo seme spendono tutta la cassa, la Sinistra 8,1 mln € su dipendenti privati, pensionati e Lombardia':''}.</p>`;

function pannelloPrivato(){

  return `<p class="sec">Le tue quote per condizione e regione su un campione tuo, accanto a quelle pubbliche.</p><div class="az"><button class="btn" data-privato>Compra il sondaggio privato · ${euro(pz)}</button></div>`;

// ======================= selettore della regione (Paese: mappa piccola e lista nel dettaglio a lato) =======================
function selettore(){
  const presi=new Set(st.spese.map(s=>bk(s.bersaglio))), ids=REG(), q=id=>quota(V().sondaggio.regioni[ids.indexOf(id)].quote), mx=Math.max(...ids.map(q));

  const svg = `<div class="carta-it"><svg viewBox="0 0 ${GEO.w} ${GEO.h}" height="300" role="radiogroup" aria-label="Regione bersaglio">${ids.map(id=>PATH[id]?`<path class="reg" id="r-${id}" d="${PATH[id].d}" fill="${fill(id)}" data-reg="${id}" role="radio" aria-checked="${sc===id}"><title>${esc(REGN[id])} · tu al ${pc(q(id))}</title></path>`:'').join('')}${sc&&PATH[sc]?`<use href="#r-${sc}" class="anello"/>`:''}</svg></div>`;
  return `<span class="occ">Campagna · bersaglio</span>${capoP('Una regione')}<div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px">${svg}
    <div><p class="min muto">Tinta: la tua quota sul sondaggio pubblico.</p>${sc?`<p class="sec"><b>${esc(REGN[sc])}</b>: tu al ${pc(q(sc))}.</p><div class="az"><button class="btn pieno" data-prendi="${sc}" ${presi.has('r:'+ids.indexOf(sc))?'disabled':''}>Spendi in ${esc(REGN[sc])}</button></div>`:'<p class="sec">Scegli sulla carta o in lista.</p>'}<div class="az"><button class="link" data-chiudireg>chiudi</button></div></div></div>
    <div class="lista due" style="margin-top:8px">${ids.map((id,i)=>`<div class="r ${sc===id?'sel':''} ${presi.has('r:'+i)?'preso':''}" data-reg="${id}"><span>${esc(REGN[id])}</span><span class="x">${pc(q(id))}</span></div>`).join('')}</div>`;
}

// ======================= le tre forme =======================
const capo = (t,x='') => `<div class="capo"><h3 class="tit">${t}</h3><span class="sec muto">${x}</span></div>`;
const capoP = (t,x='') => `<div class="capo p"><h4 class="tit">${t}</h4><span class="sec muto">${x}</span></div>`;
function testa(){
  const v=V();
  return `${v.governa?'Al governo':st.stato==='opposizione'?'All’opposizione':'Turno zero'}: si vota alla chiusura di ${per(v.data)}. Le stesse leve al governo e all’opposizione.`;
}
function nota(){ return `<div class="nota"><b>Prototipo.</b> ${testa()} Dati veri (seme ${st.stato==='cessione'?2:st.stato==='opposizione'?1:4}); importi a gradini perché le anteprime sono pre-calcolate. In blu tratteggiato i rimandi al core.</div>`; }

  return `${capoP('Cassa')}${pannelloCassa()}<div class="h5">Sondaggio privato</div>${pannelloPrivato()}<div class="h5">Casse dei rivali</div>${pannelloRivali()}`; }
function formaA(){
  return `<div class="corpo" style="grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr) var(--lato);grid-template-rows:minmax(0,1fr) auto">
    <div class="col">${capoP('Coalizione','storie 77-78')}${pannelloCoalizione()}</div>
    <div class="col">${capoP('Spesa',`${st.spese.length} bersagli su 3`)}${pannelloSpesa()}</div>
    <div class="col">${capoP('Posizione','una volta')}${pannelloPosizione()}${capoP('Promesse',`${st.prom.length} su 2`)}${pannelloPromesse()}</div>
    <aside class="lato">${lato()}</aside><div style="grid-column:1/-1">${nota()}</div></div>`;
}
function formaB(){
  const c0=cassa0(), sp=st.spese, mx=Math.max(...P().map(p=>p.cassa));
  const pezzi=[...sp.map((s,i)=>({w:s.euro,c:['var(--ink)','var(--grigio)','#8C847B'][i],t:BNome(s.bersaglio)})), ...(st.privato?[{w:prezzo(),c:'var(--giallo)',t:'sondaggio'}]:[])];
  const resto=Math.max(0,c0-pezzi.reduce((a,p)=>a+p.w,0));
  const barra = `<div style="display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:4px 10px;align-items:center">
    <b>La tua cassa</b><div class="barc" style="width:${c0/mx*100}%">${pezzi.map(p=>`<i style="width:${p.w/c0*100}%;background:${p.c}" title="${esc(p.t)} ${euro(p.w)}"></i>`).join('')}</div><b style="text-align:right">${euro(c0)}</b>
    <span class="min muto">spese e resto</span><span class="min">${pezzi.map(p=>`${esc(p.t)} ${euro(p.w)}`).join(' · ')||'nessuna spesa'} · resta ${euro(resto)}</span><span></span>
    ${P().filter(p=>p.id!=='giocatore'&&!p.sciolto).sort((a,b)=>b.cassa-a.cassa).map(p=>`<span class="sec">${esc(p.nome)}</span><i style="height:8px;width:${p.cassa/mx*100}%;background:${pcol(p.id)}"></i><span class="sec" style="text-align:right">${euro(p.cassa)}</span>`).join('')}</div>`;
  const presi=new Map(sp.map((s,i)=>[bk(s.bersaglio),i])), pv=privato(), eu = sp.length ? sp.at(-1).euro : 100000;  // la fascia della tabella: all'importo dell'ultima spesa
  const riga = b => { const k=bk(b), q=inc(b), p=pv&&inc(b,pv), a=anteprima({bersaglio:b,leva:'persuadere',euro:eu});
    return `<tr class="cl ${presi.has(k)?'preso':''}" data-nuovo="${k}"><td>${esc(BNome(b))}</td><td>${pc(quota(q.quote))}</td><td>${p?pc(quota(p.quote)):'—'}</td><td>${q.campione}</td><td>${a?fascia(a.intensita):''}</td><td>${presi.has(k)?`<b>spesa ${presi.get(k)+1}</b>`:''}</td></tr>`; };
  const tab = `<table class="tb"><tr><th>Bersaglio</th><th>tu, pubblico</th><th>tu, privato</th><th>campione</th><th>fascia a ${euro(eu)}</th><th></th></tr>
    <tr class="sez"><td colspan="6">Condizioni</td></tr>${COND.map(c=>riga({condizione:c})).join('')}<tr class="sez"><td colspan="6">Regioni</td></tr>${REG().map((_,i)=>riga({regione:i})).join('')}</table>`;
  const L = {coal:['Coalizione',pannelloCoalizione()], spese:['Spese',`${st.spese.map(slot).join('')}${st.spese.length<3?'<p class="sec muto">Un clic su una riga della tabella aggiunge il bersaglio.</p>':''}${st.rifS?`<div class="rif">${esc(st.rifS)}</div>`:''}${pannelloCassa()}`], pos:['Posizione',pannelloPosizione()], prom:['Promesse',pannelloPromesse()], priv:['Sondaggio',pannelloPrivato()]};
  return `<div class="corpo" style="grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:auto minmax(0,1fr) auto">

    <div style="grid-column:1/-1">${nota()}</div></div>`;
}
function formaC(){
  const d=disp(), g=G(), pr=PROVE()&&PROVE().riposiziona, t=taglio();
  const righe = [
    ['coal','Coalizione', st.coal.length?'con '+elenco(st.coal.map(pn)):'da solo', V().governa||V().coalizione.length?'la coalizione dell’ultimo voto':'da solo', `${d.filter(x=>x.disponibile&&!st.coal.includes(x.partito)).length} disponibili fuori`],
    ...[0,1,2].map(i=>{ const s=st.spese[i]; return ['sp'+i, `Bersaglio ${i+1}`, s?`${BNome(s.bersaglio)} · ${LV[s.leva].toLowerCase()} · ${euro(s.euro)} · ${anteprima(s)?.intensita||''}${t[i]<s.euro?' · <b class="no">si taglia</b>':''}`:'—', 'nessuna spesa', s?'':'Aggiungi ›']; }),
    ['pos','Posizione', st.rip!=null?`spostata a ${num(pr[st.rip].dich,2)}`:`${num(g.posizione_dichiarata,2)}, percepita ${num(g.posizione_percepita,2)}`, 'resta dov’è', Math.abs(g.posizione_percepita-g.posizione_dichiarata)>=SOGLIE.minaccia?'<span class="no">minaccia accesa</span>':''],
    ['prom','Promesse', st.prom.length?st.prom.map(p=>{ const dd=V().disposizioni.find(x=>x.id===p[0]); return dd.nome+': '+nomeG(dd,p[1]); }).join('; ')+(st.promFatte?'':' · da confermare'):'—', 'nessuna promessa', ''],
    ['priv','Sondaggio privato', st.privato?'comprato':`${euro(prezzo())}`, 'solo il pubblico', ''],
    ['cassa','Cassa e rivali', `${euro(cassa())} in cassa, ${euro(totale())} di campagna`, '—', t.some((x,i)=>x<st.spese[i].euro)?'<span class="no">non basta</span>':''],
  ];
  const sel=st.sel;
  const pann = sel==='coal'?[`Coalizione`,pannelloCoalizione()] : sel.startsWith('sp') ? ['Spesa', pannelloSpesa()] : sel==='pos'?['Posizione',pannelloPosizione()] : sel==='prom'?['Promesse',pannelloPromesse()] : sel==='priv'?['Sondaggio privato',pannelloPrivato()] : ['Cassa', pannelloCassa()+'<div class="h5">Casse dei rivali</div>'+pannelloRivali()];
  return `<div class="corpo" style="grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:minmax(0,1fr) auto">
    <div class="col">${capo('Campagna', testa())}<div class="odg">${righe.map(([k,q,s,dflt,a],i)=>`<div class="og ${sel===k||(k.startsWith('sp')&&sel.startsWith('sp')&&+k[2]===st.spese.length)?'sel':''}" data-sel="${k}" tabindex="0"><span class="num">${i+1}</span><span class="q">${q}</span><span class="s">${s}</span>${dflt!=='—'?`<span class="d">${dflt}</span>`:''}<span class="a">${a}</span></div>`).join('')}</div></div>
    <aside class="lato">${st.scegliReg!==null?selettore():capoP(pann[0])+pann[1]}</aside><div style="grid-column:1/-1">${nota()}</div></div>`;
}
function barrata(){
  return `<div class="corpo" style="grid-template-rows:minmax(0,1fr) auto"><div style="padding:16px var(--marg)"><div class="ph">Qui c’è la sezione aperta (il Cruscotto). La voce <b>Campagna</b> nel sommario è barrata e dice perché, al passaggio del puntatore: <b>«Si fa campagna solo nel turno prima del voto»</b>. Si accende nel turno del voto: al turno zero, all’ultimo della legislatura e dopo uno scioglimento.</div></div></div>`;
}

// ======================= cornice A · Gerenza (08) =======================
function caselle(pos,soglia=3,n=10){ return `<span class="cas ${pos<=soglia?'inp':''}">${Array.from({length:n},(_,i)=>`<i class="${[i<soglia?'per':'', i===soglia-1?'sog':'', i<pos?'on':''].join(' ')}"></i>`).join('')}</span>`; }
function tracciati(){
  const v=V(), m=media(), q=m[P().findIndex(p=>p.id==='giocatore')]/(1-m[AST()])*100;
  const co=['giocatore',...(v.governa?v.alleati.map(a=>a.partito):[])], sg=k=>v.seggi.filter(s=>co.includes(s.partito)).reduce((a,s)=>a+s[k],0), mg=[sg('camera')-201, sg('senato')-101];
  const t=[[v.turno===0?'Consenso del partito':'Consenso', num(q)+'%', clamp(Math.round((q-5)/3),0,10)],['Maggioranza C / S', v.turno===0||!v.governa?'—':mg.map(x=>(x>0?'+':x<0?'−':'')+Math.abs(x)).join(' / '), v.turno===0||!v.governa?0:clamp(Math.round((Math.min(...mg)+9)/3),0,10)],['Conti · spread', num(v.spread_pb,0), clamp(Math.round((500-v.spread_pb)/50),0,10)]];
  return `<div class="trks">${t.map(([k,val,pos])=>`<div class="trk"><span class="k">${k}</span>${caselle(pos)}<span class="v">${val}</span></div>`).join('')}</div>`;
}
const SEZ = [['prima','Prima pagina'],['cruscotto','Cruscotto'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function cornice(){
  const v=V(), b={};
  if(v.turno===0){ b.prima='Turno zero: non c’è un turno prima'; b.aula='Camere sciolte: niente aula fino al voto'; b.registro='Turno zero: nessun turno passato'; }
  if(!v.governa) b.governo= v.turno===0?'Turno zero: il governo nasce dopo il voto':'Non governi: nessun ministro tuo';
  b.bilancio='La legge di bilancio si presenta in ottobre-dicembre';
  if(st.stato==='barrata') b.campagna='Si fa campagna solo nel turno prima del voto';
  const qui = st.stato==='barrata' ? 'cruscotto' : 'campagna';
  const stato = v.turno===0 ? 'Turno zero · Camere sciolte' : v.governa ? 'Al governo · ultimo turno' : 'All’opposizione · ultimo turno';
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino">Il Pungolo</span><span class="chi"><b>${stato}</b><br>${per(v.data)} · turno ${v.turno}<br><b>si vota a fine turno</b></span></div>${tracciati()}
    <div class="c-dx"><div class="pila"><button class="btn pieno">Chiudi il turno e vota ›</button></div><span class="def">cassa ${euro(cassa())}</span></div></div>
    <nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}" ${k==='campagna'?'id="camp-b"':''}>${t}</button>` : `<button class="${k===qui?'qui':''}" ${k===qui?'aria-current="page"':''}>${t}</button>`).join('')}
    <span class="fuori"><button>Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav></header>`;
}
function banda(){
  if(st.stato==='opposizione') return `<div class="banda"><span>Minaccia di scissione: la percepita dista ${num(Math.abs(G().posizione_percepita-G().posizione_dichiarata),2)} punti dalla dichiarata (soglia 0,5; a 1 il partito si scinde)</span></div>`;
  if(V().governa && V().alleati.some(a=>a.ultimatum)) return `<div class="banda"><span>Ultimatum del ${esc(pn(V().alleati.find(a=>a.ultimatum).partito))}: l’intesa è sotto la soglia</span></div>`;
  return '';
}

// ======================= montaggio =======================
const scr = document.getElementById('screen');
let limite='';
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const b=st.stato==='barrata'?'':banda(), corpo = st.stato==='barrata' ? barrata() : st.v==='B' ? formaB() : st.v==='C' ? formaC() : formaA();
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${b?'auto ':''}minmax(0,1fr)">${cornice()}${b}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', st[seg.dataset.k]===x.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const kk in DEF_P) if(st[kk]!==DEF_P[kk]) p.set(kk,st[kk]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  if(st.stato==='barrata') mostraPerche(document.getElementById('camp-b'));
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ const b=el.getBoundingClientRect();
    const fuori = b.width && b.right>R.right+1 && !el.closest('.col,.lato');
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && !/auto|scroll/.test(cs.overflowX) && el!==r && el.tagName!=='SELECT';
    if(fuori||stretto) n++; });
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:''].filter(Boolean).join(' · ');
}
function nuovoBersaglio(k){
  st.rifS=null;
  if(st.spese.some(s=>bk(s.bersaglio)===k)){ st.rifS=D.rifiuti_campagna.ripetuto.replace('comando non ammesso: ','').replace(/: .*/, ': '+bnome(k[0]==='c'?{condizione:k.slice(2)}:{regione:+k.slice(2)})); return; }
  const b = k[0]==='c' ? {condizione:k.slice(2)} : {regione:+k.slice(2)};
  const nuove=[...st.spese, {bersaglio:b, leva:'persuadere', euro:100000}], r=prova(nuove);
  if(r){ st.rifS=r; return; }
  st.spese=nuove; st.scegliReg=null;
  if(st.v==='B') st.ling='spese';
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const kk=Object.keys(FORME); st.v=kk[(kk.indexOf(st.v)+(b.id==='next'?1:kk.length-1))%kk.length]; render(); return; }
  const kk=b.parentElement.dataset.k; if(!kk) return; st[kk]=b.dataset.v;
  if(kk==='stato') azzera();
  render();
});
scr.addEventListener('click',e=>{
  const q = s => e.target.closest(s), d = s => q(s)?.dataset;
  if(q('[data-coal]')) tocca(d('[data-coal]').coal);
  else if(q('[data-ces]')){ const [id,s]=d('[data-ces]').ces.split(':'); if(s!=='') st.ces[id]=+s; st.rifC=null; }
  else if(q('[data-nuovo]')) nuovoBersaglio(d('[data-nuovo]').nuovo);
  else if(q('[data-regione]')){ st.scegliReg=''; st.rifS=null; }
  else if(q('[data-chiudireg]')) st.scegliReg=null;
  else if(q('[data-reg]')) st.scegliReg=d('[data-reg]').reg;
  else if(q('[data-prendi]')) nuovoBersaglio('r:'+REG().indexOf(d('[data-prendi]').prendi));
  else if(q('[data-togli]')){ st.spese.splice(+d('[data-togli]').togli,1); st.rifS=null; }
  else if(q('[data-leva]')){ const [i,l]=d('[data-leva]').leva.split(':'); st.spese[+i].leva=l; }
  else if(q('[data-euro]')){ const [i,dx]=d('[data-euro]').euro.split(':').map(Number), s=st.spese[i], nuovo=EUR[EUR.indexOf(s.euro)+dx], prima=s.euro; s.euro=nuovo; const r=prova(st.spese); st.rifS=null; if(r){ s.euro=prima; st.rifS=r; } }
  else if(q('[data-rip]')){ st.ripScelta=d('[data-rip]').rip; st.ripConf=null; }
  else if(q('[data-ripchiedi]')) st.ripConf=1;
  else if(q('[data-ripno]')) st.ripConf=null;
  else if(q('[data-ripsi]')){ st.rip=st.ripScelta; st.ripConf=null; }
  else if(q('[data-promg]')){ const g=d('[data-promg]').promg, ds=V().disposizioni.find(x=>x.id===st.promDisp); st.rifP=null;
    if(g===ds.in_vigore) st.rifP=`Già in vigore: «${ds.nome}: ${nomeG(ds,g)}»`; else { st.prom.push([ds.id,g]); st.promDisp=null; } }
  else if(q('[data-promtogli]')){ st.prom.splice(+d('[data-promtogli]').promtogli,1); st.promConf=false; }
  else if(q('[data-promchiedi]')) st.promConf=true;
  else if(q('[data-promno]')) st.promConf=false;
  else if(q('[data-promsi]')){ st.promFatte=true; st.promConf=false; }
  else if(q('[data-privato]')) st.privato=true;
  else if(q('[data-ling]')) st.ling=d('[data-ling]').ling;
  else if(q('[data-sel]')){ st.sel=d('[data-sel]').sel; st.scegliReg=null; }
  else return;
  render();
});
scr.addEventListener('change',e=>{ if(e.target.matches('[data-promdisp]')){ st.promDisp=e.target.value||null; st.rifP=null; render(); } });
scr.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-sel]')){ e.preventDefault(); e.target.click(); } });
function mostraPerche(b){
  scr.querySelectorAll('.perche').forEach(x=>x.remove()); if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, kk=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche; r.appendChild(el);
  el.style.left=Math.min((B.left-R.left)/kk/z, r.offsetWidth-el.offsetWidth-8)+'px'; el.style.top=((B.bottom-R.top)/kk/z+2)+'px';
}
function perche(e){ const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null;
  if(!b && st.stato==='barrata') return mostraPerche(document.getElementById('camp-b')); mostraPerche(b); }
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
