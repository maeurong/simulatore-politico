<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Cruscotto all'opposizione» (28), mappa v1-piano-11-ui.
  Domanda: com'è fatto il cruscotto quando il giocatore è all'opposizione? Il programma del governo avversario
  nell'ordine dell'aula (storia 104) con la linea del giocatore misura per misura e il suo costo (91); le leve:
  sfiducia al governo o a un ministro con l'anteprima di chi la voterebbe (92-93), posto riservato (94),
  referendum abrogativo e confermativo (95-97); l'intesa degli alleati avversari in tre fasce (90); «Avanti fino a
  novità» sopra «Chiudi il turno» e la banda della fermata (89). E, premessa aperta del ticket: cosa dicono i tre
  tracciati della cornice quando non governi (vale anche per il turno zero).
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Ordine del giorno — gemella del 17: l'evento del governo in testa (sola lettura), righe per gruppo con le azioni
       sulla riga e il default scritto; la riga scelta si apre nel dettaglio a lato (emiciclo, anteprima, limiti)
    B  A fronte          — controprogramma: a sinistra ciò che porta il governo, nell'ordine; a destra, riga per riga,
       la tua risposta; le leve in una fascia a parte con le loro soglie
    C  Spoglio           — al centro la maggioranza avversaria partito per partito, allineata all'anteprima della
       sfiducia (azione principale); misure e leve sotto in elenco compatto
  Stati, ?stato=: ordinario (Vista 06) · sfiducia (presentata, poi l'esito) · passa (turno 4, la sfiducia passerebbe)
    · referendum (promosso, firme, esito) · posto (posto riservato tuo: libero, poi la proposta) · linea (Sì contro il
    default sulla misura 0, poi chiusura e voto) · intesa (due alleati in ultimatum) · grave (turno 11) · fine (turno
    19, un turno al voto) · fermata (banda di «avanti fino a novità») · firme e confermativo: DI PROVA.
    ?passo= sceglie il momento negli stati giocati in più tempi (barra in basso).
  Indicatori della cornice, ?ind=1|2|3: 1 consenso tuo · maggioranza del governo avversario · conti;
    2 consenso tuo · «per farlo cadere» (si riempie quando il governo è fragile) · conti;
    3 consenso dell'opposizione intera · maggioranza del governo avversario · conti.
  Altri parametri: ?fin=1280|1440  ?scala=1|1.25
  Dati, tutti giocati: Vista 06 e viste/28-opposizione.json (genera/src/opposizione.rs), con le anteprime vere di
  anteprima_sfiducia al governo e ai dieci dicasteri (turni 2 e 4). Le firme sono i seggi alla Camera dei partiti
  fuori dal governo contro un decimo della Camera, la formula di firme_sfiducia (partita.rs:3790); i sì della
  sfiducia sono i seggi dei partiti con la linea sì nell'anteprima (voto a blocchi, partita.rs:3751). Il consenso è
  calcolato qui sulle quote medie degli istituti senza l'astensione, come nelle fondamenta. Costi trascritti dal
  campo `come` del 28: valence 0,2658 → 0,1492 (senza sfiducia 0,2392); percepita 1,9363 contro 1,9149.
  DI PROVA, dichiarati anche a schermo col bollino rosa: la banda della fermata (le fermate le porta il piano di core
  «esito e Vista completa»); lo stato «firme» (firme_mancanti è null: 30 firme inventate); lo stato «confermativo»
  (null: misura, contrari e seggi inventati). Scale e soglie dei tracciati: quelle di prova delle fondamenta (ticket 31).
  Regole che la Vista non dice e il prototipo legge nel core, segnate a tratteggio: finestra del referendum
  (parlamento/mod.rs:541) e ultimo anno (partita.rs:1873).
  Le scelte restano in memoria, niente comandi veri. Nessuna modale: conferme sul posto.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A), cornice e righe dal 17, emiciclo dal 19.
  Non è codice di produzione. Buttare dopo il verdetto.
  VERDETTO (Mario, 12/11/2026), nel ticket 28: A · Ordine del giorno con le leve in testa; tracciati con la lettura 2
  («per farlo cadere», dall'anteprima della sfiducia; al turno zero i seggi attesi); niente conto in cornice; i quattro
  dati che la Vista non dice vanno al core. Si apre sulla forma decisa: le altre restano dalla barra in basso.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo cruscotto all'opposizione · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.dl.crit{background:var(--rosso);color:var(--carta);padding:0 5px}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.fascia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fascia .cas{--cw:12px;--ch:8px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-top:var(--filo);font-size:var(--c-sec)}
.voce:first-child{border-top:0}
.voce small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.voce small::before{content:"perché: ";font-style:italic}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:center}
.dati dt{color:var(--grigio)}

/* cornice A · Gerenza */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez);margin-bottom:4px}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:2px}
.capo h3{margin:0}

/* evento (comune) */
.evento{border:var(--forte);padding:10px 14px;display:grid;gap:6px}
.evento+.evento{margin-top:8px}
.evento h4{font-size:var(--c-sez)}
.evento .opz{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opz .btn small{font-weight:400;font-size:var(--c-min);margin-left:5px}
.opz .btn.scelto small,.opz .btn:hover small{color:inherit}
.evento.crisi{border-color:var(--rosso);border-width:3px}
.g .evento{border:var(--doppio)}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.rosso{border-color:var(--rosso);color:var(--rosso)}
.chip.pieno{background:var(--ink);color:var(--carta)}
.chip.ok{border-color:var(--verde);color:var(--verde)}
.alleato{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);padding:2px 8px;font-size:var(--c-sec);cursor:pointer}
.alleato.no{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default}
.alleato.on{background:var(--giallo)}
.g .alleato.on{background:var(--ink);color:var(--carta)}

/* A · Ordine del giorno */
.odg .grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:10px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between}
.r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px 6px;border-bottom:var(--filo);cursor:pointer}
.r:hover{background:var(--velo)}
.r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.r .seg{width:14px;height:14px;border:1.5px solid var(--ink)}
.r .seg.fatto{background:var(--ink)}
.r .seg.info{border-style:dashed;border-color:var(--grigio)}
.r .seg.urg{border-color:var(--rosso);background:var(--retino)}
.r .t{font-weight:700;font-size:var(--c-corpo);line-height:1.2}
.r .t small{font-weight:400;color:var(--grigio);font-size:var(--c-sec)}
.r .s{grid-column:2;font-size:var(--c-min);color:var(--grigio);line-height:1.25}
.r .a{grid-row:1/span 2;grid-column:3;display:flex;gap:4px;align-items:center}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start}
.lato h4{font-size:var(--c-sez)}
.barra{height:8px;background:var(--velo);position:relative;border:1px solid var(--grigio)}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barra b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rosso)}
.forb{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:var(--c-min)}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.minis .m{display:flex;gap:6px;align-items:center;border:var(--filo);padding:3px 8px 3px 4px;font-size:var(--c-min);cursor:pointer;max-width:100%}
.minis .m b{font-size:var(--c-sec)}
.minis .m:hover{background:var(--velo)}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:170px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
/* ===== aggiunte del 28 ===== */
.banda.ferma{background:var(--biro)}
.g .banda.ferma{background:var(--ink)}
.banda.ferma button{color:inherit;text-decoration:underline;text-underline-offset:2px;font-weight:700}
.prova{display:inline-block;background:#ff8ad8;color:#111;font:700 11px/1.4 system-ui,sans-serif;padding:0 5px;letter-spacing:.03em;vertical-align:.1em;white-space:nowrap}
.rif{font-size:var(--c-min);color:var(--rosso);font-weight:700;white-space:normal;max-width:52ch;line-height:1.25}
.r11g{display:inline-block;border:1.5px dashed var(--grigio);color:var(--grigio);font-size:var(--c-min);padding:0 5px;white-space:nowrap;cursor:help}
.lin{display:inline-flex;gap:2px;vertical-align:middle}
.lin i{width:11px;height:11px;border:1.5px solid var(--ink);flex:none}
.lin i.si{background:var(--ink)}
.lin i.g{border-color:var(--rosso)} .lin i.g.si{background:var(--rosso)}
.fb{position:relative;display:inline-block;vertical-align:middle;height:10px;border:1px solid var(--grigio);background:var(--carta);width:90px;flex:none}
.fb i{position:absolute;top:0;bottom:0;background:var(--retino);border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.fb b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.em{border-top:var(--filo);padding-top:6px;display:grid;gap:4px}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.evento.sola{border-style:solid;border-width:1.5px}
.evento.sola .opz .chip{font-size:var(--c-sec);padding:1px 8px}
.g .evento.sola{border:var(--doppio)}
.r .a{flex-wrap:nowrap}
.r .s .k{color:var(--rosso);font-weight:700}
.tab{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.tab th{font-size:var(--c-min);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio);text-align:left;font-weight:700;padding:3px 6px;border-bottom:1.5px solid var(--ink)}
.tab td{padding:4px 6px;border-bottom:var(--filo);vertical-align:middle}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums}
/* i valori all'opposizione (+140 / +72) sono più larghi di quelli al governo: cornice più stretta */
.c1 .trk{padding:0 8px}
.c1 .trk .k{letter-spacing:.04em}
.c1 .trk .cas{--cw:8px}
.lato .tab th,.lato .tab td{padding:3px 4px;letter-spacing:0}
.tab tr.tot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:700}
.tab tr.gov td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.tab tr.sel td{background:var(--velo)}
.si-b{font-weight:700}
.no-b{color:var(--grigio)}
.dic{display:flex;flex-wrap:wrap;gap:4px}
.dic button{border:1.5px solid var(--ink);padding:1px 7px;font-size:var(--c-min);font-weight:700}
.dic button.qui{background:var(--ink);color:var(--carta)}
.dic button.passa{box-shadow:inset 0 -3px 0 var(--rosso)}
.dic button[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default}
.disp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:4px 0;border-top:var(--filo);font-size:var(--c-sec)}
.disp small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.disp .rif{grid-column:1/-1}
.lista{max-height:none}
.limiti{margin:0;padding-left:16px;font-size:var(--c-sec);display:grid;gap:2px}

/* B · A fronte */
.fronte{grid-template-columns:minmax(0,1fr);align-content:start}
.leve{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:var(--bordo)}
.leve>div{padding:7px 10px;border-left:var(--filo);display:grid;gap:4px;align-content:start;min-width:0}
.leve>div:first-child{border-left:0}
.leve>div.on{background:var(--velo)}
.leve .occ{color:var(--ink)}
.leve .sog{font-size:var(--c-min);color:var(--grigio)}
.leve .sog b{color:var(--ink)}
.apri{border:var(--bordo);border-top:0;padding:8px 12px;display:grid;gap:6px}
.af{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:var(--doppio)}
.af>.h{font-family:var(--tit);font-weight:700;font-size:var(--c-riq);padding:4px 0 3px;border-bottom:1.5px solid var(--ink)}
.af>.h+.h{padding-left:var(--canale);border-left:var(--forte)}
.af>.sx{padding:6px 12px 6px 0;border-bottom:var(--filo);display:grid;gap:2px;align-content:start}
.af>.dx{padding:6px 0 6px var(--canale);border-bottom:var(--filo);border-left:var(--forte);display:grid;gap:3px;align-content:start}
.af>.sx b{font-size:var(--c-corpo)}
.af>.sep{grid-column:1/-1;font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);padding:8px 0 2px;border-bottom:1.5px solid var(--ink)}
.af .num{font-family:var(--tit);font-weight:800;color:var(--rosso);margin-right:6px}

/* C · Spoglio */
.spo{grid-template-columns:minmax(0,1fr);align-content:start}
.spo .testaC{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:end;border-bottom:var(--doppio);padding-bottom:6px}
.spo .bersagli{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.spo .bersagli button{border:1.5px solid var(--ink);padding:1px 8px;font-size:var(--c-sec);font-weight:700}
.spo .bersagli button.qui{background:var(--ink);color:var(--carta)}
.spo .bersagli button.passa{box-shadow:inset 0 -3px 0 var(--rosso)}
.spo .bersagli button[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio)}
.barreC{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:var(--c-sec)}
.stack{position:relative;display:flex;height:22px;border:1.5px solid var(--ink)}
.stack i{height:100%;border-right:1px solid var(--carta);background:var(--carta);box-shadow:inset 0 0 0 1px var(--grigio)}
.stack i.si{background:var(--ink);box-shadow:none}
.stack i.gov{background:var(--retino)}
.stack b{position:absolute;top:-5px;bottom:-5px;width:2.5px;background:var(--rosso)}
.sotto2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0 var(--canale)}
.sotto2>section{min-width:0}
.sotto2>section+section{border-left:var(--filo);padding-left:var(--canale)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:4px 0;border-top:var(--filo);font-size:var(--c-sec)}
.cmp .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
</style>
</head>

// dal 19: seggi pieni sì, retino forbice, vuoti no, riga rossa sulla maggioranza
function emiciclo(f, r, W){
  const T=tot(r), rows=r==='camera'?9:6, R0=W*.2, R1=W*.48, P=[];
  const rr=Array.from({length:rows},(_,i)=>R0+(R1-R0)*i/(rows-1)), sum=rr.reduce((a,b)=>a+b,0);
  let left=T; rr.forEach((rad,i)=>{ const n=i===rows-1?left:Math.round(T*rad/sum); left-=n;
    for(let j=0;j<n;j++){ const a=Math.PI*(1-(j+.5)/n); P.push({a, x:W/2+rad*Math.cos(a), y:W*.5-rad*Math.sin(a)}); } });
  P.sort((p,q)=>q.a-p.a);
  const [lo,hi]=f[r], mg=f['maggioranza_'+r], rad=r==='camera'?W/90:W/62, am=Math.PI*(1-mg/T);
  return `<div><svg class="emic" viewBox="0 0 ${W} ${W*.56}" width="100%" role="img" aria-label="${r}: sì attesi da ${lo} a ${hi}, ne servono ${mg}">
    <defs><pattern id="rt${r}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="var(--carta)"/><rect width="1.4" height="4" fill="var(--ink)"/></pattern></defs>
    ${P.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${i<lo?'var(--ink)':i<hi?`url(#rt${r})`:'var(--carta)'}" stroke="var(--ink)" stroke-width="1"/>`).join('')}
    <line x1="${W/2+R0*.8*Math.cos(am)}" y1="${W*.5-R0*.8*Math.sin(am)}" x2="${W/2+(R1+rad*2)*Math.cos(am)}" y2="${W*.5-(R1+rad*2)*Math.sin(am)}" stroke="var(--rosso)" stroke-width="2.5"/>
    </svg><p class="sec" style="text-align:center"><b>${r==='camera'?'Camera':'Senato'}</b> · ${lo}–${hi} sì · ne servono ${mg}</p></div>`;
}

// ======================= dettaglio (A) =======================
function dettaglio(r){
  if(!r) return `<div class="sec muto">Scegli una riga: qui il dettaglio.</div>`;
  const v=V();
  let h=`<div class="occ">${esc(r.gruppo)}</div><h4 class="tit">${esc(r.tit)}</h4>`;
  if(r.k==='mis') return h+dettMisura(r.c, r.costo);
  if(r.k==='prog'){
    h+=`<div class="sec">Il programma pubblico del governo: le disposizioni che vuole cambiare, mandate in aula in quest’ordine.</div>
      <dl class="dati"><dt>Disposizione</dt><dd><b>${esc(r.p.nome)}</b></dd><dt>Il governo la porta a</dt><dd><b>${esc(r.p.nome_gradino)}</b></dd>
      <dt>In aula</dt><dd>${r.inAula?`sì, al voto in ${per(r.inAula.voto)}`:'non ancora'}</dd></dl>`;
    if(r.inAula) h+=`<button class="link" data-sel="m:${r.inAula.id}" style="justify-self:start">La misura in aula ›</button>`;
    return h;
  }
  if(r.k==='info') return h+`<div class="sec">${esc(r.sotto)}. Del governo avversario vedi solo ciò che è pubblico: il programma, le misure in aula con le linee, l’intesa dei suoi alleati in fasce.</div><button class="link" data-vai="Prima pagina" style="justify-self:start">Prima pagina ›</button>`;
  if(r.k==='sf'||r.k==='sfm'){
    let t = r.k==='sf' ? 'governo' : st.sfm;
    if(r.k==='sfm'){
      const A=ANTV();
      h+=`<div class="dic">${v.ministeri.map(m=>{ const pa=A?.ministri[m.dicastero]?.ok?.passa;
        return m.ministro ? `<button class="${st.sfm===m.dicastero?'qui':''} ${pa?'passa':''}" data-sfm="${m.dicastero}" title="${esc(m.ministro.nome)} · ${esc(nomeP(m.ministro.partito))}${pa?' · passerebbe':''}">${esc(dic(m.dicastero))}</button>`
        : `<button aria-disabled="true" title="in interim">${esc(dic(m.dicastero))}</button>`; }).join('')}</div>
        <div class="min muto">${A?'Sottolineati in rosso: dove passerebbe.':'Anteprima non giocata in questo stato.'} Il partito del ministro non vota la sfiducia al suo ministro.</div>`;
      if(!t) return h;
      const mi=ministro(t);
      h+=`<div style="display:flex;gap:10px;align-items:center;border-top:var(--filo);padding-top:6px">${iniz(mi.nome,36)}<div><div class="occ" style="color:var(--ink)">${esc(dic(t))}</div><b>${esc(mi.nome)}</b> <span class="sec muto">· ${esc(nomeP(mi.partito))}</span></div></div>`;
    }
    const f=firme(), a=ante(t);
    h+=`<dl class="dati"><dt>Firme</dt><dd><b>${f.n}</b> su ${f.servono}, un decimo della Camera: i seggi di tutta l’opposizione ${f.prova?PROVA:''}</dd>
      <dt>Se nulla cambia</dt><dd>${a?(a.passa?'<b class="male">passa</b>':'<b>non passa</b>'):'<span class="r11g">anteprima non giocata</span>'}</dd></dl>`;
    h+=tabSfiducia(t);
    const e=sfEsito();
    if(r.k==='sf' && e) h+=`<div class="box"><div class="occ" style="color:var(--ink)">Turno scorso · ${esc(e.nome)}</div><div class="sec"><b>Respinta</b>: Camera ${e.camera.si}–${e.camera.no}, Senato ${e.senato.si}–${e.senato.no}. Ti è costata valence: ${num(VAL.prima,2)} → ${num(VAL.dopo,2)} (senza sfiducia ${num(VAL.senza,2)}). Gli alleati restano «incrinata».</div></div>`;
    h+=`<div class="em"><div class="conf">${sfAz(t)}</div><span class="min muto">Si vota alla chiusura, dopo leggi e referendum. Una per turno. ${sfNota}</span></div>`;
    return h;
  }
  if(r.k==='posto'){
    const ps=r.ps;
    if(ps.mia) return h+`<div class="sec">${esc(ps.sotto)}.</div>`+dettMisura(ps.mia, costo(ps.mia), 1);
    h+=`<div class="sec">${esc(ps.sotto)}.</div><div class="sec muto">Una proposta di legge che la maggioranza deve votare: costringila a dire no a misure care ai suoi elettori.</div>`;
    if(ps.libero){
      if(vk()==='postoPrima') h+=`<div class="em"><span class="occ" style="color:var(--ink)">Giocata nel 28</span><button class="btn" data-posto="1" style="justify-self:start">Porta: Salario minimo legale, 11 €/h</button></div>`;
      h+=`<button class="link" data-vai="Aula" style="justify-self:start">Scrivi la proposta in Aula ›</button>`;
    }
    return h;
  }
  if(r.k==='ref') return h+refLista();
  if(r.k==='conf') return h+confHtml();
  if(r.k==='p'){
    const id=r.pid, p=v.partiti.find(x=>x.id===id), a=ante('governo');
    h+=`<dl class="dati"><dt>Leader</dt><dd>${esc(p.leader)}</dd><dt>Seggi</dt><dd>Camera <b>${seg(id,'camera')}</b> · Senato <b>${seg(id,'senato')}</b></dd>
      <dt>Intesa</dt><dd>${fasciaHtml(r.a?.fascia)}</dd>${r.a?.causa_ultimatum?`<dt>Causa</dt><dd class="male" style="font-weight:700">${esc(causa(r.a.causa_ultimatum))}</dd>`:''}
      <dt>Sulla sfiducia</dt><dd>${a?(a.linee.find(l=>l.partito===id)?.si?'<b class="male">voterebbe sì</b>':'voterebbe no'):'<span class="r11g">anteprima non giocata</span>'}</dd></dl>
      <div class="min muto">Le fasce sono tre: solida, incrinata, ultimatum; la causa solo in ultimatum, mai le cifre.</div><button class="link" data-vai="Partiti" style="justify-self:start">Partiti ›</button>`;
    return h;
  }
  return h;
}
function dettMisura(c, k, corto){
  const f=forb(c), cambiata = scelta(c)!=null && scelta(c)!==defSi(c) && !misurato(c);
  let h=`<span class="occ" style="color:var(--ink)">${esc(forma(c))} · ${esc(chiPorta(c))} · al voto in ${per(c.voto)}</span>`;
  if(f) h+=`<div style="display:grid;grid-template-columns:1.5fr 1fr;gap:8px;align-items:end">${emiciclo(f,'camera',560)}${emiciclo(f,'senato',560)}</div>${f.in_bilico?'<span class="chip rosso" style="justify-self:start">in bilico</span>':''}`;
  if(cambiata) h+=`<div class="ph">La forbice dopo la tua linea non è giocata su questa misura: è quella di prima.</div>`;
  if(!corto){
    const L=Object.fromEntries(c.linee.map(l=>[l.partito,l.si]));
    h+=`<div class="dati">${V().partiti.filter(p=>seg(p.id,'camera')+seg(p.id,'senato')>0).map(p=>`<dt>${esc(p.nome)}</dt><dd class="${L[p.id]?'':'muto'}"><b>${L[p.id]?'sì':'no'}</b>${p.al_governo?'':' <span class="min muto">· opposizione</span>'}</dd>`).join('')}</div>`;
  }
  h+=`<div class="em"><span class="occ" style="color:var(--ink)">La tua linea</span><div class="conf">${linAz(c,1)}</div>
    <span class="sec ${k.contro?'male':''}">${k.misura?`<b>Costo misurato</b>: ${esc(k.txt)} (${num(PERC.con,2)} contro ${num(PERC.senza,2)}).`:`${esc(k.txt)} e porta franchi tiratori. <span class="r11g" title="la Vista non dà il costo della linea su questa misura">costo da misurare</span>`}</span></div>`;
  return h+`<button class="link" data-vai="Aula" style="justify-self:start">Aula ›</button>`;
}

// ======================= A · Ordine del giorno =======================
function rigaAz(r){
  if(r.k==='mis') return linAz(r.c,1);
  if(r.k==='sf') return sfAz('governo',1);
  if(r.k==='sfm') return st.sf ? '' : `<button class="link" data-sel="sf:min">Scegli il ministro ›</button>`;
  if(r.k==='posto') return r.ps.libero ? `<button class="link" data-vai="Aula">Porta una proposta in Aula ›</button>` : '';
  if(r.k==='ref') return corso() ? `<span class="chip">${corso().firme?'firme raccolte':'promosso'}</span>` : refFuori() ? '' : `<button class="link" data-sel="ref">Scegli la disposizione ›</button>`;
  if(r.k==='conf') return st.confC ? `<span class="chip pieno">${st.confC==='chiedi'?'lo chiedi':'rinunci'}</span>` : `<button class="link" data-sel="conf">Decidi ›</button>`;
  if(r.k==='p') return fasciaHtml(r.a?.fascia);
  if(r.k==='prog' && r.inAula) return `<span class="chip">in aula</span>`;
  return '';
}
function segno(r){ if(r.k==='info') return 'info'; if(r.k==='mis') return scelta(r.c)!=null?'fatto':r.urg?'urg':''; if(r.k==='sf' && st.sf==='governo') return 'fatto'; return r.urg?'urg':(r.k==='p'||r.k==='prog')?'info':''; }
function formaA(R){
  if(st.sel==null || !R.some(r=>r.id===st.sel)) st.sel = STATI[st.stato].sel && R.some(r=>r.id===STATI[st.stato].sel) ? STATI[st.stato].sel : R[0]?.id;
  const sel=R.find(r=>r.id===st.sel), gruppi=[...new Set(['Le tue leve', ...R.map(r=>r.gruppo)])]; // verdetto: leve in testa

  const e=sfEsito();
  const mis=R.filter(r=>r.k==='mis'), lev=R.filter(r=>['posto','ref','conf'].includes(r.k));
  const cmp = r => `<div class="cmp"><span class="t" title="${esc(r.tit)}">${esc(r.tit)}</span><span class="conf">${linAz(r.c,1)}</span><small>${stessoTurno(r.c.voto)?'<b>a fine turno</b>':per(r.c.voto)} · ${esc(forbTxt(forb(r.c)))}${r.urg?' · <b class="male">in bilico</b>':''} · <span class="${r.costo.contro?'male':''}">${esc(r.costo.txt)}</span></small></div>`;
  let leve = lev.map(r=>`<div class="cmp"><span class="t">${esc(r.tit)}${r.k==='conf'?' '+PROVA:''}</span><span>${r.k==='ref'&&!corso()&&!refFuori()?`<button class="link" data-apri="ref">${st.apri==='ref'?'chiudi':'Scegli ›'}</button>`:r.k==='conf'?`<button class="link" data-apri="conf">${st.apri==='conf'?'chiudi':'Decidi ›'}</button>`:r.k==='posto'&&r.ps.libero?`<button class="link" data-vai="Aula">Aula ›</button>`:''}</span><small>${esc(r.sotto)}</small></div>`).join('');
  if(st.apri==='ref') leve+=`<div class="em">${refLista()}</div>`;
  if(st.apri==='conf') leve+=`<div class="em">${confHtml()}</div>`;
  if(prova()!=='conf') leve+=`<div class="cmp"><span class="t muto">Referendum confermativo</span><span></span><small>nessuna norma costituzionale da confermare · soglia un quinto di una Camera</small></div>`;
  return `<div class="corpo spo">${v.eventi.map(x=>evento(x,1)).join('')}
    <div class="testaC"><div><div class="occ">La maggioranza avversaria · ${governo().length} partiti</div><h3 class="tit" style="font-size:var(--c-pag)">${esc(nomeP(premier()))} e ${governo().length-1} alleati</h3>${bers}</div>
      <div style="display:grid;gap:4px;justify-items:end"><div class="conf">${sfAz(t)}</div><span class="min muto">firme ${ff.n} su ${ff.servono}${ff.prova?' '+PROVA:''} · ${sfNota}</span></div></div>
    <div class="barreC"><span class="sec"><b>Camera</b></span>${stack('camera')}<span class="sec nf">${a?siDi(a.linee,'camera')+' sì':'—'} · ne servono ${mpu('camera')}</span>
      <span class="sec"><b>Senato</b></span>${stack('senato')}<span class="sec nf">${a?siDi(a.linee,'senato')+' sì':'—'} · ne servono ${mpu('senato')}</span>
      <span></span><span class="min muto">pieno: voterebbe sì · retino: governo che voterebbe no · vuoto: opposizione contro · riga rossa: metà più uno${a?'':' · anteprima non giocata in questo stato'}</span><span></span></div>
    ${e?`<div class="box sec"><b>Turno scorso, ${esc(e.nome.toLowerCase())}: respinta</b> ${e.camera.si}–${e.camera.no} alla Camera, ${e.senato.si}–${e.senato.no} al Senato · valence ${num(VAL.prima,2)} → ${num(VAL.dopo,2)} (senza sfiducia ${num(VAL.senza,2)})</div>`:''}
    ${tab}
    <div class="sotto2"><section><div class="grp" style="font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);border-bottom:1.5px solid var(--ink);padding-bottom:2px">Misure in aula · la tua linea</div>${mis.map(cmp).join('')}</section>
      <section><div class="grp" style="font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);border-bottom:1.5px solid var(--ink);padding-bottom:2px">Le altre leve</div>${leve}</section></div></div>`;
}

// ======================= montaggio =======================
const scr = document.getElementById('screen');
let limite='';
function barraPassi(){
  const s=STATI[st.stato], el=document.getElementById('passi'), cap=document.getElementById('passoCap');
  el.style.display=cap.style.display = s.passi?'':'none';
  el.innerHTML = s.passi ? s.passi.map(p=>`<button data-v="${p[0]}" class="${passo()===p[0]?'on':''}">${p[2]}</button>`).join('') : '';
}
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const R=righe(), b=banda();
  const corpo = st.v==='B' ? formaB(R) : st.v==='C' ? formaC(R) : formaA(R);
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1200?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${b?'auto ':''}minmax(0,1fr)">${cornice(R)}${b}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  barraPassi();
  document.querySelectorAll('#proto .seg').forEach(seg=>{ if(seg.id!=='passi') seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)); });
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k] && !(k==='passo'&&!STATI[st.stato].passi)) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.corpo'), scorre = c && c.scrollHeight>c.clientHeight+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'il corpo scorre':''].filter(Boolean).join(' · ');
}
function vaiStato(s, p){ st.stato=s; st.passo=p||''; azzera(); }
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else if(b.id==='azzera') azzera();
  else { const k=b.parentElement.dataset.k; if(!k) return; st[k]=b.dataset.v; if(k==='stato'){ st.passo=''; azzera(); } if(k==='passo') azzera(); }
  render();
});
scr.addEventListener('click',e=>{
  const t=e.target, q=s=>t.closest(s);
  let x;
  if(x=q('[data-lin]')){ const id=+x.dataset.lin, o=x.dataset.o; st.lin[id] = o==='' ? null : o==='1'; }
  else if(x=q('[data-conf]')) st.conf = x.dataset.conf||null;
  else if(x=q('[data-sf]')){ st.sf=x.dataset.sf; st.conf=null; }
  else if(x=q('[data-sfm]')){ st.sfm = x.dataset.sfm||null; if(st.v==='A') st.sel='sf:min'; }
  else if(x=q('[data-ref]')){ const d=x.dataset.ref; st.conf=null;
    if(d==='tetto_contante' && vk()==='o6') vaiStato('referendum','promosso');
    else if(d==='concorrenza_servizi' && vk()==='o6') st.refMsg[d]='comando non ammesso: niente da abrogare: Concorrenza nei servizi';
    else st.refMsg[d]=`${PROVA} comando non giocato su questa disposizione: la risposta del core qui non c’è`; }
  else if(x=q('[data-posto]')){ vaiStato('posto','dopo'); }
  else if(x=q('[data-apri]')){ st.apri = st.apri===x.dataset.apri ? null : x.dataset.apri; }
  else if(x=q('[data-cc]')){ st.confC = st.confC===x.dataset.cc ? null : x.dataset.cc; }
  else if(x=q('[data-sel]')){ if(t.closest('button') && !x.matches('button')) return; st.sel=x.dataset.sel; }
  else return;
  render();
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
azzera(); render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
