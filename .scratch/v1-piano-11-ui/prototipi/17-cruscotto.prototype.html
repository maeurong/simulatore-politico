<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Cruscotto al governo» (17), mappa v1-piano-11-ui.
  Domanda: com'è fatto il cruscotto quando il giocatore governa? In testa l'evento aperto con le opzioni e il
  default (storie 130-131); poi ciò che chiede una scelta nel turno (proposte dei ministri, emendamenti,
  bilancio da presentare, successori), ciò che si vota a fine turno, gli ultimatum, i ministri in evidenza
  (storia 27) col rimando a Governo; il conto delle scelte che vanno al default.
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Ordine del giorno — una colonna di righe con le azioni sulla riga; la riga scelta si apre nel dettaglio a lato
    B  Tre colonne       — da giornale, per scadenza: «Tocca a te», «Sul tavolo», «A fine turno»; niente dettaglio a lato
    C  Pratica per pratica — in testa l'indice numerato delle pratiche, sotto una pratica alla volta a tutta pagina
  Stati, ?stato=: ordinario (Vista 03) · scelte (03 con Rinvia e una risposta all'evento) · bilancio (04: voti a fine
    turno, due emendamenti, bilancio presentato) · ultimatum · provvisorio (esercizio provvisorio, bilancio da presentare)
    · crisi (05: allarga o dimettiti, interim) · crisiprov (crisi in esercizio provvisorio: caduta certa) · dimissioni
    (03 con Dimettiti) · grave (08) · zero (01, turno zero)
  Altri parametri: ?fin=1280|1440  ?scala=1|1.25
  Dati: Viste 01, 03, 04, 05, 08 e viste/17-cruscotto.json (genera/, tutto giocato), anteprima_accogli vera sulla
  proposta di Infrastrutture della 03. Il consenso del tracciato è calcolato qui sulle quote medie degli istituti
  della coalizione senza l'astensione, come nelle fondamenta; scale dei tracciati: proposte (ticket 31).
  Il corsivo non c'è: tagliato dalla v1 ([Testi del Pungolo]). Le scelte restano in memoria, niente comandi veri.
  Stile e token: prototipi/08-fondamenta.prototype.html (forma A). Non è codice di produzione. Buttare dopo il verdetto.

  VERDETTO (Mario, 11/11/2026), nel ticket 17: A · Ordine del giorno; «Dimettiti» con la conferma sul posto; il default
  scritto su ogni riga oltre al conto in cornice. Il file si apre su questa forma. Scartate: B e C dalla barra in basso.
-->

<head>
<meta charset="utf-8">
<title>Prototipo cruscotto al governo · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.dl.crit{background:var(--rosso);color:var(--carta);padding:0 5px}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.fascia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fascia .cas{--cw:12px;--ch:8px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-top:var(--filo);font-size:var(--c-sec)}
.voce:first-child{border-top:0}
.voce small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.voce small::before{content:"perché: ";font-style:italic}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:center}
.dati dt{color:var(--grigio)}

/* cornice A · Gerenza */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez);margin-bottom:4px}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:2px}
.capo h3{margin:0}

/* evento (comune) */
.evento{border:var(--forte);padding:10px 14px;display:grid;gap:6px}
.evento+.evento{margin-top:8px}
.evento h4{font-size:var(--c-sez)}
.evento .opz{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opz .btn small{font-weight:400;font-size:var(--c-min);margin-left:5px}
.opz .btn.scelto small,.opz .btn:hover small{color:inherit}
.evento.crisi{border-color:var(--rosso);border-width:3px}
.g .evento{border:var(--doppio)}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.rosso{border-color:var(--rosso);color:var(--rosso)}
.chip.pieno{background:var(--ink);color:var(--carta)}
.chip.ok{border-color:var(--verde);color:var(--verde)}
.alleato{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);padding:2px 8px;font-size:var(--c-sec);cursor:pointer}
.alleato.no{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default}
.alleato.on{background:var(--giallo)}
.g .alleato.on{background:var(--ink);color:var(--carta)}

/* A · Ordine del giorno */
.odg .grp{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);margin:10px 0 0;padding-bottom:2px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between}
.r{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:6px 6px;border-bottom:var(--filo);cursor:pointer}
.r:hover{background:var(--velo)}
.r.sel{background:var(--velo);box-shadow:inset 0 0 0 1.5px var(--ink)}
.r .seg{width:14px;height:14px;border:1.5px solid var(--ink)}
.r .seg.fatto{background:var(--ink)}
.r .seg.info{border-style:dashed;border-color:var(--grigio)}
.r .seg.urg{border-color:var(--rosso);background:var(--retino)}
.r .t{font-weight:700;font-size:var(--c-corpo);line-height:1.2}
.r .t small{font-weight:400;color:var(--grigio);font-size:var(--c-sec)}
.r .s{grid-column:2;font-size:var(--c-min);color:var(--grigio);line-height:1.25}
.r .a{grid-row:1/span 2;grid-column:3;display:flex;gap:4px;align-items:center}
.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start}
.lato h4{font-size:var(--c-sez)}
.barra{height:8px;background:var(--velo);position:relative;border:1px solid var(--grigio)}
.barra i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barra b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rosso)}
.forb{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:var(--c-min)}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.minis .m{display:flex;gap:6px;align-items:center;border:var(--filo);padding:3px 8px 3px 4px;font-size:var(--c-min);cursor:pointer;max-width:100%}
.minis .m b{font-size:var(--c-sec)}
.minis .m:hover{background:var(--velo)}

/* B · Tre colonne */
.tre{grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.tre>section{padding:0 var(--canale);border-left:var(--filo);display:grid;gap:8px;align-content:start;min-width:0}
.tre>section:first-child{padding-left:0;border-left:0}
.tre>section:last-child{padding-right:0}
.tre .capo h3{font-size:var(--c-riq)}
.art{border-top:1.5px solid var(--ink);padding-top:6px;display:grid;gap:4px}
.art:first-of-type{border-top:0;padding-top:0}
.art .occ{color:var(--ink);letter-spacing:.06em}
.art .occ.male{color:var(--rosso)}
.art h4{font-size:var(--c-riq)}
.art p{font-size:var(--c-sec);color:var(--grigio)}
.tre .evento h4{font-size:var(--c-riq)}

/* C · Pratica per pratica */
.prat{grid-template-rows:auto minmax(0,1fr) auto;height:100%;align-content:stretch}
.indice{display:flex;gap:0;border:var(--bordo);overflow:hidden}
.indice button{flex:1 1 0;min-width:0;padding:5px 8px;border-left:var(--filo);display:grid;gap:1px;text-align:left}
.indice button:first-child{border-left:0}
.indice button b{font-size:var(--c-sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.indice button span{font-size:var(--c-min);color:var(--grigio);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.indice button.qui{background:var(--ink);color:var(--carta)}
.indice button.qui span{color:var(--carta)}
.indice button.fatto b::before{content:"✓ "}
.indice button.urg{box-shadow:inset 0 -3px 0 var(--rosso)}
.pagC{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 calc(var(--canale)*1.5);align-content:start;min-height:0;overflow:hidden auto;padding-top:8px}
.pagC .num{font-family:var(--tit);font-size:var(--c-apre);font-weight:800;color:var(--rosso);line-height:1}
.pagC h2{font-size:var(--c-pag);margin:2px 0 6px}
.pagC .att{font-size:var(--c-lead);color:var(--grigio);max-width:60ch}
.pagC .scelte{display:grid;gap:6px;margin-top:12px}
.pagC .scelte .btn{text-align:left;padding:7px 12px;display:flex;justify-content:space-between;gap:12px}
.pagC .scelte .btn small{font-weight:400;font-size:var(--c-sec)}
.piedeC{display:flex;align-items:center;gap:10px;border-top:var(--doppio);padding-top:6px;font-size:var(--c-sec)}
.piedeC .sapere{flex:1;min-width:0;display:flex;gap:14px;overflow:hidden;white-space:nowrap}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:170px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}
</style>
</head>

</div>

  }));
  v.calendario.filter(c=>stessoTurno(c.voto)).forEach(c=>{
    const f=c.forbice, k='fid:'+c.id;
    P.push({id:k, tipo:'voto', gruppo:'Si vota a fine turno', tit:c.nome, cal:c, urg:f&&f.in_bilico?1:0,
      sotto: f ? `Camera ${f.camera[0]}–${f.camera[1]} su ${f.maggioranza_camera} · Senato ${f.senato[0]}–${f.senato[1]} su ${f.maggioranza_senato}` : '',
      scelta:st.sc[k]??null, dove:'Aula', opz: v.crisi||c.forma==='bilancio' ? [] : [{id:'fiducia',nome:'Poni la fiducia'}]});
  });
  v.alleati.filter(a=>a.ultimatum).forEach(a=>P.push({id:'ult:'+a.partito, tipo:'sapere', gruppo:'Da tenere d’occhio', tit:`${nomeP(a.partito)}: ultimatum`, urg:1, dove:'Partiti',
    sotto:`intesa ${num(a.intesa)}: sotto 25 a fine turno esce dal governo`, perche:causa(a.causa_ultimatum)}));
  return P;
}
const fatta = p => p.tipo==='scelta' && p.scelta!=null && p.scelta!=='vai';
const alDefault = P => P.filter(p=>p.tipo==='scelta' && !fatta(p) && !(p.crisi&&p.prov)).length;
function evidenza(){ // storia 27: agenda in evidenza (minaccia, distanza o evento) o ministro in preavviso
  return V().governa ? V().ministeri.filter(m=>m.ministro && (m.agenda?.in_evidenza || m.ministro.minaccia)) : [];
}

// ======================= cornice (da 08, forma A) =======================
const fr = v => v==='pari' ? '' : `<svg class="fr ${v==='giu'?'giu':''}" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 .5 9.5 9.5H.5Z"/></svg>`;
function caselle(pos,soglia=3,n=10){
  if(pos==null) return `<span class="cas vuoto">${'<i></i>'.repeat(n)}</span>`;
  const inp=pos<=soglia;
  return `<span class="cas ${inp?'inp':''}">${Array.from({length:n},(_,i)=>`<i class="${[i<soglia?'per':'', i===soglia-1?'sog':'', i<pos?'on':''].join(' ')}"></i>`).join('')}</span>`;
}
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
function tracciati(){
  const v=V(), m=v.margine, stretto=m?Math.min(...m):null;
  const t=[['Consenso',num(v.consenso)+'%', clamp(Math.round((v.consenso-25)/5),0,10)],
    ['Maggioranza C / S', m? m.map(x=>(x>0?'+':x<0?'−':'')+Math.abs(x)).join(' / ') : 'Camere sciolte', m? clamp(Math.round((stretto+9)/3),0,10) : null],
    ['Conti · spread', num(v.spread,0), clamp(Math.round((500-v.spread)/50),0,10)]];
  return `<div class="trks">${t.map(([k,val,pos])=>`<div class="trk"><span class="k">${k}</span>${caselle(pos)}<span class="v">${val}</span></div>`).join('')}</div>`;
}
const SEZ = [['prima','Prima pagina'],['cruscotto','Cruscotto'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function barrate(){
  const v=V(), b={};
  if(!v.governa){ b.prima='Turno zero: non c’è un turno prima'; b.governo='Non governi: nessun ministro tuo'; b.aula='Camere sciolte: niente aula fino al voto'; b.registro='Turno zero: nessun turno passato'; }
  if(!(v.bilancio.presentabile && v.governa)) b.bilancio = v.crisi ? 'Crisi: solo ordinaria amministrazione' : 'La legge di bilancio si presenta in ottobre-dicembre';
  if(!v.campagna) b.campagna='Si fa campagna solo nel turno prima del voto';
  return b;
}
function cornice(P){
  const v=V(), b=barrate(), n=alDefault(P);
  const stato = !v.governa ? 'Turno zero · Camere sciolte' : v.crisi ? 'Crisi di governo' : v.dimissioni ? 'Governo dimissionario' : 'Al governo';
  const chi=`<span class="chi"><b>${stato}</b><br>${per(v.data)} · turno ${v.turno}<br><b>${v.turni_al_voto?v.turni_al_voto+' turni al voto':'si vota a fine turno'}</b></span>`;
  const somm=`<nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}">${t}</button>` : `<button class="${k==='cruscotto'?'qui':''}" ${k==='cruscotto'?'aria-current="page"':''}>${t}</button>`).join('')}
    <span class="fuori"><button>Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav>`;
  const def = n ? `<button class="def">${n} ${n===1?'scelta va':'scelte vanno'} al default ›</button>` : `<span class="def tutte">nessuna scelta al default</span>`;
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino solo-ord">Il Pungolo</span>${chi}</div>${tracciati()}
    <div class="c-dx"><div class="pila"><button class="btn pieno">Chiudi il turno ›</button></div>${def}</div></div>${somm}</header>`;
}

// ======================= pezzi comuni del corpo =======================
const opzBtn = (p,o,cl='') => o.link ? `<button class="link" data-vai="${p.dove}">${esc(o.nome)}</button>`
  : o.off ? `<button class="btn ${cl}" aria-disabled="true" title="${esc(o.off)}">${esc(o.nome)}</button>`
  : `<button class="btn ${cl} ${p.scelta===o.id?'scelto':''}" data-sc="${p.id}" data-o="${o.id}">${esc(o.nome)}${o.def?' <small>default</small>':''}</button>`;
function evento(p, compatto){
  const e=p.ev, v=V(), fondo = e.opzioni.some(o=>o.id==='fondo');
  return `<section class="evento" aria-label="Evento aperto">
    <div class="occ">${esc(e.famiglia)}${e.regione?' · '+esc(e.regione):''}${grave()?' · tono grave':''}</div>
    <h4 class="tit">${esc(e.nome)}${e.costo?`: ${euro(e.costo)}`:''}</h4>
    <div class="sec muto">perché: ${esc(e.causa)}${fondo?` · fondo di riserva rimasto: <b class="${v.bilancio.fondo_residuo<e.costo?'male':''}">${euro(v.bilancio.fondo_residuo)}</b>`:''}</div>
    ${p.tipo==='scelta' ? `<div class="opz">${p.opz.map(o=>opzBtn(p,o,compatto?'p':'')).join('')}</div>
      <div class="min muto">${p.scelta?`Scelto: ${esc(p.opz.find(o=>o.id===p.scelta).nome)}. Si può cambiare fino alla chiusura.`:`Senza scelta, alla chiusura: ${esc(p.def)}.`}</div>`
      : `<div class="min muto">Nessuna scelta da fare: alla chiusura «${esc(e.opzioni[0].nome)}».</div>`}
  </section>`;
}
function crisi(p, compatto){
  const sel = st.sc.allarga||[];
  if(p.prov) return `<section class="evento crisi"><div class="occ">Crisi di governo · esercizio provvisorio</div><h4 class="tit">Il governo cade alla chiusura del turno</h4>
    <div class="sec">In esercizio provvisorio la crisi non si ricompone: nessun partito può entrare. Margine ${V().margine.map(m=>(m>0?'+':'−')+Math.abs(m)).join(' / ')} seggi.</div>
    <div class="min muto">Puoi ancora scegliere i successori e rispondere all’evento; leggi, decreti, bilancio e fiducia sono fermi.</div></section>`;
  const conf = st.conf==='dimettiti';
  return `<section class="evento crisi"><div class="occ">Crisi di governo · solo ordinaria amministrazione</div>
    <h4 class="tit">Allarga la maggioranza o dimettiti</h4>
    <div class="sec muto">Margine ${V().margine.map(m=>(m>0?'+':'−')+Math.abs(m)).join(' / ')} seggi. Senza scelta il governo cade alla chiusura.</div>
    <div class="az" style="margin-top:2px">${p.disp.map(d=>d.disponibile
        ? `<span class="alleato ${sel.includes(d.partito)?'on':''}" data-all="${d.partito}" role="checkbox" aria-checked="${sel.includes(d.partito)}" tabindex="0" title="${esc(d.causa)}"><b>${esc(nomeP(d.partito))}</b>${compatto?'':` <span class="min">${esc(d.causa)}</span>`}</span>`
        : `<span class="alleato no" title="${esc(d.causa)}">${esc(nomeP(d.partito))}${compatto?'':` <span class="min">· ${esc(d.causa)}</span>`}</span>`).join('')}</div>
    <div class="az">${sel.length?`<button class="btn ${st.sc.crisi==='allarga'?'scelto':''}" data-sc="crisi" data-o="allarga">Allarga a ${sel.map(nomeP).join(' e ')}</button>`:`<button class="btn" aria-disabled="true">Allarga</button><span class="min muto">scegli chi far entrare</span>`}
      ${conf?`<button class="btn via pieno" data-sc="crisi" data-o="dimettiti">Conferma: dimettiti</button><button class="btn" data-conf="">Annulla</button>`:`<button class="btn via ${st.sc.crisi==='dimettiti'?'pieno':''}" data-conf="dimettiti">Dimettiti</button>`}</div>
    <div class="min muto">Entrano tutti o nessuno, se ciascuno è disponibile coi seggi di oggi.</div></section>`;
}
function testa(p){ return p.crisi ? crisi(p) : p.ev ? evento(p) : ''; }
function minEvid(lim){
  const ev=evidenza(); if(!ev.length) return `<span class="sec muto">Nessun ministro in evidenza.</span>`;
  return `<div class="minis">${ev.slice(0,lim||99).map(m=>`<div class="m" data-vai="Governo" title="${esc(m.agenda?.motivo||'')}">${iniz(m.ministro.nome,24)}<span><b>${esc(dic(m.dicastero))}</b> · ${esc(m.ministro.nome)}<br><span class="muto">${m.ministro.minaccia?`<span class="male" style="font-weight:700">in preavviso, ${Math.round(m.ministro.soddisfazione)}</span> · `:''}${esc(m.agenda?.nome||m.motivo_senza_agenda||'')}</span></span></div>`).join('')}</div>`;
}
// il dettaglio di una pratica: quello che serve a decidere
function dettaglio(p){
  if(!p) return `<div class="sec muto">Scegli una riga: qui il dettaglio per decidere.</div>`;
  const v=V();
  let corpo='';
  if(p.prop){
    const m=v.ministeri.find(x=>x.dicastero===p.dic), mi=p.mini;
    corpo += `<div style="display:flex;gap:10px;align-items:center">${mi?iniz(mi.nome,40):''}<div><div class="occ">${esc(dic(p.dic))}</div><b>${esc(mi?.nome||'interim')}</b> <span class="sec muto">· ${esc(nomeP(mi?.partito))} · soddisfazione ${Math.round(mi?.soddisfazione??0)}</span></div></div>
      <div class="voce"><b>${p.prop.importo?'Proposta di fondi':'Proposta di riforma'}</b><span>${p.prop.importo?euro(p.prop.importo):''}</span><small>${esc(p.perche)}</small></div>`;
    if(p.prop.importo && st.stato!=='grave' && v.turno===2){
      const a=D._anteprima, f=a.forbice;
      corpo += `<div><div class="occ" style="color:var(--ink)">Se accogli · decreto</div><div class="sec">${esc(a.nome)}: vale subito, a fine turno è convertito o decade.</div></div>
        <dl class="dati"><dt>Costo</dt><dd><b>${euro(a.costo_annuo)}</b> nel trimestre</dd>
        ${a.effetti.map(e=>`<dt>${esc(gr(e.grandezza))}</dt><dd>${fascia(e.fascia)} <span class="${e.migliora?'bene':'male'}">${e.migliora?'migliora':'peggiora'}</span> <span class="muto">${e.ritardo?`fra ${e.ritardo} turn${e.ritardo>1?'i':'o'}`:'subito'}</span></dd>`).join('')}</dl>
        <div class="forb"><span>Camera</span><span class="barra">${barra(f.camera,f.maggioranza_camera,400)}</span><span>${f.camera[0]}–${f.camera[1]} su ${f.maggioranza_camera}</span>
          <span>Senato</span><span class="barra">${barra(f.senato,f.maggioranza_senato,200)}</span><span>${f.senato[0]}–${f.senato[1]} su ${f.maggioranza_senato}</span></div>
        <div class="min muto">Forbice dei franchi tiratori sulla conversione. Dati: <code>anteprima_accogli</code>.</div>`;
    } else if(p.prop.importo){
      corpo += `<div class="ph"><b>Anteprima del decreto</b> da <code>anteprima_accogli</code>: costo, effetti stimati, forbice della conversione (vera solo nello stato «ordinario»).</div>`;
    } else {
      corpo += `<div class="sec">Se accogli, la riforma entra in calendario come legge del governo e si vota al turno dopo.</div>
        <div class="ph"><b>Anteprima della legge</b>: linee e forbice. Com’è fatta lo decide il ticket «Anteprima della misura».</div>`;
    }
    corpo += `<div class="min muto">Se la ignori: ${esc(p.def)}.${p.prop.rinviata?' Già rinviata una volta.':''}</div>`;
  } else if(p.cal){
    const c=p.cal, f=c.forbice;
    corpo += `<div class="occ" style="color:var(--ink)">${esc(c.forma)} · si vota a fine turno${c.promotore?` · posto riservato di ${esc(nomeP(c.promotore))}`:''}</div>
      ${f?`<div class="forb"><span>Camera</span><span class="barra">${barra(f.camera,f.maggioranza_camera,400)}</span><span>${f.camera[0]}–${f.camera[1]} su ${f.maggioranza_camera}</span>
      <span>Senato</span><span class="barra">${barra(f.senato,f.maggioranza_senato,200)}</span><span>${f.senato[0]}–${f.senato[1]} su ${f.maggioranza_senato}</span></div>
      ${f.in_bilico?'<div class="sec male" style="font-weight:700">In bilico: la forbice scavalca la maggioranza.</div>':''}`:''}
      <div class="min muto">${c.forma==='bilancio'?'Il bilancio non chiede fiducia: si vota com’è presentato.':'La fiducia stringe i franchi tiratori, ma se cade il governo cade.'} Linee dei partiti in Aula.</div>`;
  } else if(p.ev){ corpo += evento(p,1); }
  else if(p.crisi){ corpo += crisi(p,1); }
  else if(p.opz){
    corpo += `<div class="sec">${esc(p.sotto)}</div>${p.perche?`<div class="voce"><b>Motivo</b><small>${esc(p.perche)}</small></div>`:''}${p.testo?`<div class="sec muto">${esc(p.testo)}</div>`:''}`;
  } else corpo += `<div class="sec">${esc(p.sotto)}</div>${p.perche?`<div class="voce"><b>Causa</b><small>${esc(p.perche)}</small></div>`:''}`;
  const az = p.opz && !p.ev && !p.crisi && p.opz.length ? `<div class="az" style="border-top:var(--filo);padding-top:8px">${p.opz.map(o=>opzBtn(p,o)).join('')}</div>` : '';
  return `<div class="occ">${esc(p.gruppo)}</div><h4 class="tit">${esc(p.tit)}</h4>${corpo}${az}${p.dove?`<button class="link" data-vai="${p.dove}" style="justify-self:start">Apri ${p.dove} ›</button>`:''}`;
}
function barra([a,b],magg,tot){ return `<i style="width:${(b/tot*100).toFixed(1)}%;background:var(--velo)"></i><i style="width:${(a/tot*100).toFixed(1)}%"></i><b style="left:${(magg/tot*100).toFixed(1)}%"></b>`; }
function fascia(f){ const n={poco:1,medio:2,molto:3}[f]||0; return `<span class="fascia"><span class="cas">${[0,1,2].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>${f}</span>`; }
function stato(p){ return p.tipo==='sapere' ? (p.urg?'urg':'info') : fatta(p) ? 'fatto' : p.urg ? 'urg' : ''; }
function esitoRiga(p){
  if(p.tipo==='voto') return p.scelta==='fiducia' ? '<span class="chip">fiducia posta</span>' : p.urg ? '<span class="chip rosso">in bilico</span>' : '';
  if(p.tipo==='sapere') return '';
  if(fatta(p)) return `<span class="chip pieno">${esc(p.opz.find(o=>o.id===p.scelta)?.nome||p.scelta)}</span>`;
  return `<span class="min muto">default: ${esc(p.def)}</span>`;
}

// ======================= A · Ordine del giorno =======================
function formaA(P){
  const top=P.find(p=>p.crisi||p.ev||p.id==='dim'), resto=P.filter(p=>p!==top);
  if(st.sel==null || !P.some(p=>p.id===st.sel)) st.sel = (resto.find(p=>p.tipo==='scelta')||resto[0]||top)?.id;
  const sel=P.find(p=>p.id===st.sel);
  const gruppi=[...new Set(resto.map(p=>p.gruppo))];
  const riga = p => `<div class="r ${p.id===st.sel?'sel':''}" data-sel="${p.id}"><span class="seg ${stato(p)}" aria-hidden="true"></span>
    <span class="t">${esc(p.tit)}</span>
    <span class="a">${p.tipo==='scelta'&&!p.crisi ? (p.opz.every(o=>o.link) ? `<button class="link" data-vai="${p.dove}">${p.dove} ›</button>` : p.opz.length<=3 ? p.opz.map(o=>opzBtn(p,o,'p')).join('') : esitoRiga(p)) : p.tipo==='voto' ? (p.opz.map(o=>opzBtn(p,o,'p')).join('')+esitoRiga(p)) : p.dove?`<button class="link" data-vai="${p.dove}">${p.dove} ›</button>`:''}</span>
    <span class="s">${esc(p.sotto)}${p.tipo==='scelta'&&!fatta(p)?` · <i>default:</i> ${esc(p.def)}`:''}</span></div>`;
  const dimB = P.find(p=>p.id==='dim');
  return `<div class="corpo" style="grid-template-columns:minmax(0,1fr) var(--lato)">
    <section class="odg">${dimB?`<div class="evento crisi" style="margin-bottom:6px"><div class="occ">Governo dimissionario</div><h4 class="tit">${esc(dimB.tit)}</h4><div class="sec muto">${esc(dimB.sotto)}. Le scelte qui sotto valgono fino ad allora.</div></div>`:''}
      ${P.filter(p=>p.crisi).map(p=>crisi(p)).join('')}${P.filter(p=>p.ev).map(p=>evento(p, !!(dimB||P.some(x=>x.crisi)))).join('')}
      ${gruppi.filter(g=>g!=='Evento'&&g!=='Dimissioni').map(g=>{ const r=resto.filter(p=>p.gruppo===g); const n=r.filter(p=>p.tipo==='scelta'&&!fatta(p)).length;
        return `<div class="grp"><span>${g}</span><span>${n?n+' al default':''}</span></div>${r.map(riga).join('')}`; }).join('')}
      ${V().governa?`<div class="grp"><span>Ministri in evidenza</span><button class="link" data-vai="Governo" style="text-transform:none;letter-spacing:0">Governo ›</button></div><div style="padding-top:6px">${minEvid()}</div>`:''}
      ${!resto.length&&!top?'<div class="ph" style="margin-top:10px">Nessuna scelta aperta: chiudi il turno quando vuoi.</div>':''}
    </section>
    <aside class="lato" aria-label="Dettaglio">${dettaglio(sel && sel!==top ? sel : null)}</aside></div>`;
}

// ======================= B · Tre colonne =======================
function formaB(P){
  const v=V();
  const art = p => `<article class="art">
    <div class="occ ${p.urg?'male':''}">${esc(p.gruppo)}${p.dove?` · <button class="link" data-vai="${p.dove}" style="text-transform:none;letter-spacing:0;font-size:var(--c-min)">${p.dove} ›</button>`:''}</div>
    <h4 class="tit">${esc(p.tit)}</h4><p>${esc(p.sotto)}</p>${p.perche?`<p><i>perché:</i> ${esc(p.perche)}</p>`:''}
    ${p.opz&&p.opz.length?`<div class="az" style="margin-top:2px">${p.opz.map(o=>opzBtn(p,o,'p')).join('')}</div>`:''}
    ${p.tipo==='scelta'?`<p class="min">${fatta(p)?`<b>Scelto.</b> Si cambia fino alla chiusura.`:`<i>Senza scelta:</i> ${esc(p.def)}.`}</p>`:p.tipo==='voto'?`<p class="min">${p.scelta==='fiducia'?'<b>Fiducia posta.</b>':p.urg?'<b class="male">In bilico.</b>':''}</p>`:''}</article>`;
  const tocca = P.filter(p=>p.crisi||p.ev||p.id==='dim'||p.id==='bil'||p.id==='coal');
  const tavolo = P.filter(p=>p.tipo==='scelta' && !tocca.includes(p));
  const fine = P.filter(p=>p.tipo!=='scelta' && !tocca.includes(p));
  const col1 = tocca.map(p=>p.crisi?crisi(p,1):p.ev?evento(p,1):p.id==='dim'?`<div class="evento crisi"><div class="occ">Governo dimissionario</div><h4 class="tit">${esc(p.tit)}</h4><div class="sec muto">${esc(p.sotto)}.</div></div>`:art(p)).join('');
  const n=alDefault(P);
  return `<div class="corpo tre">
    <section><div class="capo"><h3 class="tit">Tocca a te</h3><span class="min muto">${per(v.data)}</span></div>${col1||'<p class="sec muto">Niente di urgente.</p>'}</section>
    <section><div class="capo"><h3 class="tit">Sul tavolo</h3><span class="min muto">${tavolo.length} da decidere</span></div>${tavolo.map(art).join('')||'<p class="sec muto">Nessuna proposta, nessun emendamento.</p>'}</section>
    <section><div class="capo"><h3 class="tit">A fine turno</h3><span class="min ${n?'male':'bene'}" style="font-weight:700">${n?`${n} al default`:'tutto deciso'}</span></div>
      ${fine.map(art).join('')}
      ${v.governa?`<article class="art"><div class="occ">Ministri in evidenza · <button class="link" data-vai="Governo" style="text-transform:none;letter-spacing:0;font-size:var(--c-min)">Governo ›</button></div>${minEvid(6)}</article>`:''}</section></div>`;
}

// ======================= C · Pratica per pratica =======================
function formaC(P){
  if(!P.length) return `<div class="corpo"><div class="ph">Nessuna pratica aperta: chiudi il turno quando vuoi.</div></div>`;
  st.pc = clamp(st.pc,0,P.length-1);
  const p=P[st.pc];
  const idx = `<nav class="indice" aria-label="Pratiche del turno">${P.map((x,i)=>`<button class="${i===st.pc?'qui':''} ${fatta(x)||x.scelta==='fiducia'?'fatto':''} ${x.urg&&!fatta(x)?'urg':''}" data-pc="${i}"><b>${i+1}. ${esc(x.tit)}</b><span>${esc(x.gruppo)}${x.tipo==='scelta'&&!fatta(x)?' · default':''}</span></button>`).join('')}</nav>`;
  const scelte = p.crisi ? '' : p.opz&&p.opz.length ? `<div class="scelte">${p.opz.map(o=>o.link?`<button class="btn" data-vai="${p.dove}"><span>${esc(o.nome)}</span></button>`:o.off?`<button class="btn" aria-disabled="true"><span>${esc(o.nome)}</span><small>${esc(o.off)}</small></button>`:`<button class="btn ${p.scelta===o.id?'scelto':''}" data-sc="${p.id}" data-o="${o.id}"><span>${esc(o.nome)}</span><small>${o.def?'default':o.nota||''}</small></button>`).join('')}</div>` : '';
  const sin = p.crisi ? crisi(p) : `<div class="num">${st.pc+1}<span class="min muto" style="font-family:var(--txt);font-weight:400"> di ${P.length}</span></div><div class="occ">${esc(p.gruppo)}</div><h2 class="tit">${esc(p.tit)}${p.ev&&p.ev.costo?': '+euro(p.ev.costo):''}</h2>
    <p class="att">${esc(p.ev?`Perché: ${p.ev.causa}.${p.ev.regione?' '+p.ev.regione+'.':''}`:p.sotto)}</p>${p.perche?`<p class="sec muto" style="margin-top:4px"><i>perché:</i> ${esc(p.perche)}</p>`:''}
    ${scelte}<p class="sec muto" style="margin-top:8px">${p.tipo==='scelta'?(fatta(p)?'Scelto: si cambia fino alla chiusura.':`Senza scelta: ${esc(p.def)}.`):''}</p>`;
  const des = p.prop||p.cal ? dettaglio(p).replace(/<div class="az"[\s\S]*?<\/div>(?=<button class="link"|$)/,'') : p.ev ? `<div class="occ" style="color:var(--ink)">Il fondo di riserva</div><div class="sec">Rimasto: <b>${euro(V().bilancio.fondo_residuo)}</b> per un costo di ${euro(p.ev.costo)}.</div>` : '';
  const ev=evidenza();
  const sapere = [ev.length?`<button class="link" data-vai="Governo">${ev.length} ministri in evidenza ›</button>`:'' , ...P.filter(x=>x.tipo==='sapere'&&x.id!=='dim').map(x=>`<span class="male" style="font-weight:700">${esc(x.tit)}</span>`)].filter(Boolean).join('');
  return `<div class="corpo prat">${idx}
    <div class="pagC"><div>${sin}</div><div style="border-left:var(--filo);padding-left:var(--canale);display:grid;gap:8px;align-content:start">${des}</div></div>
    <div class="piedeC"><button class="btn" data-pcd="-1" ${st.pc===0?'aria-disabled="true"':''}>‹ Precedente</button><div class="sapere">${sapere}</div><span class="muto">${alDefault(P)} al default</span><button class="btn" data-pcd="1" ${st.pc===P.length-1?'aria-disabled="true"':''}>Prossima ›</button></div></div>`;
}

// ======================= montaggio =======================
const scr = document.getElementById('screen');
let limite='';
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const v=V(), P=pratiche();
  const banda = v.crisi ? `<div class="banda">Crisi di governo: solo ordinaria amministrazione.${v.bilancio.esercizio_provvisorio?' In esercizio provvisorio la caduta è certa.':' Allarga la maggioranza o dimettiti.'}</div>`
    : v.dimissioni ? `<div class="banda">Dimissioni annunciate: il governo cade alla chiusura del turno.</div>` : '';
  const corpo = st.v==='B' ? formaB(P) : st.v==='C' ? formaC(P) : formaA(P);
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto ${banda?'auto ':''}minmax(0,1fr)">${cornice(P)}${banda}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(e){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo,.pagC')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.corpo'), scorre = c && c.scrollHeight>c.clientHeight+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'il corpo scorre':''].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; }
  else if(b.id==='azzera'){ st.sc={}; st.conf=null; }
  else { st[b.parentElement.dataset.k]=b.dataset.v; if(b.parentElement.dataset.k==='stato'){ st.sc={}; st.sel=null; st.pc=0; st.conf=null; } }
  render();
});
scr.addEventListener('click',e=>{
  const t=e.target, sc=t.closest('[data-sc]'), al=t.closest('[data-all]'), cf=t.closest('[data-conf]'), pc=t.closest('[data-pc]'), pcd=t.closest('[data-pcd]'), r=t.closest('[data-sel]');
  if(sc){ const k=sc.dataset.sc, o=sc.dataset.o; st.sc[k] = st.sc[k]===o && k!=='crisi' ? null : o; st.conf=null; render(); }
  else if(al){ const a=st.sc.allarga||[], p=al.dataset.all; st.sc.allarga = a.includes(p)?a.filter(x=>x!==p):[...a,p]; if(st.sc.crisi==='allarga') st.sc.crisi=null; render(); }
  else if(cf){ st.conf = cf.dataset.conf||null; render(); }
  else if(pc){ st.pc=+pc.dataset.pc; render(); }
  else if(pcd && pcd.getAttribute('aria-disabled')!=='true'){ st.pc+=+pcd.dataset.pcd; render(); }
  else if(r && !t.closest('button')){ st.sel=r.dataset.sel; render(); }
});
function perche(e){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=e.type==='mouseover'||e.type==='focusin' ? e.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.getElementById('next').click(); if(e.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
</html>
