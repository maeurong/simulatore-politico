<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket «Trattativa e spartizione» (27), mappa v1-piano-11-ui.
  Domanda: com'è fatta la casa del turno dopo il voto? Il risultato in testa; la spartizione dei dieci dicasteri proposta
  dal giocatore, con la richiesta di ogni alleato in vista e l'intesa di partenza che sale o scende (storie 79-80); i
  tecnici nella quota del proprio partito (81); l'allargamento quando manca la maggioranza (82); con l'incarico a un altro,
  chiedere la guida o restare fuori dal ribaltone (98).
  Tre forme via ?v=A|B|C (frecce ← →):
    A  Righe     — il risultato in testa, poi un dicastero per riga col peso e i bottoni «a chi»; gli alleati nel lato
    B  Cesti     — un cesto per partito coi dicasteri dentro come tessere alte quanto il peso, la richiesta tratteggiata;
                   un clic su una tessera la sceglie e il lato dice dove spostarla
    C  Incroci   — tabella dicasteri × partiti a pallini, sotto i totali, la richiesta e l'intesa di partenza;
                   il risultato e l'allargamento nel lato
  Stati, ?stato=: premio (Vista 02, tono ordinario) · grave (la stessa 02 com'è: l'emergenza idrogeologica è grave) ·
    senza (proporzionale al 3%, seme 4 a 5,5: incarico senza maggioranza, Centrosinistra e Centro disponibili) ·
    guida (seme 2 a 1,5, turno 5: il ribaltone dopo la caduta del governo di destra, la Sinistra primo per seggi) ·
    capo (seme 1 a 1,5: l'incarico al Capo dello Stato, il turno del 06 prima che nasca il governo IA)
  Altri parametri: ?fin=1280|1440 ?scala=1|1,25 ?cede=si|no (solo nella guida; «no» è scritto a mano: nei semi provati la
  Sinistra la cede, il testo è la causa del core «guiderebbe la propria coalizione»)
  Dati: viste/27-trattativa.json, nuovo in genera/ (src/trattativa.rs). Rifatti qui e quindi rimandi al core: la
  spartizione in corso per dicastero (la Vista porta solo richiesta e offerta in punti per alleato), il peso dei dicasteri
  (3 Economia, 2 Interno ed Esteri, 1 gli altri: dati/base/dicasteri.toml), l'intesa di partenza 60 + 10 × (offerta −
  richiesta) (manopole intesa_base e intesa_per_punto), la coalizione del ribaltone e il primo per seggi. Verificati
  giocando: cinque proposte sulla 02 danno l'intesa che dice la formula, e un tecnico conta nella tua quota anche messo
  su un dicastero di un alleato. Scritta a mano: la spartizione di default dello stato «senza» prima di allargare (la
  chiusura lì forma il governo della Sinistra), coi punti delle offerte che la Vista porta, Centrodestra 3 e Destra 7.
  Facce: variante 5 del 32, copiata dal 24. Stile: 08-fondamenta (forma A), cornice del 24. Non è codice di produzione.

  VERDETTO (Mario, 12/11/2026), nel ticket 27: A · Righe; allargare riporta la spartizione al default; il tecnico su
  qualunque dicastero, nella tua quota; «Chiedi la guida» diretto. Il file si apre su questa forma. Scartate: B e C dalla barra.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prototipo Trattativa · piano 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6f6a64}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{flex:none;position:relative;overflow:hidden;transform-origin:center;background:#F4ECD8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{display:block}

/* ===== token: copiati da 08-fondamenta (forma A), nessun colore o misura a mano ===== */
.vS{
  --carta:#F4ECD8; --ink:#1F1A17; --grigio:#5E5750;
  --rosso:#B3122B; --verde:#2E6B45; --biro:#1D4E89; --giallo:#FFD23F;
  --velo:rgb(31 26 23 / .06);
  --retino:repeating-linear-gradient(45deg,transparent 0 3px,rgb(31 26 23 / .3) 3px 4px);
  --tit:'Fraunces',Georgia,'Times New Roman',serif;
  --txt:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
  --wonk:"SOFT" 100,"WONK" 1;
  --c-min:12px; --c-sec:13px; --c-corpo:14px; --c-lead:16px; --c-num:19px;
  --c-riq:18px; --c-sez:23px; --c-pag:30px; --c-apre:44px; --c-test:72px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --marg:24px; --canale:20px; --lato:clamp(300px,30%,440px);
  --filo:1px solid var(--grigio); --bordo:1.5px solid var(--ink); --forte:2px solid var(--ink); --doppio:3px double var(--ink);
  --k:1; --t-press:80ms; --e-work:cubic-bezier(.2,0,.38,.9);
  background:var(--carta);color:var(--ink);font:400 var(--c-corpo)/1.35 var(--txt);
  font-variant-numeric:tabular-nums lining-nums;display:grid;min-height:0;position:relative;overflow:hidden;
  accent-color:var(--ink);
}
.vS.g{--rosso:var(--ink);--verde:var(--ink);--biro:var(--ink);--giallo:transparent;--wonk:"SOFT" 0,"WONK" 0}
.vS.g .solo-ord{display:none!important}
.vS ::selection{background:var(--giallo);color:var(--ink)}
.vS :focus-visible{outline:2px solid var(--biro);outline-offset:2px}
.tit{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:700;line-height:1.1;text-wrap:balance}
.g .tit{font-weight:600}
.occ{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--rosso)}
.muto{color:var(--grigio)} .bene{color:var(--verde)} .male{color:var(--rosso)}
.sec{font-size:var(--c-sec)} .min{font-size:var(--c-min)}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.link:hover{text-decoration-thickness:2px}
.btn{border:var(--forte);padding:4px 11px;font-size:var(--c-corpo);font-weight:700;background:var(--carta);white-space:nowrap;
  transition:transform calc(var(--t-press)*var(--k)) var(--e-work)}
.btn:hover{background:var(--ink);color:var(--carta)}
.btn:active{transform:scale(.97)}
.btn.pieno{background:var(--ink);color:var(--carta)}
.btn.pieno:hover{background:var(--carta);color:var(--ink)}
.btn.p{padding:1px 7px;font-size:var(--c-min);border-width:1.5px}
.btn.scelto{background:var(--giallo);color:var(--ink)}
.g .btn.scelto{background:var(--ink);color:var(--carta)}
.btn[aria-disabled=true]{border-style:dashed;border-color:var(--grigio);color:var(--grigio);cursor:default;background:var(--carta)}
.btn.via{border-color:var(--rosso);color:var(--rosso)}
.btn.via:hover,.btn.via.pieno{background:var(--rosso);color:var(--carta);border-color:var(--rosso)}
.fr{display:inline-block;width:.62em;height:.62em;margin-right:.2em;fill:currentColor;vertical-align:.02em}
.fr.giu{transform:rotate(180deg)}
.dl{font-size:var(--c-min);font-weight:700;white-space:nowrap}
.dl.crit{background:var(--rosso);color:var(--carta);padding:0 5px}
.nf{white-space:nowrap;font-weight:700}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none}
.cas i.per{background:var(--ret,none)}
.cas i.sog{margin-right:4px}
.cas i.on{background:var(--ink)}
.cas.inp i.on{background:var(--rosso);border-color:var(--rosso)}
.cas.vuoto i{border-style:dashed;border-color:var(--grigio);background:none}
.trk{display:grid;align-items:center}
.trk .k{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);white-space:nowrap}
.trk .v{font-size:var(--c-num);font-weight:700;line-height:1.1;white-space:nowrap}
.fascia{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fascia .cas{--cw:12px;--ch:8px}
.voce{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:6px 0;border-top:var(--filo);font-size:var(--c-sec)}
.voce:first-child{border-top:0}
.voce small{grid-column:1/-1;color:var(--grigio);font-size:var(--c-min)}
.voce small::before{content:"perché: ";font-style:italic}
.box{border:var(--bordo);padding:var(--s2) var(--s3)}
.ph{border:1.5px dashed var(--grigio);color:var(--grigio);padding:7px 11px;font-size:var(--c-sec)}
.ph b{color:var(--ink)}
.az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:center}
.dati dt{color:var(--grigio)}

/* cornice A · Gerenza */
.nomino{font-family:var(--tit);font-variation-settings:var(--wonk);font-weight:800;color:var(--rosso);line-height:1;white-space:nowrap}
.chi{font-size:var(--c-sec);line-height:1.3;color:var(--grigio);white-space:nowrap}
.chi b{color:var(--ink)}
.def{font-size:var(--c-min);color:var(--grigio);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.def.tutte{color:var(--verde)}
.pila{display:flex;flex-direction:column;gap:3px}
.pila .btn{text-align:center}
.somm button{font-weight:700;color:var(--grigio);white-space:nowrap}
.somm button:hover{color:var(--ink)}
.somm button.qui{color:var(--ink)}
.somm button.chiusa{text-decoration:line-through;font-weight:400;cursor:help}
.perche{position:absolute;z-index:3;background:var(--ink);color:var(--carta);font-size:var(--c-min);padding:3px 8px;pointer-events:none;white-space:nowrap}
.banda{background:var(--ink);color:var(--carta);padding:4px var(--marg);font-size:var(--c-sec);font-weight:700;letter-spacing:.04em}
.cA{padding:8px var(--marg) 0;border-bottom:var(--doppio)}
.c1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding-bottom:6px}
.c1 .c-sx{display:flex;align-items:center;gap:12px}
.cA .nomino{font-size:27px}
.c1 .trks{display:flex;justify-content:center}
.c1 .trk{padding:0 12px;border-left:var(--filo);grid-template-columns:auto auto;gap:0 8px}
.c1 .trk:last-child{border-right:var(--filo)}
.c1 .trk .k{grid-column:1/-1}
.c1 .c-dx{display:grid;gap:3px;justify-items:center}
.cA .somm{display:flex;align-items:end;gap:2px;margin-top:2px}
.cA .somm button{padding:4px 12px 5px;border:1.5px solid transparent;border-bottom:0}
.cA .somm button.qui{border-color:var(--ink);background:var(--carta);margin-bottom:-3px;padding-bottom:8px}
.somm .fuori{margin-left:auto;display:flex;gap:14px;padding-bottom:5px}
.somm .fuori button{font-weight:400;text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);padding:0;border:0}
.stretta .cA .nomino{display:none}
.stretta .c1{gap:10px}
.stretta .c1 .trk{padding:0 8px}
.stretta .cA .somm button{padding-left:7px;padding-right:7px;font-size:var(--c-sec)}
.stretta .somm .lungo{display:none}

/* corpo */
.corpo{padding:12px var(--marg) 14px;min-height:0;min-width:0;overflow:hidden auto;display:grid;gap:10px var(--canale);align-content:start;position:relative}
.corpo>*{min-width:0}
h3.tit{font-size:var(--c-sez);margin-bottom:4px}
h4.tit{font-size:var(--c-riq)}
.capo{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:var(--doppio);padding-bottom:3px;margin-bottom:2px}
.capo h3{margin:0}

/* barra del prototipo */
#proto{flex:none;background:#1b1b1b;color:#eee;font:12px/1.2 system-ui,sans-serif;display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;justify-content:center;padding:8px 14px}
#proto .cap{color:#aaa;margin-right:-8px}
#proto button{padding:3px 8px;border-radius:999px;background:#333;color:#eee}
#proto button.on{background:#FFD23F;color:#111;font-weight:700}
#proto .seg{display:inline-flex;gap:2px;flex-wrap:wrap}
#proto .lab{min-width:170px;text-align:center;font-weight:700;font-size:13px}
#proto #avv{color:#ff8ad8;font-weight:700}

.lato{border-left:var(--forte);padding-left:var(--canale);display:grid;gap:8px;align-content:start}
.lato h4{font-size:var(--c-sez)}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:0 6px;font-size:var(--c-min);font-weight:700;white-space:nowrap;line-height:1.4}
.chip.rosso{border-color:var(--rosso);color:var(--rosso)}
.chip.pieno{background:var(--ink);color:var(--carta)}
.chip.ok{border-color:var(--verde);color:var(--verde)}
.chip.tr{border-style:dashed;border-color:var(--grigio);color:var(--grigio)}
.sez-l{font-size:var(--c-min);letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--grigio);border-bottom:1.5px solid var(--ink);padding-bottom:2px;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.sez-l span{letter-spacing:0;text-transform:none;font-weight:400}

/* ===== Partiti (ticket 24) ===== */
.par{grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.par>.lato{overflow:hidden auto;min-height:0;padding-bottom:8px}
.par>.pag{min-height:0;overflow:hidden auto;display:grid;gap:10px;align-content:start}
.sw{display:inline-block;width:10px;height:10px;border:1px solid var(--ink);vertical-align:-1px;margin-right:5px;flex:none}
.sw.nato{background:var(--retino)!important}
.g .sw{background:var(--carta)!important}
.tu-box{display:inline-grid;place-items:center;border:2px solid var(--biro);color:var(--biro);font-weight:800;font-family:var(--tit);flex:none}
.g .tu-box{border-color:var(--ink);color:var(--ink)}
.iniz{display:inline-grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-weight:700;letter-spacing:.02em;flex:none}
.sciolto{color:var(--grigio)}
.sciolto .nmP{text-decoration:line-through}
.nmP{font-weight:700}
.ld{font-size:var(--c-min);color:var(--grigio)}
.ld b{color:var(--ink);font-weight:400}
.ind1{font-size:var(--c-min);color:var(--grigio);line-height:1.25}
.num{font-weight:700;white-space:nowrap}
.cas{display:flex;gap:2px}
.cas i{width:var(--cw,9px);height:var(--ch,14px);border:1.5px solid var(--ink);flex:none;position:relative}
.cas i.on{background:var(--ink)}
.cas i.rs{border-color:var(--rosso)}
.cas i.rs.on{background:var(--rosso)}
.cas i.sg::after{content:"";position:absolute;right:-3.5px;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.g .cas i.sg::after{background:var(--ink)}
.intesa{display:grid;gap:2px}
.intesa .cas{--cw:12px;--ch:10px}
.ints{font-size:var(--c-min);color:var(--grigio);display:flex;justify-content:space-between;gap:6px}
.barraI{position:relative;height:12px;border:1px solid var(--grigio);background:var(--velo)}
.barraI i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.barraI i.ult{background:var(--rosso)}
.barraI b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.barraI em{position:absolute;top:13px;font-size:10px;font-style:normal;color:var(--rosso);transform:translateX(-50%);white-space:nowrap}
.cause{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;font-size:var(--c-min)}
.dati{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--c-sec);align-items:baseline}
.dati dt{color:var(--grigio)}
.dati dd b{font-weight:700}
.mossa{font-size:var(--c-min);border-left:2px solid var(--biro);padding-left:6px;color:var(--ink);line-height:1.3}
.g .mossa{border-color:var(--ink)}
.prom{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:var(--c-min);gap:1px 8px}
.link{text-decoration:underline;text-underline-offset:2px;font-size:var(--c-sec);white-space:nowrap}
.testa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.testa h4{font-size:var(--c-sez)}
.ax text{font:400 11px var(--txt);fill:var(--grigio)}
.ax .nmA{font-weight:700;fill:var(--ink);font-size:12px}
.ax .nmA.sc{text-decoration:line-through;fill:var(--grigio)}
.sel-ring{outline:2px solid var(--ink);outline-offset:1px}
[data-sel]{cursor:pointer}


/* ===== Trattativa (ticket 27) ===== */
.camere{display:grid;gap:4px}
.cam{display:grid;grid-template-columns:62px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:var(--c-min)}
.stk{display:flex;height:14px;border:1px solid var(--ink);position:relative}
.stk i{height:100%;border-right:1px solid var(--carta)}
.stk b{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--rosso)}
.g .stk b{background:var(--ink)}
.trt{grid-template-columns:minmax(0,1fr) var(--lato);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.trt>.lato{overflow:hidden auto;min-height:0;padding-bottom:8px}
.trt>.pag{min-height:0;overflow:hidden auto;display:grid;gap:10px;align-content:start}
.ris{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:4px 18px;border-bottom:var(--doppio);padding-bottom:8px}
.ris>.sez-l{grid-column:1/-1}
.ris .vt{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:var(--c-min)}
.ris .vt span{white-space:nowrap}
.ris .mg{font-size:var(--c-sec);align-self:end}
.stk i.coal{box-shadow:inset 0 -4px 0 var(--ink)}
.stk{height:16px}
.evt{font-size:var(--c-sec);border-left:3px solid var(--rosso);padding-left:8px}
.g .evt{border-color:var(--ink)}
.pesi{display:inline-flex;gap:2px;vertical-align:middle}
.pesi i{width:7px;height:7px;border-radius:50%;background:var(--ink)}
/* A · Righe */
.rig{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.rig th{font-size:var(--c-min);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio);text-align:left;font-weight:700;border-bottom:1.5px solid var(--ink);padding:2px 6px;white-space:nowrap}
.rig td{border-bottom:var(--filo);padding:4px 6px;vertical-align:middle;white-space:nowrap}
.rig td.d{font-weight:700}
.rig tr.mod td.d::after{content:" •";color:var(--biro)}
.g .rig tr.mod td.d::after{color:var(--ink)}
.chi2{display:inline-flex;gap:3px}
.op{border:1.5px solid var(--ink);padding:1px 8px;font-size:var(--c-min);font-weight:700;background:var(--carta);white-space:nowrap}
.op:hover{background:var(--velo)}
.op.on{color:var(--carta);background:var(--pc,var(--ink));border-color:var(--pc,var(--ink))}
.op.tec.on{background:var(--retino),var(--carta);color:var(--ink);border-style:double;border-width:3px;padding:0 6px}
.tot{display:flex;gap:16px;font-size:var(--c-sec);flex-wrap:wrap}
.tot b{font-size:var(--c-num)}
/* gli alleati nel lato */
.all{border:var(--bordo);border-top-width:5px;padding:6px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px}
.all>:not(.fz){grid-column:2}
.all .fz{grid-row:1/span 2}
.all .largo{grid-column:1/-1}
.punti{display:flex;gap:2px;position:relative;margin:2px 0 12px}
.punti i{width:14px;height:12px;border:1.5px solid var(--ink);flex:none}
.punti i.on{background:var(--pc,var(--ink))}
.punti b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--biro)}
.punti em{position:absolute;top:14px;font-size:10px;font-style:normal;color:var(--biro);transform:translateX(-50%);white-space:nowrap}
.g .punti b{background:var(--ink)} .g .punti em{color:var(--ink)}
.fu{border:var(--filo);padding:5px 7px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:var(--c-sec)}
.fu.no{color:var(--grigio)}
.conf{border:var(--forte);padding:6px 8px;font-size:var(--c-sec);display:grid;gap:6px;background:var(--velo)}
.rif{border:1.5px solid var(--rosso);color:var(--rosso);padding:5px 8px;font-size:var(--c-sec);font-weight:700}
.g .rif{border-color:var(--ink);color:var(--ink)}
/* B · Cesti */
.cesti{display:grid;grid-template-columns:repeat(var(--nc),minmax(0,1fr));gap:10px;align-items:start}
.cesto{border:var(--bordo);border-top-width:5px;padding:6px 7px 8px;display:grid;gap:6px;min-width:0}
.cesto .tst{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;align-items:center}
.pila2{position:relative;display:grid;gap:3px;padding:3px;min-height:calc(var(--rq)*30px)}
.pila2 .rq{position:absolute;left:-1px;right:-1px;top:-1px;height:calc(var(--rq)*30px + 2px);border:2px dashed var(--biro);pointer-events:none}
.pila2 .rq span{position:absolute;right:3px;bottom:-15px;font-size:10px;color:var(--biro);white-space:nowrap}
.g .pila2 .rq{border-color:var(--ink)} .g .pila2 .rq span{color:var(--ink)}
.tes{height:calc(var(--p)*30px - 3px);border:1.5px solid var(--ink);background:var(--pcm,var(--carta));padding:2px 6px;font-size:var(--c-min);font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:start;text-align:left}
.tes.tec{background:var(--retino),var(--carta)}
.tes:hover{outline:2px solid var(--ink)}
.tes.sel{outline:3px solid var(--ink);outline-offset:1px}
.cesto .vuo{font-size:var(--c-min);color:var(--grigio);font-style:italic}
/* C · Incroci */
.inc{width:100%;border-collapse:collapse;font-size:var(--c-sec)}
.inc th{font-size:var(--c-min);font-weight:700;text-align:center;border-bottom:1.5px solid var(--ink);padding:3px 6px;white-space:nowrap;vertical-align:bottom}
.inc th.d,.inc td.d{text-align:left}
.inc td{border-bottom:var(--filo);padding:3px 6px;text-align:center;white-space:nowrap}
.inc td.d{font-weight:700}
.inc tr.mod td.d::after{content:" •";color:var(--biro)}
.inc .pal{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;vertical-align:middle;background:var(--carta)}
.inc .pal.on{background:var(--pc,var(--ink));border-color:var(--pc,var(--ink));box-shadow:0 0 0 2px var(--carta),0 0 0 3.5px var(--pc,var(--ink))}
.inc .pal.tec.on{background:var(--retino),var(--carta);border-color:var(--ink);box-shadow:0 0 0 2px var(--carta),0 0 0 3.5px var(--ink)}
.inc td button{padding:2px 8px}
.inc tfoot td{border-bottom:0;border-top:1.5px solid var(--ink);font-size:var(--c-min)}
.inc tfoot tr+tr td{border-top:var(--filo)}
.inc tfoot td.d{font-weight:400;color:var(--grigio);text-transform:uppercase;letter-spacing:.08em}
.inc tfoot b{font-size:var(--c-sec)}
.inc .cas{justify-content:center}
.inc .cas i{--cw:7px;--ch:10px}
.inc .cas i.sg::after{right:-2.5px}
/* guida e Capo dello Stato */
.gui{display:grid;gap:10px;max-width:760px}
.gui .grande{font-family:var(--tit);font-variation-settings:var(--wonk);font-size:var(--c-pag);font-weight:700;line-height:1.1}
</style>

// ---- per la 5 ----
// due inchiostri sovrapposti, come una stampa a due passaggi: ogni inchiostro al suo retino (mix), poi moltiplicati sulla carta
const sovr = (a,b)=>'#'+[1,3,5].map(i=>{ const x=k=>parseInt(k.slice(i,i+2),16); return Math.round(x(a)*x(b)/x(K.carta)).toString(16).padStart(2,'0'); }).join('');
const PIANO = [sovr(mix(K.giallo,.42),mix(K.rosso,.16)), sovr(mix(K.giallo,.6),mix(K.rosso,.32))];   // terra chiara (guancia, orecchio), terra (sotto il naso)
const SOVR = [['arancio',sovr(K.giallo,mix(K.rosso,.5))],['oliva',sovr(K.giallo,mix(K.biro,.5))]];       // due colletti in più, oltre ai quattro inchiostri
// ponytail: il genere si ricava dal nome con una lista fissa, perché il core non lo porta. Sono i sei femminili del bacino
// (dati/base/elettorato.toml:11, alternati F/M) più Silvia, leader del Centrodestra (dati/base/scenario.toml:307).
// Se cambia uno dei due file la lista va rifatta a mano; il posto giusto è un campo `genere` accanto al nome, nel core.
const DONNE = new Set(['Giulia','Francesca','Chiara','Sara','Elena','Anna','Silvia']);
const donna = m => DONNE.has(m.nome.split(' ')[0]);
// il profilo della 5: due pennellate (nuca-fronte, naso-collo) che si staccano alla radice del naso; nella donna il naso
// resta lo stesso dell'hash ma scala dell'85% verso la radice
function profilo5(id,k){
  const sc = s=>s.replace(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g,(_,x,y)=>`${+(42+(x-42)*k).toFixed(2)} ${+(26+(y-26)*k).toFixed(2)}`);
  const b = id.cranio ? 18 : 13, fr = id.fronte ? 'Q35 5 38 9L44 23' : 'Q38 6 41 11L43 23';
  const naso = sc(NASI[id.naso][1]), tip = NASI[id.naso][2].map((v,i)=>+((i?26:42)+(v-(i?26:42))*k).toFixed(2));
  const davanti = `M42 26${naso}L43 35L44 39${MENTI[id.mento][1]}L35 48L36 51L37 57`;
  return { tip, davanti, naso:`M42 26${naso}L43 35Z`, dietro:`M23 57L21 47L20 44C${b} 36 ${b} 9 30 7${fr}L42 26`,
    sagoma:`M20 44C${b} 36 ${b} 9 30 7${fr}L42 26${davanti.slice(6).replace(/L37 57$/,'')}L37 61L23 61L21 47Z` };
}
// pennello a punta piatta: la punta (lunga L, inclinata di a gradi) scorre lungo il tracciato, così lo spessore cambia
// con la direzione come in un tratto a pennino; si assottiglia ai due capi. Ogni passo è un quadrilatero, tutti con lo
// stesso verso, in un solo path: la regola nonzero ne fa l'unione senza giunte.
const PENNI = new Map();
let PEN;
function pennello(d,L,a,passo=.7,coda=.16){
  const chiave=`${d}|${L}|${a}`; if(PENNI.has(chiave)) return PENNI.get(chiave);
  if(!PEN){ const s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('style','position:absolute;width:0;height:0;visibility:hidden'); PEN=document.createElementNS(s.namespaceURI,'path'); s.appendChild(PEN); document.body.appendChild(s); }
  PEN.setAttribute('d',d);
  const tot=PEN.getTotalLength(), n=Math.max(8,Math.ceil(tot/passo)), nx=Math.cos(a*Math.PI/180)*L/2, ny=-Math.sin(a*Math.PI/180)*L/2;
  const pt = Array.from({length:n+1},(_,i)=>{ const t=i/n, q=PEN.getPointAtLength(t*tot), s=Math.max(.25,Math.min(1,t/coda,(1-t)/coda)); return [q.x,q.y,nx*s,ny*s]; });
  const f = v=>+v.toFixed(1);
  let out='';
  for(let i=0;i<n;i++){
    const [x0,y0,a0,b0]=pt[i], [x1,y1,a1,b1]=pt[i+1];
    let q=[[x0-a0,y0-b0],[x0+a0,y0+b0],[x1+a1,y1+b1],[x1-a1,y1-b1]];
    if(q.reduce((s,[x,y],j)=>{ const [X,Y]=q[(j+1)%4]; return s+x*Y-X*y; },0)<0) q.reverse();
    out+='M'+q.map(([x,y])=>`${f(x)} ${f(y)}`).join('L')+'Z';
  }
  PENNI.set(chiave,out); return out;
}

function E(){

    return {...v, modo:'incarico', richieste:d.richieste, default:d.default, disponibilita:d.disponibilita, coal:v.ribaltone, guidata:true};
  }

}

}
function formaB(e,s){
  const o=offerte(s), chi=['giocatore',...alleati(e)];
  const cesto = id=>{
    const ds=V().dicasteri.filter(d=>(s[d.id]===null?'giocatore':s[d.id])===id).sort((a,b)=>D.pesi[b.id]-D.pesi[a.id]);
    const r=e.richieste.find(x=>x.partito===id), it=r?partenza(o[id]||0,r.richiesta):null;
    const tes=ds.map(d=>`<button class="tes ${s[d.id]===null?'tec':''} ${st.sel===d.id?'sel':''}" style="--p:${D.pesi[d.id]};--pcm:${grave()?'var(--carta)':mix(col(id),.22)}" data-tes="${d.id}"><span>${esc(d.nome)}${s[d.id]===null?' · tecnico':''}${s[d.id]!==e.default[d.id]?' •':''}</span><span>${D.pesi[d.id]}</span></button>`).join('');
    return `<section class="cesto" style="border-top-color:${col(id)}"><div class="tst">${faccia(id,40,it==null?0:umoreI(it))}<span><span class="nmP">${esc(nomeP(id))}</span><br><span class="sec">${r?`chiede <b>${num(r.richiesta)}</b> · ha <b>${o[id]||0}</b>`:`<b>${o[id]||0}</b> punti, il resto`}</span></span></div>
      ${r?`<div class="intesa">${caselleI(it)}<span class="ints"><b class="${it<SOGLIA.ultimatum?'male':''}">parte da ${num(it,0)}</b><span>${it<SOGLIA.ultimatum?'ultimatum':''}</span></span></div>`:''}
      <div class="pila2" style="--rq:${r?r.richiesta:0}">${r?`<span class="rq"><span>la richiesta</span></span>`:''}${tes||'<span class="vuo">nessun dicastero</span>'}</div></section>`; };
  return `<div class="pag">${evento()}${risultato(e)}<p class="sec">Un clic su un dicastero per spostarlo. Ogni tessera è alta quanto il suo peso; il tratteggio è la richiesta.</p>
    <div class="cesti" style="--nc:${chi.length}">${chi.map(cesto).join('')}</div>${nota}</div>`;
}
function formaC(e,s){
  const o=offerte(s), cols=titolari(e);
  const righe=V().dicasteri.map(d=>`<tr class="${s[d.id]!==e.default[d.id]?'mod':''}"><td class="d">${esc(d.nome)}</td><td>${pesi(D.pesi[d.id])}</td>${cols.map(c=>`<td><button data-as="${d.id}|${c}" aria-label="${esc(d.nome)} a ${esc(nomeB(c))}"><span class="pal ${c===null?'tec':''} ${s[d.id]===c?'on':''}" style="--pc:${c===null?'':col(c)}"></span></button></td>`).join('')}</tr>`).join('');
  const pT = c => c===null ? Object.keys(s).filter(d=>s[d]===null).reduce((a,d)=>a+D.pesi[d],0) : c==='giocatore' ? Object.keys(s).filter(d=>s[d]==='giocatore').reduce((a,d)=>a+D.pesi[d],0) : o[c]||0;
  const rq = c => { const r=e.richieste.find(x=>x.partito===c); return r ? `<b>${num(r.richiesta)}</b>` : ''; };
  const it = c => { const r=e.richieste.find(x=>x.partito===c); if(!r) return ''; const v=partenza(o[c]||0,r.richiesta); return `${caselleI(v)}<b class="${v<SOGLIA.ultimatum?'male':''}">${num(v,0)}</b>`; };
  const th = c => `<th>${c===null?'<span class="sec">Tecnico</span><br><span class="min muto">conta per te</span>':`${faccia(c,30)}<span class="sec">${esc(nomeB(c))}</span>`}</th>`;
  return `<div class="pag">${evento()}<table class="inc"><thead><tr><th class="d">Dicastero</th><th>Peso</th>${cols.map(th).join('')}</tr></thead><tbody>${righe}</tbody>
    <tfoot><tr><td class="d">punti dati</td><td></td>${cols.map(c=>`<td><b>${pT(c)}</b></td>`).join('')}</tr>
    <tr><td class="d">richiesta</td><td></td>${cols.map(c=>`<td>${rq(c)}</td>`).join('')}</tr>
    <tr><td class="d">intesa di partenza</td><td></td>${cols.map(c=>`<td>${it(c)}</td>`).join('')}</tr></tfoot></table>${nota}</div>`;
}
function guida(e){
  const v=V(), rib=e.coal.filter(id=>id!=='giocatore'), primo=Pid('sinistra');
  let corpo;
  if(st.fuori) corpo=`<p class="grande">Resti fuori dal ribaltone.</p><p>A fine turno il Capo dello Stato cerca una maggioranza senza di te; se non la trova, le Camere si sciolgono. Dal turno dopo sei all’opposizione.</p>`;
  else corpo=`<p class="grande">Il governo è caduto. ${esc(elenco([...rib.map(id=>Pid(id).nome),'il tuo partito']))} hanno la maggioranza.</p>
    <p>La Sinistra è il primo per seggi (${seg('sinistra',0)+seg('sinistra',1)} contro i tuoi ${seg('giocatore',0)+seg('giocatore',1)}): la guida è sua. Puoi chiederla come condizione per entrare, o restare fuori.</p>
    ${risultato(e)}
    ${st.rifiuto?`<p class="rif">${esc(st.rifiuto)}. A fine turno nasce un governo senza di te.</p>`:''}
    <div class="az"><button class="btn pieno" data-act="chiedi" ${st.rifiuto?'aria-disabled="true"':''}>Chiedi la guida a ${esc(primo.leader)} ›</button><button class="btn via" data-act="fuori">Resta fuori</button></div>
    ${conferma('fuori','Resti fuori: il Capo dello Stato cerca una maggioranza senza di te, e non si torna indietro in questo turno.','Resta fuori')}
    <p class="min muto">Senza scelta, a fine turno la chiusura chiede la guida per te.</p>`;
  return `<div class="pag"><div class="gui"><p class="occ">Il ribaltone</p>${corpo}</div></div>`;
}
function capo(e){
  return `<div class="pag"><div class="gui"><p class="occ">L’incarico</p><p class="grande">L’incarico va a un’altra coalizione.</p>
    <p>Nessuna maggioranza ti comprende: il Capo dello Stato dà l’incarico, e il governo nasce a fine turno senza di te.</p>${risultato(e)}</div></div>`;
}

// ======================= cornice (da 08, forma A, come nel 24) =======================
function caselle(pos,soglia=3,n=10){
  if(pos==null) return `<span class="cas vuoto">${'<i></i>'.repeat(n)}</span>`;
  const inp=pos<=soglia;
  return `<span class="cas ${inp?'inp':''}">${Array.from({length:n},(_,i)=>`<i class="${[i<soglia?'per':'', i===soglia-1?'sog':'', i<pos?'on':''].join(' ')}"></i>`).join('')}</span>`;
}
function tracciati(e){
  const v=V(), tot=BASE8.reduce((a,id)=>a+(v.sond[id]||0),0), cons=v.sond.giocatore/tot*100;
  const m = e.modo==='capo' || st.fuori ? null : margine(e), stretto=m?Math.min(...m):null;
  const t=[['Il tuo consenso', num(cons)+'%', clamp(Math.round((cons-25)/5),0,10)],
    [e.modo==='guida'?'Ribaltone C / S':'Coalizione C / S', m? m.map(sgn).join(' / ') : 'fuori', m? clamp(Math.round((stretto+9)/3),0,10) : null],
    ['Conti · spread', num(v.spread,0), clamp(Math.round((500-v.spread)/50),0,10)]];
  return `<div class="trks">${t.map(([k,val,pos])=>`<div class="trk"><span class="k">${k}</span>${caselle(pos)}<span class="v">${val}</span></div>`).join('')}</div>`;
}
const SEZ = [['prima','Prima pagina'],['cruscotto','Trattativa'],['governo','Governo'],['aula','Aula'],['conti','Conti'],['bilancio','Bilancio'],['paese','Paese'],['partiti','Partiti'],['campagna','Campagna'],['registro','Registro']];
function cornice(e,s){
  const v=V(), b={governo:'Non guidi il governo uscente', aula:'Le Camere aspettano il governo nuovo', bilancio:'Il bilancio lo presenta chi governa'};
  if(v.turni_al_voto>1) b.campagna='Si fa campagna solo nel turno prima del voto';
  const chi=`<span class="chi"><b>Trattativa</b><br>${per(v.data)} · turno ${v.turno}<br><b>${v.turni_al_voto} turni al voto</b></span>`;
  const somm=`<nav class="somm" aria-label="Sommario">${SEZ.map(([k,t])=> b[k] ? `<button class="chiusa" aria-disabled="true" data-perche="${esc(b[k])}">${t}</button>` : `<button class="${k==='cruscotto'?'qui':''}" ${k==='cruscotto'?'aria-current="page"':''}>${t}</button>`).join('')}
    <span class="fuori"><button>Schema<span class="lungo"> dello Stato</span></button><button>Impostazioni</button><button>Edicola</button></span></nav>`;
  const def = e.modo==='capo' ? ['tutte','nessuna scelta da fare'] : e.modo==='guida' ? (st.fuori?['tutte','resti fuori']:['','senza scelta: chiedi la guida']) : cambiata(e,s) ? ['tutte','la tua spartizione'] : ['','senza proposta: la spartizione di default'];
  return `<header class="cornice cA"><div class="c1"><div class="c-sx"><span class="nomino solo-ord">Il Pungolo</span>${chi}</div>${tracciati(e)}
    <div class="c-dx"><div class="pila"><button class="btn pieno">Chiudi il turno ›</button></div><span class="def ${def[0]}">${def[1]}</span></div></div>${somm}</header>`;
}

// ======================= render =======================
const scr = document.getElementById('screen');
let limite='';
function render(){
  const W=+st.fin, H=W===1440?900:800, z=Math.min(+st.scala, W/1024), lw=W/z, lh=H/z;
  limite = z<+st.scala ? 'scala fermata (minimo 1024 px utili)' : '';
  const e=E(), s=e.modo==='incarico'?sparti(e):{};
  const pag = e.modo==='capo' ? capo(e) : e.modo==='guida' ? guida(e) : st.v==='B' ? formaB(e,s) : st.v==='C' ? formaC(e,s) : formaA(e,s);
  const corpo = `<main class="corpo trt">${capoSez(e)}${pag}${lato(e,s)}</main>`;
  scr.style.width=W+'px'; scr.style.height=H+'px';
  scr.innerHTML = `<div class="vS ${grave()?'g':''} ${lw<1150?'stretta':''}" style="zoom:${z};width:${lw}px;height:${lh}px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">${cornice(e,s)}${corpo}</div>`;
  document.getElementById('lab').textContent = FORME[st.v];
  document.querySelectorAll('#proto .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', st[seg.dataset.k]===b.dataset.v)));
  const stage=document.getElementById('stage'); scr.style.transform=`scale(${Math.min(1,stage.clientWidth/W,stage.clientHeight/H)})`;
  try{ const p=new URLSearchParams(); for(const k in DEF) if(st[k]!==DEF[k]) p.set(k,st[k]); history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')); }catch(x){}
  tagli();
}
function tagli(){
  const r=scr.firstElementChild, R=r.getBoundingClientRect(); let n=0;
  r.querySelectorAll('*').forEach(el=>{ if(el.closest('svg')||el.closest('.cas')) return; const b=el.getBoundingClientRect();
    const fuori = b.width && (b.right>R.right+1 || (b.bottom>R.bottom+1 && !el.closest('.corpo')));
    const cs=getComputedStyle(el);
    const stretto = el.clientWidth && el.scrollWidth>el.clientWidth+1 && cs.display!=='inline' && !/ellipsis/.test(cs.textOverflow) && cs.overflow!=='hidden' && !/auto|scroll/.test(cs.overflowY) && el!==r;
    if(fuori||stretto) n++; });
  const c=r.querySelector('.pag'), scorre = c && c.scrollHeight>c.clientHeight+1;
  const l=r.querySelector('.lato'), scorreL = l && l.scrollHeight>l.clientHeight+1;
  document.getElementById('avv').textContent = [limite, n?`tagli: ${n}`:'', scorre?'la pagina scorre':'', scorreL?'il lato scorre':''].filter(Boolean).join(' · ');
}
document.getElementById('proto').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.id==='prev'||b.id==='next'){ const k=Object.keys(FORME); st.v=k[(k.indexOf(st.v)+(b.id==='next'?1:k.length-1))%k.length]; st.sel=null; }
  else { const k=b.parentElement.dataset.k; st[k]=b.dataset.v; if(k==='stato'||k==='cede') azzera(); }
  render();
});
scr.addEventListener('click',ev=>{
  const x=ev.target.closest('[data-as],[data-tes],[data-act],[data-sel]'); if(!x) return;
  const e=E();
  if(x.dataset.as){ const [d,o0]=x.dataset.as.split('|'), o=o0==='null'?null:o0; if(o===e.default[d]) delete st.prop[d]; else st.prop[d]=o; }
  else if(x.dataset.tes){ st.sel = st.sel===x.dataset.tes ? null : x.dataset.tes; }
  else if('sel' in x.dataset){ st.sel=null; }
  else { const a=x.dataset.act;
    if(a==='annulla') st.conf=null;
    else if(a==='reset') st.prop={};
    else if(a==='chiedi'){ if(st.rifiuto) return; if(st.cede==='si'){ st.chiesta=true; st.prop={}; } else st.rifiuto='Sinistra non ti cede la guida: guiderebbe la propria coalizione'; }
    else if(a==='fuori') st.conf='fuori';
    else if(a==='ok-fuori'){ st.fuori=true; st.conf=null; }
    else if(a.startsWith('ok-allarga-')){ const ids=a.slice(11).split('+'); st.alla=[...new Set([...st.alla,...ids])].sort((p,q)=>BASE8.indexOf(p)-BASE8.indexOf(q)); st.prop={}; st.conf=null; }
    else if(a.startsWith('allarga-')) st.conf=a;
  }
  render();
});
function perche(ev){
  scr.querySelectorAll('.perche').forEach(x=>x.remove());
  const b=ev.type==='mouseover'||ev.type==='focusin' ? ev.target.closest('[data-perche]') : null; if(!b) return;
  const r=scr.firstElementChild, z=+r.style.zoom||1, k=scr.getBoundingClientRect().width/scr.offsetWidth, B=b.getBoundingClientRect(), R=r.getBoundingClientRect();
  const el=document.createElement('div'); el.className='perche'; el.textContent=b.dataset.perche;
  el.style.left=((B.left-R.left)/k/z)+'px'; el.style.top=((B.bottom-R.top)/k/z+2)+'px'; r.appendChild(el);
}
['mouseover','mouseout','focusin','focusout'].forEach(t=>scr.addEventListener(t,perche));
addEventListener('keydown',ev=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(ev.key==='ArrowRight') document.getElementById('next').click(); if(ev.key==='ArrowLeft') document.getElementById('prev').click(); });
addEventListener('resize',render);
render(); if(document.fonts) document.fonts.ready.then(render);
</script>
</body>
