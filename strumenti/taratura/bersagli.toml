# Derivazione, in punti sulle medie grezze:
# - AVS (6,33) divisa a meta' fra i posti 1 e 2 (SI e' al posto 1, EV al 2; ruling del controller): 3,165 + 3,165.
# - gli «altri» (100 - 94,98 = 5,02) divisi a meta' fra i posti 4 e 5: 2,51 + 2,51. Nessun posto a zero, il logit non puo' dare quota 0.
# - posto 6 = FdI 27,29 + FI 7,27 + NM 1,15 = 35,71; posto 7 = Lega 5,71 + FN 7,26 = 12,97.
# - posto 2 = PD 20,33 + M5S 12,52 + meta' AVS 3,165 = 36,015; posto 3 = Azione 3,16 + IV 2,43 + +E 1,53 = 7,12.
posti = [3.165, 36.015, 7.12, 2.51, 2.51, 35.71, 12.97]

