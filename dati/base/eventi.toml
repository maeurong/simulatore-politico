# Eventi e situazioni nazionali (piano 9).
# Alias nelle fonti: situazioni = docs/ricerca/sintesi/situazioni-ed-eventi-al-turno-zero.md; "scelta N" = piano 9 (docs/superpowers/plans/2026-11-01-v1-piano-9-eventi-e-informazione.md).
#
# Situazione: `verso` e' il verso in cui si ACCENDE, non quello in cui la grandezza migliora:
