# Eventi e situazioni nazionali (piano 9).
# Alias nelle fonti: situazioni = docs/ricerca/sintesi/situazioni-ed-eventi-al-turno-zero.md.
#
# Situazione: `verso` è il verso in cui si ACCENDE, non quello in cui la grandezza migliora:
# `sale` accende sopra `accensione` e spegne sotto `spegnimento`, `scende` il contrario.
# Le soglie sono provvisorie, al bilanciamento.
# Intensità degli effetti: assunzione del piano 9, nessuna fonte in docs/ricerca.
#
# Gravità: nel tetto di un evento a turno vince la più alta. Emergenza = livello × 10 + gravità
# (lieve 0, grave 1, con vittime 2); scandalo 6-7. `valida` vuole la gravità sotto 10.

# situazioni:21-37 e :36 (6 episodi dal 2000; sigma 0,49 t/t nel 2010-19, circa 1,96 annualizzata); crescita
# vera annualizzata. Due trimestri di fila sotto -1,0 accendono, due a 0,0 o sopra spengono. Misura del 02/11
# (semi 1-200, 20 chiusure): circa 0,9 recessioni per partita contro circa 1,15 reali in 5 anni; il solo
# segno ne dava 1,7. Scelta di Mario.
[[situazione]]
id = "recessione"
nome = "Recessione"
misura = "crescita_pil"
verso = "scende"
accensione = -1.0
spegnimento = 0.0
evento = "recessione"
spinta = false

