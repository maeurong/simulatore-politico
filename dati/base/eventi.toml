# Emergenze naturali: nascono dal rischio per regione (`eventi/emergenze.rs`), con costo e tono
# dal livello estratto. Fonti: docs/ricerca/dati/pericolosita-naturale-regioni.md e
# docs/ricerca/sintesi/situazioni-ed-eventi-al-turno-zero.md:116-134 (siccità come emergenza regionale).
# Il fondo e il debito spendono dal primo dicastero dell'evento; la quota di domanda regionale, la gravità
# (che ordina le emergenze nello stesso turno) e l'intensità sono assunzioni del piano 9, nessuna fonte in docs/ricerca.

# Il decreto di un'emergenza ammette solo le sue `norme` (contenuto specifico e omogeneo:
# docs/ricerca/modelli/iter-legislativo-italiano.md:22); vuota = tutto il ministero, come le situazioni.
# `detrazione_edilizia` è il Sismabonus (docs/ricerca/dati/pericolosita-naturale-regioni.md:108);
