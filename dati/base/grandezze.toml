# Deriva e rumore delle grandezze fisse (piano 9). Per trimestre; `tasso` e `sigma` sono frazioni.
# Lineare: base ← base·(1 + tasso + sigma·z) + ritorno·(iniziale − base).
# Logaritmica: ln(base/iniziale) ← (1 − ritorno)·ln(base/iniziale) + tasso + sigma·z.
# Dopo il passo la base sta in min-max. Una normale dal flusso Eventi per riga, nell'ordine.

# situazioni-ed-eventi-al-turno-zero:58 e :93, +0,9% a trimestre, σ ~0,75%.
[[deriva]]
grandezza = "sovraffollamento_carceri"
tasso = 0.009
sigma = 0.0075
ritorno = 0.0
logaritmica = false

# situazioni-ed-eventi-al-turno-zero:75 e :94, σ log 0,50 a trimestre, deriva nulla; ritorno 0,2
# assunzione del piano 9: la σ stazionaria (0,83) sta fra la trimestrale (0,50) e l'annua (0,74).
[[deriva]]
grandezza = "immigrazione_irregolare"
tasso = 0.0
sigma = 0.5
ritorno = 0.2
logaritmica = true

# situazioni-ed-eventi-al-turno-zero:95, rumore trimestrale ≤1% e deriva lenta; il tasso (-0,1%
# a trimestre: CPI in salita, corruzione in calo) è un'assunzione del piano 9.
[[deriva]]
grandezza = "corruzione"
tasso = -0.001
sigma = 0.005
ritorno = 0.0
logaritmica = false
