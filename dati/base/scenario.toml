# Scenario di base: solo ingressi. Intervalli provvisori, al bilanciamento.
# Alias nelle fonti: spec = docs/superpowers/specs/2026-10-21-v1-giocabile.md; stato-del-paese = docs/ricerca/sintesi/stato-del-paese-al-turno-zero.md; economia-italiana-parametri, banca-centrale-e-inflazione, regole-fiscali-ue = docs/ricerca/modelli/<alias>.md; "alias:N" = riga N.

pde = "sospesa"
# regole-fiscali-ue:46; dopo il 2029 vale l'ultimo
tetti_spesa_netta = { 2026 = 1.6, 2027 = 1.9, 2028 = 1.7, 2029 = 1.5 }
clausola_nazionale_fino_a = 2028
legge_elettorale = "legge_180"
# Coalizioni del 2022 ricondotte ai posti [assunzione del piano 4; la corrispondenza fra partiti veri e posti resta fuori dai dati, spec riga 284]. Regola: la collocazione CHES 2024 (`lrgen`) si tronca, classi [k, k+1), poi il TAGLIO dei 7 punti; ne escono sinistra e centrosinistra (posti 2-3), centrodestra e destra (posti 5-6).
coalizioni = [["sinistra", "centrosinistra"], ["centrodestra", "destra"]]

# Valori precedenti al turno zero: Rosatellum (L. 165/2017) senza collegi, ticket 13:41
[legge_elettorale_precedente]
soglia_lista_pb = 300
coalizioni = true
soglia_coalizione_pb = 1000
ripescaggio = false
premio = "nessuno"
soglia_premio_pb = 4200
taglia_premio_pb = 1750
formula = "hare"

# Parlamento della legislatura uscente: assunzione del piano 6. Coalizione di governo coi seggi reali del 2022 (237/400, 115/200), resto in proporzione alle intenzioni del turno zero. Il piano 7 lo sostituisce col voto del turno zero.
[parlamento_uscente]
camera = { estrema_sinistra = 9, sinistra = 100, centrosinistra = 20, centro = 14, centrodestra = 48, destra = 189, estrema_destra = 20 }
senato = { estrema_sinistra = 5, sinistra = 52, centrosinistra = 10, centro = 7, centrodestra = 23, destra = 92, estrema_destra = 11 }

# Governo uscente di centrodestra e destra, posti 5 e 6 per lo stesso troncamento (spec riga 277); partito per dicastero dai ministri del 2026 ricondotti ai posti [assunzione del piano 4; la corrispondenza fra partiti veri e posti resta fuori dai dati, spec riga 284]
[governo]
presidente = "destra"
dicasteri = { economia_finanze = "destra", sviluppo_economico = "destra", lavoro_welfare = "destra", sanita = "destra", istruzione_ricerca = "destra", infrastrutture_trasporti = "destra", ambiente_energia = "centrodestra", interno = "destra", giustizia = "destra", esteri_difesa = "centrodestra" }

# economia-italiana-parametri:98-102; contributi 33%: assunzione del piano 5, nessuna fonte in docs/ricerca
[aliquote]
iva = 0.22
ires = 0.24
contributi = 0.33
irpef = [{ fino_a = 28000, aliquota = 0.23 }, { fino_a = 50000, aliquota = 0.33 }, { aliquota = 0.43 }]

